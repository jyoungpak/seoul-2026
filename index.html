복을 입고 나면 얼룩질 만한 음식은 근처에도 두지 마세요.","dose.d8-bfast.label.0":"먼저 먹이고, 옷은 그다음.","dose.d8-bfast.label.1":"전날 밤 모두에게 알리기: 이 아침은 평소 09:00보다 일찍 시작.","dose.d8-bfast.title":"아침, 빠르면 방에서","dose.d8-bfast.who":"다 함께","dose.d8-dinner.detail":"가족 저녁 식사로 잠정 예정돼 있고, 장소와 시간은 아직 확정되지 않았어요. 18:30은 임시 시간으로 두세요. 14:30–17:00 휴식 시간 바로 뒤라서 어떤 장소로 정해지든 아이들은 낮잠을 자고 난 상태예요. 오늘은 다 함께 차려입고 사진까지 찍은 날이라, 제대로 된 자리를 잡기에 가장 자연스러운 저녁이에요.","dose.d8-dinner.label.0":"장소와 시간을 확정하고, 어린아이 셋을 포함한 아홉 명을 위한 룸을 요청하세요.","dose.d8-dinner.title":"가족 저녁 식사 · 세부 사항 예정","dose.d8-dinner.who":"다 함께","dose.d8-fitting.cost":"서화 공시 가격 기준, 1인당 4시간 약 24,000원 또는 종일 32,000원","dose.d8-fitting.detail":"09:00 오픈에 맞춰 예약 없이 워크인, 70분 안에 마쳐야 합니다. 한복남을 추천 — 리뷰 4,426건에 평점 4.7, 이 근처에서 옷 종류가 가장 다양하고, 호텔에서 1.1 km 거리입니다. 광화문에서 서쪽으로 약 350미터에 있어서 가는 길에 궁을 지나가고, 끝난 뒤에는 잠깐만 되돌아오면 돼요. 옷 입는 순서: 할머니·할아버지, 두 살 아이, 아기들, 그다음 가장 빠르게 스스로 입을 수 있는 어른 순.","dose.d8-fitting.label.0":"종일권으로. 09:10에 4시간 대여하면 13:10 만료(점심 시간).","dose.d8-fitting.label.1":"아기 한 명당 한복 갈아입히기 20분씩 잡으세요. 아기가 둘입니다.","dose.d8-fitting.label.2":"한복남에 이메일: 오픈에 스타일리스트 2명? 1명이면 10:50 위태.","dose.d8-fitting.label.3":"오픈에 맞춰 도착. 이른 시간은 조용하고, 뒤로 갈수록 붐빕니다.","dose.d8-fitting.label.4":"메이크업 없는 어른 1명이 08:55에 한복남 가서 서류·사이즈 먼저.","dose.d8-fitting.label.5":"여기 직원은 혼자 고르라 둘 수 있어요. 카운터에서 사이즈 안내 요청.","dose.d8-fitting.label.6":"한복남이 한 번에 아홉 명(아기 둘 포함) 대여 가능한지 확인.","dose.d8-fitting.title":"한복 대여·9명","dose.d8-fitting.where":"한복 대여점","dose.d8-fitting.who":"다 함께","dose.d8-hairmakeup.cost":"1인당, 서비스 등급별","dose.d8-hairmakeup.detail":"이건 한복보다 먼저 해야 합니다. 나란히 진행이 아니라 반드시 먼저예요. 살롱이 한복 대여점보다 한 시간 일찍 열기 때문입니다. 뷰티팰리스 경복궁점은 일요일 08:00에 열고, 40분짜리 한복 메이크업과 70분짜리 한복 메이크업+업스타일 서비스를 운영합니다. 하려는 사람은 모두 40분짜리로 예약해서 자리를 병행으로 돌리세요.","dose.d8-hairmakeup.label.0":"뷰티팰리스는 동시 6명. 9명은 08:00부터 시간을 나눠 예약.","dose.d8-hairmakeup.label.1":"화요일 휴무. 9월 13일 일요일은 괜찮지만 화요일로 옮기지 마세요.","dose.d8-hairmakeup.label.2":"08:00 근무 인원 확인. 한 명이 09:00까지 네 명 마감 불가.","dose.d8-hairmakeup.title":"헤어·메이크업, 첫 타임","dose.d8-hairmakeup.where":"경복궁 일대의 메이크업 살롱","dose.d8-hairmakeup.who":"받기로 한 어른들","dose.d8-lunch.detail":"다들 배고프고 덥고 지쳐 있을 거예요. 가깝고 의자 있는 곳으로. 찾아 다니지 마세요.","dose.d8-lunch.label.0":"점심 예약. 일요일에 경복궁 근처에서 아홉 명이 예약 없이는 위험합니다.","dose.d8-lunch.label.1":"두 살 아이 소동에도 무리 없는 점심 선택, 절반 먼저 보낼 준비.","dose.d8-lunch.title":"경복궁 근처 점심","dose.d8-lunch.who":"다 함께","dose.d8-rest.detail":"여행에서 가장 큰 오전이었으니, 여행에서 가장 비어 있는 오후를 누리세요.","dose.d8-rest.label.0":"보호된 휴식 시간. 여기엔 아무 일정도 넣지 마세요.","dose.d8-rest.title":"호텔 복귀·전원 오프","dose.d8-rest.who":"다 함께","dose.d8-return.detail":"가게로 돌아가 옷을 갈아입고 자기 옷을 챙기세요. 종일 대여를 하고 다들 힘이 남아 있다면 점심때까지 한복을 입고 있어도 됩니다.","dose.d8-return.title":"한복 반납","dose.d8-return.who":"다 함께","dose.d8-shoot.cost":"입장료 19~64세 어른 3,000원, 규정에 맞는 한복 착용 시 무료","dose.d8-shoot.detail":"흥례문 안에서 만나요. 한복을 완전히 갖춰 입은 사람은 궁 입장이 무료입니다. 규정은 전통 한복과 개량 한복 모두 인정하고요. 부모님은 65세 이상이라 원래 무료이고, 아이 셋도 모두 무료입니다.","dose.d8-shoot.label.0":"무료 입장은 완전한 한복: 저고리+치마 또는 바지. 일부만이면 정가.","dose.d8-shoot.label.1":"단체·할머니·할아버지 컷 먼저. 아기들 컨디션은 40분이 한계.","dose.d8-shoot.label.2":"도착하면 안내센터 옆 수유실 위치 확인. 교체대·전자레인지·개수대 있음.","dose.d8-shoot.label.3":"궁 안 길에 자갈과 거친 돌 있음. 들어가면 아기띠 사용.","dose.d8-shoot.title":"경복궁 사진 촬영","dose.d8-shoot.where":"경복궁","dose.d8-shoot.who":"다 함께","dose.d8-toPalace.detail":"보통 5분이면 되는 거리에 20분을 잡으세요. 유모차 두 대에 한복 차림 아홉 명은 정상 도보 속도가 안 나옵니다. 10:45에는 만남 지점에 서서 5분 여유가 있도록 목표하세요.","dose.d8-toPalace.fallback":"지금 정해 두고 10:30에는 다시 논의하지 않는 결정: 대여점 진행이 늦어지면 10:30에 할머니·할아버지, 남자들, 두 살 아이를 먼저 도보로 보내 만남 지점을 잡아 두세요. 마지막 립 수정은 건너뛰세요. 10:50에 사과 문자를 보내지 말고 10:20에 사진작가에게 현실적인 인원을 알리세요. 팀 전체의 실질 마감은 11:00 — 사진작가는 10분은 기다려도 30분은 기다리지 않습니다.","dose.d8-toPalace.getting":"광화문으로 입장하세요. 매표·안내소는 두 번째 문인 흥례문 안에 있습니다. 공식 투어가 여기서 모이고, '메인 매표 입구'라고 하는 곳이 여기일 가능성이 높아요.","dose.d8-toPalace.label.0":"광화문·흥례문 부근 수문장 교대식 10:00 20분, 11:00 10분. 도보 넉넉히.","dose.d8-toPalace.label.1":"사진작가와 만남 지점 확정, 연락처 교환. 광화문·매표소 150m 거리.","dose.d8-toPalace.label.2":"사진작가와 우천 대안 사전 확정: 실내 전각, 지붕 회랑, 일정 변경.","dose.d8-toPalace.title":"흥례문까지 도보","dose.d8-toPalace.where":"경복궁 · 흥례문 안 매표·안내소","dose.d8-toPalace.who":"다 함께","dose.d8-toSalon.detail":"네이버 지도에서 호텔부터 경복궁 일대까지 1.1 km — 도보 18분, 1,719걸음, 횡단보도 4개, 계단이 없어 유모차 두 대에도 문제없는 길입니다. 이 가까움이 사진 촬영일을 이번 일정에 넣은 이유예요. 그래도 택시를 타세요. 아홉 명을 08:00 확정 예약에 맞춰 이동시켜야 하는데, 걸어가면 가장 먼저 흐트러지는 게 이 도보 이동입니다.","dose.d8-toSalon.getting":"나인트리 프리미어 인사동에서 택시 두 대. 우정국로·율곡로·사직로를 따라 서쪽으로 1.1 km — 네이버 지도 기준 차량으로 3분, 한 대에 4,800원(서울 기본요금, 통행료 없음). 두 대 합계 약 9,600원. [네이버 지도, 8월 27일 확인] 일요일 07:35에 길에서 잡지 말고, 전날 밤에 프런트에 두 대 예약을 부탁하세요. 앱보다 안정적이고, 다시는 못 하는 아침에 앱 가입 문제 자체를 아예 없애 줍니다.","dose.d8-toSalon.label.0":"택시 실패 시 07:30까지 도보 18분(1.1km), 또는 3호선 안국역 6번 출구 한 정거장. 1,550원.","dose.d8-toSalon.title":"살롱까지 택시 두 대","dose.d8-toSalon.where":"뷰티팰리스 경복궁점, 또는 예약한 메이크업 살롱","dose.d8-toSalon.who":"다 함께","dose.d8-toShop.detail":"살롱과 대여점은 경복궁역 4번 출구와 자하문로2길 주변 같은 몇 골목에 몰려 있어요. 짧고 평평한 도보 이동, 이동이라 부를 정도도 아닙니다.","dose.d8-toShop.title":"한복집으로 도보 이동","dose.d8-toShop.where":"한복 대여점, 경복궁역 4번 출구 일대","dose.d8-toShop.who":"다 함께","dose.d9-back.detail":"도시를 가로질러 30분. 오늘은 취침이 늦어지도록 일부러 짠 거라, 내일 아침은 실내에서 천천히 시작해요.","dose.d9-back.title":"인사동으로 먼저 복귀","dose.d9-back.who":"할머니·할아버지 · 아이 셋 · 당번 부모","dose.d9-bfast.detail":"일부러 늦게 시작 — 오늘의 진짜 일정은 망원시장에서의 저녁이니, 오후 중반부터 지쳐 있으면 안 돼요.","dose.d9-bfast.title":"아침","dose.d9-bfast.who":"다 함께","dose.d9-cheonggyecheon.detail":"도심 한복판, 도로 아래로 흐르는 하천이고, 호텔에서 걸어서 5분이에요. 물가라 시원하고, 전 구간이 평지고, 더위가 오기 전에 걷기엔 정말 좋아요. 걷고 싶은 만큼만 걷다가 아무 다리에서든 올라오면 돼요. 원래는 시간 때우기용이었는데 오늘의 진짜 오전 일정으로 옮겼어요 — 오후엔 마포까지 나가야 하니 아침은 가볍게 시작해야 해서요.","dose.d9-cheonggyecheon.fallback":"언제든 되돌아와도 돼요. 하천 전체가 위쪽 도로와 나란히 흐르니까, 꼭 얼마를 걸어야 한다는 게 없어요.","dose.d9-cheonggyecheon.label.0":"하천 진입로는 대부분 계단이에요. 유모차라면 경사로 입구를 먼저 찾으세요.","dose.d9-cheonggyecheon.title":"청계천의 아침","dose.d9-cheonggyecheon.where":"청계천, 호텔에서 도보 5분","dose.d9-cheonggyecheon.who":"다 함께","dose.d9-hongdae.detail":"홍대 메인 거리는 연남 공원 끝에서 도보 10분이에요 — 버스킹, 길거리 음식, 레코드 가게, 그리고 서울에서 늦게까지 여는 가게가 가장 빽빽하게 모인 곳이에요. 확정이 아니라 후보로 넣어둔 이유는, 시끄럽고 심하게 붐비고 잠자리에 들 아기 둘한테는 아주 안 맞는 환경이라서예요. 한 가지 다행: 오늘이 월요일이라, 이 동네에서 한 주 중 가장 조용한 저녁이에요.","dose.d9-hongdae.fallback":"그냥 건너뛰기. 아이가 있는 사람은 다 연남에서 바로 호텔로 돌아가고, 이 일정은 아예 없는 걸로.","dose.d9-hongdae.label.0":"19:30에 홍대 팀 분리. 갈 어른만 보내고, 나머지는 차로 호텔로.","dose.d9-hongdae.title":"홍대, 원하는 사람만","dose.d9-hongdae.where":"홍대 메인 거리와 어울마당로","dose.d9-hongdae.who":"가고 싶은 어른들","dose.d9-lunch.detail":"종로로 돌아와 시간에 여유가 있어요. 오늘 저녁은 시장에서 서서 먹는 자리라, 여기서 제대로 챙겨 드세요.","dose.d9-lunch.title":"호텔 근처에서 점심","dose.d9-lunch.who":"다 함께","dose.d9-mangwon.detail":"광장시장 대신 넣은 곳이고, 이 팀한테 중요한 모든 면에서 더 잘 맞아요. 망원은 관광지가 아니라 실제로 굴러가는 동네 시장이에요 — 현지 사람들이 진짜 장을 보고, 관광객용으로 가격이 새로 매겨져 있지도 않고, 지붕 있는 아케이드가 광장시장 통로보다 넓고 여유로워요. 여기서 먹을 것은 새콤달콤한 소스의 닭강정, 떡볶이, 갓 튀긴 만두, 그리고 고로케예요. 늦은 오후가 사람이 차고 모든 게 뜨끈뜨끈한 시간이에요.","dose.d9-mangwon.fallback":"너무 붐비면 먹을 것만 사서 도보 2분 거리 망원한강공원에서 강 옆에서 드세요.","dose.d9-mangwon.label.0":"망원은 지붕은 있지만 붐벼요. 유모차는 최대 하나, 아기띠 활용, 서서 먹거나 공원에서 먹을 각오로.","dose.d9-mangwon.label.1":"현금 꼭 챙기세요. 카드 되는 노점도 있지만, 안 되는 곳도 많아요.","dose.d9-mangwon.label.2":"가기 전에 휴무일을 확인하세요. 전통시장은 일·월요일에 쉬는 곳이 많고, 오늘이 월요일이에요.","dose.d9-mangwon.title":"망원시장 — 서서 저녁","dose.d9-mangwon.where":"망원시장, 마포구 · 망원역 6호선 2번 출구","dose.d9-mangwon.who":"다 함께","dose.d9-nap.title":"호텔에서 낮잠 시간","dose.d9-nap.who":"아이 셋 + 할머니·할아버지","dose.d9-tomapo.detail":"도시를 서쪽으로 가로질러 마포구의 망원·연남 쪽으로. 아홉 명이라 차량 두 대를 쓰거나, 다들 지하철도 괜찮다 싶으면 6호선 — 망원역은 홍대입구역에서 두 정거장이에요.","dose.d9-tomapo.title":"마포로 건너가기","dose.d9-tomapo.where":"망원동, 마포구","dose.d9-tomapo.who":"다 함께","dose.d9-yeonnam.detail":"폐선이 된 철길을 길고 좁은 공원으로 바꾼 곳이고, 연남동을 관통하며, 서울 이쪽에서 유모차 다니기에 가장 좋은 코스예요 — 평지고, 직선이고, 잔디밭이 있고, 넓고, 조용한 카페와 상점이 이어져 있어요. 이 동네의 조용한 얼굴이고, 홍대 인파 속으로 들어가지 않고도 망원과 홍대 사이를 걸어서 이어줘요.","dose.d9-yeonnam.fallback":"시장 다녀오고 곧장 호텔로 돌아가도 돼요. 필수가 아니라 보너스 일정이라, 건너뛰어도 아무도 서운해하지 않아요.","dose.d9-yeonnam.getting":"망원시장에서 택시로 약 10분, 혹은 지하철로 세 정거장.","dose.d9-yeonnam.title":"연남동과 경의선숲길","dose.d9-yeonnam.where":"경의선숲길, 연남동","dose.d9-yeonnam.who":"다 함께","leg.air.hotel":"KE042 · 시애틀→인천","leg.air.range":"9월 5–6일","leg.air.short":"이동 중","leg.icn.hotel":"하얏트 리젠시 인천 파라다이스시티 · 영종도","leg.icn.range":"9월 16–18일","leg.icn.short":"영종도","leg.insa.ho <script type="module">
/* Seoul trip — dispensing strip renderer.
   Small hand-rolled DOM builder; no framework, no build step. */

const $ = (sel, root = document) => root.querySelector(sel);

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const SKY = {
  sun:     { icon: "sun",     label: "Sunny" },
  cloud:   { icon: "cloud",   label: "Cloudy" },
  rain:    { icon: "rain",    label: "Rain" },

function icon(name, size = 14) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.5");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", ICON[name] || ICON.warn);
  svg.append(p);
  return svg;
}

/* ---------------- time helpers ---------------- */

const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW_KO = ["일", "월", "화", "수", "목", "금", "토"];

const parseISO = (d) => {
  const [y, m, dd] = d.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, dd));
};

const dowOf = (d) => DOW[parseISO(d).getUTCDay()];
const dayNum = (d) => parseISO(d).getUTCDate();
const monOf = (d) => MON[parseISO(d).getUTCMonth()];

/* Korean writes the weekday last and in one character, which is why the day rail
   fits it in the same slot as "Sat". */
const dowShort = (d) => (lang === "ko" ? DOW_KO[parseISO(d).getUTCDay()] : dowOf(d));
const fmtDate = (d) =>
  lang === "ko"
    ? `${parseISO(d).getUTCMonth() + 1}월 ${dayNum(d)}일 (${DOW_KO[parseISO(d).getUTCDay()]})`
    : `${dowOf(d)} ${dayNum(d)} ${monOf(d)}`;

const toMin = (hhmm) => {
  if (!hhmm) return null;
  const [h1, m1] = hhmm.split(":").map(Number);
  return h1 * 60 + m1;
};

const fmtDur = (mins) => {
  if (!mins) return null;
  const hrs = Math.floor(mins / 60);
  const rem = mins % 60;
  if (lang === "ko") {
    if (hrs && rem) return `${hrs}시간 ${rem}분`;
    if (hrs) return `${hrs}시간`;
    return `${rem}분`;
  }
  if (hrs && rem) return `${hrs}h ${rem}m`;
  if (hrs) return `${hrs}h`;
  return `${rem}m`;
};

/** Current wall-clock date and time in Seoul, regardless of the host's zone. */
function seoulNow() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t)?.value ?? "00";
  return {
    date: `${get("year")}-${get("month")}-${get("day")}`,
    minutes: Number(get("hour")) * 60 + Number(get("minute")),
    clock: `${get("hour")}:${get("minute")}`,
  };
}

/* ---------------- language ---------------- */

/* English is the source of truth; Korean is an overlay keyed off the same ids
   (lib/ko.mjs). A missing key falls back to English rather than showing a blank,
   so a half-translated build degrades to a readable one. */

const LANG_KEY = "seoul-2026-09/lang";
const LANGS = ["en", "ko"];

let lang = (() => {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch { /* private mode */ }
  return "en";
})();

const dict = () => (lang === "ko" ? window.__KO__ || {} : null);

/** Korean for `key` when Korean is on and we have it; the English otherwise. */
function t(key, en) {
  const d = dict();
  const v = d && d[key];
  return typeof v === "string" && v.trim() ? v : en;
}

/** Interface chrome, with {placeholder} interpolation. */
function ui(key, en, vars) {
  let s = t(`ui.${key}`, en);
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}

/* Content accessors — one per shape in the plan, so the key strings live in
   exactly one place and stay in step with scripts/i18n.mjs. */
const tTrip = (f) => t(`trip.${f}`, state.trip[f]);
const tLeg = (leg, f) => t(`leg.${leg.id}.${f}`, leg[f]);
const tDay = (day, f) => t(`day.${day.date}.${f}`, day[f]);
const tDose = (dose, f) => t(`dose.${dose.id}.${f}`, dose[f]);
const tLabel = (dose, i, text) => t(`dose.${dose.id}.label.${i}`, text);
const tNap = (day, i, f, v) => t(`day.${day.date}.nap.${i}.${f}`, v);
/* A clock time reads the same in both languages; a phrase like "Before you fly"
   is prose and has a Korean key beside it. */
const tStart = (dose) => (/^\d{1,2}:\d{2}$/.test(dose.start || "") ? dose.start : tDose(dose, "start"));
const tWeatherNote = (day) => t(`day.${day.date}.weatherNote`, day.weather?.note);
const skyLabel = (k) => ui(`sky.${k}`, SKY[k]?.label || "");

function setLang(next) {
  if (next === lang || !LANGS.includes(next)) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch { /* private mode */ }
  applyLang();
  render();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dataset.lang = lang;
}

/* ---------------- state ---------------- */

const state = { trip: null, day: null, view: "day", sheet: null };
let lastOrigin = null;

const LS_KEY = "seoul-2026-09/local";
function readLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function writeLocal(v) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch { /* private mode */ }
}
function withLocal(seed) {
  const ov = readLocal();
  if (!Object.keys(ov).length) return seed;
  return {
    ...seed,
    days: seed.days.map((d) => ({
      ...d,
      doses: d.doses.map((x) => (ov[x.id] ? { ...x, ...ov[x.id] } : x)),
    })),
  };
}

async function load() {
  state.trip = withLocal(window.__TRIP__);
  const now = seoulNow();
  const dates = state.trip.days.map((d) => d.date);
  const inTrip = dates.includes(now.date);
  state.day = inTrip ? now.date : dates[0];
  state.view = inTrip ? "day" : "overview";
  applyLang();
  render();
}

async function patchDose(id, patch) {
  const ov = readLocal();
  ov[id] = { ...(ov[id] || {}), ...patch };
  writeLocal(ov);
  state.trip = withLocal(window.__TRIP__);
  render();
}

const currentDay = () => state.trip.days.find((d) => d.date === state.day);
const legOf = (day) => state.trip.legs.find((l) => l.id === day.legId);

/** Every dose in the trip that carries a caution or an unverified fact. */
function allFlags() {
  const out = [];
  for (const day of state.trip.days) {
    for (const dose of day.doses) {
      for (const label of dose.labels || []) {
        if (label.kind === "warn" || label.kind === "verify") out.push({ day, dose, label });
      }
    }
  }
  return out;
}

/* ---------------- render ---------------- */

/* Re-rendering must not move the reader. The minute tick, a language switch and
   ticking a dose done all rebuild the page under someone who is halfway down it,
   so `preserveScroll` defaults to true. Navigation passes false, because landing
   on a different day should start at the top.

   Note the reader scrolls `.strip-scroll`, not the window — body is
   overflow:hidden and .app is a fixed-height grid. replaceChildren() discards
   that element outright, so its offset has to be carried across by hand. */
function render({ preserveScroll = true } = {}) {
  const root = $("#app");
  const keptScroll = preserveScroll ? ($(".strip-scroll")?.scrollTop ?? 0) : 0;
  const body =
    state.view === "index" ? renderIndex() :
    state.view === "overview" ? renderOverview() :
    renderDay();
  root.replaceChildren(
    renderEnvelope(),
    renderRail(),
    body,
  );
  if (keptScroll) {
    const pane = $(".strip-scroll");
    if (pane) pane.scrollTop = keptScroll;
  }
  const flags = allFlags();
  const existing = $(".fab");
  if (existing) existing.remove();
  if (flags.length) document.body.append(renderFab(flags.length));
  if (state.sheet) openSheet(state.sheet);
}

function renderEnvelope() {
  const trip = state.trip;
  const now = seoulNow();

function renderRail() {
  const rail = h("div", { class: "rail", role: "tablist", "aria-label": ui("days", "Days") });
  const now = seoulNow();
  rail.append(h("button", {
    class: "day-tab day-tab--all",
    role: "tab", "aria-selected": String(state.view === "overview"),
    "aria-label": ui("wholeTrip", "Whole trip on one page"),
    onclick: () => { state.view = "overview"; render({ preserveScroll: false }); },
  },
    h("span", { class: "day-tab__dow" }, ui("all", "All")),
    h("span", { class: "day-tab__d day-tab__d--all" }, ui("allDays", "days")),
  ));
  for (const day of state.trip.days) {
    const selected = day.date === state.day && state.view === "day";
    const hasFixed = day.doses.some((d) => d.status === "booked" && d.kind === "fixed");
    const hasWarn = day.doses.some((d) => (d.labels || []).some((l) => l.kind === "warn"));
    rail.append(h("button", {
      class: `day-tab${day.date === now.date ? " day-tab--today" : ""}`,
      role: "tab", "aria-selected": String(selected),
      "aria-label": `${fmtDate(day.date)} — ${tDay(day, "title")}`,
      onclick: () => { state.view = "day"; state.day = day.date; render({ preserveScroll: false }); },
    },
      h("span", { class: "day-tab__dow" }, dowShort(day.date)),
      h("span", { class: "day-tab__d" }, String(dayNum(day.date))),
      hasFixed ? h("span", { class: "day-tab__pin" })
        : hasWarn ? h("span", { class: "day-tab__pin day-tab__pin--warn" }) : null,
    ));
  }
  queueMicrotask(() => {
    const active = rail.querySelector('[aria-selected="true"]');
    if (!active) return;
    /* Move the rail's own scrollLeft rather than calling scrollIntoView(), which
       walks up and scrolls every scrollable ancestor as well — dragging the
       whole page around just to centre a tab. */
    const r = rail.getBoundingClientRect();
    const a = active.getBoundingClientRect();
    const delta = (a.left - r.left) - (r.width - a.width) / 2;
    const max = rail.scrollWidth - rail.clientWidth;
    const next = Math.max(0, Math.min(rail.scrollLeft + delta, max));
    if (Math.abs(rail.scrollLeft - next) > 1) rail.scrollLeft = next;
  });
  return rail;
}

function openSheet(id, origin) {
  closeSheet(false);
  let dose = null, day = null;
  for (const d of state.trip.days) {
    const found = d.doses.find((x) => x.id === id);

    class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": tDose(dose, "title"), tabindex: "-1",
    style: { "--seal": SEAL_VAR[dose.kind] || "var(--film-edge)" },
  },
    h("div", { class: "sheet__grip" }),
    h("div", { class: "sheet__seal", "aria-hidden": "true" }),
    h("div", { class: "sheet__body" },
      h("div", { class: "sheet__head" },
        h("span", { class: "sheet__time" }, tStart(dose)),
        dose.end ? h("span", { class: "sachet__span" }, `→ ${dose.end}`) : null,
        dose.mins ? h("span", { class: "sachet__span" }, fmtDur(dose.mins)) : null,
      ),
      h("h2", {}, tDose(dose, "title")),
      dose.detail ? h("p", { class: "sheet__detail" }, tDose(dose, "detail")) : null,
      dose.labels?.length ? h("div", { class: "labels" },
        dose.labels.map((l, li) => h("span", { class: `label label--${l.kind}` }, icon(l.kind === "rest" ? "rest" : l.kind === "verify" ? "verify" : l.kind === "fall" ? "fall" : "warn", 13), tLabel(dose, li, l.text))),
      ) : null,
      h("dl", { class: "fields" },
        field(ui("f.date", "Date"), fmtDate(day.date)),
        field(ui("f.who", "Who"), dose.who ? tDose(dose, "who") : ui("everyone", "Everyone")),
        dose.leaveBy ? field(ui("f.leaveBy", "Leave by"), dose.leaveBy) : null,
        dose.where ? field(ui("f.where", "Where"), (() => {
          /* Gate on the English string so the filters keep working, then
             search in Korean when Korean is on — Naver resolves it better. */
          const gate = naverQuery(dose.where);
          const koWhere = lang === "ko" ? tDose(dose, "where") : null;
          const q = gate && koWhere && koWhere !== dose.where
            ? koWhere.split(/\s+[·—→]\s+/)[0].trim().replace(/[,;.]+$/, "")
            : gate;
          return h("span", {},
            tDose(dose, "where"),
            q ? h("a", {
              class: "field__map",
              href: `https://map.naver.com/p/search/${encodeURIComponent(q)}`,
              target: "_blank", rel: "noreferrer",
            }, icon("pin", 12), ui("naverMap", "Naver Map")) : null,
          );
        })()) : null,
        dose.getting ? field(ui("f.getting", "Getting there"), tDose(dose, "getting")) : null,
        dose.cost ? field(ui("f.cost", "Cost"), tDose(dose, "cost")) : null,
        dose.fallback ? field(ui("f.fallback", "If it fails"), tDose(dose, "fallback")) : null,
        dose.book ? field(ui("f.book", "To book"), dose.book) : null,
        field(ui("f.status", "Status"), {
          booked: ui("status.booked", "Booked and confirmed"),
          planned: ui("status.planned", "Planned, not booked"),
          idea: ui("status.idea", "Idea — swap freely"),
        }[dose.status] || dose.status),
        dose.source ? field(ui("f.source", "Source"), h("a", { href: dose.source, target: "_blank", rel: "noreferrer" }, new URL(dose.source).hostname.replace(/^www\./, ""))) : null,
      ),
      h("div", { class: "sheet__actions" },
        h("button", {
          class: "btn btn--primary",
          onclick: () => { patchDose(dose.id, { done: !dose.done }); closeSheet(); },
        }, dose.done ? ui("markNotDone", "Mark not done") : ui("markDone", "Mark done")),
        h("button", { class: "btn", onclick: () => closeSheet() }, ui("close", "Close")),
      ),
    ),
  );

  document.body.append(backdrop, sheet);

  /* Peephole: the sheet grows out of the sachet you tapped and shrinks back
     into it, so the strip stays the map and the sheet is the window opening. */
  if (lastOrigin && !reduceMotion()) {
    const from = lastOrigin.getBoundingClientRect();
    const to = sheet.getBoundingClientRect();
    if (to.width > 0 && to.height > 0) {
      const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
      const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
      sheet.animate(
        [
          { transform: `translate(${dx}px, ${dy}px) scale(${Math.max(0.28, from.width / to.width)}, ${Math.max(0.12, from.height / to.height)})`, opacity: 0, borderRadius: "8px" },
          { transform: "translate(0, 0) scale(1, 1)", opacity: 1 },
        ],
        { duration: 320, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "backwards" },
      );
      backdrop.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: "ease-out" });
    }
  }

  const app = document.getElementById("app");
  if (app) app.inert = true;
  sheet.focus();
}

function reduceMotion() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* Focus trap. aria-modal alone does not stop Tab escaping into the strip. */
function trapFocus(e) {
  const sheet = document.querySelector(".sheet");
  if (!sheet || e.key !== "Tab") return;
  const items = [...sheet.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter((el) => el.offsetParent !== null);
  if (!items.length) { e.preventDefault(); sheet.focus(); return; }
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === sheet)) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}
document.addEventListener("keydown", trapFocus, true);

/* Google Maps will not route inside Korea, so every location links to Naver.
   The `where` strings carry prose after the place name; strip it down to
   something Naver can actually resolve, and link nothing when it cannot. */
const GENERIC = /^(hanbok rental|makeup salon)\b|^(a|an|the)?\s*(shop|salon|clinic|restaurant|market)s?\b/i;

function naverQuery(where) {
  if (!where) return null;
  let q = where.split(/\s+[·—→]\s+/)[0];
  q = q.split(/\.\s|\bor\b/i)[0];
  q = q.replace(/,\s+[a-z][^,]*$/, "");
  q = q.trim().replace(/[,;.]+$/, "");
  if (q.length > 75) q = q.split(",")[0].trim();
  if (!q) return null;
  if (/\bSEA\b|Seattle|^Departs\b/i.test(q)) return null;
  if (GENERIC.test(q)) return null;
  if (!/[A-Z\uAC00-\uD7A3]/.test(q)) return null;
  return q;
}

function field(label, value) {
  return h("div", { class: "field" }, h("dt", {}, label), h("dd", {}, value));
}

function closeSheet(clearState = true) {
  const sheet = document.querySelector(".sheet");
  const backdrop = document.querySelector(".sheet-backdrop");
  const app = document.getElementById("app");
  if (app) app.inert = false;

  const origin = lastOrigin;
  const drop = () => { sheet?.remove(); backdrop?.remove(); };

  if (sheet && clearState && origin && document.contains(origin) && !reduceMotion()) {
    const from = origin.getBoundingClientRect();
    const to = sheet.getBoundingClientRect();
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    backdrop?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 190, easing: "ease-in", fill: "forwards" });
    const a = sheet.animate(
      [
        { transform: "translate(0, 0) scale(1, 1)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(${Math.max(0.28, from.width / to.width)}, ${Math.max(0.12, from.height / to.height)})`, opacity: 0, borderRadius: "8px" },
      ],
      { duration: 210, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" },
    );
    a.onfinish = drop;
    a.oncancel = drop;
  } else {
    drop();
  }

  if (clearState) { state.sheet = null; origin?.focus?.(); lastOrigin = null; }
}

        ),
        h("span", { class: "ov-day__body" },
          h("span", { class: "ov-day__title" }, tDay(day, "title")),
          fixedTag ? h("span", { class: "ov-day__fixed" }, fixedTag) : null,
          h("span", { class: "ov-day__gist" }, tDay(day, "gist") || ""),
        ),
        h("span", { class: "ov-day__side" },
          sky ? h("span", { class: "ov-day__sky", title: skyLabel(day.weather.sky) },
            icon(sky.icon, 15),
            h("span", { class: "u-sr" }, skyLabel(day.weather.sky)),
          ) : null,
          h("span", { class: "ov-day__pace" }, pace),
        ),
      ));
    }
    wrap.append(band);
  }

  wrap.append(h("p", { class: "ov-foot" }, tTrip("weatherCaveat") || ""));
  scroll.append(wrap);
  return scroll;
}

function renderIndex() {
  const flags = allFlags();
  const scroll = h("div", { class: "strip-scroll" });
  scroll.append(
    h("div", { class: "day-head" },
      h("div", { class: "day-head__meta" }, h("span", {},
        ui("idxMeta", `${flags.length} cautions across ${state.trip.days.length} days`,
          { n: flags.length, d: state.trip.days.length }))),
      h("h1", {}, ui("idxTitle", "Everything that could bite")),
    ),
  );

  const wrap = h("div", { class: "strip" });
  for (const kind of ["warn", "verify"]) {
    const group = flags.filter((f) => f.label.kind === kind);
    if (!group.length) continue;
    const g = h("section", { class: "index-group" },
      h("h2", { class: "index-group__h" }, kind === "warn"
        ? ui("grp.warn", "Collisions and cautions")
        : ui("grp.verify", "Confirm before you rely on it")),
    );
    for (const { day, dose, label } of group) {
      const li = (dose.labels || []).indexOf(label);
      g.append(h("button", {
        class: `index-row index-row--${dose.kind}`,
        onclick: () => { state.view = "day"; state.day = day.date; render({ preserveScroll: false }); openSheet(dose.id); },
      },
        h("span", { class: "index-row__seal", "aria-hidden": "true" }),
        h("div", { class: "index-row__m" }, `${fmtDate(day.date)} · ${tStart(dose)}`),
        h("div", { class: "index-row__t" }, tDose(dose, "title")),
        h("div", { class: "index-row__d" }, tLabel(dose, li, label.text)),
      ));
    }
    wrap.append(g);
  }
  scroll.append(wrap);
  return scroll;
}

/* ---------------- keyboard ---------------- */

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.sheet) { closeSheet(); return; }
  if (state.view !== "day" || state.sheet) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.target.closest("input, textarea")) return;
  const dates = state.trip.days.map((d) => d.date);
  const i = dates.indexOf(state.day);
  const next = e.key === "ArrowLeft" ? i - 1 : i + 1;
  if (next < 0 || next >= dates.length) return;
  e.preventDefault();
  state.day = dates[next];
  render({ preserveScroll: false });
});

/* Live "now" rule: re-render on the minute so it stays honest. */
setInterval(() => { if (state.trip && !state.sheet) render(); }, 60_000);

load();

</script>
