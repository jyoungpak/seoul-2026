ely usable instead of theoretically off-limits. The cost of the placement is that you leave the country roughly thirty hours later — fine for a routine shave or laser removal, and the thing to reconsider if the doctor wants to cut deeper.","where":"Rene Clinic (르네의원), 3F Rooms 304–308, SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu, Incheon · 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층 304–308호 · +82 32-716-5716 · Thursday hours 10:00–20:00 with a 13:00–14:00 lunch break","cost":"Not published. Incheon rates generally run ₩10,000–₩20,000 for a small or medium flat mole, typically 10–30% below Gangnam, with multiple moles often priced as a package. Add roughly ₩30,000–₩60,000 if anything goes to biopsy. Confirm the price at the desk before the procedure starts.","source":"https://rene-clinic.com/","fallback":"If Rene cancels, Yes Dermatology (032-752-9730) in the Unseo cluster is five minutes from the resort and also opens 10:00 Thursday, with two board-certified dermatologists. Yeongjong Central Dermatology (032-746-3200) and Doctors Dermatology Yeongjong (032-710-2346) are in the same cluster on the same hours.","labels":[{"kind":"warn","text":"13:00 is the real deadline, not 14:00 — the clinic shuts 13:00–14:00 for lunch."},{"kind":"rest","text":"Three patients on one doctor. Realistically out by 11:30; the room is held to 12:00."},{"kind":"warn","text":"Ask whether anything goes to pathology. If the doctor wants a biopsy, defer to Seattle."},{"kind":"warn","text":"If the doctor recommends sutures instead of a shave, don't do it 30 hours before a ten-hour flight."},{"kind":"verify","text":"Ask if Dr. Moon Seong-ho (문성호) is a 피부과 전문의. Check akd.or.kr/dermatologist/verify."},{"kind":"verify","text":"Ask for aftercare instructions in English, in writing. Use the hotel concierge by phone if needed."},{"kind":"warn","text":"Buy dressings, ointment, and silicone gel before you leave the clinic."},{"kind":"warn","text":"No swimming, sauna, or hot tub for seven to ten days from today."},{"kind":"rest","text":"Photograph the wound with a ruler today and tomorrow for a Seattle dermatologist."},{"kind":"verify","text":"Confirm the clinic takes foreign cards. Three separate payments will be slower."}]},{"id":"d12-morning","start":"10:15","end":"12:15","title":"Resort morning, whatever anyone feels like","kind":"rest","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Pool for whoever can, grounds for whoever wants, room for whoever needs it. No group activity, and no waiting around for the clinic party — start lunch without them if they run late.","labels":[]},{"id":"d12-back","start":"12:00","end":"12:15","title":"Back to the resort","kind":"transit","status":"planned","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"Ask the clinic to call the return taxi before you walk out. Ten minutes later you are back. If you finish closer to 11:30, you get the spare half hour back at the pool."},{"id":"d12-lunch","start":"12:15","mins":60,"title":"Lunch on site","kind":"meal","status":"planned","who":"Everyone","detail":"Eat inside the complex. This is the last full day and nobody needs a taxi for lunch. The clinic party may walk in a few minutes late — start without them."},{"id":"d12-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[]},{"id":"d12-pack","start":"15:30","end":"17:00","title":"Pack properly","kind":"admin","status":"planned","who":"Adults","detail":"All the skincare into checked bags. Formula, milk, snacks, and a full change of clothes per child into the cabin bag. Passports and boarding passes somewhere one person is responsible for.","labels":[{"kind":"warn","text":"Pack every Myeongdong liquid and gel in checked luggage before you reach the airport."}]},{"id":"d12-outing","start":"16:00","end":"17:30","title":"Sunset somewhere near the water","kind":"outing","status":"idea","who":"Whoever wants it","whoSplit":true,"detail":"Yeongjong has west-facing coast and the sunsets are the reason people stay out here. Late afternoon rather than midday keeps it off anyone's healing skin.","fallback":"Drop it without a second thought if the day has been enough.","labels":[{"kind":"verify","text":"Confirm sunset time and a viewpoint a short taxi ride from the hotel."}]},{"id":"d12-dinner","start":"18:30","mins":90,"title":"Last dinner","kind":"meal","status":"planned","who":"Everyone","detail":"Twelve days, nine people, everybody still speaking to each other. Book something good."}]},{"date":"2026-09-18","legId":"icn","title":"Home","gist":"Last breakfast, an early lunch, and KE041 home at 16:40. The airport is 15 minutes away.","pace":"Travel","weather":{"sky":"sun","hi":24,"lo":20,"note":"The cloud has gone for your last day: clear, 24°C, dry — and dry is what matters with nine people and a luggage convoy. The sun is the part to act on. Three of you had moles removed yesterday morning, and open sun on a day-old wound is exactly what the clinic will have told you to avoid. It's a short exposure — the morning wound check, the 13:00 run to Terminal 2, then indoors — but wear hats for those three and keep the dressings covered rather than letting them catch sun on the kerb. The low is 20°C, two degrees up, mild enough that the infants can wear one layer that works outside and inside without a change."},"note":"The one genuine advantage of staying on Yeongjong Island: the airport is fifteen minutes away instead of ninety. A calm morning, an early lunch, and a departure that does not start at dawn.","naps":[{"who":"All three","start":"on board","end":"eventually"}],"doses":[{"id":"d13-bfast","start":"09:00","mins":60,"title":"Last breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, like the rest of the trip. The car to Terminal 2 does not leave until 13:00, so there is room for a proper last meal without anyone watching a clock."},{"id":"d13-woundcheck","start":"10:15","mins":15,"title":"Wound check before the flight","kind":"medical","status":"planned","who":"Whoever had it removed","whoSplit":true,"detail":"About twenty-four hours on. Look at it in good daylight, change the dressing, and photograph it with a ruler in frame — that photo is what a Seattle dermatologist will compare against. Then dress it clean for the flight, because cabin air is dry and ten hours is a long time.","fallback":"If it looks wrong — spreading redness, heat, or weeping that will not stop — call Rene Clinic on +82 32-716-5716 the moment they open at 10:00, not from the airport. You are ten minutes from them this morning and you will be nine thousand kilometres away tonight. Even a 10:00 call leaves three hours before the car leaves.","labels":[{"kind":"warn","text":"Pack ointment and spare dressings in your cabin bag. Redress it once mid-flight."},{"kind":"rest","text":"Take the second wound photo. Use the same ruler and light if you can."}]},{"id":"d13-morning","start":"10:30","end":"11:45","title":"Slow morning, bags down","kind":"rest","status":"planned","who":"Everyone","detail":"Checkout is usually 11:00. Store the bags and use the lobby until you leave."},{"id":"d13-lunch","start":"11:45","mins":60,"title":"Early lunch before the airport","kind":"meal","status":"planned","who":"Everyone","detail":"Eat properly now. Airside with nine people is not where you want to be solving lunch."},{"id":"d13-toAirport","start":"13:00","end":"13:30","title":"To Incheon Terminal 2","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:00","detail":"About twenty minutes from the hotel to Terminal 2, so you are checking in around 13:30 for a 16:40 departure. With three car seats to check, a stroller to tag, and tax-free refunds to claim, three hours is the right number rather than a generous one.","where":"ICN Terminal 2 · Korean Air departures","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Korean Air international check-in closes at 15:40. That's the real deadline."},{"kind":"warn","text":"Claim tax-free refunds before security. Afternoon desk queues can be bad."},{"kind":"verify","text":"Paradise City's Terminal 2 shuttle is less frequent. Book a private van for nine people with luggage."},{"kind":"fall","text":"Skip Smart Pass. It starts at age seven, so it would split the group at the gate for nothing."}]},{"id":"d13-ke041","start":"16:40","title":"KE041 · Incheon to Seattle","kind":"fixed","status":"booked","who":"Everyone","detail":"Arrives Seattle 10:40 the same day, 18 September. You land before you took off, which is the only good thing about flying east.","where":"ICN → SEA"},{"id":"d13-liquids","start":"Before you pack","title":"Baby liquids · Korea's rule, not the TSA's","kind":"admin","status":"planned","who":"Both families","whoSplit":true,"detail":"Flying out is the direction where liquids actually bite, and Korea writes its exemption differently from the one you know at home. Milk, formula, water, juice, porridge-type baby food and wet wipes are all exempt from the 100 millilitre limit for children under six, which covers all three of ours, capped only at the amount needed during the flight. There is no number attached to that, which means there is a judgement call at the lane. Pack a credible ten hours' worth rather than the whole tin.","where":"ICN Terminal 2 · security","fallback":"Anything refused can be replaced airside or on board — Korean Air will give you hot water for bottles. Nothing here is worth an argument at the lane with a queue behind you.","source":"https://www.airport.kr/ap_en/1434/subview.do","labels":[{"kind":"warn","text":"Keep each baby's milk in that baby's own household bag. A parent carrying it in a separate lane is unverified."},{"kind":"verify","text":"Gel ice packs are not confirmed exempt. Assume not, and buy ice airside instead."}]},{"id":"d13-mpc","start":"In the air","title":"Mobile Passport Control, before Seattle","kind":"admin","status":"planned","who":"One adult per household","whoSplit":true,"detail":"The mirror image of the Incheon arrival, and the one place on this trip where a phone genuinely saves an hour. Mobile Passport Control is free, Seattle supports it, and it opens a dedicated lane. Submit up to four hours before landing and it stays live for four. File three, one per household — unlike Korea, the US does want a declaration from everyone, and the customs questions inside it are a household declaration where the $800 exemption pools only within a household.","where":"SEA · International Arrivals Facility","fallback":"If the app fails you are still a US citizen with a passport — the standard lane is there and Seattle's facial recognition is automatic. You lose the fast lane, nothing else.","source":"https://www.cbp.gov/travel/us-citizens/mobile-passport-control","labels":[{"kind":"warn","text":"Install it and scan all nine passports before you leave Seoul, not on the plane."},{"kind":"warn","text":"Declare every food item. Declared and refused costs nothing; undeclared is a fine."},{"kind":"warn","text":"Leave meat behind, including the broth sachets in instant ramen. Fresh fruit and seeds are refused too."}]},{"id":"d13-molealt","start":"Only if Rene cancels","title":"The Friday-morning fallback","kind":"medical","status":"idea","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"Thursday 10:00 at Rene Clinic is confirmed, so this is now a cancellation fallback rather than a live option — keep it only because a clinic can call on Wednesday night. The math is much tighter than it used to be, because it is three patients rather than one: Yeongjong clinics open at 10:00, three people take roughly ninety minutes end to end, and the car to Terminal 2 leaves at 13:00. A 10:00 start in the Unseo cluster has you back at the hotel around 11:45 — enough, but it is a single buffer with nothing behind it.","where":"Unseo-dong, five minutes away. Yes Dermatology (032-752-9730) and Yeongjong Central (032-746-3200) both open 10:00 Friday, and TheYul in Cheongna opens 10:00 Friday too if you need a third. Rene itself is open 10:00–20:00 Friday if the cancellation is yours rather than theirs.","fallback":"If the only Friday slot offered is after 10:30, decline it and have the removal done in Seattle instead. Three patients starting at 11:00 finish too close to a 13:00 departure, and no mole is worth a missed flight with nine people.","labels":[{"kind":"warn","text":"For the 10:00 fallback appointment, eat at 08:15 and walk out by 09:30."},{"kind":"warn","text":"Friday means no wound check before the ten-hour flight. That's why Thursday was booked."},{"kind":"rest","text":"Keep the wound covered with the hydrocolloid patch, and reapply ointment right before boarding."},{"kind":"warn","text":"Korean Air check-in closes at 15:40. Leaving the hotel at 13:00 gives a buffer, not endless time."}]}]}],"overlayUpdatedAt":null};</script>
<script>window.__KO__ = {"day.2026-09-05.gist":"시애틀에서 서울로. KE042는 12:50 출발, 내일 오후 도착이에요.","day.2026-09-05.nap.0.end":"착륙 무렵","day.2026-09-05.nap.0.start":"기내에서","day.2026-09-05.nap.0.who":"아기들","day.2026-09-05.nap.1.end":"15:00","day.2026-09-05.nap.1.start":"13:30","day.2026-09-05.nap.1.who":"두 살 아이","day.2026-09-05.note":"오늘은 선택할 수 있는 것도, 조정할 수 있는 것도 없어요. 아홉 명, 카시트 세 개, 그리고 모두가 함께 있어야 하는 국제선 카운터. 실제로 정할 문제는 집에서 얼마나 일찍 나서느냐, 그것 하나예요.","day.2026-09-05.pace":"이동일","day.2026-09-05.title":"시애틀, 그리고 열한 시간","day.2026-09-05.weatherNote":"시애틀에서 출발해 서울에 도착하는 날이에요. 오늘 중요한 건 착륙할 때 인천공항 날씨뿐인데, 그게 좋아졌어요. 장기 모델은 비를 예상했지만 실제로는 건조하고 27도 안팎이에요.","day.2026-09-06.gist":"16:40 도착, 기사님부터 찾고 eSIM과 현금. 오늘은 그게 전부예요.","day.2026-09-06.nap.0.end":"아무 때나","day.2026-09-06.nap.0.start":"아무 때나","day.2026-09-06.nap.0.who":"세 아이 모두","day.2026-09-06.note":"아홉 명이 16:40에 도착한다는 건 현실적으로 20:15 이전에는 호텔 방에 못 들어가고, 그보다 늦어질 수도 있다는 뜻이에요. 다른 일정은 아무것도 잡지 마세요. 오늘 순서는 검역, 입국심사, 수하물, 세관, 그다음이 기사님이에요. eSIM 카운터나 ATM보다 먼저요. 업체는 착륙 시각부터 딱 두 시간만 기다리거든요. 아기들을 재우고, 다 함께 03:00에 눈이 떠질 걸 받아들이세요. Jun과 Jordan에게 오늘은 대장내시경 전날이기도 한데, 이번 계획 전체에서 가장 빡빡하게 겹치는 지점이에요. 흰죽만, 18:00부터 맑은 음료, 저녁에 장 정결제 1차 복용, 21:00 이후 금식 — 이 모든 걸 20:00에 겨우 들어선 호텔 방에서 시작해야 하거든요. NaRhee는 대장내시경이 빠졌으니 저녁은 평범한 검진 전날이에요. 먹고 싶은 걸 먹고 21:00에 멈추면 됩니다. 나머지를 버틸 수 있게 만드는 단 하나는, 도착했을 때 흰죽과 이온음료가 이미 방에 있는 거예요.","day.2026-09-06.pace":"가벼움","day.2026-09-06.title":"착륙, 연결, 눕기","day.2026-09-06.weatherNote":"도착일 하늘에서 구름이 걷혔어요. 맑고 28°C, 여전히 비는 없어요. 착륙 자체는 달라지지 않지만 이동은 달라져요. 18:00쯤 공항을 빠져나가는데 해는 19:00 가까이까지 떠 있어서, 강남으로 동쪽으로 향하는 동안 해가 뒤쪽 낮은 위치에서 뒷유리를 통해 뒤보기 카시트 두 개로 들어와요. 누가 울기 시작한 뒤가 아니라 출발 전에 미리 햇빛 가리개를 내려 두세요. 최저 19°C라 열 시간 비행 뒤 도로변에서 가방을 뒤져 겉옷을 꺼낼 일은 없고, 비 없는 일요일 이동이라 기사님의 두 시간 제한에도 여유가 생겨요.","day.2026-09-07.gist":"08:00부터 셋은 병원, 나머지는 아침 식사 후 코엑스.","day.2026-09-07.nap.0.end":"11:00","day.2026-09-07.nap.0.start":"09:30","day.2026-09-07.nap.0.who":"7개월","day.2026-09-07.nap.1.end":"09:30","day.2026-09-07.nap.1.start":"08:30","day.2026-09-07.nap.1.who":"5개월","day.2026-09-07.nap.2.end":"15:00","day.2026-09-07.nap.2.start":"13:00","day.2026-09-07.nap.2.who":"두 살 아이","day.2026-09-07.note":"새벽 전에 팀이 나뉩니다. 어른 세 명은 금식 상태로 병원에 가고, 나머지 여섯 명은 시차 적응 중에 남아 아침 식사를 하며 무리하지 않아요. 이날의 유일한 행운은 위치예요 — 광동병원은 봉은사로 612, 코엑스 바로 옆, 파크 하얏트에서 약 5분 거리입니다. 병원의 세 명과 몰의 여섯 명은 오전 내내 서로 도보 거리 안에 있어요.","day.2026-09-07.pace":"분리 일정","day.2026-09-07.title":"검진, 나머지는 아주 느긋한 하루","day.2026-09-07.weatherNote":"흐리고 28°C, 여전히 완전히 건조해요. 06:30에 시작하는 하루에는 똑같이 좋은 조건이고, 세 사람이 아무것도 못 먹는 이 아침에는 떠오르는 햇볕보다 구름이 나아요. 달라진 건 새벽이에요. 최저기온이 3도 올라 20°C가 됐으니 06:30도 더 이상 쌀쌀하지 않아요. 지난 예보에서 챙기라고 했던 겉옷은 빼세요. 나서는 순간부터 포근하고, 병원까지 들고 갔다 올 짐이 하나 줄어요. 남는 여섯 사람은 어느 쪽이든 크게 체감하지 않아요. 코엑스와 별마당 도서관은 냉방이 되고 낮잠 시간은 호텔에서 보내니까요.","day.2026-09-08.gist":"오전엔 서울숲, 낮잠 후엔 보톡스와 스킨케어, 저녁 6시엔 크랩52예요.","day.2026-09-08.nap.0.end":"11:00","day.2026-09-08.nap.0.start":"09:30","day.2026-09-08.nap.0.who":"7개월","day.2026-09-08.nap.1.end":"13:00","day.2026-09-08.nap.1.start":"11:30","day.2026-09-08.nap.1.who":"5개월","day.2026-09-08.nap.2.end":"15:00","day.2026-09-08.nap.2.start":"13:00","day.2026-09-08.nap.2.who":"두 살 아이","day.2026-09-08.note":"아직 시차 적응 중이에요. 오전엔 야외 일정 하나, 오후엔 실내 일정 하나, 그리고 호텔에서 15분 이상 떨어진 곳은 가지 않아요. 경복궁은 화요일에 쉬기 때문에 오늘은 일부러 궁을 건너뛰고 성수대교를 건너 잠깐 다녀와요. 서울숲은 이 호텔에서 갈 수 있는 가장 평평하고 그늘이 많은 녹지예요. 오늘 유일하게 시간을 꼭 지켜야 하는 일정은 저녁이에요. 크랩52를 저녁 6시에 9명으로 예약해 뒀고, 강남 구간에서 유일한 예약이라 오후 일정은 제시간에 끝내야 해요.","day.2026-09-08.pace":"가벼움","day.2026-09-08.title":"여유로운 강남","day.2026-09-08.weatherNote":"맑던 저녁이 다시 흐려졌고, 전망도 함께 사라졌어요. 흐리고 28°C, 비는 없어요. Crab 52는 52층이고 18:00 예약이 이제 구름 아래에 놓이니 저녁을 창밖 전망 중심으로 잡지 마세요. 예약한 이유는 음식이고, 전망은 화려하기보다 흐릿할 거예요. 이제 여행 중 가장 더운 날도 아니에요. 다른 나흘이 똑같이 28°C예요. 대신 구름 덕분에 서울숲 산책은 나아져요. 뙤약볕 없이 28°C면 훨씬 수월하거든요. 최저기온은 15°C로 그대로예요. 여전히 여행 중 가장 추운 아침이라 아기 둘 다 아침 식사 때 형식적인 겉옷이 아니라 제대로 된 겉옷이 필요해요.","day.2026-09-09.gist":"Jun, Ann, 아기는 예약된 10:00 열차로 대전. 나머지는 강남.","day.2026-09-09.nap.0.end":"대략 11:00","day.2026-09-09.nap.0.start":"열차 안에서","day.2026-09-09.nap.0.who":"7개월","day.2026-09-09.nap.1.end":"13:00","day.2026-09-09.nap.1.start":"11:30","day.2026-09-09.nap.1.who":"5개월","day.2026-09-09.nap.2.end":"15:00","day.2026-09-09.nap.2.start":"13:00","day.2026-09-09.nap.2.who":"두 살 아이","day.2026-09-09.note":"여행 중 유일한 장거리 일정이고, 파크 하얏트 구간에 일부러 붙였어요. 수서역이 삼성동에서 가깝고, 여기서 남쪽으로 가는 고속선이 대전으로 가는 가장 빠른 방법이거든요. 처음 계획을 세운 뒤로 두 가지가 바뀌었어요. 가는 편은 이제 예약이 끝났고 — KTX 393, 14호차, 6C·7C 좌석이에요 — 아침 시작이 전보다 빨라졌어요. 수서역까지 가는 택시가 출근길 택시라서요. 5분이라는 건 지도의 답이지 수요일 아침의 답이 아니었어요. 나머지 하나는 여러분 사정이 아니에요. 9월 1일부로 코레일과 SR이 통합돼서, 예전에 SRT라고 부르던 열차가 이제 KTX로 팔려요. 옛 SRT 예매 사이트는 더 이상 쓸 수 없어요. 돌아오는 표는 코레일 앱에서 예매하세요. 나머지 가족은 강남에서 일부러 느슨한 하루를 보내요.","day.2026-09-09.pace":"분리 · 3인 장거리","day.2026-09-09.title":"대전 다녀오기","day.2026-09-09.weatherNote":"대전이 흐림에서 대체로 맑음 27도로 바뀌었고, 여전히 건조해요 — 확률 15%에 측정될 만한 비는 없어요. 기차 타고, 차 타고, 가족과 밥 먹는 날엔 이보다 나은 패가 없어요. 사이사이 걷는 구간이 기분 좋을 만큼 맑고, 아기한테 뭘 더 챙길 필요 없을 만큼 따뜻하고, 우산을 계산에 넣지 않아도 될 만큼 건조해요. 수서역 승강장은 지하라 기다리는 동안은 시원해요 — 더위가 느껴지는 건 택시까지 걷는 길과 대전 쪽에서 걷는 길이에요. 내려가기 전에 물병은 채워 두세요.","day.2026-09-10.gist":"한산한 평일 롯데월드, 실내 위주. 오후 낮잠은 호텔에서.","day.2026-09-10.nap.0.end":"11:00","day.2026-09-10.nap.0.start":"09:30","day.2026-09-10.nap.0.who":"7개월","day.2026-09-10.nap.1.end":"13:00","day.2026-09-10.nap.1.start":"11:30","day.2026-09-10.nap.1.who":"5개월","day.2026-09-10.nap.2.end":"15:00","day.2026-09-10.nap.2.start":"13:00","day.2026-09-10.nap.2.who":"두 살 아이","day.2026-09-10.note":"놀이공원 가는 날이에요. 일부러 평일에, 그리고 일부러 대부분 실내인 이 공원으로 잡았어요. 잠실은 호텔에서 15분 거리라, 낮잠은 유모차 안이 아니라 호텔에서 잘 수 있어요.","day.2026-09-10.pace":"빡빡함 — 최대 하루","day.2026-09-10.title":"목요일 롯데월드","day.2026-09-10.weatherNote":"또 2도 내려가서 이제 강남 일정 중 가장 선선한 날이 됐어요. 흐리고 22°C, 강수 확률 8%로 건조해요. 이 구간의 다른 날은 전부 26°C 이상이라 야외 활동이 정말 편한 날은 이 하루뿐이에요. 마침 잘 맞아떨어져요. 롯데월드 실내 구간은 어차피 냉난방이 되지만 16:35 석촌호수 한 바퀴는 야외 일정이고, 구름 아래 22°C면 부모님이 절반이 아니라 한 바퀴를 다 도실 수 있어요. 다만 늦은 오후 호숫가 22°C는 바람이 불면 쌀쌀해요. 아기 둘 다 잠실로 가는 아침뿐 아니라 호수에서도 제대로 된 겉옷이 필요해요.","day.2026-09-11.gist":"강남에서 느긋한 오전, 15시 30분에 기사님, 그리고 인사동 첫 산책.","day.2026-09-11.nap.0.end":"11:00","day.2026-09-11.nap.0.start":"09:30","day.2026-09-11.nap.0.who":"7개월","day.2026-09-11.nap.1.end":"15:00","day.2026-09-11.nap.1.start":"13:30","day.2026-09-11.nap.1.who":"두 살 아이","day.2026-09-11.note":"일부러 느리게 잡은 오전과 늦은 이동이에요. 기사님이 15시 30분에 오시고 현장에서 현금 16만 원을 드려야 해서, 오늘은 다른 무엇보다 두 가지를 먼저 챙겨야 해요. 현금을 미리 준비해 둘 것, 그리고 픽업 때까지 파크 하얏트 방을 유지할 것. 둘 다 보기보다 중요해요. 방이 없으면 낮잠 시간 내내 지친 아이 셋을 데리고 로비에 앉아 있어야 하고, 현금이 없으면 기사님을 기다리게 해 놓고 15시 20분에 ATM 앞에 서 있게 돼요. 이 둘만 맞춰 두면 나머지는 쉬워요 — 짐 내리고, 강 건너고, 새 동네가 문 바로 앞이에요.","day.2026-09-11.pace":"가벼움 · 이동일","day.2026-09-11.title":"북쪽으로 이동","day.2026-09-11.weatherNote":"흐리고 26도인데, 최저기온이 17도까지 내려가요. 어제 예보보다 밤이 3도 더 서늘해요. 이동하는 날에는 이 숫자가 제일 중요해요. 아침에 체크아웃하고 짐을 차에 두 번 싣고 내리니까요. 아기들 옷은 오후 최고기온이 아니라 아침 17도에 맞춰 입히세요. 쌈지길은 이제 피난처가 아니라 그냥 가고 싶으면 가는 곳이에요.","day.2026-09-12.gist":"국립중앙박물관은 무료에 평지, 그다음은 용산 곳곳.","day.2026-09-12.nap.0.end":"11:00","day.2026-09-12.nap.0.start":"09:30","day.2026-09-12.nap.0.who":"7개월","day.2026-09-12.nap.1.end":"13:00","day.2026-09-12.nap.1.start":"11:30","day.2026-09-12.nap.1.who":"5개월","day.2026-09-12.nap.2.end":"15:00","day.2026-09-12.nap.2.start":"13:00","day.2026-09-12.nap.2.who":"두 살 아이","day.2026-09-12.note":"토요일이라 궁궐과 시장은 가장 붐빌 겁니다. 국립중앙박물관은 정반대예요. 규모가 크고, 평지에, 냉방이 되고, 어디든 엘리베이터가 있고, 입장료도 무료입니다. 서울의 큰 명소 중에서 아기와 할머니·할아버지에게 가장 편한 곳입니다.","day.2026-09-12.pace":"보통","day.2026-09-12.title":"박물관 가는 날","day.2026-09-12.weatherNote":"이번엔 반대로 움직였어요. 25°C가 아니라 28°C로 3도 올라 여행 중 가장 더운 날과 같아졌어요. 그래도 비는 없어요. 강수 확률 20%에 0mm라 우산은 두고 가세요. 달라지는 건 하루의 어느 쪽에 무게를 두느냐예요. 국립중앙박물관은 원래 날씨와 무관한 중심축이었는데 이제 시원한 곳이기도 해요. 오후 가장 더울 때 박물관을 넣고 용산 산책은 그 앞뒤로 돌리세요. 반대가 아니고요. 최저 19°C라 아침은 포근하고 이전 예보가 요구했던 겉옷은 필요 없어요.","day.2026-09-13.gist":"헤어, 한복, 그리고 10:50 경복궁 사진 촬영. 유일하게 확정된 오전입니다.","day.2026-09-13.nap.0.start":"이동 중 아기띠에서","day.2026-09-13.nap.0.who":"7개월","day.2026-09-13.nap.1.start":"이동 중 아기띠에서","day.2026-09-13.nap.1.who":"5개월","day.2026-09-13.nap.2.end":"16:30","day.2026-09-13.nap.2.start":"14:45","day.2026-09-13.nap.2.who":"두 살 아이","day.2026-09-13.note":"이번 여행에서 유일하게 미룰 수 없는 오전입니다. 아홉 명이 한복 차림에 헤어·메이크업을 마치고 10:50까지 흥례문 안에 서 있어야 해요. 그 앞의 모든 일정은 이 시간에서 역산해 짰습니다. 순서가 중요한데, 뻔한 순서가 아닙니다. 메이크업 살롱은 08:00에 열지만 한복집은 09:00에야 문을 열어요. 그래서 메이크업이 먼저이고, 한복 대여는 대여점 문 여는 순간 바로 시작해야 합니다.","day.2026-09-13.pace":"빡빡함 · 콜타임 엄수","day.2026-09-13.title":"한복, 그리고 사진","day.2026-09-13.weatherNote":"안심하라던 예보를 되돌려야 해요. 비용을 이미 낸 10:50 야외 촬영에 이슬비 가능성이 다시 생겼어요. 걱정하기 전에 숫자부터 보세요. 하루 종일 합쳐 0.6mm, 강수 확률 20%예요. 흠뻑 젖는 날이 아니라 살짝 축축할 수 있는 정도이고, 확률로는 여전히 마른 날 쪽이 크게 앞서요. 그래도 접어 두라고 했던 우천 대안은 다시 주머니에 넣어 둘 만하고, 09:10 피팅 때 한복집에 한 가지는 물어볼 만해요. 한복이 젖으면 어떻게 되는지, 그리고 그에 대한 비용을 받는지요. 우산을 산다면 투명한 걸로 사세요. 어두운 우산은 얼굴에 그림자를 드리워요. 위안은 분명해요. 26°C가 아니라 22°C면 피팅부터 12:30 반납까지 한복을 입고 있는 게 견디는 일이 아니라 편안한 일이 되고, 흐린 하늘은 흥례문 앞 아홉 사람 얼굴에 강한 햇빛이 떨어지는 것보다 훨씬 부드럽고 고른 빛이에요.","day.2026-09-14.gist":"아침엔 청계천 산책, 낮잠 뒤엔 망원시장과 연남동.","day.2026-09-14.nap.0.end":"11:00","day.2026-09-14.nap.0.start":"09:30","day.2026-09-14.nap.0.who":"7개월","day.2026-09-14.nap.1.end":"13:00","day.2026-09-14.nap.1.start":"11:30","day.2026-09-14.nap.1.who":"5개월","day.2026-09-14.nap.2.end":"15:00","day.2026-09-14.nap.2.start":"13:00","day.2026-09-14.nap.2.who":"두 살 아이","day.2026-09-14.note":"오전엔 종로에서 여유롭게, 낮잠 뒤엔 서쪽으로. 광장시장은 일부러 뺐어요 — 이제는 시장이라기보다 관광 사진 줄서기가 됐고, 아기들이 있기엔 정말 힘든 공간이에요. 망원은 아직 제대로 굴러가는 쪽이에요: 사람들이 실제로 장을 보러 오는 동네 시장이고, 홍대에서 두 정거장, 옆에는 평지의 한강공원과 경의선숲길이 있어요. 오늘은 월요일이라, 이쪽 동네에서 하루를 보내기엔 가장 조용한 저녁이에요.","day.2026-09-14.pace":"보통","day.2026-09-14.title":"마포, 현지인의 시장","day.2026-09-14.weatherNote":"한때는 이슬비에 31°C로 여행 중 가장 더운 날이었지만, 지금은 전혀 달라요. 건조하고 흐리고 27°C에 최저기온은 17°C예요. 4도가 돌아오면서 망원은 더위를 관리해야 하는 문제에서 평범한 저녁으로 바뀌었어요. 16:30 시간대는 그대로 두는 게 맞아요. 그때쯤이면 하루의 정점은 지났고, 나머지는 시장의 지붕 덮인 골목이 해결해 줘요.","day.2026-09-15.gist":"더현대 서울에서 아이 옷, 코스트코, 이어서 명동에서 스킨케어.","day.2026-09-15.nap.0.end":"11:00","day.2026-09-15.nap.0.start":"09:30","day.2026-09-15.nap.0.who":"7개월","day.2026-09-15.nap.1.end":"13:00","day.2026-09-15.nap.1.start":"11:30","day.2026-09-15.nap.1.who":"5개월","day.2026-09-15.nap.2.end":"15:00","day.2026-09-15.nap.2.start":"13:00","day.2026-09-15.nap.2.who":"두 살 아이","day.2026-09-15.note":"본격적인 쇼핑 데이인데, 여행 후반에 배치해서 남은 캐리어 상황을 알고 물건을 살 수 있어요. 남대문은 여의도의 더현대 서울로 바꿨어요 — 아이 옷 브랜드가 더 좋고, 냉방, 수유실, 엘리베이터, 지하 식품관까지 갖춰져 있어, 두 살 아이를 데리고 다니는 상황에선 시장 가격보다 이쪽이 훨씬 나아요. 코스트코 양평점은 여기서 10분 거리라, 두 곳을 한 번에 묶을 수 있어요. 오후엔 명동에서 스킨케어. 오늘은 경복궁이 휴관인데, 이미 다녀왔으니 아쉬울 게 없어요.","day.2026-09-15.pace":"보통 · 쇼핑","day.2026-09-15.title":"아이 옷·코스트코·스킨케어","day.2026-09-15.weatherNote":"여기에도 이슬비가 생겼어요. 27°C에 강수 확률 18%, 0.6mm예요. 일요일과 같은 해석이에요. 안 올 가능성이 더 크지만 이제 무시할 정도는 아니에요. 가장 영향을 받는 건 16:15이에요. 명동은 그늘이 거의 없는 트인 거리이고 제대로 된 지붕도 없어서, 걷는 두 살 아이와 밀어야 할 유모차까지 있으면 젖은 보도는 숫자가 주는 인상보다 훨씬 느리고 힘들어요. 다행인 건 나머지 일정이 원래 실내라는 점이에요. 더현대 서울과 코스트코는 하늘이 어떻든 상관없어요. 우산 하나 챙기시고, 명동은 무리해서 다 도는 대신 짧게 끊을 각오를 하세요. 최저기온은 19°C로 2도 올라 여의도로 가는 이른 아침도 쌀쌀하기보다 포근해요.","day.2026-09-16.gist":"체크아웃하고 인천 차이나타운에서 짜장면, 다리를 건너 리조트로.","day.2026-09-16.nap.0.end":"11:00","day.2026-09-16.nap.0.start":"09:30","day.2026-09-16.nap.0.who":"7개월","day.2026-09-16.nap.1.end":"16:00","day.2026-09-16.nap.1.start":"14:00","day.2026-09-16.nap.1.who":"두 살 아이","day.2026-09-16.note":"진료 일정이 얹혀 있지 않은, 순수하게 이동만 하는 날 — 그게 이번 이동일의 핵심이에요. 점 빼기는 17일에 잡혀 있어서 오늘은 체크아웃하고 도시를 가로질러 수영장이 있는 곳으로 이동하는 것뿐이에요. 하나 더 있는 건 점심: 인천이 짜장면의 발상지이고, 원조 차이나타운이 다리 진입로에서 가까워서 따로 다녀오는 대신 가는 길에 들러 먹을 수 있어요. 영종도 두 호텔 모두 체크인이 15:00이라, 오후 낮잠은 이미 우리 방이 된 곳에서 재워야 해요.","day.2026-09-16.pace":"가벼움 · 이동일","day.2026-09-16.title":"섬으로","day.2026-09-16.weatherNote":"인천은 다시 흐림으로 돌아왔고 2도 올라 27°C예요. 여전히 건조한데, 이동하는 날 날씨에 바라는 건 사실 그것뿐이에요. 차이나타운에서는 차와 식당 사이를 걸어야 하는데, 구름이 햇빛보다 그 길을 편하게 만들어 줘요. 눈부시지 않고 유모차 그늘을 찾을 필요도 없으니까요. 대신 덥다기보다 습하게 느껴질 거예요. 그러니 짐을 정리하기 전에 아기들을 먼저 실내로 들여보내는 편이 여전히 나아요.","day.2026-09-17.gist":"10:00에 어른 셋 점 빼기, 정오쯤 복귀, 오후는 일부러 비워둡니다.","day.2026-09-17.nap.0.end":"11:00","day.2026-09-17.nap.0.start":"09:30","day.2026-09-17.nap.0.who":"7개월","day.2026-09-17.nap.1.end":"13:00","day.2026-09-17.nap.1.start":"11:30","day.2026-09-17.nap.1.who":"5개월","day.2026-09-17.nap.2.end":"15:00","day.2026-09-17.nap.2.start":"13:00","day.2026-09-17.nap.2.who":"두 살 아이","day.2026-09-17.note":"여행 마지막 온전한 하루예요. 확정된 오전 예약 하나 말고는 일부러 거의 비워두었어요. 아기 둘, 두 살 아이, 70대 두 분과 함께한 12일차, 가장 값진 일정은 '아무것도 없음'입니다. 르네의원은 10:00에 열고 그날 첫 슬롯이 여러분이지만, 환자 셋에 의사 한 명이라 11:30쯤까지 걸린다고 잡고 진료실은 12:00까지 확보해 두세요. 그 외에는 예약이 없으니 시간이 밀려도 아무 손해가 없어요. 짐은 오후에 싸서 내일 아침을 편하게 두세요.","day.2026-09-17.pace":"가벼움 · 일부러","day.2026-09-17.title":"비워둔 하루","day.2026-09-17.weatherNote":"어제의 경고는 거둬도 돼요. 다시 흐림으로 뒤집혔고 24°C로 2도 시원해졌으며 강수 확률 12%로 건조해요. 덕분에 정말 문제였던 충돌이 사라졌어요. 세 사람이 10:00에 점 제거를 받고 그 뒤로 강한 햇빛을 피하라는 안내를 받았는데, 흐린 하늘이 그 일을 대부분 대신해 줘요. 그래도 시술 부위는 가려 두세요. 구름이 자외선이 없다는 뜻은 아니니까요. 다만 리조트에서의 오후는 이제 계획을 짜서 피해야 할 시간이 아니라 온전히 여러분의 시간이에요. 16:00 물가 산책도 그대로 괜찮아요. 다만 노을은 못 볼 거예요.","day.2026-09-18.gist":"마지막 아침, 이른 점심, 16:40 KE041로 귀국. 공항까지 15분.","day.2026-09-18.nap.0.end":"언젠가는","day.2026-09-18.nap.0.start":"기내에서","day.2026-09-18.nap.0.who":"셋 다","day.2026-09-18.note":"영종도에 묵는 진짜 장점 하나: 공항까지 90분이 아니라 15분이에요. 여유로운 아침, 이른 점심, 새벽부터 시작하지 않아도 되는 출국일.","day.2026-09-18.pace":"이동일","day.2026-09-18.title":"집으로","day.2026-09-18.weatherNote":"마지막 날에는 구름이 걷혔어요. 맑고 24°C, 비는 없어요. 아홉 명과 짐 행렬에는 비가 없다는 게 가장 중요하죠. 정작 대비할 부분은 햇빛이에요. 세 사람이 어제 아침에 점을 뺐는데, 하루 지난 상처에 직사광선이 닿는 건 병원에서 피하라고 했을 바로 그거예요. 노출 시간은 짧아요. 아침 상처 확인, 13:00 제2터미널 이동, 그다음은 실내니까요. 그래도 세 사람은 모자를 쓰고, 도로변에서 드레싱이 햇빛을 받게 두지 말고 가려 주세요. 최저기온은 20°C로 2도 올라, 아기들은 갈아입히지 않아도 실내외 모두 괜찮은 옷 한 겹이면 돼요.","dose.d0-carriers.detail":"아이 셋이니 답도 셋이에요. 아기 둘은 대부분의 날 소프트 아기띠, 두 살 아이는 가볍고 완전히 접히는 유모차 한 대. 망원시장, 익선동 골목, 궁 자갈길은 사실상 아기띠만 가능해요. 더현대 서울과 국립중앙박물관은 반대로, 넓고 평평하고 엘리베이터가 있어서 유모차가 제 역할을 해요.","dose.d0-carriers.fallback":"짐을 다 가져오기가 부담스럽다면, KPLANZ가 서울에서 유모차, 카시트, 여행용 아기 침대를 대여해요.","dose.d0-carriers.label.0":"롯데월드, 경복궁, 코엑스, 국립중앙박물관은 현장에서 유모차를 대여해요.","dose.d0-carriers.start":"출발 전","dose.d0-carriers.title":"아기띠·유모차 실전편","dose.d0-carriers.who":"두 가족","dose.d0-colonclear.detail":"병원에서 준 두 문서는 거의 다 답해 주지만 네 가지가 비어 있고, 그 첫 번째는 예약 자체를 바꿀 만큼 커요. 광동병원 검진 안내문에 대장 용종을 제거하면 그 자리에 출혈과 천공 위험이 있어 2주간 비행기 탑승이 금지된다고 적혀 있어요. 검사는 9월 7일 월요일이고 KE041은 18일에 떠납니다. 병원이 스스로 인쇄한 14일 규정에 11일로 맞서는 셈이고, NaRhee가 대장내시경에서 빠지면서 이제 Jun과 Jordan 두 사람에게 걸립니다. 두 번째 공백은 여전히 NaRhee의 것이고, 대장내시경을 빼도 해결되지 않아요. 같은 안내문이 제왕절개나 개복술, 치질 수술 후 6개월이 지나야 내시경 검사가 가능하다고 하는데, 이 표현은 위내시경까지 포함하거든요. 아기는 5개월이에요. 세 번째는 사소해 보이지만 나머지 전부를 막고 있어요 — 장 정결제 복용 시각 두 칸이 모두 비어 있고, 6일과 7일은 오직 병원만 줄 수 있는 시각 위에 통째로 세워져 있습니다. 네 번째는 약 자체예요. 일요일 밤 호텔 방에 20정이 있어야 하는데, 누가 그걸 가져가는지 어느 서류에도 없어요.","dose.d0-colonclear.fallback":"병원이 2주 규정을 그대로 지킨다면 현실적인 선택지는 두 가지예요. 보기만 하고 제거하지 않은 뒤 발견된 건 시애틀에서 처리하거나, NaRhee가 이미 한 대로 대장내시경을 패키지에서 빼는 겁니다. 둘 다 9월 1일에 나누기엔 합리적인 대화이고, 7일 08:00에 나누기엔 최악인 대화예요.","dose.d0-colonclear.label.0":"용종 제거 후 2주간 비행 금지. Jun과 Jordan은 11일 뒤에 돌아갑니다. 오늘 02-2222-4888, 2번으로 전화하세요.","dose.d0-colonclear.label.1":"제왕절개 후 6개월이 지나야 내시경이 가능해요 — 대장내시경만이 아니라 위내시경도 포함입니다. NaRhee는 5개월이에요.","dose.d0-colonclear.label.2":"제이클정은 어디에 있나요? 일요일 밤 호텔 방에 20정이 필요해요. 병원이 발송하는지, 도착해서 수령하는지 확인하세요.","dose.d0-colonclear.label.3":"안내문의 복용 시각 두 칸이 모두 비어 있어요. 병원이 채워주기 전까지 6일 일정은 확정할 수 없어요.","dose.d0-colonclear.label.4":"NaRhee의 대장내시경 제외를 서면으로 확인받으세요. 변경된 비용과 종료 시각까지요. 7일 아침 데스크에서의 구두 변경은 변경이 아니에요.","dose.d0-colonclear.label.5":"같은 통화에서 수유 중 수면마취에 대해서도 물어보세요. 두 안내문 모두 이 부분이 없고 NaRhee에게는 답이 필요해요.","dose.d0-colonclear.label.6":"아스피린, 플라빅스, 와파린: 안내문은 7일 전 중단을 요구했고 그날은 8월 31일이었어요. 아직 복용 중인 사람이 있다면 임의로 끊지 말고 병원에 알리세요.","dose.d0-colonclear.start":"출발 전","dose.d0-colonclear.title":"오늘 광동병원에 전화하세요 · 서류로는 알 수 없는 네 가지","dose.d0-colonclear.where":"광동병원 · 서울 강남구 봉은사로 612 (삼성동)","dose.d0-colonclear.who":"Jun · Jordan · NaRhee","dose.d0-colondiet.detail":"3일 전이면 9월 4일 금요일, 시애틀에서, 출발 하루 전이에요. 그때부터 검사일까지 Jun과 Jordan은 흰쌀밥, 흰죽, 계란, 생선, 감자, 두부, 카스텔라, 흰 식빵, 사과, 바나나, 맑은 음료만 먹습니다. 그 외에는 없어요. NaRhee는 대장내시경이 빠지면서 이 목록에서 완전히 자유로워졌어요 — 일요일 21:00 금식 시작까지 평소대로 먹으면 됩니다. 두 사람이 피해야 할 것: 잡곡이나 현미류 전부, 김치, 모든 채소, 모든 해조류, 버섯, 옥수수, 견과류, 씨 있는 과일, 색깔 있는 음료, 그리고 커피. 커피가 제일 아파요. 이번 여행에서 시차가 가장 심한 시점보다 사흘 먼저 끊어야 하거든요. 그리고 달력을 한국 시간으로 다시 읽으면 더 빡빡해집니다. KE042는 토요일 12:50에 출발하는데 한국에서는 이미 6일 일요일이라, 그 비행기에서 나오는 모든 기내식이 가장 엄격한 전날에 걸려요. 반찬 없는 흰죽만 가능하다는 뜻입니다. 대한항공 기본 기내식은 그렇지 않고, 비빔밥은 더더욱 아니에요.","dose.d0-colondiet.fallback":"특별 기내식이 안 되면 트레이에서 흰밥만 먹고 나머지는 그대로 두세요. 열한 시간 동안 거의 못 먹는 건 괴롭지만 장 정결을 망치지는 않아요. 김치 한 접시는 망칩니다.","dose.d0-colondiet.label.0":"대한항공 특별식은 세 개가 아니라 두 개만 신청하세요. 마감은 출발 24시간 전, 금요일 12:50입니다.","dose.d0-colondiet.label.1":"커피는 금요일부터 금지예요. 기내에서 알게 되지 말고 시차 계획을 그에 맞춰 세우세요.","dose.d0-colondiet.label.2":"레토르트 죽은 보안검색에서 젤로 분류돼 기내 반입이 안 돼요. 서울에서 사세요 — 편의점마다 있어요.","dose.d0-colondiet.start":"출발 전","dose.d0-colondiet.title":"대장내시경 식이조절은 금요일, 집에서 시작돼요","dose.d0-colondiet.who":"Jun · Jordan","dose.d0-formula.detail":"기저귀는 어렵지 않아요 — 이마트, 홈플러스, 편의점 어디든 모든 사이즈가 있고, 쿠팡은 호텔로도 배송해요. 분유는 달라요. 두 아기 중 하나라도 미국의 특정 브랜드를 먹는다면, 12일치를 짊어지고 오거나 낯선 나라에서 여행 중간에 바꾸거나 둘 중 하나예요. 어느 쪽도 4일차 새벽 3시에 결정할 일이 아니에요.","dose.d0-formula.fallback":"7개월 아기용 이유식 파우치는 CU나 GS25 어디서든 팔아요. 이유식 문제는 따로 준비 안 해도 해결돼요.","dose.d0-formula.label.0":"아기 둘의 12일치 분유는 캐리어 하나 분량이에요. 지금 부피를 계산하고 누가 들지 정하세요.","dose.d0-formula.label.1":"세탁은 두 번, 9일경 파크 하얏트와 14일경 인사동에서 계획하세요. 두 호텔 모두 셀프 세탁실은 없어요.","dose.d0-formula.start":"출발 전","dose.d0-formula.title":"분유·이유식·기저귀 결정","dose.d0-formula.who":"두 가족","dose.d0-ke042.detail":"한국 시간 9월 6일(일) 16:40 도착. 벽쪽 아기 바구니 좌석은 아직 배정되지 않았다면 꼭 요청해 볼 만해요.","dose.d0-ke042.label.0":"지금 대한항공에 아기 바구니 좌석을 요청하세요. 아기 체중 제한이 있어요.","dose.d0-ke042.label.1":"KE042가 ICN 제2여객터미널 도착인지 확인하세요. 기사님이 제자리에서 기다리도록.","dose.d0-ke042.label.2":"시애틀 공항은 세 콩코스 모두에 수유실이 있어요. 탑승 전에 수유와 유축을 마치세요.","dose.d0-ke042.title":"KE042 · 시애틀→인천","dose.d0-ke042.where":"SEA 출발 · ICN 도착","dose.d0-ke042.who":"다 함께","dose.d0-leave.detail":"국제선 출발 네 시간 전. 아홉 명, 그중 둘은 걷지도 못하는 아기예요. 지나쳐 보이지만 지나치지 않아요.","dose.d0-leave.label.0":"카시트 세 개는 위탁 수하물이나 게이트 체크. 어느 쪽으로 할지 카운터가 아니라 집에서 나서기 전에 정하세요.","dose.d0-leave.title":"시애틀–타코마 공항 출발","dose.d0-leave.where":"SEA · 대한항공 국제선 체크인","dose.d0-leave.who":"다 함께","dose.d0-medical.detail":"체류지마다 소아 응급실 정보를 한국어로 카드에 적어, 어른들 지갑에 한 장씩 넣어 두세요. 22:00에 아픈 아기를 태운 택시 기사님은 폰으로 읽어주는 영어 주소를 원하지 않아요.","dose.d0-medical.fallback":"파크 하얏트 구간: 삼성서울병원, 약 10분. 인사동 구간: 서울대학교병원, 5–10분. 영종도 구간: 인천 인하대학교병원, 약 25분.","dose.d0-medical.label.0":"각 병원에 24시간 소아 응급실이 있는지 확인하고, 주소는 한국어로 적어 두세요.","dose.d0-medical.label.1":"여행자 의료보험이 한국에서 세 아이 모두의 소아 응급실 진료를 보장하는지 확인하세요.","dose.d0-medical.start":"출발 전","dose.d0-medical.title":"쓸 일 없길 바라는 카드","dose.d0-medical.who":"다 함께","dose.d0-pack.detail":"여권, 카시트, 유모차 태그, 분유와 유축 모유는 기내 가방에, 어른마다 여벌 옷 한 벌씩도 기내 가방에. 마지막 한 가지는 아기 둘과 함께라면 선택이 아니에요.","dose.d0-pack.fallback":"잊고 온 건 처방약과 여권만 빼면 서울에서 다 살 수 있어요.","dose.d0-pack.label.0":"입국 서류는 아래에 따로 항목을 뒀어요. 사람들이 놓치는 건 Q-Code예요.","dose.d0-pack.title":"최종 짐·장비 점검","dose.d0-pack.who":"다 함께","dose.d0-paperwork.detail":"한국이 출발 전에 요구하는 건 두 가지고, 둘 다 공항에서는 처리할 수 없어요. Q-Code는 아무도 예상 못 하는 쪽이에요. 워싱턴주가 한국의 중점검역관리지역 목록에 올라 있어서 아기까지 아홉 명 전원이 필요하고, 검역대가 제일 먼저 만나는 곳이에요. 한 사람이 전원 몫을 신청할 수 있고 상한은 스무 명이지만, 시스템은 여행자마다 QR 코드를 따로 내줘요. 질병관리청은 그걸 전부 저장해야 한다고 못 박아 뒀고요. 수정 기능도 없어서 오타 하나면 처음부터 다시예요. 전자입국신고서는 세관이 아니라 출입국 쪽이고, 모든 외국인에게 적용돼요. 아이라고, 나이 때문이라고 빼주는 예외가 없어요. 법무부가 17세 미만과 65세 초과를 대상자로 명시해 뒀으니 이번에도 아홉 명 전원이에요. 한 번 제출로 신청자 포함 아홉 명까지 되는데, 딱 우리 인원이라 여유가 하나도 없어요. 그러니 둘로 나눠서 내세요. K-ETA는 안 해도 되는 쪽이에요. 미국 여권은 면제 대상이고, 갖고 있어 봐야 어차피 무료인 입국신고서를 면제받는 것뿐이에요.","dose.d0-paperwork.fallback":"Q-Code를 건너뛰면 검역대에서 아홉 명 분 종이 건강신고서를 서서, 아기 둘을 안고 쓰게 돼요. 여권 심사에 닿기도 전에 기사님 2시간을 다 써버리는 시나리오가 바로 그거예요. 전자입국신고서 쪽은 좀 나아요. 기내에서 종이 입국신고서를 써도 받아주거든요. 다만 어두운 기내에서 아홉 장이에요.","dose.d0-paperwork.label.0":"Q-Code는 한 번만 신청하면 아홉 명이 다 되지만, QR코드는 아홉 개가 따로 나와요. 전부 저장하세요. 지금 신청할 수 있어요.","dose.d0-paperwork.label.1":"전자입국신고서는 도착 3일 전, 시애틀 시간으로 9월 3일 오전에 열려요. 두 건으로 나눠서 Jun이 다섯 명, NaRhee가 네 명.","dose.d0-paperwork.label.2":"2026년 5월 6일부터 전자입국신고서는 제출 전에 인증번호를 보내요. 그런데 지메일이 이 사이트가 직접 지목한 지연 발생 메일 목록에 들어 있어요. 그날 이른 시간에 신청하고, 메일을 기다리지 말고 화면에 뜨는 대로 캡처해 두세요.","dose.d0-paperwork.label.3":"QR코드는 안드로이드는 크롬이나 삼성인터넷, 아이폰은 사파리에서 받으세요. 다른 브라우저는 조용히 실패해요. 안 되면 이메일로 받으세요.","dose.d0-paperwork.start":"출발 전","dose.d0-paperwork.title":"입국 서류 · 두 가지, 그리고 안 해도 되는 하나","dose.d0-paperwork.where":"qcode.kdca.go.kr · e-arrivalcard.go.kr","dose.d0-paperwork.who":"Jun과 NaRhee가 전원분 신청","dose.d1-cash.detail":"공항 은행 ATM은 미국 카드를 받고, 명동 어느 환전소보다 나은 환율을 줘요. 일행 전체의 잡비를 한 번에 넉넉히 뽑으세요 — 망원시장, 인사동 노점, 그리고 실제로 먹고 싶어질 대부분의 소소한 먹거리는 현금 결제고, 이걸 여행 중간에 해결하고 싶지는 않을 거예요. 티머니 카드는 같은 편의점에서 함께 사세요.","dose.d1-cash.fallback":"기사님이 기다리고 있다면 이 일은 통째로 넘기세요. 호텔에서 환전되고, 편의점 어디서든 티머니를 팔고, 파크 하얏트 로비에 ATM이 있어요. 이 일 하나 때문에 픽업을 잃을 만한 가치는 없어요.","dose.d1-cash.label.0":"차에 짐 싣는 동안 현금과 티머니를 해결하세요. 두 시간이 임박했다면 건너뛰고 호텔에서 처리하세요.","dose.d1-cash.label.1":"출발 전에 Uber를 설치하세요. 기존 계정, 번호, 카드가 한국에서도 그대로 작동해서 새 가입이 필요 없어요.","dose.d1-cash.label.2":"원하면 집에서 Kakao T도 설치해 두되, 해외번호 인증에 의지해서 도착하지는 마세요.","dose.d1-cash.label.3":"k.ride는 3순위로 두세요. 최근 후기에서 미국, 캐나다, 호주 카드가 거절됐다는 언급이 있어요.","dose.d1-cash.title":"현금·티머니 · 한 명만","dose.d1-cash.who":"어른 한 명, 짐 싣는 동안","dose.d1-checkin.detail":"방마다 아기 침대가 이미 들어와 있는지 확인하세요. 프런트에 있을 때 일행 전원의 Globalist 조식 안내도 함께 물어보세요.","dose.d1-checkin.label.0":"아기 침대와 젖병 워머는 체크인이 아니라 예약할 때 요청하세요.","dose.d1-checkin.title":"체크인·아기 침대·짐 풀기","dose.d1-checkin.who":"다 함께","dose.d1-customs.detail":"한국은 2023년 5월 1일에 신고할 물품이 없는 여행자의 신고서를 없앴고, 지금도 그대로예요. 관세청 표현 그대로 '신고서 제출 생략, 신고없음 통로 이용'이에요. 그러니 여기는 앱도, 서류도, 줄도 없어요. 다 같이 통과하면 돼요. 사람들이 걸리는 건 음식이에요. 육류, 과일, 식물, 농축수산물은 금액과 상관없이 신고해야 하고, 신고하지 않은 육류는 실제로 과태료가 나와요. 밀봉된 분유와 이유식은 괜찮아요. 면세 범위는 1인당 미화 800달러인데, 세 가구끼리 합산되지 않아요. 본인 가족, NaRhee 가족, 부모님이 한국 법상 각각 별개의 세대예요. 따로 사는 성인 형제자매와 성인 자녀는 같은 세대로 보지 않거든요.","dose.d1-customs.fallback":"어느 통로로 가든 세관원이 무작위로 검사할 수는 있어요. 가방에 먹을 것만 숨어 있지 않으면 5분짜리 대화지 문제가 아니에요.","dose.d1-customs.label.0":"대전에 가져갈 술을 챙기시나요? 면세 주류는 성인 다섯 명한테만 있어요. 한 명당 2병, 2리터, 400달러까지예요. 19세 미만은 아예 없으니 아이들 몫은 계산에 넣으면 안 돼요.","dose.d1-customs.title":"세관 · 낼 서류가 없어요","dose.d1-customs.where":"인천공항 제2터미널 · 신고없음 통로","dose.d1-customs.who":"다 같이","dose.d1-dinner.detail":"대부분은 룸서비스나 편의점이에요. 오늘 저녁은 시작 시간이 있는 식당은 예약하지 마세요 — 공항이 지연되는 만큼 이 식사도 계속 밀리게 되거든요. 여기에 다른 계획 두 개가 나란히 갑니다. Jun과 Jordan은 병원이 정한 시각에 따라 흰죽이거나 아예 아무것도 못 먹고, 18:00부터 맑은 음료를 꾸준히 마시고 있어야 해요. NaRhee는 대장내시경이 빠졌으니 평소대로 저녁을 먹되 검진 금식은 그대로 적용됩니다. 21:00 이후로는 아무것도 안 돼요. 맑은 음료는 음식이 아니고, 두 사람에게는 그게 핵심이에요.","dose.d1-dinner.fallback":"도착일 저녁으로 편의점 식사는 전혀 부끄러울 것 없는 선택이고, 두 사람에게는 반찬 없는 흰죽 한 그릇이 저녁 전부예요.","dose.d1-dinner.label.0":"병원에 가는 세 사람 모두 21:00 이후 금식이에요. Jun과 Jordan은 물과 맑은 이온음료를 계속 마셔야 하고, 그건 정결제 과정의 일부지 위반이 아닙니다.","dose.d1-dinner.title":"일곱은 저녁, 둘은 흰죽","dose.d1-dinner.who":"일곱은 식사 · 둘은 흰죽","dose.d1-driver.detail":"마지막 짐이 카트에 실리는 순간, 어른 한 명이 곧장 만남의 장소로 걸어가 기사님과 연락을 취하세요. eSIM 카운터도, ATM도 아니에요. 이 페이지의 다른 모든 일은 늦어도 되지만, 이것만은 안 돼요.","dose.d1-driver.fallback":"안내판 앞에 기사님이 없다면, 찾아 나서기 전에 먼저 업체에 전화하세요. 홀을 헤매지 마세요 — 제2여객터미널 입국장에는 만남의 장소가 여러 군데 있고 서로 멀리 떨어져 있어요.","dose.d1-driver.label.0":"기사님은 착륙 시각부터 두 시간만 기다려요. KE042가 16:40 도착이니까, 18:40이면 예약이 무효가 돼요.","dose.d1-driver.label.1":"짐이 다 나오면 어른 한 명을 먼저 보내세요. 연락만 닿으면 일행이 도착할 때까지 대기 시간이 멈춰요.","dose.d1-driver.label.2":"업체 전화번호는 종이에도 적어 지니세요. 신호가 안 잡힐 수 있는 폰만 믿어서는 안 돼요.","dose.d1-driver.title":"무엇보다 기사님 먼저","dose.d1-driver.where":"ICN 제2여객터미널 입국장 — 업체 만남의 장소","dose.d1-driver.who":"어른 한 명이 먼저","dose.d1-esim.detail":"이건 10분짜리 점검이지 별도의 일이 아니에요. 이제는 기사님 연락 전이 아니라 후에 해요. 시애틀을 떠나기 전에 eSIM을 사고, 시애틀 공항 게이트 Wi-Fi에서 탑승 전에 전부 활성화해 두세요 — 한국 eSIM 프로필은 네트워크를 잡으면 자동으로 켜져서, 입국심사까지 걸어가는 사이에 폰 다섯 대가 알아서 연결돼요.","dose.d1-esim.fallback":"폰 하나가 말썽이면 공항 포켓 Wi-Fi 한 대만 빌려도 일행 전체가 쓸 수 있어요. 나머지는 입국장이 아니라 호텔에서 정리하세요.","dose.d1-esim.label.0":"eSIM은 탑승 전에 활성화하세요. 입국장에서 폰 다섯 대를 처리하면 45분이 날아가고 기사 대기 시간까지 놓칠 수 있어요.","dose.d1-esim.label.1":"시애틀을 떠나기 전에 모든 폰이 통신사 잠금 해제 상태이고 eSIM을 지원하는지 확인하세요.","dose.d1-esim.label.2":"문자 인증코드가 필요한 앱 가입은 한국 eSIM으로 바꾸기 전에 마치세요. 데이터 전용 eSIM은 미국 SMS를 막을 수 있어요.","dose.d1-esim.title":"기사님 연락 후 eSIM","dose.d1-esim.where":"ICN 입국장","dose.d1-esim.who":"어른들 모두","dose.d1-immig.detail":"여기서 세 가구로 나뉘었다가 KE042 수하물 캐로셀에서 다시 만나요. 빠르기만의 문제가 아니에요. 이렇게 하면 우선 심사대 요청이 깔끔해지거든요. 가구마다 자격이 되는 사람이 한 명씩 생기니까요. 아이 셋은 모두 만 7세 미만이고, 아버지는 만 70세가 넘으세요. 어머니는 만 69세라 아버지의 동반자로 함께 통과하시면 돼요. 한국은 2023년에 만 나이로 통일해서 예전 나이 계산은 이제 도움이 안 되거든요. 그리고 수하물에는 시간을 넉넉히 잡으세요. 카시트 세 개와 게이트 위탁 유모차 두 대는 캐로셀이 끝난 뒤에도 대형 수하물 코너에 나오기까지 보통 15~25분이 더 걸려요.","dose.d1-immig.fallback":"한 가구가 줄을 잘못 서면 나머지는 기다리지 말고 수하물 쪽으로 먼저 가세요. 아홉 명이 같은 자리에 서 있어야 할 일은 여기 없어요.","dose.d1-immig.label.0":"우선 심사대는 가구별로 각각 요청하세요. 만 7세 미만과 만 70세 이상이 대상인데, 가구마다 한 명씩 있어요.","dose.d1-immig.label.1":"내리기 전에 승무원에게 게이트 위탁 유모차를 어디서 받는지 물어보세요. 짐 찾기 전까지는 없다고 생각하는 게 안전해요.","dose.d1-immig.label.2":"입국 쪽 동반자 인원 제한은 공개돼 있지 않아요. 물어보면 아홉 명 일행이 아니라 세 가구라고 말하세요.","dose.d1-immig.title":"입국심사는 세 가구로, 그다음 짐 찾기","dose.d1-immig.who":"가구별로 나뉘었다가 캐로셀에서 재집결","dose.d1-land.detail":"착륙. 여기서부터 호텔 문 앞까지 걸리는 시간이야말로 사람들이 늘 과소평가하는 부분이에요.","dose.d1-land.label.0":"제2여객터미널 수유실: 3층, 1번 게이트 근처.","dose.d1-land.title":"KE042 인천 도착","dose.d1-land.where":"인천국제공항","dose.d1-land.who":"다 함께","dose.d1-prep1.detail":"먼저 물 한 컵. 그다음 제이클정 10정을 물 500mL와 함께 한 알씩, 한 번에 털어넣지 말고 꼬박 30분에 걸쳐 나눠 드세요. 이어서 한 시간 동안 물이나 맑은 이온음료 1L를 천천히 더 마십니다. 처음부터 끝까지 90분이니 20:45에 시작하면 착륙한 그날 밤 22:15쯤 끝나요. 이 시각은 임시로 두세요. 병원이 안내문에 적어줬어야 하는데 칸을 비워 놨거든요. 지켜볼 건 색깔이에요. 안내문에 색 비교표가 있고 목표는 소변색 같은 맑은 노란색입니다 — 갈색이나 어두운 오렌지색이면 아직 준비가 안 된 거예요. 중간에 맑아 보여도 10정은 끝까지 다 드세요.","dose.d1-prep1.fallback":"비행이 늦어지면 복용을 미루더라도 양을 줄이지는 마세요. 시각을 임의로 바꾸기 전에 02-2222-4888로 전화하세요 — 정작 중요한 건 1차와 2차 사이의 간격이에요.","dose.d1-prep1.label.0":"임시 시각이에요. 광동병원이 복용 시각 두 칸을 모두 비워 놨으니 출발 전에 정확한 시각을 받으세요.","dose.d1-prep1.label.1":"복용 시작 한 시간쯤 뒤부터는 화장실 근처에 계세요. 시차에 시달리는 아기가 둘이니 어느 방을 쓸지 지금 정해두는 게 좋아요.","dose.d1-prep1.title":"제이클정 1차 복용 · 10정, 그리고 1L","dose.d1-prep1.who":"Jun · Jordan","dose.d1-quarantine.detail":"다들 잊어버리는 관문인데, 인천에서는 입국심사 뒤가 아니라 앞에 있어요. Q-Code QR 아홉 개를 스크린샷으로 미리 열어두세요. 시차에 지친 입국 통로에서 포털이 신호를 필요로 하고 새 eSIM은 아직 안 잡혔다는 걸 알게 되고 싶진 않으실 거예요. 이 창구까지는 다 함께 움직이고, 흩어지는 건 입국심사부터예요.","dose.d1-quarantine.fallback":"Q-Code가 없으면 아홉 명분 종이 건강상태 질문서를 서서 쓰게 돼요. 되돌릴 수는 있지만 여유 시간을 거의 다 써버려요.","dose.d1-quarantine.label.0":"탑승 전에 QR 아홉 개를 모두 스크린샷 해두세요. 공항 와이파이는 믿지 마시고요.","dose.d1-quarantine.title":"검역대 · 입국심사보다 먼저 Q-Code","dose.d1-quarantine.where":"인천공항 제2터미널 · 검역대","dose.d1-quarantine.who":"전원, 아직 다 함께","dose.d1-sleep.detail":"시차 16시간. 다 함께 03:00에 눈이 떠질 걸 예상하고, 맞서지 마세요 — 내일 일정이 이렇게 짜인 이유예요. Jun과 Jordan은 이 시간에도 아직 장 정결제 1차 복용을 끝내는 중이라 22:30 전에는 못 눕고, 그다음은 04:00 알람이에요. 검진을 둘째 날에 넣은 진짜 대가이고, 그때 알기보다 지금 아는 편이 나아요.","dose.d1-sleep.title":"다 함께 잠자리로","dose.d1-sleep.who":"다 함께","dose.d1-supplies.detail":"제이클정 1회분은 알약 10정을 30분에 걸쳐 한 알씩 물 500mL와 함께 삼키고, 이어서 한 시간 동안 물이나 맑은 이온음료 1L를 더 마시는 거예요. 1인 1회에 1.5L, 각자 2회, 두 사람이니 오늘 밤부터 내일 아침까지 약 6L의 맑은 음료가 필요하고, 여기에 두 사람분 흰죽이 더해집니다. 아기 둘과 두 살 아이를 데리고 인천을 막 빠져나온 사람이 20:15에 편의점에서 이걸 찾아다닐 수는 없어요. 파크 하얏트에 도착 전 객실에 넣어 달라고 요청하거나, 이번 주에 쿠팡으로 호텔에 보내 두세요.","dose.d1-supplies.fallback":"호텔에서 2분 거리에 CU와 GS25가 있고 둘 다 즉석 흰죽과 포카리스웨트를 팔아요. 10분이면 되는 심부름이지만, 오늘 밤에 하고 싶은 일은 아니죠.","dose.d1-supplies.label.0":"무색 음료만 됩니다. 포카리스웨트가 한국에서 쓰는 표준이고, 빨갛거나 보라색인 건 전부 금지예요.","dose.d1-supplies.label.1":"반드시 '흰죽'으로 요청하세요. 일반 죽집 그릇에는 못 먹는 고명이 잔뜩 올라옵니다.","dose.d1-supplies.label.2":"광동병원이 약을 발송한다면 파크 하얏트에 의료 소포가 온다고 미리 알리고, 호텔명이 정확한지 확인하세요.","dose.d1-supplies.start":"착륙 전에","dose.d1-supplies.title":"정결제 준비물, 방에서 기다리게","dose.d1-supplies.where":"파크 하얏트 서울 · 도착 시 객실에","dose.d1-supplies.who":"오늘 호텔에 요청","dose.d1-transfer.detail":"인천에서 삼성동까지는 도시를 가로지르는 먼 거리예요. 아홉 명에 짐까지 하면 차량 두 대 아니면 큰 승합차 한 대인데, 카시트를 지정해서 출발 전에 예약해 두세요. 18:10에 연락이 닿았으니, 이 출발 시각은 위약금 없이 10~15분 정도는 늦출 수 있어요.","dose.d1-transfer.label.0":"픽업 업체가 영유아 카시트 세 개를 제공하는지 확인하세요. 한국 법상 만 6세 미만은 카시트 착용이 필수예요.","dose.d1-transfer.label.1":"두 시간 대기가 예정 착륙 시각부터인지, 입국장 통과 시점부터인지 확인하세요.","dose.d1-transfer.label.2":"일요일 저녁 도착일 때의 견적 이동 시간을 확인하세요.","dose.d1-transfer.title":"파크 하얏트 개별 이동","dose.d1-transfer.where":"파크 하얏트 서울, 강남구 테헤란로 606","dose.d1-transfer.who":"다 함께","dose.d10-bfast.detail":"아홉 시 시작이지만 손해 볼 것 없어요 — 더현대 서울은 10:30이 되어야 문을 여니, 더 일찍 나가봤자 닫힌 몰 앞에 서 있는 시간만 늘어요.","dose.d10-bfast.title":"아침","dose.d10-bfast.who":"다 함께","dose.d10-costco.detail":"더현대 서울에서 10분 거리라, 다른 날이 아니라 오늘 넣은 이유가 전적으로 이거예요. 양평점이 여의도에서 가장 가까운 지점이고 10:00–22:00 영업이에요. 이 매장에서 사둘 만한 한국 전용 품목은 자체 브랜드 김, 김스낵, 곶감, 허니버터 아몬드, 그리고 대용량 스킨케어예요 — 이 가격에는 올리브영에서 그대로 들고 나올 수 없는 것들이에요.","dose.d10-costco.getting":"더현대 서울에서 택시로 약 10분.","dose.d10-costco.label.0":"미국 코스트코 실물 카드 지참. 회원권은 세계 공용, 앱은 한국 입구 스캐너에서 안 될 수 있어요.","dose.d10-costco.label.1":"한국 코스트코는 둘째·넷째 일요일 휴무. 화요일은 정상 영업이지만, 주말로 옮기면 꼭 확인하세요.","dose.d10-costco.label.2":"입구에서 카드 결제 정책 확인. 미국 카드가 안 될 때를 대비해 현금도 넉넉히 챙기세요.","dose.d10-costco.label.3":"코스트코에서 산 물건은 크고 무거워요. 짐 정리는 오늘 밤에 하세요. 18일 공항에서 하면 늦어요.","dose.d10-costco.title":"코스트코 양평점","dose.d10-costco.where":"코스트코 양평점, 영등포구 선유로 156","dose.d10-costco.who":"쇼핑 팀","dose.d10-dinner.detail":"도심에서 먹는 마지막 저녁이에요 — 여기서부터는 공항 호텔이에요. 누군가 한 번 더 먹고 싶다고 했던 것 하나를 골라서 거기로 가세요.","dose.d10-dinner.label.0":"저녁 예약. 즉흥으로 정하고 싶지 않은 마지막 편한 식사예요.","dose.d10-dinner.title":"종로에서 마지막 저녁","dose.d10-dinner.who":"다 함께","dose.d10-easy.detail":"호텔, 인사동 거리, 카페. 오늘 팀을 나누는 이유는 원치 않는 쇼핑을 억지로 견디지 않아도 되게 하려는 거예요. 다른 사람 볼일로 두 살 아이를 여의도까지 끌고 가기엔 너무 멀어요.","dose.d10-easy.title":"그 외 여유로운 오전","dose.d10-easy.who":"할머니·할아버지 · 아이들","dose.d10-hyundai.cost":"백화점 가격대. 시장보다 품목당 예산을 늘리고, 사는 개수는 줄여서 잡으세요.","dose.d10-hyundai.detail":"남대문 대신 넣은 곳이고, 이 팀한테는 고민할 것도 없이 더현대예요. 더현대 서울은 서울에서 가장 최근에 문을 연, 후기가 꾸준히 좋은 백화점이에요: 한국·해외 브랜드가 다 모인 아동복 전 층, 유모차를 세워둘 수 있는 실내 정원, 제대로 된 수유실, 넓고 평평한 통로, 어디에나 있는 엘리베이터, 그리고 점심으로도 충분한 지하 식품관이 있어요. 시장 가격 대신 백화점 가격을 내야 해요 — 이게 감수할 부분이고, 두 살 아이를 데리고 다닐 땐 이쪽이 맞는 선택이에요.","dose.d10-hyundai.fallback":"잠실의 롯데월드몰이 비슷한 쇼핑을 커버하고, 10일에 이미 근처까지 갔었어요. 스타필드 하남은 더 크지만 서울 밖이라, 이렇게 빡빡한 날에 굳이 갈 거리는 아니에요.","dose.d10-hyundai.getting":"종로3가역에서 5호선 여의도역까지 직행.","dose.d10-hyundai.label.0":"여권 챙기세요. 택스프리 환급에 필요하고, 창구는 매장 안에 있어요.","dose.d10-hyundai.label.1":"출발 전에 오픈 시간 확인. 백화점은 10:00이 아니라 10:30에 여는 곳이 많아요.","dose.d10-hyundai.label.2":"점심은 건물 안에서. 지하 식품관은 예약 없이도 인원수를 받아줘요.","dose.d10-hyundai.title":"더현대 서울 · 아이 옷","dose.d10-hyundai.where":"더현대 서울, 여의도 · 아동복 층과 식품관","dose.d10-hyundai.who":"쇼핑 팀","dose.d10-lunch.detail":"숙소 근처에서, 낮잠 전에. 쇼핑 팀도 같은 시간에 더현대 식품관에서 먹으니, 점심 때 다시 합류하지 않아도 돼요.","dose.d10-lunch.title":"호텔 팀은 인사동 점심","dose.d10-lunch.who":"할머니·할아버지 · 아이들","dose.d10-myeongdong.detail":"명동 플래그십 올리브영과 주변 브랜드 매장, 여기서 사람이 교대해도 괜찮아요 — 여의도와 코스트코를 돈 사람은 좀 앉아 쉴 자격이 있어요. 이번 여행에서 스킨케어를 제대로 사는 곳이에요: 공항 말고 여기서 물량을 챙겨 오세요.","dose.d10-myeongdong.getting":"호텔에서 택시로 10분, 혹은 3호선 두 정거장에 짧은 도보.","dose.d10-myeongdong.label.0":"택스프리 환급 기준 금액과 절차 확인. 여권 챙기세요.","dose.d10-myeongdong.label.1":"액체·젤·크림류는 오늘 밤 위탁 수하물에 다 넣으세요.","dose.d10-myeongdong.title":"명동 · 스킨케어","dose.d10-myeongdong.where":"명동","dose.d10-myeongdong.who":"쇼핑 팀","dose.d10-nap.title":"낮잠 시간","dose.d10-nap.who":"아이 셋","dose.d10-pack.detail":"내일은 호텔을 옮기고, 오늘은 백화점 옷, 코스트코 장보기, 스킨케어까지 샀어요. 캐리어가 하나 더 필요한지는, 18일 인천 체크인 카운터가 아니라 오늘 밤에 알아두는 게 나아요.","dose.d10-pack.label.0":"추가 캐리어가 필요하면 오늘 사세요. 영종도나 공항까지 미루지 마세요.","dose.d10-pack.title":"1차 짐 정리·캐리어 점검","dose.d10-pack.who":"어른들","dose.d10-toyeouido.detail":"종로3가역에서 여의도역까지 5호선이 환승 없이 바로 이어져요, 서울치고는 드물게 편한 편이에요. 택시로는 약 25분. 어느 쪽이든 11:30에 다른 사람들과 함께가 아니라 오픈 직후에 도착해요.","dose.d10-toyeouido.title":"여의도로 건너가기","dose.d10-toyeouido.where":"더현대 서울, 영등포구 여의대로 108","dose.d10-toyeouido.who":"쇼핑 팀","dose.d11-bfast.detail":"체크아웃은 11:00, 이동 차량은 11:30이라 9시 아침이면 서두르지 않아도 한 시간이 남아요. 전날 밤에 짐을 싸두면 오늘 아침은 정말 여유로워요.","dose.d11-bfast.title":"아침과 마지막 짐 정리","dose.d11-bfast.who":"다 함께","dose.d11-checkin.detail":"호텔이 파라다이스시티 단지 안에 있어서, 한 번 들어가면 비행기 타기 전까지 다시 나올 일이 없어요.","dose.d11-checkin.label.0":"체크인 15:00. 도착 직후 낮잠 위해 15일 밤부터 방 하나 예약.","dose.d11-checkin.title":"체크인","dose.d11-checkin.who":"다 함께","dose.d11-checkout.detail":"잊고 가기 쉬운 것들을 방마다 확인하세요: 젖병 부품, 충전기, 신발 한 짝, 두 살 아이가 쓰는 그 컵. 인사동에서 한 시간 더 보내고 싶으면 프런트에 짐을 맡겨 두세요.","dose.d11-checkout.title":"인사동 체크아웃","dose.d11-checkout.who":"다 함께","dose.d11-dinner.detail":"이 근처에는 걸어갈 만한 외부 식당이 거의 없어요. 안에서 먹는 걸로 계획하세요.","dose.d11-dinner.label.0":"단지 내 식당 옵션과 9명 예약 가능 여부 확인.","dose.d11-dinner.title":"리조트에서 저녁","dose.d11-dinner.who":"다 함께","dose.d11-jjajang.cost":"짜장면은 대략 ₩8,000–₩12,000, 다 같이 먹는 탕수육은 그보다 더 나와요.","dose.d11-jjajang.detail":"인천 차이나타운은 짜장면이 처음 만들어진 곳이에요. 1800년대 말 항구에서 일하던 산둥 출신 화교들이 만들었고, 여기서 먹는 짜장면은 다른 곳에서 먹는 것과 정말 달라요. 이 인원에는 중화루가 답이에요: 평이 좋고, 아홉 명이 앉을 만큼 넓고, 유명한 두 집이 보통 한 시간씩 걸리는 것과 달리 10~20분 대기로 끝나요. 오늘이 수요일이라는 게 가장 큰 강점이에요 — 주말 차이나타운은 대기가 정말 지독해요.","dose.d11-jjajang.fallback":"공화춘이 원조 집이고 박물관 같은 내부가 있지만, 음식은 평범하다는 평이 많고 대기도 길어요. 신승반점은 맛으로는 현지인들의 선택이에요. 중화루가 문을 닫았을 때를 대비해 둘 다 알아두면 좋아요.","dose.d11-jjajang.label.0":"9명은 미리 전화 예약. 차이나타운은 이 인원의 워크인은 어려워요.","dose.d11-jjajang.label.1":"짜장면은 안 지워져요. 세 살 이하 턱받이 필수, 좋은 옷은 피하기.","dose.d11-jjajang.label.2":"휴무일 확인. 차이나타운 식당 중엔 월 1회 평일 휴무인 곳이 있어요.","dose.d11-jjajang.title":"짜장면 원조에서","dose.d11-jjajang.where":"중화루, 인천 차이나타운 · 인천역 근처","dose.d11-jjajang.who":"다 함께","dose.d11-lastinsa.detail":"짐은 다 쌌고, 체크아웃은 11:00까지, 쌈지길은 문 앞에서 4분 거리예요. 육지에서 여유롭게 보낼 수 있는 마지막 시간 — 아직 못 산 작은 기념품을 사러 가거나, 아예 건너뛰고 로비에 앉아 있어도 돼요.","dose.d11-lastinsa.fallback":"건너뛰어도 아쉬울 것 없어요. 공항 면세점이 동네 하나 크기예요.","dose.d11-lastinsa.label.0":"이 산책은 선택이에요. 오늘 아침 아무도 호텔을 나갈 필요 없어요.","dose.d11-lastinsa.title":"인사동 마지막 산책","dose.d11-lastinsa.where":"인사동길, 호텔에서 4분","dose.d11-lastinsa.who":"원하는 사람만","dose.d11-nap.detail":"평소보다 짧고, 다리 건너오는 이동으로 일부는 이미 채워졌어요. 늘리지 말기 — 오늘 밤이 수영할 수 있는 마지막 기회예요.","dose.d11-nap.title":"낮잠 시간","dose.d11-nap.who":"아이 셋","dose.d11-resort.detail":"오늘은 일부러 실내와 그늘 위주로 짰어요. 원더박스는 파라다이스시티의 실내 가족 테마파크로, 두 살 아이에게 딱 맞는 규모와 온도예요 — 롤러코스터 규모가 아니라 회전목마 규모. 단지 안에 무료로 걸어볼 수 있는 공공 예술 작품도 많아요. 오늘이 확실하게 물놀이할 수 있는 유일한 날이에요: 점 빼기는 17일에 잡혀 있어서 아직 아무도 수영 금지가 아니에요.","dose.d11-resort.fallback":"호텔 방에서 느긋하게 목욕만 해도 충분해요.","dose.d11-resort.label.0":"오늘 원하면 수영하세요. 내일 시술 이후로는 7~10일간 물놀이 금지.","dose.d11-resort.label.1":"원더박스 운영 시간과 호텔 입장권 포함 여부 확인.","dose.d11-resort.label.2":"시메르는 7세 미만 입장 불가. 어른만 교대로 다녀오는 방식으로만 가능.","dose.d11-resort.label.3":"투숙객 50%쿠폰: 60,000→30,000원, 아쿠아존 19:00 마감","dose.d11-resort.title":"원더박스 또는 객실","dose.d11-resort.where":"파라다이스시티 단지 내","dose.d11-resort.who":"다 함께","dose.d11-toresort.detail":"바다 위로 25분이면 파라다이스시티예요. 아이 셋 다 차에서 잠들 가능성이 높은데, 어차피 체크인이 15:00이라 딱 좋아요.","dose.d11-toresort.label.0":"이 이동을 낮잠 전반으로 보세요. 도착해도 아무도 깨우지 마세요.","dose.d11-toresort.title":"다리 건너 영종도로","dose.d11-toresort.where":"하얏트 리젠시 인천 파라다이스시티, 영종도","dose.d11-toresort.who":"다 함께","dose.d11-transfer.detail":"종로에서 육지 쪽 인천역까지 약 한 시간. 돌아가는 길이라기보다 가는 길에 잠깐 들르는 정도예요 — 차이나타운이 영종대교 진입로 옆이라 잠깐 내려 먹고 다리를 건너 리조트까지 이어가면 돼요. 도착지 이름이 헷갈리는 문제는 걱정 마세요: 하얏트 리젠시 인천 파라다이스시티는 실제로 존재하는 단일 호텔이에요 — 원래 그랜드 하얏트 인천의 서쪽 타워였던 곳이 2025년에 리브랜딩되어 파라다이스시티 리조트 단지 안에 자리 잡고 있어요. 그래서 하얏트 멤버십과 리조트 시설을 한 번의 예약으로 다 누릴 수 있어요.","dose.d11-transfer.label.0":"이동 차량은 카시트 3개, 차이나타운 경유, 대기 시간 포함으로 예약.","dose.d11-transfer.label.1":"점심 시 기사가 짐 지켜주는지 확인. 안 되면 짜장면 17일로 이동.","dose.d11-transfer.label.2":"예약이 하얏트 리젠시인지 확인 — Paradise·Paradiso 아님","dose.d11-transfer.title":"인천 차이나타운으로","dose.d11-transfer.where":"인천 차이나타운, 중구 · 이어서 영종도","dose.d11-transfer.who":"다 함께","dose.d12-back.detail":"나오기 전에 의원에 돌아갈 택시를 불러 달라고 요청하세요. 10분 뒤면 도착합니다. 11:30쯤 마치면 남는 30분은 수영장에서 챙길 수 있어요.","dose.d12-back.title":"리조트로 복귀","dose.d12-back.who":"어른 셋 — NaRhee, Jun, Ann","dose.d12-bfast-rest.detail":"나머지는 오늘 일찍 일어날 필요 없어요. 여행 마지막 온전한 아침이고, 수영장은 바로 옆이고, 점심 전까지 아무 일정도 없어요.","dose.d12-bfast-rest.title":"느긋한 아침","dose.d12-bfast-rest.who":"나머지 모두","dose.d12-bfast.detail":"10:00 예약이 그날 첫 슬롯이고 르네의원까지 5분이 아니라 8~12분 거리라, 이 아침은 08:15에 시작해요. 그래도 서두를 정도는 아니에요 — 식탁에서 한 시간, 09:30에 나가면 초진 서류를 여유 있게 마칠 시간이 남아요.","dose.d12-bfast.label.0":"진료 팀만 일찍 먹고, 나머지는 09:00 아침 그대로.","dose.d12-bfast.title":"이른 아침 · 진료 팀만","dose.d12-bfast.who":"어른 셋 — NaRhee, Jun, Ann","dose.d12-dinner.detail":"열이틀, 아홉 명, 아직 서로 말을 나누는 사이. 괜찮은 곳으로 예약하세요.","dose.d12-dinner.title":"마지막 저녁","dose.d12-dinner.who":"다 함께","dose.d12-lunch.detail":"리조트 안에서 먹어요. 마지막 온전한 하루, 점심 때문에 택시 탈 필요 없어요. 진료 팀이 몇 분 늦게 올 수 있어요 — 기다리지 말고 먼저 시작하세요.","dose.d12-lunch.title":"리조트에서 점심","dose.d12-lunch.who":"다 함께","dose.d12-mole.cost":"공개된 가격 없음. 인천 시세는 보통 작은/중간 편평 점 하나에 10,000~20,000원 정도로, 강남보다 10~30% 저렴하고, 점이 여러 개면 패키지로 묶는 경우가 많아요. 조직검사로 넘어가면 약 30,000~60,000원을 더 잡으세요. 시술 시작 전에 데스크에서 가격을 확정하세요.","dose.d12-mole.detail":"10:00에 확정, 그날의 첫 슬롯, 어른 셋입니다. 2시간을 잡되 그보다 짧게 끝날 거예요. 한국 피부과는 이 시술을 파이프라인처럼 돌립니다: 사람마다 상담 10~15분, 상담이 끝나면 마취 크림을 발라 15~20분 두고, 그다음 점 하나당 실제 레이저나 셰이브가 3~10분입니다. 1번 환자에 마취가 도는 동안 2번 환자를 상담하기 때문에, 세 명이 걸리는 시간은 한 명의 세 배보다 훨씬 짧아요 — 현실적으로 13:00이 아니라 11:30쯤 나옵니다. 시간이 길어지는 요인은 제2외국어로 진행하는 초진 서류, 예상보다 점이 더 많이 나오는 경우, 마지막에 세 번 따로 결제하는 것입니다. 마지막 온전한 하루에 일부러 배치했어요: 오늘 하면 서울의 더위·햇볕·시장을 아물지 않은 상처를 안고 열이틀 동안 다닐 일이 없고, 수요일 워터파크도 이론상 금지가 아니라 실제로 마음껏 즐길 수 있는 상태로 남습니다. 이 배치의 대가는 시술 뒤 약 30시간 만에 출국한다는 점이에요 — 일반 셰이브나 레이저 제거라면 문제없지만, 의사가 더 깊이 절개하겠다고 하면 다시 생각해 봐야 할 부분입니다.","dose.d12-mole.fallback":"르네의원이 취소되면, 운서동 상권의 예스피부과(032-752-9730)가 리조트에서 5분 거리이고 목요일 10:00에 열며 피부과 전문의가 두 명입니다. 같은 상권에 같은 시간대인 영종중앙피부과(032-746-3200)와 닥터스피부과 영종점(032-710-2346)도 있어요.","dose.d12-mole.label.0":"진짜 마감은 14:00이 아니라 13:00 — 의원이 13:00–14:00 점심시간에 문을 닫습니다.","dose.d12-mole.label.1":"환자 셋에 의사 한 명. 현실적으로 11:30 종료, 진료실은 12:00까지 확보.","dose.d12-mole.label.2":"조직검사로 넘길 것이 있는지 확인. 조직검사가 필요하면 시애틀에서 하세요.","dose.d12-mole.label.3":"셰이브 대신 봉합을 권하면, 열 시간 비행 30시간 전에는 하지 마세요.","dose.d12-mole.label.4":"문성호 원장이 피부과 전문의인지 확인. akd.or.kr/dermatologist/verify에서 조회.","dose.d12-mole.label.5":"시술 후 관리 안내를 영어로, 서면으로 받으세요. 필요하면 호텔 컨시어지에 전화로 도움 요청.","dose.d12-mole.label.6":"의원을 나서기 전에 드레싱, 연고, 실리콘 겔을 구입하세요.","dose.d12-mole.label.7":"오늘부터 7~10일간 수영, 사우나, 온탕 금지.","dose.d12-mole.label.8":"시애틀 피부과에 보낼 사진: 오늘과 내일, 자를 대고 상처를 촬영하세요.","dose.d12-mole.label.9":"해외 카드 결제 가능한지 확인. 세 번 따로 결제하면 더 오래 걸려요.","dose.d12-mole.title":"점 빼기 · 르네의원","dose.d12-mole.where":"르네의원 · 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층 304–308호 · +82 32-716-5716 · 목요일 10:00–20:00, 점심시간 13:00–14:00","dose.d12-mole.who":"어른 셋 — NaRhee, Jun, Ann","dose.d12-morning.detail":"가능한 사람은 수영장, 원하는 사람은 야외 산책, 필요한 사람은 객실에서. 단체 활동 없음, 진료 팀 기다리지 말 것 — 늦어지면 그들 없이 점심을 시작하세요.","dose.d12-morning.title":"리조트 오전 · 자유롭게","dose.d12-morning.who":"나머지 모두","dose.d12-nap.title":"낮잠 시간","dose.d12-nap.who":"아이 셋","dose.d12-outing.detail":"영종도는 서쪽 해안이라 노을을 보러 사람들이 이 동네에 머물러요. 한낮이 아니라 늦은 오후에 나가면 시술 부위에 강한 햇볕이 닿을 일이 없어요.","dose.d12-outing.fallback":"하루가 이미 충분했다 싶으면 미련 없이 접으세요.","dose.d12-outing.label.0":"노을 시각과 호텔에서 택시로 잠깐 거리인 전망 지점을 확정.","dose.d12-outing.title":"바닷가 어디쯤 노을","dose.d12-outing.who":"원하는 사람만","dose.d12-pack.detail":"스킨케어는 전부 위탁 수하물로. 분유, 우유, 간식, 아이별로 전신 갈아입을 옷 한 벌은 기내 가방으로. 여권과 탑승권은 한 사람이 책임지고 관리.","dose.d12-pack.label.0":"공항 도착 전에 명동에서 산 액체·젤은 전부 위탁 수하물로 옮기세요.","dose.d12-pack.title":"짐 제대로 싸기","dose.d12-pack.who":"어른들","dose.d12-toclinic.cost":"택시로 약 7,000~10,000원, 섬 안이라 통행료 없음","dose.d12-toclinic.detail":"르네의원은 운서동 쪽이 아니라 하늘도시 쪽에 있어요. 그래서 택시로 5분이 아니라 8~12분 걸립니다 — 그래도 섬 안이라 통행료는 없어요. 09:30에 출발하면 이동 시간에 더해, 초진 외국인 환자 셋의 서류를 10:00 슬롯 시작 전까지 마칠 15분이 남아요.","dose.d12-toclinic.fallback":"출입구에 택시가 안 잡히면 리조트 프런트에 부탁하면 불러 줍니다. 인천공항 자기부상열차는 계산에 넣지 마세요 — 관광 열차로 재분류되어 화요일부터 일요일까지 10:00–17:00에만 운행하고, 하늘도시 근처에는 가지 않아요.","dose.d12-toclinic.label.0":"전날 밤에 택시 확정. 기사에게 주소 보여주기: 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층.","dose.d12-toclinic.title":"의원 가는 길","dose.d12-toclinic.where":"에스디메디컬 · 영종구 하늘중앙로195번길 21 — 하늘도시, 파라다이스시티에서 약 8~12분","dose.d12-toclinic.who":"어른 셋 — NaRhee, Jun, Ann","dose.d13-bfast.detail":"여행 내내 그랬듯 9시. 제2여객터미널로 가는 차는 13:00에나 출발하니, 시계 볼 필요 없이 제대로 마지막 식사를 할 여유가 있어요.","dose.d13-bfast.title":"마지막 아침","dose.d13-bfast.who":"다 함께","dose.d13-ke041.detail":"같은 날 9월 18일 10:40에 시애틀 도착. 이륙 전에 착륙하는 셈이에요, 동쪽으로 가는 비행의 유일한 장점이죠.","dose.d13-ke041.title":"KE041 · 인천 → 시애틀","dose.d13-ke041.where":"ICN → SEA","dose.d13-ke041.who":"다 함께","dose.d13-liquids.detail":"액체 규정이 실제로 발목을 잡는 건 나가는 쪽이에요. 그리고 한국의 예외 규정은 미국에서 알던 것과 다르게 쓰여 있어요. 우유, 분유, 물, 주스, 죽 형태의 이유식, 물티슈는 만 6세 미만 아동에 한해 100mL 제한에서 면제돼요. 우리 아이 셋 모두 해당되고요. 다만 '비행 중 필요한 양'까지만이에요. 숫자로 정해진 기준이 없다는 건 검색대에서 담당자의 판단이 들어간다는 뜻이니, 통째로 넣지 말고 열 시간쯤에 맞는 양으로 챙기세요.","dose.d13-liquids.fallback":"걸려서 버리게 돼도 면세구역이나 기내에서 대신 구할 수 있어요. 대한항공에 요청하면 젖병용 뜨거운 물을 줘요. 뒤에 줄이 선 검색대에서 실랑이할 만한 일은 여기 없어요.","dose.d13-liquids.label.0":"아기 우유는 그 아기가 속한 가족 가방에 넣으세요. 부모가 따로 다른 줄에서 들고 가는 건 확인되지 않았어요.","dose.d13-liquids.label.1":"젤 아이스팩은 면제 대상인지 확인이 안 됐어요. 안 된다고 보고 면세구역에서 얼음을 사세요.","dose.d13-liquids.start":"짐 싸기 전","dose.d13-liquids.title":"아기 액체류 · 미국 기준이 아니라 한국 기준","dose.d13-liquids.where":"인천공항 제2터미널 · 보안검색","dose.d13-liquids.who":"두 가족","dose.d13-lunch.detail":"지금 제대로 드세요. 9명이서 출국장 안쪽에서 점심을 해결해야 하는 상황은 만들지 마세요.","dose.d13-lunch.title":"공항 전 이른 점심","dose.d13-lunch.who":"다 함께","dose.d13-molealt.detail":"목요일 10:00 르네의원 예약이 확정되어 있어서, 이건 실제 옵션이 아니라 취소 대비 대안이에요 — 수요일 밤에 병원에서 취소 연락이 올 수 있으니 남겨두는 것뿐이에요. 시간 계산이 예전보다 훨씬 빡빡해요, 환자가 한 명이 아니라 세 명이라서: 영종도 병원은 10:00 개원, 세 사람이면 처음부터 끝까지 90분 정도 걸리고, 제2여객터미널로 가는 차는 13:00에 출발해요. 운서 쪽에서 10:00 시작이면 호텔에 11:45쯤 돌아와요 — 여유는 있지만, 그 뒤로 대안이 없는 단 하나의 여유예요.","dose.d13-molealt.fallback":"금요일에 10:30 이후 시간대만 가능하다면, 거절하고 시애틀에서 점 빼기로 하세요. 11:00에 세 명 시작하면 13:00 출발 시간과 너무 가까워지고, 9명이 비행기를 놓칠 만큼 가치 있는 점은 없어요.","dose.d13-molealt.label.0":"10:00 대안 예약이면 08:15에 식사, 09:30에는 출발.","dose.d13-molealt.label.1":"금요일이면 10시간 비행 전 상처 확인 못 해요. 그래서 목요일 예약.","dose.d13-molealt.label.2":"상처는 하이드로콜로이드 패치로 덮고, 탑승 직전에 연고를 다시 바르세요.","dose.d13-molealt.label.3":"대한항공 체크인 15:40 마감. 13:00 출발은 버퍼일 뿐이에요.","dose.d13-molealt.start":"Rene에서 취소될 경우에만","dose.d13-molealt.title":"금요일 아침 대안","dose.d13-molealt.where":"운서동, 5분 거리. 예스피부과(032-752-9730)와 영종중앙의원(032-746-3200) 모두 금요일 10:00 개원, 세 번째 후보가 필요하면 청라의 더율피부과도 금요일 10:00 개원이에요. 취소가 우리 쪽에서 나오는 경우라면 르네의원도 금요일 10:00–20:00 진료해요.","dose.d13-molealt.who":"어른 셋 — NaRhee, Jun, Ann","dose.d13-morning.detail":"체크아웃은 보통 11:00이에요. 짐은 맡겨두고 출발할 때까지 로비를 이용하세요.","dose.d13-morning.title":"느긋한 아침, 짐 맡기기","dose.d13-morning.who":"다 함께","dose.d13-mpc.detail":"인천 도착의 거울상이자, 이번 여행에서 휴대폰이 정말로 한 시간을 아껴주는 유일한 지점이에요. 모바일 여권심사(MPC)는 무료이고 시애틀에서 지원하며 전용 심사줄이 열려요. 착륙 4시간 전부터 제출할 수 있고, 제출한 뒤 4시간 동안 유효해요. 가구당 하나씩 세 건을 내세요. 한국과 달리 미국은 모두에게 신고를 요구하고, 그 안의 세관 질문이 세대 단위 신고라 800달러 면세 한도도 같은 세대 안에서만 합산되거든요.","dose.d13-mpc.fallback":"앱이 안 되더라도 여권을 가진 미국 시민이에요. 일반 심사줄이 그대로 있고 시애틀의 얼굴 인식은 자동으로 진행돼요. 잃는 건 빠른 줄 하나뿐이에요.","dose.d13-mpc.label.0":"서울을 떠나기 전에 앱을 설치하고 여권 아홉 개를 모두 스캔해두세요. 비행기에서 하지 마시고요.","dose.d13-mpc.label.1":"음식은 빠짐없이 신고하세요. 신고했다가 반입이 거절되면 잃는 게 없지만, 신고를 안 하면 벌금이에요.","dose.d13-mpc.label.2":"고기는 두고 오세요. 라면 스프에 든 고기 성분도 포함이에요. 생과일과 씨앗도 반입이 안 돼요.","dose.d13-mpc.start":"기내에서","dose.d13-mpc.title":"시애틀 도착 전 모바일 여권심사(MPC)","dose.d13-mpc.where":"시애틀공항 · 국제선 도착동","dose.d13-mpc.who":"가구당 어른 한 명","dose.d13-toAirport.detail":"호텔에서 제2여객터미널까지 약 20분이라, 16:40 출발편에 13:30쯤 체크인하게 돼요. 카시트 3개 위탁, 유모차 태그, 세금 환급까지 있으니 세 시간은 넉넉한 게 아니라 딱 맞는 시간이에요.","dose.d13-toAirport.label.0":"대한항공 국제선 체크인 마감은 15:40. 이게 진짜 마감이에요.","dose.d13-toAirport.label.1":"세금 환급은 보안 검색 전에 처리. 오후 창구 줄이 길 수 있어요.","dose.d13-toAirport.label.2":"파라다이스시티 제2여객터미널 셔틀은 뜸함. 9명 짐용 프라이빗 밴 예약.","dose.d13-toAirport.label.3":"스마트패스는 건너뛰세요. 만 7세부터라서 괜히 탑승구에서 일행만 갈라져요.","dose.d13-toAirport.title":"인천 제2여객터미널로","dose.d13-toAirport.where":"인천공항 제2여객터미널 · 대한항공 출국","dose.d13-toAirport.who":"다 함께","dose.d13-woundcheck.detail":"시술 후 약 24시간이 지난 시점이에요. 밝은 자연광에서 살펴보고, 드레싱을 갈고, 자를 함께 넣어 사진을 찍으세요 — 이 사진이 시애틀 피부과에서 비교할 기준이에요. 그리고 비행을 위해 깨끗하게 다시 붙이세요, 기내 공기는 건조하고 열 시간은 긴 시간이에요.","dose.d13-woundcheck.fallback":"이상이 있으면 — 붉은 기가 번지거나, 열이 나거나, 진물이 계속 나면 — 공항에서가 아니라 10:00에 문 여는 즉시 르네의원(+82 32-716-5716)으로 전화하세요. 오늘 아침 여기서 병원까지 10분 거리지만, 오늘 밤이면 9,000km 떨어져 있게 돼요. 10:00에 전화해도 차량 출발까지 세 시간이 있어요.","dose.d13-woundcheck.label.0":"연고와 여분 드레싱은 기내 가방에. 비행 중 한 번 갈아주세요.","dose.d13-woundcheck.label.1":"두 번째 상처 사진 촬영. 가능하면 같은 자와 같은 조명으로.","dose.d13-woundcheck.title":"출국 전 상처 확인","dose.d13-woundcheck.who":"점 뺀 사람","dose.d2-bfast.detail":"글로벌리스트 혜택에 포함. 여유 있게 드세요 — 오늘 하루 이 그룹이 머물 가장 조용하고 따뜻한 공간이고, 이 아침이 오늘 계획의 대부분을 대신해 줍니다. 8시가 아니라 9시: 병원 세 명은 새벽에 출발했고, 시차 적응 이틀째에 다른 사람들이 일찍 일어날 이유는 없어요.","dose.d2-bfast.label.0":"글로벌리스트 아침이 몇 명까지 포함되는지 확인하세요. 추가 인원은 보통 유료예요.","dose.d2-bfast.label.1":"이유식 먹는 7개월 아기 음식이 되는지 주방에 문의하세요. CU와 GS25에서도 이유식 파우치를 팔아요.","dose.d2-bfast.title":"파크 하얏트 아침","dose.d2-bfast.who":"아내 · 부모님 · 아이 셋","dose.d2-clinic-go.detail":"광동병원은 파크 하얏트에서 택시로 5분, 또는 코엑스를 지나 도보 15분 거리예요. 지하철 9호선 봉은사역 5번 출구에서 1분. 차로 내려주는 경우 발렛 파킹 가능.","dose.d2-clinic-go.getting":"택시로 5분. 너무 배고파서 못 걷는 사람만 없다면 도보 15분도 가능.","dose.d2-clinic-go.label.0":"수면 검사받는 사람은 여권 지참 필수. 여권 없으면 수면내시경 불가.","dose.d2-clinic-go.title":"병원 이동","dose.d2-clinic-go.where":"광동병원 · 서울 강남구 봉은사로 612 (삼성동)","dose.d2-clinic-go.who":"Jun · NaRhee · Jordan","dose.d2-coex.detail":"지하에 있고, 평평하고, 냉난방이 되며, 엘리베이터가 곳곳에 있고, 호텔에서 도보로 가까워요. 시차 적응 이틀째에 어린아이 셋과 함께라면 흥미로움보다 실내와 가까움이 이깁니다. 마침 병원 바로 옆이라 두 그룹이 멀리 떨어지지도 않아요.","dose.d2-coex.fallback":"너무 부담되면 호텔 로비와 블록 한 바퀴 유모차 산책만으로도 충분히 좋은 오전이 됩니다.","dose.d2-coex.getting":"몰 영업시간 10:30~22:00. 수유실과 유모차 대여 시설 있음.","dose.d2-coex.title":"코엑스 몰과 별마당 도서관","dose.d2-coex.where":"코엑스, 삼성동 — 파크 하얏트에서 도보 거리","dose.d2-coex.who":"아내 · 부모님 · 아이 셋","dose.d2-collect.detail":"누군가 차를 가지고 출구에서 만나세요. 어제 저녁부터 금식했고 수면 마취까지 받았을 수 있는 세 명이 스스로 택시를 잡을 상황이 아닙니다.","dose.d2-collect.fallback":"검진 진행에 따라 시간이 밀립니다. 오후는 여유 있게 두고, 이 시간과 겹치는 일정은 잡지 마세요.","dose.d2-collect.label.0":"죽을 미리 준비하세요. 내시경 후에는 자극 없는 음식부터, 아홉 명 식당 식사는 아직 안 됩니다.","dose.d2-collect.title":"병원 셋 데리러 가기","dose.d2-collect.who":"어른 한 명","dose.d2-dinner.detail":"좌식이 아니라 의자로 아홉 명이 앉을 수 있는 곳. 이 조건은 여행 내내 반복해서 부딪히니 매번 확인할 가치가 있어요.","dose.d2-dinner.label.0":"예약할 때 의자석을 요청하세요. 좌식은 70대 두 분에게 힘듭니다.","dose.d2-dinner.title":"호텔 근처 이른 저녁","dose.d2-dinner.who":"다 함께","dose.d2-evening.detail":"아기 둘과 70대 두 분과 함께 하는 열여섯 시간 교대 근무의 이틀째. 지금 저녁을 비워두면 남은 한 주가 편해집니다.","dose.d2-evening.label.0":"회복을 위해 저녁은 비워두세요.","dose.d2-evening.title":"일정 없음. 일부러.","dose.d2-evening.who":"다 함께","dose.d2-fast.detail":"세 사람 모두 아침은 없고, 안내문은 무엇까지 금식을 깨는지도 분명히 적어 놨어요. 껌 안 되고, 담배 안 되고, 콘택트렌즈도 안 됩니다 — 안경을 챙기세요. 수면마취가 들어간 뒤에는 렌즈를 둘 데가 마땅치 않거든요. 유일한 예외는 혈압약이고 시간대가 따로 있어요. 06:00 이전에, 가능한 한 적은 물과 함께, 그리고 당일에는 그 외 어떤 약도 복용하지 않습니다. NaRhee는 이제 셋 중 아침이 가장 수월해요. 장 정결제가 없으니까요. 대신 두 줄을 더 읽어야 합니다. 골반 초음파는 방광이 차 있어야 잘 보이니 택시 타기 전 습관적으로 비우지 말고 아침 첫 소변을 참으세요. 그리고 옷을 자주 갈아입는 검사가 많으니 팬티스타킹은 피하는 게 좋아요. 시계와 장신구는 방에 두고 가세요.","dose.d2-fast.label.0":"안경을 챙기세요. 수면마취를 받는 사람은 콘택트렌즈를 착용할 수 없어요.","dose.d2-fast.label.1":"혈압약은 06:00 이전에 물 한 모금과 함께. 당일 다른 약은 복용하지 마세요.","dose.d2-fast.label.2":"검진센터는 08:00에 열고, 안내문은 늦어도 10:00까지 내원하라고 되어 있어요.","dose.d2-fast.label.3":"약을 임의로 중단하지 마세요. 내시경·조직검사 전 항응고제·항혈소판제 복용을 반드시 알리세요.","dose.d2-fast.title":"금식, 그리고 가져가면 안 되는 것들","dose.d2-fast.who":"Jun · NaRhee · Jordan","dose.d2-kd.cost":"광동병원 자체 등급은 스탠다드 $400~$850, 프리미엄 $1,000~$3,900, 1인 기준","dose.d2-kd.detail":"광동병원 공시 소요 시간은 스탠다드 프로그램 약 3시간, 프리미엄은 3~4시간입니다. KD Program은 뇌 MRI, 뇌 MRA, 경추·요추 MRI, 췌장·간 MRI, NK세포 활성도, 심장초음파, 암 유전자 패널이 추가되어 이 범위의 상단 또는 그 이상에 해당돼요. 최소 12:30까지 잡아두고, 14:00 정도는 여유 있게 보세요.","dose.d2-kd.label.0":"용종을 떼면 광동병원 안내문 자체가 2주간 비행을 금지해요. KE041은 11일 뒤입니다. 이제 이 위험은 Jun과 Jordan의 것이니, 벌어진 다음이 아니라 그 전에 정리하세요.","dose.d2-kd.label.1":"08:00 시작은 병원 안내문으로 확인됐어요. 검진센터는 08:00에 열고 늦어도 10:00까지 내원하라고 합니다.","dose.d2-kd.label.2":"수면내시경 후 1~2시간은 식사 불가, 혼자 귀가 불가. 누군가 데리러 가야 해요.","dose.d2-kd.label.3":"NaRhee의 검진은 KD 패키지에서 대장내시경만 빠진 구성이에요. 시작 전에 데스크에서 확인받으세요.","dose.d2-kd.label.4":"세 명이 동시에 진행 가능한지 확인하세요. MRI 대기가 한 줄이면 하루 전체가 달라져요.","dose.d2-kd.label.5":"전체 결과는 나중에 나옵니다. 광동병원은 약 10일이라고 안내하지만 후기는 2~3주라고 해요.","dose.d2-kd.title":"정밀 특화 검진 · KD Program","dose.d2-kd.where":"광동병원 국제검진센터","dose.d2-kd.who":"Jun · NaRhee · Jordan","dose.d2-naps.detail":"아이 셋 모두 취침, 어른 두 명 휴식. 여행 어느 날에도 이 시간대에는 다른 일정을 잡지 마세요.","dose.d2-naps.title":"호텔 복귀 · 낮잠 시간","dose.d2-naps.who":"아내 · 부모님 · 아이 셋","dose.d2-prep2.detail":"어젯밤과 같은 순서인데 시작만 하나 달라요. 알약 전에 물을 한 컵이 아니라 두 컵 마십니다. 그다음 제이클정 10정을 물 500mL와 함께 30분에 걸쳐, 이어서 그 뒤 한 시간 동안 물이나 맑은 이온음료 1L. 절대 조건은 안내문에 빨간 글씨로 박혀 있어요 — 약과 추가 수분 섭취를 검사 최소 2시간 전까지 모두 끝내야 합니다. 04:00에 시작하면 05:30에 끝나니 08:00 도착까지 여유가 충분해요. 04:00은 병원이 말한 시각이니 그대로 쓰되, 인쇄된 칸은 비어 있었으니 한 번 확인받는 게 좋아요. 착륙 후 약 11시간이 지난 시점이고, 이번 여행에서 시차 적응이 가장 힘든 밤이에요. 전체 계획에서 놓치기 가장 쉬운 항목이자 되돌릴 수 없는 유일한 항목입니다. 장이 깨끗하지 않은 채로 도착하면 대장내시경은 그 자리에서 취소돼요. NaRhee는 이 시간에 그냥 자면 됩니다 — 금식만 하면 되거든요.","dose.d2-prep2.fallback":"대안은 없습니다. 복용을 놓쳤다면 병원으로 출발하기 전에 02-2222-4888로 전화하세요. 가서 알게 되는 것보다 낫습니다.","dose.d2-prep2.label.0":"검사 2시간 전까지 전부 끝내세요. 안내문의 빨간 줄이고, 권고가 아니에요.","dose.d2-prep2.label.1":"잠들기 전에 휴대폰 두 대에 알람을 두 개 설정하세요.","dose.d2-prep2.label.2":"04:00부터 출발 전까지 화장실 근처에 있으세요. 07:30 택시 전 잠은 기대하지 마세요.","dose.d2-prep2.title":"제이클정 2차 복용 · 밀리면 안 되는 하나","dose.d2-prep2.who":"Jun · Jordan","dose.d2-rejoin.detail":"세 명에게는 약 스무 시간 만의 첫 제대로 된 식사입니다. 가깝고, 조용하고, 계단 없는 곳으로.","dose.d2-rejoin.fallback":"16:00까지 밀릴 수 있어요. 이 식사는 시간이 옮겨질 뿐, 취소되지는 않습니다.","dose.d2-rejoin.label.0":"점심 시간은 여유 있게 잡으세요. 수면 마취 후 퇴원은 검사 일정보다 늦어질 수 있어요.","dose.d2-rejoin.title":"병원 셋 도착 후 늦은 점심","dose.d2-rejoin.who":"다 함께","dose.d3-bfast.detail":"포함되어 있어요. 이 여정 전체를 여기에 맞춰 짜세요 — 호텔에서 제대로 된 아침을 먹으면 하루 중 가장 어려운 식사를 다섯 번 넘게 계획에서 지울 수 있습니다. 9시에 시작하니 어두울 때 아기 옷 입힐 일도 없어요.","dose.d3-bfast.title":"파크 하얏트 아침","dose.d3-bfast.who":"다 함께","dose.d3-botox.cost":"국산 보톡스는 부위당 약 ₩40,000~₩80,000, 수입 알러간은 약 ₩140,000~₩220,000","dose.d3-botox.detail":"이동일에서 이날로 옮겼습니다. 강남은 병원이 밀집해 있고 영어 지원도 좋으며, 셋째 날에 하면 결과가 자리 잡을 시간이 열흘 있고, 출국 전에 같은 병원이 예상 밖의 변화를 확인할 여유도 생깁니다. 시술 자체는 5~15분이고, 예약 시간의 대부분은 상담이에요.","dose.d3-botox.label.0":"보톡스 후: 4시간 눕지 말고 시술 부위 만지지 마세요. 24시간 음주·뜨거운 목욕·사우나·격한 운동 금지.","dose.d3-botox.label.1":"17일 인천 르네의원 점 빼기와는 일정을 겹치지 마세요. 사후 관리 안내는 서면으로 받아두세요.","dose.d3-botox.label.2":"가격, 사용 제품, 재진 포함 여부를 확인하세요.","dose.d3-botox.title":"보톡스 예약 · 강남","dose.d3-botox.where":"강남역 또는 압구정 · 병원 미정","dose.d3-botox.who":"받는 사람","dose.d3-dinner.cost":"성인 1인 200달러, 36개월 미만 무료 — 성인 6명 기준 약 1,200달러예요","dose.d3-dinner.detail":"저녁 6시에 9명으로 예약했어요. 저녁 영업이 6시부터 9시까지라 첫 타임이에요. 문 여는 시간이 가장 조용하고 음식도 가장 신선해요. 아이 셋을 데리고 가는 자리라면 전망보다 그 점이 더 중요해요. 호텔에서 339m 거리라 이번 여행 중 저녁 먹으러 가는 길이 가장 짧고, 아이들은 8시 반이면 잠자리에 들 수 있어요.","dose.d3-dinner.fallback":"지상 엘리베이터 줄이 길면 코엑스 지하 1층 경로로 몰 안에서 같은 엘리베이터까지 갈 수 있어요.","dose.d3-dinner.getting":"가는 길은 두 가지인데, 오늘 저녁엔 우열이 있어요. 지상으로는 영동대로를 따라 4분쯤 걸어 트레이드타워 정문으로 들어가서 로비 엘리베이터를 타면 돼요. 지하로는 호텔에서 삼성역을 지나 코엑스로 들어가 별마당 도서관을 지나면 밖으로 한 번도 나가지 않고 트레이드타워 엘리베이터까지 갈 수 있어요. 지하 경로가 걷는 거리는 더 길지만 평지에 냉방이 되고 수유실을 지나가요. 영유아 둘과 두 살 아이를 데리고 간다면 그래서 지하가 나아요.","dose.d3-dinner.label.0":"아이들 여권을 꼭 챙기세요. 크랩52는 영유아와 어린이 모두 생년월일을 확인할 수 있는 증빙을 요구하고, 여권도 인정 서류에 명시돼 있어요. 안 가져가면 무료여야 할 아이에게 어린이 요금 100달러가 붙을 수 있어요.","dose.d3-dinner.label.1":"9월 8일 기준으로 두 살 조카가 36개월 미만인지 확인하세요. 무료는 세 번째 생일 전날까지라 몇 주 차이로 100달러가 갈려요.","dose.d3-dinner.label.2":"매장 안에는 수유실도 기저귀 교환대도 없어요. 매장이 직접 공지한 내용이고, 매장 내부에만 해당하는 이야기예요. 올라가는 길에 코엑스 지하 1층 아가사랑방에서 기저귀를 갈고 수유를 마치세요. 식사 중간에 다시 내려갔다 오면 52층 엘리베이터까지 감안해 왕복 10~15분은 걸려요.","dose.d3-dinner.label.3":"유모차는 매장 안으로 들어갈 수 없어요. 보관은 해 주지만 저녁엔 아기띠를 쓰는 편이 나아요.","dose.d3-dinner.label.4":"9명이 한 테이블에 앉을 수 있는지 물어보세요. 5인 이상은 테이블이 나뉠 수 있다고 매장에서 공지하고 있어서, 문 앞에 서기 전에 확인해 두는 게 좋아요.","dose.d3-dinner.label.5":"결제는 당일 매장에서만 가능해요. 원화는 카드나 현금, 달러는 지폐만 받아요. 동전, 사전 결제, 계좌 이체는 안 돼요. 달러 환율은 전날 기업은행 고시 환율을 적용해요.","dose.d3-dinner.label.6":"7일에 미리 길을 봐 두면 좋아요. 그날 오전에 어차피 코엑스에 있으니, 예약 시간에 쫓기지 않을 때 지하 1층에서 트레이드타워 엘리베이터까지 한 번 걸어 보세요.","dose.d3-dinner.title":"크랩52 · 52층에서 저녁","dose.d3-dinner.where":"크랩52 · 강남구 영동대로 511 트레이드타워","dose.d3-dinner.who":"다 함께","dose.d3-lunch.detail":"낮잠 시간 범위 안으로 돌아옵니다. 좌식 아닌 의자석으로.","dose.d3-lunch.title":"호텔 근처 점심","dose.d3-lunch.who":"다 함께","dose.d3-nap.title":"호텔 낮잠 시간","dose.d3-nap.who":"아이 셋 + 필요한 사람","dose.d3-seongsu.detail":"강남에서 강 건너 바로 맞은편이고, 성수를 가장 편하게 즐길 수 있는 방법이에요 — 동네가 완전히 깨어나기 전에 도착하세요. 먼저 서울숲에서 시작해요. 평평하고 넓고 그늘이 많아 유모차와 할머니·할아버지에게 정말 편합니다. 그런 다음 연무장길의 창고를 개조한 카페와 플래그십 스토어로 걸어 들어가세요. 성수는 옛 신발 공장 지구에서 디자인 지구로 바뀐 곳이라 도로가 넓고 인도가 제대로 되어 있어요. 익선동이나 북촌과는 다릅니다.","dose.d3-seongsu.fallback":"서울숲만으로도 완전한 오전 일정이 됩니다. 그룹이 지치면 카페 거리는 완전히 건너뛰고 나무 그늘 아래 앉아 계세요.","dose.d3-seongsu.getting":"파크 하얏트에서 성수대교를 곧장 건너 택시로 10~15분. 아홉 명이니 차 두 대.","dose.d3-seongsu.label.0":"10:30에 도착해 서울숲부터. 성수 카페는 대부분 11:00에 열고 정오면 줄이 생겨요.","dose.d3-seongsu.label.1":"부모님께는 서울숲을 활용하세요. 평평한 포장 산책로, 그늘, 벤치가 넉넉해요.","dose.d3-seongsu.label.2":"카페 한 곳이 유모차 포함 아홉 명을 받을 수 있는지 확인하거나, 두 테이블로 나눌 계획을 세우세요.","dose.d3-seongsu.title":"성수와 서울숲","dose.d3-seongsu.where":"서울숲, 성동구 성수동","dose.d3-seongsu.who":"다 함께","dose.d3-skincare.detail":"그룹을 나누세요: 일부는 쇼핑, 일부는 아이들과 함께. 올리브영은 한국 데일리 스킨케어를 커버하고, 백화점 식품관과 아동 매장이 나머지를 커버해요. 두 곳 모두 실내, 냉방, 엘리베이터 이용 가능.","dose.d3-skincare.fallback":"여기 있는 것들은 여행 후반 명동에서도 살 수 있으니 오늘 다 끝내지 않아도 괜찮아요.","dose.d3-skincare.label.0":"여권을 지참하세요. 매장 내 즉시 환급 창구에서 필요합니다.","dose.d3-skincare.label.1":"5시 30분에는 무조건 끝내세요. 크랩52 예약이 6시라 5시 40분에는 호텔에서 나서야 해요. 서두르게 되기 전에 마지막 가게에서 나오세요.","dose.d3-skincare.title":"스킨케어 — 올리브영·백화점","dose.d3-skincare.where":"강남 · 올리브영 강남타운, 그리고 현대백화점 무역센터점 또는 스타필드 코엑스","dose.d3-skincare.who":"어른들 교대로","dose.d4-bfast.detail":"이번 여행에서 유일하게 9시에 시작할 수 없는 아침이에요 — 10:00 열차가 시간을 정하니, 08:55에는 택시에 타 있어야 해요. 그래도 서두르는 아침이 아니라 여유 있는 아침이에요. 다만 예전 계획보다는 일찍 시작해요. 수서역까지 가는 길이 출근 시간대라, 지도에 나오는 5분짜리 이동이 아니거든요. 여기서 든든히 드세요. 57분 열차이고, 양쪽 역에서 살 만한 게 있으리라는 보장은 없어요.","dose.d4-bfast.label.0":"이 셋만 일찍 움직여요. 호텔에 남는 나머지는 09:00에 아침 먹어요.","dose.d4-bfast.title":"호텔에서 여유로운 아침","dose.d4-bfast.who":"Jun · 아내 · 7개월","dose.d4-bongeunsa.detail":"코엑스 바로 건너편에 있는 현역 사찰이에요. 도보 10분. 조용하고 푸르고, 언제든 그만두고 나올 만큼 짧아요. 확정이 아니라 후보로 둔 것도 의도적이에요 — 오늘은 열차 안 타는 여섯 명의 회복일이니까, 아무것도 안 하는 것도 완전히 유효한 선택이에요.","dose.d4-bongeunsa.fallback":"두 살 아이가 지치면 언제든 돌아오세요. 아예 건너뛰고 할머니·할아버지는 방에서 오전을 보내셔도 좋아요. 스타필드 코엑스는 실내에 평평하고 30초 더 가까워요.","dose.d4-bongeunsa.label.0":"부모님이 피곤하시면 이건 그냥 넘어가세요. 다른 외출로 설득하지 마세요.","dose.d4-bongeunsa.label.1":"사찰 경내에는 계단과 경사가 있어요. 계단 없는 경로를 미리 확인하거나 아래층에만 머무세요.","dose.d4-bongeunsa.title":"봉은사","dose.d4-bongeunsa.where":"봉은사, 삼성동","dose.d4-bongeunsa.who":"부모님 · NaRhee 가족","dose.d4-dept.detail":"실내에 냉방, 엘리베이터, 수유실, 지하 식품관까지 갖췄어요. 한국 백화점은 어린아이와 함께일 때 실제로 필요한 것들을 유난히 잘 갖춰놓았어요.","dose.d4-dept.label.0":"수유실 층수와 영업시간을 확인하세요.","dose.d4-dept.title":"백화점, 교대로","dose.d4-dept.where":"현대백화점 무역센터점 또는 스타필드 코엑스","dose.d4-dept.who":"부모님 · NaRhee 가족","dose.d4-dinner.detail":"호텔 근처에서. 이번 저녁을 위해 멀리 이동할 힘은 아무도 없어요.","dose.d4-dinner.title":"열차 도착 후 저녁","dose.d4-dinner.who":"다 함께","dose.d4-ktx.cost":"일반실 1인 20,100원. 7개월 아기는 무릎에 앉히면 무료예요 — 만 6세 미만, 동반 어른 1명당 1명까지요.","dose.d4-ktx.detail":"KTX-산천 393으로 남쪽으로 57분. 어른 표 두 장, 14호차 6C·7C 좌석이에요 — 아기는 무릎에 앉으니 표가 두 장인 거예요. 생각보다 좋은 자리를 잡으셨어요. 6C와 7C는 나란히 붙은 자리가 아니라, 4인 동반석에서 고정 테이블을 사이에 두고 마주 보는 자리예요. 7개월 아기를 서로 주고받기에 이보다 편한 배치는 없어요. 둘 다 통로 쪽이라 창가는 아니지만, 누구를 넘어가지 않고도 각자 일어설 수 있어요.","dose.d4-ktx.getting":"14호차는 20량 중련 편성의 뒤쪽 편성이에요. 11~18호차 범위로 타시고, 승강장 바닥의 호차 표시를 따라가세요. 앞뒤 편성은 서로 막혀 있어서, 실수로 1~8호차로 타면 열차가 달리는 동안에는 자리로 갈 수 없어요. 탈 때는 아기를 안고 유모차는 접으세요. 객차로 올라서는 턱이 꽤 높아요.","dose.d4-ktx.label.0":"14호차가 유아동반 객차예요. 기저귀 교환대가 있는 수유실이 바로 이 객차 끝에 있어서, 멀리 찾아다닐 일이 없어요.","dose.d4-ktx.label.1":"캡처 화면은 승차권으로 인정되지 않아요. 코레일이 캡처에서 열차번호·좌석번호·승차권번호를 일부러 가리기 때문에, 코레일 앱에서 실제 승차권을 띄워야 해요. 승강장에 가기 전에 eSIM이 되고 있어야 한다는 뜻이에요.","dose.d4-ktx.label.2":"승강장은 출발 15분 전쯤, 그러니까 09:45쯤에야 안내돼요. 전광판을 보다가 뜨는 즉시 움직이세요.","dose.d4-ktx.label.3":"동반석 네 자리 중 두 자리만 사셨어요. 맞은편 창가 두 자리는 다른 승객에게 팔릴 수 있으니, 테이블을 둘이서만 쓴다고 생각하지는 마세요.","dose.d4-ktx.label.4":"열차 안에 이동 판매나 카페 칸이 없어요. 젖병과 마실 것은 미리 챙겨서 타세요.","dose.d4-ktx.title":"KTX 393 대전행","dose.d4-ktx.where":"수서역 → 대전역","dose.d4-ktx.who":"Jun · 아내 · 7개월","dose.d4-return.cost":"1인 20,100원.","dose.d4-return.detail":"아직 예약 안 했어요 — 오늘 하루에서 유일하게 비어 있는 부분이에요. 가는 편 표만 있어요. 대전에서 수서로는 늦은 오후에 시간당 2~4편씩 다니니 자리가 문제는 아니에요. 지친 아기를 안고 발권기 앞에 서야 하는 게 문제죠. 16:26 열차면 17:19에 수서, 17:45쯤 호텔이라 저녁 전에 여유 있어요.","dose.d4-return.fallback":"더 늦은 편은 16:59, 17:09, 17:34에 있어요. 대전에서 17:30 이후 출발이면 18:45 저녁을 놓치니, 그냥 넘기지 말고 가족에게 알려주세요.","dose.d4-return.label.0":"시애틀 떠나기 전에 예매하세요. 오늘 일정에서 유일하게 예약이 안 된 구간이고, 소파에 앉아서 해결할 수 있는 가장 쉬운 일이에요.","dose.d4-return.label.1":"돌아가는 열차 시간을 삼촌과 미리 정해두세요. 그래야 인사가 급하지 않고 놓치지도 않아요.","dose.d4-return.title":"수서로 돌아오는 열차","dose.d4-return.where":"대전역 → 수서역","dose.d4-return.who":"Jun · 아내 · 7개월","dose.d4-stay-bfast.detail":"정해진 일정도 알람도 없어요. 오늘은 열차 안 타는 여섯 명의 회복일이에요 — 9시 이후에 시작하고, 뒤에는 언제든 뺄 수 있는 일정만 두세요.","dose.d4-stay-bfast.title":"여유로운 호텔 아침","dose.d4-stay-bfast.who":"부모님 · NaRhee 가족","dose.d4-stay-nap.title":"낮잠 시간","dose.d4-stay-nap.who":"호텔에 있는 아이 둘","dose.d4-suseo.cost":"택시로 약 9,000~12,000원.","dose.d4-suseo.detail":"수서역은 남쪽 방향 고속철도 종점이고, 파크 하얏트에서 약 6km예요 — 이 일정을 인사동 구간이 아니라 여기에 넣은 이유가 바로 이거예요. 예전 계획에는 택시로 5분이라고 적혀 있었어요. 그건 길이 뚫렸을 때 이야기고, 수요일 아침 9시 강남 교통이면 15~25분이에요. 08:55에 출발하면 09:25쯤 대합실에 들어가요. 그 여유가 필요해요. 승강장 번호는 09:45쯤에야 전광판에 뜨고, 여러분 호차는 400m짜리 열차의 저쪽 끝에 있거든요.","dose.d4-suseo.getting":"호텔 정문에서 택시. 기사님께 수서역이라고 보여드리세요 — 지하철역이 아니라 고속철도역이에요. 대합실은 이어져 있어요.","dose.d4-suseo.label.0":"개찰구가 없어요. 들어가서 출발 전광판을 보고 해당 승강장 에스컬레이터로 내려가면 돼요. 그러니 일찍 가는 건 줄을 서려는 게 아니라 걸어갈 시간을 벌려는 거예요.","dose.d4-suseo.label.1":"전광판에는 여러분 목적지가 아니라 열차의 종착역이 떠요. 대전이 아니라 10:00 포항행을 찾으세요.","dose.d4-suseo.title":"수서역으로","dose.d4-suseo.where":"수서역 · 강남구 수서동 210","dose.d4-suseo.who":"Jun · 아내 · 7개월","dose.d4-uncle.detail":"오늘의 이유예요. 함께 여유롭게 점심 드세요. 뒤에 다른 일정 얹지 말고 오후는 비워두세요 — 4시간이면 형식적인 인사가 아니라 진짜 방문이에요.","dose.d4-uncle.label.0":"4시간이면 형식적인 인사가 아니라 진짜 방문이에요. 길어지면 길어지는 대로 두세요 — 오늘 유연한 쪽은 돌아오는 열차예요.","dose.d4-uncle.label.1":"삼촌과 만날 장소를 미리 정해두세요. 열차는 중심가에 있는 대전역으로 들어가요 — 서대전역은 노선이 달라서 이 열차가 서지 않아요.","dose.d4-uncle.title":"아내 삼촌과","dose.d4-uncle.who":"Jun · 아내 · 7개월","dose.d5-back.detail":"다 같이 돌아와요 — 이 부분은 선택이 아니에요. 삼성동까지 15분이면 두 살 아이를 14:20에 진짜 침대에 눕힐 수 있어요. 이번 구간 가장 큰 하루니까요.","dose.d5-back.label.0":"여기서 부모님을 호텔로 모시고 들어가세요. 69세·70세 어른들에게 4시간 외출은 하루 종일에 해당해요.","dose.d5-back.title":"다 함께 호텔 복귀","dose.d5-back.who":"다 함께","dose.d5-bfast.detail":"9시. 롯데월드는 종일 걸어야 하니, 일찍 시작하는 것보다 쉬고 시작하는 게 더 중요해요 — 목요일이라 개장부터 11시 사이에는 사람이 크게 늘지 않아요.","dose.d5-bfast.title":"파크 하얏트 아침","dose.d5-bfast.who":"다 함께","dose.d5-dinner.detail":"가족 저녁 식사로 잠정 예정돼 있고, 장소와 시간은 아직 확정되지 않았어요. 18:15은 세부 사항이 정해지면 바뀔 임시 시간으로 봐 주세요. 석촌호수 한 바퀴가 17:30에 끝나니 잠실 단지 안이면 추가 이동 없이 그대로 이어져요. 삼성동으로 돌아가면 30분쯤 걸리고 아기들 잠자리 시간에 더 가까워져요.","dose.d5-dinner.label.0":"장소와 시간을 확정하고, 아홉 명이 앉을 수 있는지와 아기 의자 두 개가 가능한지 확인하세요.","dose.d5-dinner.title":"가족 저녁 식사 · 세부 사항 예정","dose.d5-dinner.who":"다 함께","dose.d5-go.detail":"택시 두 대나 지하철. 어느 쪽이든 금방이에요.","dose.d5-go.title":"잠실로","dose.d5-go.where":"롯데월드, 잠실","dose.d5-go.who":"다 함께","dose.d5-lake.detail":"공원 옆 호수를 도는 평평한 포장 산책로예요. 전 구간에 벤치가 있어요. 늦은 오후 빛에 좋고, 언제든 짧게 끊을 수 있어요. 정말 선택이에요 — 잠실까지 다시 나가는 건 하루에는 부담스러울 수 있어요.","dose.d5-lake.label.0":"이미 하루가 길었다면 석촌호수는 그냥 넘어가세요. 있으면 좋고 없어도 되는 일정이에요.","dose.d5-lake.title":"석촌호수 산책","dose.d5-lake.who":"원하는 사람만","dose.d5-lunch.detail":"바로 옆 롯데월드몰이 공원 안보다 음식이 훨씬 낫고 자리도 제대로 있어요.","dose.d5-lunch.title":"단지 안에서 점심","dose.d5-lunch.who":"다 함께","dose.d5-nap.label.0":"이 낮잠은 꼭 지키세요. 할머니·할아버지도 여기서 쉬시고, 오늘 나머지 일정은 두 분에게는 선택이에요.","dose.d5-nap.title":"호텔에서 낮잠 시간","dose.d5-nap.who":"아이 셋 · 할머니·할아버지","dose.d5-park.detail":"오전 내내가 아니라 두 시간 이내로만. 실내 어드벤처 구역은 냉방이 되고, 대부분 평지에 엘리베이터가 있어요 — 여기서는 놀이기구보다 이 점이 더 중요해요. 어린이 전용 구역이 따로 있어서, 두 살 아이가 도는 동안 할머니·할아버지는 편안히 앉아 계실 수 있어요. 아기 둘은 그동안 아기띠 안에서 낮잠 자요.","dose.d5-park.fallback":"공원이 부담스러우면 같은 단지 안의 롯데월드 아쿠아리움이 어둡고 시원하고 조용하고, 90분 정도면 돌아요.","dose.d5-park.label.0":"두 살 아이 기준으로 롯데월드는 90–100분까지만. 아이가 무너지기 전에 나오세요.","dose.d5-park.label.1":"개장 시간, 티켓 종류, 유모차 대여, 놀이기구 나이·키 제한을 확인하세요.","dose.d5-park.label.2":"아기들은 탈 수 있는 게 거의 없어요. 놀이기구 체크리스트가 아니라 둘러보는 곳으로 여기세요.","dose.d5-park.label.3":"가기 전에 공원 안 수유실과 기저귀 교환대 위치를 확인하세요.","dose.d5-park.title":"롯데월드 어드벤처 실내","dose.d5-park.where":"롯데월드 어드벤처, 잠실","dose.d5-park.who":"다 함께","dose.d6-bfast.detail":"포함된 마지막 아침이에요 — 인사동 구간에는 조식 혜택이 없으니, 여행 중 편안한 아침 식사는 이게 마지막이에요. 9시에 시작해요. 체크아웃은 11:30까지고, 서두를 이유가 없어요.","dose.d6-bfast.title":"파크 하얏트 마지막 아침","dose.d6-bfast.who":"다 함께","dose.d6-checkin.detail":"늦게 이동하는 것의 진짜 장점 하나 — 체크인 시간인 15시를 한참 넘겨 도착하니까 방이 준비돼 있고, 로비에서 하우스키핑을 기다릴 일이 없어요. 짐 올리고, 아기 침대 확인하고, 그다음에 누가 다시 나갈지 정하세요.","dose.d6-checkin.label.0":"오늘은 여기까지인 사람은 여기까지예요. 이 뒤는 전부 선택이고, 여기서 다섯 밤을 자요.","dose.d6-checkin.title":"체크인·아기 침대·숨 돌림","dose.d6-checkin.who":"다 함께","dose.d6-checkout.detail":"오늘 하루의 모양은 이 한 가지에 달려 있어요. 기사님이 올 때까지 이 방을 유지하는 것. Globalist 자격은 리조트가 아닌 하얏트 호텔에서 오후 4시 체크아웃을 보장해 주는데, 파크 하얏트 서울은 삼성동 도심 호텔이라 여기에 해당돼요. 그러면 지친 아이 셋과 로비에서 3시간을 버티는 대신, 낮잠이 들어간 평범한 오후가 돼요. 지금 짐을 완전히 싸 두세요. 그래야 15시 15분에 나가는 게 40분이 아니라 15분짜리 일이 돼요.","dose.d6-checkout.label.0":"당일 아침 말고 전날 밤에 프런트에 요청하세요. 보장된다는 것과 잡혀 있다는 건 다르고, 하우스키핑이 돌기 전에 시스템에 들어가 있어야 해요.","dose.d6-checkout.label.1":"방을 정말 못 잡아 주면 프런트에 짐 맡기고, 점심을 길게 먹고, 낮잠 시간대는 스타필드 코엑스에서 보내세요. 5분 거리에 실내예요.","dose.d6-checkout.title":"방 유지하고, 짐 싸고, 가방 대기","dose.d6-checkout.who":"다 함께","dose.d6-dinner.detail":"돌아와서 다시 나가지 말고 산책이 끝나는 곳에서 드세요. 익선동은 한옥을 개조한 식당이 빼곡해요. 식사 후 호텔까지는 평지 도보 10분이에요. 9명 테이블석으로 예약 완료.","dose.d6-dinner.label.0":"예약할 때 의자석으로 요청하세요. 한옥 개조 식당은 좌식이 많아요.","dose.d6-dinner.label.1":"9명이니 미리 예약하세요. 익선동 식당들은 작아서, 미리 말하지 않으면 함께 앉기 어려울 수 있어요.","dose.d6-dinner.title":"익선동 저녁","dose.d6-dinner.who":"다 함께","dose.d6-ikseon.detail":"낙원동 쪽으로 동쪽으로 빠지면 익선동 초입이 나와요. 한옥을 고쳐 만든 카페와 작은 가게들이 촘촘히 모인 골목이에요. 평지이고 낮은 지붕선 덕에 그늘이 지고, 호텔에서 10분쯤 걸려요. 첫 구경엔 30분이면 충분하고, 되돌아 나올 필요 없이 그대로 저녁 자리로 이어져요.","dose.d6-ikseon.fallback":"골목이 유모차로 다니기엔 너무 붐비면 청계천이 남쪽으로 5분 거리에 평지이고 그늘져요.","dose.d6-ikseon.getting":"걸어서, 쌈지길에서 낙원동을 지나 쭉이요.","dose.d6-ikseon.label.0":"익선동 골목은 폭이 2m가 안 되는 곳이 많아요. 아기띠를 쓰거나, 큰 유모차는 호텔에 두고 오세요.","dose.d6-ikseon.label.1":"저녁 자리가 이 산책 끝에 있어서 되돌아 나올 일이 없어요.","dose.d6-ikseon.title":"이어서 익선동으로","dose.d6-ikseon.where":"익선동, 종로 · 호텔에서 약 700m","dose.d6-ikseon.who":"원하는 사람만","dose.d6-insa.detail":"전체 코스가 아니라 맛보기예요 — 이동이 늦어지면서 오후 한가운데가 빠졌고, 어차피 여기서 다섯 밤을 자니까 제대로 도는 건 다음에 해도 돼요. 호텔에서 나와 인사동길로, 종이·도자기·차·붓 가게들을 지나 북쪽으로 올라가면 꼭대기에 쌈지길이 있어요. 계단이 아니라 4층짜리 나선형 경사로라 유모차가 엘리베이터 없이 끝까지 올라갔다 내려와요. 누구든 힘들어지면 그때 돌아서면 돼요. 어디에 있든 방까지 8분을 넘지 않아요.","dose.d6-insa.fallback":"이 산책의 어느 지점에서든 방까지 평지로 금방이라, 20분이 될 수도 한 시간이 될 수도 있고 누구든 중간에 빠져도 돼요.","dose.d6-insa.getting":"도보. 호텔이 인사동길에 바로 있어요.","dose.d6-insa.label.0":"26도쯤에 흐리고, 하루 중 시원한 시간에 나가요. 이번 구간 야외 일정 중 날씨가 가장 순한 시간이에요.","dose.d6-insa.label.1":"인사동길은 보통 주말에 차 없는 거리인데 11일은 금요일이에요. 차가 다닌다고 생각하고 두 살 아이는 안쪽으로 걸리세요.","dose.d6-insa.title":"인사동길 첫 산책","dose.d6-insa.where":"인사동길 → 쌈지길 · 호텔 문 앞에서","dose.d6-insa.who":"원하는 사람만","dose.d6-lunch.detail":"방이 4시까지 우리 것이고 기사님도 3시 30분에나 오니까 서두를 일이 없어요. 호텔이나 코엑스처럼 가까운 데로 하세요. 앞으로 두 시간의 목적은 아이들이 무너지기 전에 방으로 올라가 있는 거니까요.","dose.d6-lunch.fallback":"제대로 앉아서 먹기 싫으면 코엑스 푸드홀이 5분 거리예요. 각자 다른 걸 다른 속도로 먹을 수 있어요.","dose.d6-lunch.title":"강남에서의 마지막 점심","dose.d6-lunch.who":"다 함께","dose.d6-move.cost":"16만 원, 현금, 픽업 때 기사님께 직접","dose.d6-move.detail":"예약 완료. 기사님이 15시 30분에 파크 하얏트로 오셔서 강 건너 종로까지 데려다주세요. 한산할 때 40분 걸리는 거리지만 넉넉히 한 시간을 잡으세요 — 금요일이고, 저녁 정체가 시작되는 초입에 들어가게 되거든요. 그래도 가장 심한 시간은 피한 거고, 그래서 15시 30분 픽업이 17시 픽업보다 나아요.","dose.d6-move.fallback":"기사님이 안 오시면 삼성역에서 2호선 타고 3호선으로 갈아타 안국역까지 갈 수는 있는데, 이 짐을 들고는 정말 힘든 오후가 돼요. 재확인할 때 기사님 휴대폰 번호를 꼭 받아 두세요.","dose.d6-move.getting":"파크 하얏트 로비에서 문 앞까지. 15시 15분엔 내려가 있으세요 — 아홉 명, 12일치 짐, 카시트 세 개는 5분 만에 안 실려요.","dose.d6-move.label.0":"현금 16만 원, 픽업 때 드려요. 주중에 미리 뽑아서 쓸 돈과 따로 빼 두세요 — 5만 원권 세 장에 1만 원권 한 장이면 딱 맞아서 기사님이 거스름돈을 준비할 필요가 없어요.","dose.d6-move.label.1":"카시트 세 개 다시 확인하세요. 이번 여행의 다른 모든 이동은 카시트를 넣어 예약했으니 이것도 맞춰야 해요.","dose.d6-move.label.2":"차량이 아홉 명에 12일치 짐까지 정말 들어가는지 확인하세요. 두 대가 아니라 한 대라면 좌석이 아니라 짐이 문제예요.","dose.d6-move.label.3":"기사님께 목적지 이름과 주소를 확인해 주세요. 서울 도심에 나인트리가 한 곳이 아니에요.","dose.d6-move.title":"인사동까지 개인 차량 이동","dose.d6-move.where":"나인트리 프리미어 인사동 · 종로구 인사동길 49","dose.d6-move.who":"다 함께","dose.d6-nap.detail":"레이트 체크아웃으로 얻는 게 바로 이거예요. 카시트나 로비 소파가 아니라 익숙하고 어두운 방에서 다 같이 자고, 금요일 저녁 도심 횡단을 지친 상태가 아니라 쉰 상태로 시작하게 돼요.","dose.d6-nap.label.0":"어른들도 이 시간엔 같이 쉬세요. 곧 아홉 명과 12일치 짐을 퇴근 시간 서울에서 옮겨야 해요.","dose.d6-nap.title":"낮잠 시간, 우리 방에서","dose.d6-nap.who":"아이 셋","dose.d6-slow.detail":"예약된 건 없어요. 짐을 제대로 싸고 아이들은 방에서 뛰어놀게 두세요. 이동일은 앞 오전이 비어 있을 때 더 잘 흘러가요.","dose.d6-slow.fallback":"차 타기 전에 에너지를 좀 빼야 한다면, 스타필드 코엑스가 5분 거리에 있고 실내예요.","dose.d6-slow.title":"강남에서 여유 오전","dose.d6-slow.who":"다 함께","dose.d7-back.detail":"낮잠이 필요한 절반은 곧장 숙소로 돌아갑니다. 박물관에서 점심을 안 먹는 건 의도적이에요. 여기서 점심을 먹으면 두 살 아이 낮잠이 14:00을 넘기게 되는데, 내일은 잘 못 잔 두 살을 감당할 여유가 전혀 없는 하루입니다.","dose.d7-back.title":"낮잠팀 인사동 복귀","dose.d7-back.who":"할머니·할아버지·아이 셋·어른 둘","dose.d7-bfast.detail":"이번 일정은 아침이 포함돼 있지 않습니다. 호텔 조식을 이용하거나 베이커리로 해결하세요. 한국 프랜차이즈 베이커리는 아홉 명 정도는 무리 없이 소화합니다. 박물관은 10:00에 문을 여니 9시 전에 일어날 이유는 없어요.","dose.d7-bfast.label.0":"인사동 예약에 조식이 포함되는지, 몇 명분인지 확인.","dose.d7-bfast.title":"아침","dose.d7-bfast.who":"다 함께","dose.d7-dinner.detail":"정말로 일찍. 내일은 여행 전체를 사진으로 남기는 날입니다.","dose.d7-dinner.title":"이른 저녁, 이른 취침","dose.d7-dinner.who":"다 함께","dose.d7-lunch.detail":"룸서비스, 베이커리 사 오기, 아니면 로비에서 가장 가까운 곳. 오늘은 맛보다 속도가 중요합니다.","dose.d7-lunch.fallback":"인사동길에 포장 음식이 많아요. 한 명이 사 오고 나머지는 방으로 올라가세요.","dose.d7-lunch.title":"호텔에서 점심","dose.d7-lunch.who":"다 함께","dose.d7-museum.detail":"용산. 상설전시는 무료 입장이고, 전시실은 넓고 평평합니다. 곳곳에 엘리베이터가 있고, 현장에서 유모차를 무료로 빌릴 수 있으며, 대부분의 전시실에 벤치가 있어요. 한 관만 도세요. 건물 전체는 무리입니다.","dose.d7-museum.fallback":"전시실이 부담스러우면 야외 거울못과 석탑까지 이어지는 산책로만 봐도 이곳까지 온 보람이 있어요.","dose.d7-museum.label.0":"수유실은 1층. 유모차·휠체어는 안내데스크에서 무료 대여.","dose.d7-museum.label.1":"월요일 휴관. 오늘은 18:00까지, 여유 있게 나올 수 있어요.","dose.d7-museum.label.2":"무료 어린이박물관 지금 예약. 매진 빠름, 9명 한 회차 어려울 수 있음.","dose.d7-museum.title":"국립중앙박물관","dose.d7-museum.where":"국립중앙박물관, 용산구 서빙고로 137","dose.d7-museum.who":"다 함께","dose.d7-nap.detail":"제시간에 두 살 아이가 낮잠을 충분히 자는 것, 오늘 일찍 마무리하는 이유가 바로 이거예요. 할머니·할아버지도 함께 쉬세요. 내일은 06:50 시작에 하루가 깁니다.","dose.d7-nap.label.0":"이 낮잠 시간은 반드시 지키세요. 여행 중 가장 중요한 휴식입니다.","dose.d7-nap.title":"호텔 낮잠 시간","dose.d7-nap.who":"아이 셋 + 할머니·할아버지","dose.d7-prep.detail":"대여 예약, 인원 수, 헤어·메이크업 시간, 그리고 궁 매표소까지의 도보 경로를 확정하세요. 각자 안에 입을 옷을 미리 꺼내 두고, 카메라를 충전하세요.","dose.d7-prep.label.0":"내일 10:50 콜타임 확정, 9명 착장. 오늘 밤 가능한 건 다 정리.","dose.d7-prep.label.1":"대여 보증금용 여권 1부, 현금 70,000원을 오늘 밤 준비.","dose.d7-prep.label.2":"오늘 밤 사진작가에게 문자: 우천 대안, 궁 내 지붕 있는 곳, 아침 연락처.","dose.d7-prep.title":"내일 한복, 오늘 밤 정리","dose.d7-prep.who":"Jun","dose.d7-yongsan.detail":"박물관 하나 보러 이 먼 곳까지 왔다면, 하나만 보고 돌아가긴 아쉽습니다. 도보나 지하철 한 정거장 거리에 세 곳이 있어요. 박물관 부지와 거울못은 무료이고, 서울에서 조용히 손꼽히는 조경입니다. 이촌한강공원은 바로 강변으로 이어지고, 용산역의 용산 아이파크몰은 전자제품·장난감·푸드코트를 갖춘 정말 거대한 실내 복합몰이라 더위에 지치면 이곳으로 피할 수 있습니다.","dose.d7-yongsan.fallback":"그냥 다른 사람들과 함께 숙소로 돌아가세요. 이건 자는 아이를 안고 있지 않은 사람들을 위한 추가 일정일 뿐, 건너뛰어도 잃는 게 없어요.","dose.d7-yongsan.getting":"박물관 부지는 도보로. 이촌한강공원은 도보 약 15분. 용산 아이파크몰은 지하철 4호선으로 한 정거장, 또는 택시로 5분.","dose.d7-yongsan.label.0":"필요 시 용산 후 분리. 낮잠은 유지, 이건 13:00에 자유인 어른만.","dose.d7-yongsan.label.1":"15:30까지 복귀. 내일 06:50 시작, 한복 준비에 모두 참석 필수.","dose.d7-yongsan.label.2":"용산공원 조성 부지 예약 없이 입장 가능한지 확인. 구역별 예약제 있음.","dose.d7-yongsan.title":"여유 있는 사람은 용산","dose.d7-yongsan.where":"용산구 · 박물관 부지, 이촌한강공원, 용산 아이파크몰","dose.d7-yongsan.who":"낮잠 담당이 아닌 어른들","dose.d8-bfast.detail":"여행에서 하나 남은 이른 출발이고, 피할 방법이 없어요. 살롱은 08:00 오픈, 한복집은 09:00 오픈, 사진작가 콜타임 10:50은 유료 예약이 걸려 있습니다. 지금 아이들을 제대로 먹이세요. 촬영이 끝날 때까지 다시 여유 있게 먹일 시간이 없고, 한
