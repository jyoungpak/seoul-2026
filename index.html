the end of the Insadong loop. Flat, shaded by the low rooflines, and photogenic without the hill climb Bukchon demands. Late afternoon is the right time — the shops are all open by now, and the lanes light up as the sun drops.","where":"Ikseon-dong, Jongno · about 700 m from the hotel","getting":"On foot, straight on from Nagwon-dong.","fallback":"Cheonggyecheon stream is five minutes south and is flat, shaded and noticeably cooler if the alleys are crowded.","source":"https://english.visitseoul.net/attractions/Ikseon-dong-Hanok-Village_/2686","labels":[{"kind":"warn","text":"Ikseon-dong alleys are often under 2 m wide. Use a carrier, or leave the big stroller at the hotel."},{"kind":"rest","text":"Ikseon-dong is a 10-minute walk from this hotel, so it fits a thin moving-day afternoon."}]},{"id":"d6-dinner","start":"18:30","mins":75,"title":"Dinner in Ikseon-dong","kind":"meal","status":"planned","who":"Everyone","detail":"Eat where the walk ends rather than trekking back. Ikseon-dong is thick with restaurants in converted hanok, and the walk home afterwards is ten flat minutes. Table seating for nine, booked.","labels":[{"kind":"warn","text":"Ask for chairs when you book. Converted hanok often means floor seating."},{"kind":"warn","text":"Book ahead for nine. Ikseon-dong restaurants are small and may not seat you together without notice."}]}]},{"date":"2026-09-12","legId":"insa","title":"Museum day","gist":"National Museum of Korea, free and flat, then the rest of Yongsan.","pace":"Medium","weather":{"sky":"cloud","hi":28,"lo":20,"note":"Cloudy and 28°C. The museum is air-conditioned throughout, so this day is weather-proof by construction — which is exactly why the Yongsan add-on afterwards has an indoor option built into it."},"note":"A Saturday, so the palaces and markets will be at their worst. The national museum is the opposite: enormous, flat, air-conditioned, lift-served throughout, and free to enter. It is the single most infant-and-grandparent-friendly major sight in Seoul.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d7-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Breakfast is not included on this leg. Either the hotel's own, or a bakery — Korean bakery chains handle a group of nine without ceremony. The museum does not open until 10:00, so there is nothing to gain from being up before nine.","labels":[{"kind":"verify","text":"Confirm whether the Insadong booking includes breakfast and for how many."}]},{"id":"d7-museum","start":"10:30","end":"12:30","title":"National Museum of Korea","kind":"outing","status":"planned","who":"Everyone","detail":"Yongsan. Free general admission, vast flat galleries, lifts everywhere, stroller-free rental on site, and benches in most rooms. Do one wing, not the building.","where":"National Museum of Korea, 137 Seobinggo-ro, Yongsan-gu","source":"https://www.museum.go.kr/site/eng/home","fallback":"The reflecting pool and the path to the pagoda outside are worth the trip on their own if the galleries are too much.","labels":[{"kind":"rest","text":"Lactation room is on the first floor. Strollers and wheelchairs are free at the information desk."},{"kind":"warn","text":"Closed Mondays. Open until 18:00 today, so you can leave with hours to spare."},{"kind":"verify","text":"Reserve the free Children’s Museum online now. It books out weeks ahead, and one slot may not hold nine."}]},{"id":"d7-back","start":"12:40","end":"13:10","title":"Nap group back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · two adults","whoSplit":true,"leaveBy":"12:40","detail":"The half of the group that needs the nap goes straight back. Skipping the museum lunch is deliberate: eating at the museum pushes the toddler's nap past 14:00, and tomorrow is the one day of the trip that cannot absorb a badly rested two-year-old."},{"id":"d7-yongsan","start":"12:40","end":"15:00","title":"Yongsan afterwards, for whoever is free","kind":"outing","status":"planned","who":"Adults not on nap duty","whoSplit":true,"detail":"The museum is not the only reason to come out here, and it is a long way to travel for one building. Three things are within reach on foot or one stop: the museum's own grounds and reflecting pool, which are free and quietly one of the best pieces of landscape in Seoul; Ichon Hangang Park, straight down to the river; and Yongsan I'Park Mall at Yongsan Station, which is a genuinely enormous indoor complex with electronics, toys and a food court if the heat wins.","where":"Yongsan-gu · museum grounds, Ichon Hangang Park, Yongsan I'Park Mall","getting":"Museum grounds on foot. Ichon Hangang Park is about fifteen minutes' walk. Yongsan I'Park Mall is one stop on Line 4 or a five-minute taxi.","fallback":"Go straight back with everyone else. This is an add-on for the people who are not carrying a sleeping child, and skipping it costs nothing.","labels":[{"kind":"rest","text":"Split after Yongsan if needed. The nap stays protected; this is only for adults free at 13:00."},{"kind":"warn","text":"Be back by 15:30. Tomorrow starts at 06:50, and hanbok prep needs everyone dressing to be present."},{"kind":"verify","text":"Confirm Yongsan Park redevelopment walk-in access. Parts open and close by reservation."}]},{"id":"d7-lunch","start":"13:15","mins":45,"title":"Lunch at the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Room service, a bakery run, or the nearest thing to the lobby. Speed matters more than quality today.","fallback":"Insadong-gil is full of takeaway. Somebody grabs food while everyone else goes up."},{"id":"d7-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","detail":"A full, on-time toddler nap, which is the entire reason today ends early. The grandparents should take this one too — tomorrow starts at 06:50 and runs long.","labels":[{"kind":"rest","text":"Protect this nap block. It’s the most load-bearing rest of the trip."}]},{"id":"d7-prep","start":"16:30","end":"17:30","title":"Tomorrow's hanbok logistics, settled tonight","kind":"admin","status":"planned","who":"Jun","detail":"Confirm the rental booking, the number of people, the hair and makeup slots, and the walking route to the palace ticket office. Lay out what everyone wears underneath. Charge the camera.","labels":[{"kind":"warn","text":"Tomorrow has a hard 10:50 call time and nine people to dress. Settle everything you can tonight."},{"kind":"warn","text":"Set out one passport and ₩70,000 cash tonight for the rental deposit."},{"kind":"warn","text":"Message the photographer tonight: rain plan, covered palace option, and a morning phone number."}]},{"id":"d7-dinner","start":"18:00","mins":75,"title":"Early dinner, early night","kind":"meal","status":"planned","who":"Everyone","detail":"Genuinely early. Tomorrow is the day the whole trip is photographed."}]},{"date":"2026-09-13","legId":"insa","title":"Hanbok, and the photographs","gist":"Hair, hanbok, and the 10:50 photo session at Gyeongbokgung. The one fixed morning.","pace":"Full · hard call time","weather":{"sky":"showers","hi":26,"lo":19,"note":"Showers in the model, on the one day of the trip with a paid, unmovable, outdoor booking. This is the single most weather-exposed thing on the itinerary and it is worth over-preparing for — see the photographer note on the 12th."},"note":"The one immovable morning of the trip. Nine people in hanbok, with hair and makeup, standing inside Heungnyemun Gate at 10:50. Everything before it is reverse-timed from it. The order matters and it is not the obvious one: makeup salons open at 08:00, hanbok shops do not open until 09:00, so makeup has to come first and the fitting has to start the minute the rental shop unlocks the door.","naps":[{"who":"7mo","start":"in the carrier, en route","end":""},{"who":"5mo","start":"in the carrier, en route","end":""},{"who":"Toddler","start":"14:45","end":"16:30"}],"doses":[{"id":"d8-bfast","start":"06:50","mins":40,"title":"Breakfast, in the room if it is faster","kind":"meal","status":"planned","who":"Everyone","detail":"The one early start left on the trip, and it is unavoidable: the salon opens at 08:00, the hanbok shop at 09:00, and the photographer's call time at 10:50 is paid and booked. Feed the children properly now — there is no good window again until after the shoot, and nothing staining goes near anyone once hanbok is on.","labels":[{"kind":"warn","text":"Feed first, dress second."},{"kind":"rest","text":"Warn everyone the night before: this breakfast starts before the usual 09:00."}]},{"id":"d8-toSalon","start":"07:35","end":"07:55","title":"Two taxis to the salon","kind":"transit","status":"planned","who":"Everyone","leaveBy":"07:35","detail":"Naver puts the hotel 1.1 km from the Gyeongbokgung cluster — 18 minutes and 1,719 steps on foot, four crosswalks, and the route is step-free, which matters with two strollers. That proximity is the whole reason the photo day sits in this leg. Take taxis anyway. You are moving nine people to a hard 08:00 booking and the walk is the first thing that slips.","where":"Beauty Palace Gyeongbokgung, or your chosen makeup salon","getting":"Two taxis from Nine Tree by Parnas Insadong. 1.1 km due west via Ujeongguk-ro, Yulgok-ro and Sajik-ro — Naver says 3 minutes driving at ₩4,800 a car, which is Seoul's base fare with no tolls. Two cars is roughly ₩9,600 total. [Naver Map, verified 27 August] Ask the front desk to book both cars the night before rather than hailing at 07:35 on a Sunday — it is more reliable than an app, and it takes the sign-up question off the table entirely on the one morning you cannot repeat.","source":"https://english.visitseoul.net/hotel/view/18185180","labels":[{"kind":"fall","text":"If taxis fail, walk 1.1 km in 18 minutes by 07:30, or take line 3 one stop from Anguk exit 6. Fare is ₩1,550."}]},{"id":"d8-hairmakeup","start":"08:00","end":"09:00","title":"Hair and makeup · first slot of the day","kind":"fixed","status":"planned","who":"Adults having it","whoSplit":true,"detail":"This has to happen before the hanbok, not alongside it, because the salon opens an hour earlier than the rental shop. Beauty Palace Gyeongbokgung opens 08:00 on Sundays and runs a 40-minute hanbok makeup and a 70-minute hanbok makeup with hair-up. Book the 40-minute service for everyone who wants it and run the chairs in parallel.","where":"Makeup salon in the Gyeongbokgung cluster","cost":"Per person, by service tier","source":"https://creatrip.com/en/spot/14538","labels":[{"kind":"warn","text":"Beauty Palace fits six at once. Book explicit staggered slots from 08:00 for nine people."},{"kind":"warn","text":"Closed Tuesdays. Sunday 13 September is fine, but don't move this to Tuesday."},{"kind":"verify","text":"Confirm how many artists work at 08:00. One artist can't finish four faces before 09:00."}]},{"id":"d8-toShop","start":"09:00","end":"09:10","title":"Walk to the hanbok shop","kind":"transit","status":"planned","who":"Everyone","leaveBy":"09:00","detail":"The salons and the rental shops are the same few streets around Gyeongbokgung Station Exit 4 and Jahamun-ro 2-gil. This is a short flat walk, not a journey.","where":"Hanbok rental, Gyeongbokgung Station Exit 4 cluster","source":"https://seohwahanbok.net/hanbok-rental/"},{"id":"d8-fitting","start":"09:10","end":"10:20","title":"Hanbok fitting · nine people","kind":"fixed","status":"planned","who":"Everyone","detail":"Seventy minutes against a 09:00 opening, walking in rather than reserving. Hanboknam is the pick — 4.7 across 4,426 reviews, the largest selection in the cluster, and 1.1 km from the hotel. It sits about 350 metres west of Gwanghwamun, so you pass the palace on the way over and only backtrack a short distance afterward. Order of dressing: grandparents, toddler, infants, then the adults who can dress themselves fastest.","where":"Hanbok rental shop","cost":"Around ₩24,000 for four hours or ₩32,000 all day, per person, at Seohwa's published rates","source":"https://seohwahanbok.net/hanbok-rental/","book":"Walking in, not reserving. A booking here does not buy queue priority, and the crowding complaints in this cluster are all about midday rather than the opening hour. Send Hanboknam one email before you fly — hanboknams@naver.com — asking two things: how many stylists work the 09:00 slot on Sunday 13 September, and that infant sizes are held for a 5-month-old and a 7-month-old. Hair runs about 20 minutes a head, one head at a time. Two stylists and the morning is comfortable; one stylist against three or four heads does not finish. All nine of you are renting, both babies included. Fallbacks if Hanboknam is shut or slammed: Seohwa at 137 Sajik-ro, Oneday in the same building's basement, or Haewadal on 0507-1315-7188.","labels":[{"kind":"warn","text":"Take the all-day tier. A four-hour rental from 09:10 expires at 13:10, during lunch."},{"kind":"warn","text":"Budget 20 minutes for each infant's hanbok change. There are two of them."},{"kind":"warn","text":"Email Hanboknam: confirm two stylists at opening. One stylist doing 15 to 20 minutes per head risks the 10:50 call time."},{"kind":"rest","text":"Arrive at opening. The early slot is calm, and crowds build later."},{"kind":"rest","text":"Send one non-makeup adult to Hanboknam at 08:55 to start paperwork and pull sizes."},{"kind":"warn","text":"Staff here may let you browse alone. Ask at the counter to be walked through the sizes."},{"kind":"verify","text":"Confirm Hanboknam can take nine renters in one slot, both babies included."}]},{"id":"d8-toPalace","start":"10:25","end":"10:45","title":"Walk to Heungnyemun Gate","kind":"transit","status":"planned","who":"Everyone","leaveBy":"10:25","detail":"Twenty minutes for a walk that takes five, because nine people in hanbok with two strollers do not move at walking pace. Aim to be standing at the meeting point at 10:45 with five minutes in hand.","where":"Gyeongbokgung · ticket and information area inside Heungnyemun Gate","getting":"Enter through Gwanghwamun Gate. The ticket and information area is inside Heungnyemun, the second gate — this is where official tours assemble and is what 'main ticket entrance' almost certainly means.","source":"https://royal.khs.go.kr/ENG/contents/E702000000.do?schGroupCode=gbg","fallback":"The escalation branch, decided now and not at 10:30: if the shop is running late, at 10:30 send the grandparents, the men and the toddler ahead on foot to hold the meeting point. Skip the last lip touch-up. Message the photographer at 10:20 with a realistic number rather than at 10:50 with an apology. Real drop-dead for the group is 11:00 — the photographer will wait ten minutes and will not wait thirty.","labels":[{"kind":"warn","text":"Guard performances run 10:00 for 20 minutes and 11:00 for 10 near Gwanghwamun and Heungnyemun. Budget the full walk."},{"kind":"warn","text":"Confirm the exact photographer meeting point and swap numbers. Gwanghwamun Gate and the ticket area are 150 metres apart."},{"kind":"fall","text":"Agree on the photographer's rain plan in advance: indoor palace halls, a covered colonnade, or a reschedule."}]},{"id":"d8-shoot","start":"10:50","end":"12:20","title":"Photography session at Gyeongbokgung","kind":"fixed","status":"booked","who":"Everyone","detail":"Meeting inside Heungnyemun Gate. Everyone in full hanbok enters the palace free — the rule covers traditional and modernised hanbok, and your parents are already free at 65 and over, as are all three children.","where":"Gyeongbokgung Palace","cost":"Admission ₩3,000 for adults 19–64, and free for anyone in qualifying hanbok","source":"https://royal.khs.go.kr/ENG/contents/E701000000.do","labels":[{"kind":"warn","text":"Free admission needs full hanbok: jeogori plus chima or baji. Partial outfits pay full price."},{"kind":"warn","text":"Shoot whole-group and grandparent frames first. The infants may only last 40 good minutes."},{"kind":"rest","text":"Find the nursing room by the information centre on arrival. It has a changing station, microwave, and sink."},{"kind":"warn","text":"Palace paths include gravel and rough stone. Use carriers once you're inside."}]},{"id":"d8-return","start":"12:30","end":"13:00","title":"Return the hanbok","kind":"admin","status":"planned","who":"Everyone","detail":"Back to the shop, change, collect your own clothes. Or keep them on through lunch if you took the full-day rental and everyone still has the energy."},{"id":"d8-lunch","start":"13:00","mins":75,"title":"Lunch near the palace","kind":"meal","status":"planned","who":"Everyone","detail":"Everyone will be hungry, hot, and finished. Somewhere close with chairs — do not go looking.","labels":[{"kind":"warn","text":"Book lunch. Sunday near Gyeongbokgung for nine without a reservation is risky."},{"kind":"warn","text":"Pick lunch somewhere that can absorb a toddler meltdown, and be ready to send half the group ahead."}]},{"id":"d8-rest","start":"14:30","end":"17:00","title":"Back to the hotel · everyone off duty","kind":"rest","status":"planned","who":"Everyone","detail":"The biggest morning of the trip earns the emptiest afternoon of the trip.","labels":[{"kind":"rest","text":"Protected rest block. Don't schedule into this."}]},{"id":"d8-dinner","start":"18:30","mins":90,"title":"A proper dinner","kind":"meal","status":"planned","who":"Everyone","detail":"The one meal of the trip worth booking properly. Table seating, private room if you can get one for nine.","labels":[{"kind":"verify","text":"Book a private room well in advance for nine people and three small children."}]}]},{"date":"2026-09-14","legId":"insa","title":"Mapo, and a market locals still use","gist":"A stream walk in the morning, Mangwon Market and Yeonnam-dong after the nap.","pace":"Medium","weather":{"sky":"sun","hi":29,"lo":20,"note":"Sunny and 29°C. Warm for a market at midday, which is part of why Mangwon sits at 16:30 — the arcade is covered, the heat has dropped, and the food stalls are at their best in the late afternoon."},"note":"An easy morning in Jongno, then west after the nap. Gwangjang has been dropped on purpose — it has become a queue for a tourist photograph rather than a market, and it is a genuinely hard room for infants. Mangwon is the version that still works: a real neighbourhood market where people do their shopping, two stops from Hongdae, with a flat riverside park and the Gyeongui Line park next door. Today is a Monday, which is the quietest possible night to be on this side of the city.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d9-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Late morning by design — the day's real event is dinner at Mangwon Market, and you do not want the group already tired by mid-afternoon."},{"id":"d9-cheonggyecheon","start":"10:15","end":"11:30","title":"Cheonggyecheon in the morning","kind":"outing","status":"planned","who":"Everyone","detail":"The sunken stream through the middle of the city, and a five-minute walk from the hotel door. Cool at water level, flat along the whole length, and genuinely pleasant before the heat arrives. Walk as far as you feel like and climb out at any bridge. This has moved from filler to the actual morning, because the afternoon is out in Mapo and today needs an easy start.","where":"Cheonggyecheon, five minutes from the hotel","source":"https://english.visitseoul.net/area/CheonggyecheonStream/ENP000034","fallback":"Turn around at any point. The whole stream runs parallel to the street above it, so there is no committed distance.","labels":[{"kind":"warn","text":"Most stream access is stairs. Find a ramped entrance before you commit with a stroller."}]},{"id":"d9-lunch","start":"12:00","mins":75,"title":"Lunch near the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Back in Jongno with time in hand. Eat properly here, because tonight's meal is standing up at a market."},{"id":"d9-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","labels":[]},{"id":"d9-tomapo","start":"15:45","end":"16:20","title":"Across to Mapo","kind":"transit","status":"planned","who":"Everyone","leaveBy":"15:45","detail":"West across the city to the Mangwon and Yeonnam side of Mapo-gu. Two vehicles for nine, or Line 6 if the group is feeling robust — Mangwon is two stops from Hongik University station.","where":"Mangwon-dong, Mapo-gu"},{"id":"d9-mangwon","start":"16:30","end":"18:00","title":"Mangwon Market — dinner, standing up","kind":"meal","status":"planned","who":"Everyone","detail":"This replaces Gwangjang, and it is a better fit in every way that matters to this group. Mangwon is a working neighbourhood market rather than a tourist destination — locals doing their actual shopping, prices that have not been rewritten for visitors, and a covered arcade that is wider and calmer than Gwangjang's aisles. The things to eat here are the fried chicken in sweet-and-sour glaze, tteokbokki, freshly fried mandu and the croquettes. Late afternoon is when it fills up and everything is hot.","where":"Mangwon Market, Mapo-gu · Mangwon station Line 6, exit 2","fallback":"If it is heaving, buy food and walk two minutes to Mangwon Hangang Park to eat it by the river.","labels":[{"kind":"warn","text":"Mangwon is covered but crowded. Take one stroller at most, use carriers, and expect to eat standing or in the park."},{"kind":"warn","text":"Bring cash. Some stalls take cards, but plenty don't."},{"kind":"verify","text":"Confirm the closing day before you go. Traditional markets often close Sunday or Monday, and today is Monday."}]},{"id":"d9-yeonnam","start":"18:15","end":"19:15","title":"Yeonnam-dong and the Gyeongui Line park","kind":"outing","status":"planned","who":"Everyone","detail":"A disused railway line turned into a long, thin park running through Yeonnam-dong, and the single most stroller-friendly thing in this half of the city — flat, straight, grassy, wide, and lined with low-key cafés and shops. It is the calm version of this neighbourhood, and it connects Mangwon to Hongdae on foot without ever putting you in Hongdae's crowds.","where":"Gyeongui Line Forest Park, Yeonnam-dong","getting":"About ten minutes by taxi from Mangwon Market, or three stops.","fallback":"Go straight back to the hotel after the market. This is a bonus, not a requirement, and nobody will mind.","labels":[]},{"id":"d9-hongdae","start":"19:15","end":"20:30","title":"Hongdae, for whoever still wants it","kind":"outing","status":"idea","who":"Adults who fancy it","whoSplit":true,"detail":"The main Hongdae streets are ten minutes' walk from the far end of the Yeonnam park — buskers, street food, record shops, and the densest concentration of late-opening anything in Seoul. Marked as an idea rather than a plan because it is loud, extremely crowded and the wrong environment for two infants at bedtime. One useful piece of luck: today is a Monday, which is by some distance the quietest night of the week here.","where":"Hongdae main street and Eoulmadang-ro","fallback":"Skip it entirely. Everyone with a child goes back to the hotel from Yeonnam and this simply does not happen.","labels":[{"kind":"warn","text":"Split up for Hongdae at 19:30. Send interested adults, and put everyone else in a car home."}]},{"id":"d9-back","start":"19:30","title":"Kids and grandparents back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · parents on duty","whoSplit":true,"leaveBy":"19:30","detail":"Thirty minutes back across town. Bedtime is late tonight by design, which is why tomorrow's morning starts indoors and slowly."}]},{"date":"2026-09-15","legId":"insa","title":"Children's clothes, Costco, and the skincare haul","gist":"Children's clothes at The Hyundai Seoul, Costco, then Myeongdong for skincare.","pace":"Medium · shopping","weather":{"sky":"cloud","hi":28,"lo":20,"note":"Mostly cloudy. Almost the whole day is indoors — department store, warehouse, Myeongdong — so this one is weather-independent by design. If the model turns wet, nothing here needs to move."},"note":"The dedicated shopping day, placed late so you are buying with a known suitcase situation rather than guessing. Namdaemun has been dropped for The Hyundai Seoul in Yeouido — better children's brands, air conditioning, nursing rooms, lifts and a food hall, which is worth more than market pricing when you are doing this with a toddler. Costco Yangpyeong is ten minutes from it, so the two pair on one trip. Myeongdong skincare in the afternoon. Gyeongbokgung is closed today, which costs you nothing since you have already been.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d10-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, and nothing lost by it — The Hyundai Seoul does not open its doors until 10:30, so an earlier start only buys you time standing outside a shut mall."},{"id":"d10-toyeouido","start":"10:10","end":"10:50","title":"Over to Yeouido","kind":"transit","status":"planned","who":"Shopping group","whoSplit":true,"leaveBy":"10:10","detail":"Line 5 runs directly from Jongno-3ga to Yeouido with no change, which is unusually civilised for this city. A taxi is about twenty-five minutes. Either way you arrive just after opening rather than at 11:30 with everyone else.","where":"The Hyundai Seoul, 108 Yeoui-daero, Yeongdeungpo-gu"},{"id":"d10-easy","start":"10:15","end":"12:00","title":"Slow morning for everyone else","kind":"rest","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Hotel, Insadong street, a café. The point of splitting today is that nobody has to endure a shopping trip they did not want, and Yeouido is a long way to drag a two-year-old for other people's errands."},{"id":"d10-hyundai","start":"10:55","end":"13:00","title":"The Hyundai Seoul · children's clothes","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"This replaces Namdaemun, and for this group it is not a close call. The Hyundai Seoul is the newest and most consistently well-reviewed department store in the city: a full children's floor with the Korean and international brands people actually fly home with, an indoor garden you can park a stroller in, proper nursing rooms, wide flat aisles, lifts everywhere, and a basement food hall good enough to be lunch. You will pay department-store prices rather than market prices — that is the trade, and with a toddler in tow it is the right one.","where":"The Hyundai Seoul, Yeouido · children's floor and the food hall","getting":"Line 5 to Yeouido, direct from Jongno-3ga.","cost":"Department-store pricing. Budget more per item than a market and fewer items.","fallback":"Lotte World Mall in Jamsil covers similar ground and you were already near it on the 10th. Starfield Hanam is bigger again but is outside Seoul and not worth the drive on a day this full.","labels":[{"kind":"warn","text":"Bring passports. Tax-free refund needs one, and the desks are in-store."},{"kind":"verify","text":"Confirm opening time before you leave. Department stores often open at 10:30, not 10:00."},{"kind":"rest","text":"Eat lunch in the building. The lower-level food hall can handle a group without a booking."}]},{"id":"d10-lunch","start":"12:00","mins":75,"title":"Lunch in Insadong for the hotel group","kind":"meal","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Close to the room and ahead of the nap. The shopping group is eating in The Hyundai's food hall at the same time, so there is no regroup to coordinate."},{"id":"d10-costco","start":"13:15","end":"14:45","title":"Costco Yangpyeong","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"Ten minutes from The Hyundai Seoul, which is the entire reason it sits on this day rather than any other. Yangpyeong is the closest warehouse to Yeouido and it is open 10:00 to 22:00. The Korean-specific things worth the trip are the own-brand seaweed, gim snacks, dried persimmon, honey butter almonds and the bulk skincare — none of which you can carry out of Olive Young at this price.","where":"Costco Yangpyeong, 156 Seonyu-ro, Yeongdeungpo-gu","getting":"About ten minutes by taxi from The Hyundai Seoul.","labels":[{"kind":"warn","text":"Bring your physical US Costco card. Membership is global, but the app can fail at Korean door scanners."},{"kind":"warn","text":"Korean Costco closes on the second and fourth Sunday. Tuesday is clear, but check before moving this to a weekend."},{"kind":"verify","text":"Confirm the card policy at the door. Carry enough cash for the basket in case your US card doesn't work."},{"kind":"warn","text":"Costco buys are bulky and heavy. Do the luggage reckoning tonight, not at the airport on the 18th."}]},{"id":"d10-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[]},{"id":"d10-myeongdong","start":"16:15","end":"18:00","title":"Myeongdong · skincare","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"The flagship Olive Young plus the surrounding brand stores, and a fresh shift is fine here — whoever did Yeouido and Costco has earned a sit down. This is the serious skincare stop of the trip: buy the volume here, not at the airport.","where":"Myeongdong","getting":"Ten minutes by taxi from the hotel, or two stops on Line 3 and a short walk.","labels":[{"kind":"verify","text":"Confirm the tax-free refund threshold and process. Bring your passport."},{"kind":"warn","text":"Pack all liquids, gels, and creams in checked bags tonight."}]},{"id":"d10-pack","start":"18:15","mins":45,"title":"First pack and a luggage reckoning","kind":"admin","status":"planned","who":"Adults","detail":"Tomorrow you move hotels, and today you bought department-store clothes, a Costco run and a skincare haul. Better to find out tonight that you need another suitcase than at the Incheon check-in desk on the 18th.","labels":[{"kind":"warn","text":"Buy the extra suitcase today if you need one. Don't leave this for Yeongjong or the airport."}]},{"id":"d10-dinner","start":"19:00","mins":75,"title":"Last Jongno dinner","kind":"meal","status":"planned","who":"Everyone","detail":"The last dinner in the city proper — from here it is the airport hotel. Pick the one thing someone said they wanted to eat again and go there.","labels":[{"kind":"warn","text":"Book dinner. This is the last easy meal nobody will want to improvise."}]}]},{"date":"2026-09-16","legId":"icn","title":"Out to the island","gist":"Check out, jjajangmyeon in Incheon Chinatown, then over the bridge to the resort.","pace":"Light · moving day","weather":{"sky":"showers","hi":27,"lo":20,"note":"Showers return for the Incheon leg. A wet moving day is a nuisance rather than a problem, but Chinatown involves walking between the vehicle and the restaurant, so keep the umbrellas at the top of a bag."},"note":"A clean moving day with no medical appointment stacked on top of it — which is the whole point. The mole removal sits on the 17th, so today is nothing but checking out, crossing the city, and arriving somewhere with a pool. The one addition is lunch: Incheon invented jjajangmyeon, and the original Chinatown is close enough to the bridge that you can eat there on the way rather than making a separate trip. Check-in is 15:00 at both Yeongjong properties, so the afternoon nap needs a room that is already yours.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"Toddler","start":"14:00","end":"16:00"}],"doses":[{"id":"d11-bfast","start":"09:00","mins":60,"title":"Breakfast and final pack","kind":"meal","status":"planned","who":"Everyone","detail":"Checkout is 11:00 and the transfer is not until 11:30, so a nine o'clock breakfast still leaves an unhurried hour. Pack the night before and this morning is genuinely easy."},{"id":"d11-lastinsa","start":"10:05","end":"10:50","title":"Last walk through Insadong","kind":"outing","status":"planned","who":"Anyone who wants it","whoSplit":true,"detail":"Bags are packed, checkout is not until 11:00, and Ssamziegil is four minutes from the door. This is the last unhurried stretch on the mainland — use it for the small souvenirs nobody has bought yet, or skip it entirely and sit in the lobby.","where":"Insadong-gil, four minutes from the hotel","fallback":"Skipping this costs nothing. The airport has a duty-free the size of a town.","labels":[{"kind":"rest","text":"This walk is optional. Nobody has to leave the hotel this morning."}]},{"id":"d11-checkout","start":"11:00","mins":30,"title":"Check out of Insadong","kind":"admin","status":"planned","who":"Everyone","detail":"Sweep the rooms for the small things that get left: bottle parts, chargers, one shoe, the toddler's specific cup. Ask the desk to hold the bags if you want a last hour in Insadong."},{"id":"d11-transfer","start":"11:30","end":"12:30","title":"Out west to Incheon Chinatown","kind":"transit","status":"planned","who":"Everyone","leaveBy":"11:30","detail":"Roughly an hour from Jongno to Incheon Station on the mainland. This is not a detour so much as a pause on the way — Chinatown sits by the Yeongjong Bridge approach, so you stop, eat, and carry on over the water to the resort. Good news on the name confusion at the far end: Hyatt Regency Incheon Paradise City is a single, real hotel — the former west tower of Grand Hyatt Incheon, rebranded in 2025 and sitting inside the Paradise City resort complex. So you get Hyatt loyalty and the resort's facilities in one booking.","where":"Incheon Chinatown, Jung-gu · then Yeongjong Island","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Book the transfer with three car seats, a Chinatown stop, and waiting time."},{"kind":"verify","text":"Confirm the driver will hold your luggage during lunch. If not, move jjajangmyeon to the 17th."},{"kind":"verify","text":"Check your confirmation says Hyatt Regency, not Hotel Paradise or Art Paradiso."}]},{"id":"d11-jjajang","start":"12:35","end":"13:45","title":"Jjajangmyeon in the place that invented it","kind":"meal","status":"planned","who":"Everyone","detail":"Incheon's Chinatown is where jjajangmyeon was created, by Shandong migrants working the port in the late 1800s, and eating it here is a genuinely different thing from eating it anywhere else. Junghwaru is the pick for this group: well reviewed, large enough to seat nine, and with waits that run ten to twenty minutes rather than the hour that the two famous places routinely hit. Today is a Wednesday, which is the single biggest thing working in your favour here — weekend waits in Chinatown are punishing.","where":"Junghwaru, Incheon Chinatown · near Incheon Station","cost":"Roughly ₩8,000–₩12,000 for jjajangmyeon, more for tangsuyuk to share.","fallback":"Gonghwachun is the original house and has the museum-piece interior, but the food is widely described as ordinary and the wait as long. Sinseungban is the locals' choice on taste. Both are worth knowing about if Junghwaru is closed.","labels":[{"kind":"warn","text":"Call ahead for nine. Chinatown lunch spots may not hold a walk-in table this size."},{"kind":"warn","text":"Jjajangmyeon stains permanently. Bib everyone under three, and skip nice clothes."},{"kind":"verify","text":"Confirm the closing day. Some Chinatown restaurants close one weekday a month."}]},{"id":"d11-toresort","start":"13:50","end":"14:20","title":"Over the bridge to Yeongjong","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:50","detail":"Twenty-five minutes over the water to Paradise City. All three children will very likely sleep in the car, which is exactly what you want given check-in is not until 15:00 anyway.","where":"Hyatt Regency Incheon Paradise City, Yeongjong Island","labels":[{"kind":"rest","text":"Treat this drive as the first half of nap. Don't wake anyone at the door."}]},{"id":"d11-checkin","start":"14:20","mins":40,"title":"Check in","kind":"rest","status":"planned","who":"Everyone","detail":"The hotel sits inside the Paradise City complex, so once you are in you do not need to leave it again before the flight.","labels":[{"kind":"warn","text":"Standard check-in is 15:00. Book one room from the night of the 15th so kids can nap on arrival."}]},{"id":"d11-nap","start":"14:45","end":"16:00","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","detail":"Shorter than usual and partly already served by the drive over the bridge. Do not stretch it — tonight is the last chance to swim.","labels":[]},{"id":"d11-resort","start":"16:15","end":"18:00","title":"Wonderbox, or just the room","kind":"outing","status":"planned","who":"Everyone","detail":"Indoors and shaded by design today. Wonderbox is Paradise City's indoor family theme park and is the right size and temperature for a two-year-old — carousel scale, not roller-coaster scale. The complex also has extensive public art you can walk through for free. This is now your one clear water day: the mole removal sits on the 17th, so nobody is under a no-swimming restriction yet.","where":"Paradise City complex, on site","source":"https://www.p-city.com/front/wonderbox/overview","fallback":"The hotel room and a long bath is a perfectly good version of this.","labels":[{"kind":"rest","text":"Swim today if anyone wants to. Tomorrow's procedure closes the water for seven to ten days."},{"kind":"verify","text":"Confirm Wonderbox hours and whether the hotel bundles admission."},{"kind":"warn","text":"Cimer refuses children under seven. It only works as an adults-only split shift."},{"kind":"rest","text":"Ask for the 50% guest coupon. The ₩60,000 aqua pass drops to about ₩30,000, and the aqua zone shuts at 19:00."}]},{"id":"d11-dinner","start":"18:30","mins":75,"title":"Dinner at the resort","kind":"meal","status":"planned","who":"Everyone","detail":"There is very little walkable off-site dining out here. Plan to eat in.","labels":[{"kind":"verify","text":"Confirm on-site restaurant options and whether any take a booking for nine."}]}]},{"date":"2026-09-17","legId":"icn","title":"The empty day","gist":"Mole removal at 10:00, back by 11:00, and then deliberately nothing.","pace":"Light — deliberately","weather":{"sky":"showers","hi":28,"lo":21,"note":"Showers again. This matters less than any other rain day of the trip: the mole removal is indoors, the resort is indoors, and staying out of strong sun afterwards is a medical instruction anyway. Cloud is genuinely helpful today."},"note":"The last full day, and outside one confirmed morning appointment it is intentionally almost blank. Twelve days in with two infants, a toddler and two people in their seventies, the most valuable thing you can schedule is nothing. Rene Clinic opens at 10:00 and you have the first slot of the day, so the whole errand is done and back at the resort by 11:00. Pack in the afternoon so tomorrow morning is calm.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d12-bfast","start":"08:15","mins":60,"title":"Early breakfast, clinic party only","kind":"meal","status":"planned","who":"Whoever is having it","whoSplit":true,"detail":"The 10:00 slot is the first appointment of the day and Rene Clinic is eight to twelve minutes away rather than five, so this one breakfast starts at 08:15. It is still unhurried — an hour at the table and you are walking out at 09:30 with time to spare for first-visit paperwork.","labels":[{"kind":"rest","text":"Only the clinic party eats early. Everyone else keeps the 09:00 breakfast."}]},{"id":"d12-bfast-rest","start":"09:00","mins":75,"title":"Breakfast, no rush","kind":"meal","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Nobody else has to be up early today. Last full morning of the trip, the pool is right there, and there is nothing on the schedule until lunch."},{"id":"d12-toclinic","start":"09:30","end":"09:45","title":"Out to the clinic","kind":"transit","status":"planned","who":"Whoever is having it","whoSplit":true,"leaveBy":"09:30","detail":"Rene Clinic sits in the Haneul-dosi (Sky City) district rather than the Unseo cluster, which makes it eight to twelve minutes by taxi instead of five — still on-island, so no toll. Leaving at 09:30 for a 10:00 appointment gives you the drive plus fifteen minutes for first-visit paperwork, which a foreign patient will need.","where":"SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu — Haneul-dosi, about 8–12 minutes from Paradise City","cost":"About ₩7,000–₩10,000 by taxi, on-island, no toll","fallback":"If no taxi materialises at the door, the resort front desk will call one. Do not plan on the Incheon Airport Maglev — it was reclassified as a tourist train, runs 10:00 to 17:00 Tuesday to Sunday only, and does not go near Haneul-dosi.","source":"https://www.incheon.go.kr/IC010205/view?repSeq=DOM_0000000013303245","labels":[{"kind":"verify","text":"Confirm the taxi the night before. Show the driver: 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층."}]},{"id":"d12-mole","start":"10:00","end":"10:45","title":"Mole removal · Rene Clinic","kind":"medical","status":"booked","who":"Whoever is having it","whoSplit":true,"detail":"Confirmed for 10:00, the first slot of the day. Placed on the last full day deliberately: doing it here means you carry no healing wound through twelve days of Seoul heat, sun, and markets, and it leaves Wednesday's water park genuinely usable instead of theoretically off-limits. The cost of the placement is that you leave the country roughly thirty hours later — fine for a routine shave or laser removal, and the thing to reconsider if the doctor wants to cut deeper.","where":"Rene Clinic (르네의원), 3F Rooms 304–308, SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu, Incheon · 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층 304–308호 · +82 32-716-5716 · Thursday hours 10:00–20:00 with a 13:00–14:00 lunch break","cost":"Not published. Incheon rates generally run ₩10,000–₩20,000 for a small or medium flat mole, typically 10–30% below Gangnam, with multiple moles often priced as a package. Add roughly ₩30,000–₩60,000 if anything goes to biopsy. Confirm the price at the desk before the procedure starts.","source":"https://rene-clinic.com/","fallback":"If Rene cancels, Yes Dermatology (032-752-9730) in the Unseo cluster is five minutes from the resort and also opens 10:00 Thursday, with two board-certified dermatologists. Yeongjong Central Dermatology (032-746-3200) and Doctors Dermatology Yeongjong (032-710-2346) are in the same cluster on the same hours.","labels":[{"kind":"warn","text":"Ask whether anything goes to pathology. If the doctor wants a biopsy, defer to Seattle."},{"kind":"warn","text":"If the doctor recommends sutures instead of a shave, don't do it 30 hours before a ten-hour flight."},{"kind":"verify","text":"Ask if Dr. Moon Seong-ho (문성호) is a 피부과 전문의. Check akd.or.kr/dermatologist/verify."},{"kind":"verify","text":"Ask for aftercare instructions in English, in writing. Use the hotel concierge by phone if needed."},{"kind":"warn","text":"Buy dressings, ointment, and silicone gel before you leave the clinic."},{"kind":"warn","text":"No swimming, sauna, or hot tub for seven to ten days from today."},{"kind":"rest","text":"Photograph the wound with a ruler today and tomorrow for a Seattle dermatologist."},{"kind":"verify","text":"Confirm the clinic takes foreign cards. Carry enough cash if it doesn't."},{"kind":"rest","text":"The clinic closes 13:00–14:00 for lunch if you need to call back the same day."}]},{"id":"d12-morning","start":"10:15","end":"12:00","title":"Resort morning, whatever anyone feels like","kind":"rest","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Pool for whoever can, grounds for whoever wants, room for whoever needs it. No group activity, and no waiting around for the clinic party — they are back by 11:00.","labels":[]},{"id":"d12-back","start":"10:45","end":"11:00","title":"Back to the resort","kind":"transit","status":"planned","who":"Whoever is having it","whoSplit":true,"detail":"Ask the clinic to call the return taxi before you walk out. Ten minutes later you are back, and the resort morning is still going."},{"id":"d12-lunch","start":"12:15","mins":60,"title":"Lunch on site","kind":"meal","status":"planned","who":"Everyone","detail":"Eat inside the complex. This is the last full day and nobody needs a taxi for lunch."},{"id":"d12-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[]},{"id":"d12-pack","start":"15:30","end":"17:00","title":"Pack properly","kind":"admin","status":"planned","who":"Adults","detail":"All the skincare into checked bags. Formula, milk, snacks, and a full change of clothes per child into the cabin bag. Passports and boarding passes somewhere one person is responsible for.","labels":[{"kind":"warn","text":"Pack every Myeongdong liquid and gel in checked luggage before you reach the airport."}]},{"id":"d12-outing","start":"16:00","end":"17:30","title":"Sunset somewhere near the water","kind":"outing","status":"idea","who":"Whoever wants it","whoSplit":true,"detail":"Yeongjong has west-facing coast and the sunsets are the reason people stay out here. Late afternoon rather than midday keeps it off anyone's healing skin.","fallback":"Drop it without a second thought if the day has been enough.","labels":[{"kind":"verify","text":"Confirm sunset time and a viewpoint a short taxi ride from the hotel."}]},{"id":"d12-dinner","start":"18:30","mins":90,"title":"Last dinner","kind":"meal","status":"planned","who":"Everyone","detail":"Twelve days, nine people, everybody still speaking to each other. Book something good."}]},{"date":"2026-09-18","legId":"icn","title":"Home","gist":"Last breakfast, an early lunch, and KE041 home at 16:40. The airport is 15 minutes away.","pace":"Travel","weather":{"sky":"showers","hi":29,"lo":21,"note":"Showers on departure day. Build in extra time for the drive to the terminal — it is short, but a wet Friday morning at ICN with nine people and a luggage trolley convoy is not the moment to be optimistic about traffic."},"note":"The one genuine advantage of staying on Yeongjong Island: the airport is fifteen minutes away instead of ninety. A calm morning, an early lunch, and a departure that does not start at dawn.","naps":[{"who":"All three","start":"on board","end":"eventually"}],"doses":[{"id":"d13-bfast","start":"09:00","mins":60,"title":"Last breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, like the rest of the trip. The car to Terminal 2 does not leave until 13:00, so there is room for a proper last meal without anyone watching a clock."},{"id":"d13-woundcheck","start":"10:15","mins":15,"title":"Wound check before the flight","kind":"medical","status":"planned","who":"Whoever had it removed","whoSplit":true,"detail":"About twenty-four hours on. Look at it in good daylight, change the dressing, and photograph it with a ruler in frame — that photo is what a Seattle dermatologist will compare against. Then dress it clean for the flight, because cabin air is dry and ten hours is a long time.","fallback":"If it looks wrong — spreading redness, heat, or weeping that will not stop — call Rene Clinic on +82 32-716-5716 the moment they open at 10:00, not from the airport. You are ten minutes from them this morning and you will be nine thousand kilometres away tonight. Even a 10:00 call leaves three hours before the car leaves.","labels":[{"kind":"warn","text":"Pack ointment and spare dressings in your cabin bag. Redress it once mid-flight."},{"kind":"rest","text":"Take the second wound photo. Use the same ruler and light if you can."}]},{"id":"d13-morning","start":"10:30","end":"11:45","title":"Slow morning, bags down","kind":"rest","status":"planned","who":"Everyone","detail":"Checkout is usually 11:00. Store the bags and use the lobby until you leave."},{"id":"d13-lunch","start":"11:45","mins":60,"title":"Early lunch before the airport","kind":"meal","status":"planned","who":"Everyone","detail":"Eat properly now. Airside with nine people is not where you want to be solving lunch."},{"id":"d13-toAirport","start":"13:00","end":"13:30","title":"To Incheon Terminal 2","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:00","detail":"About twenty minutes from the hotel to Terminal 2, so you are checking in around 13:30 for a 16:40 departure. With three car seats to check, a stroller to tag, and tax-free refunds to claim, three hours is the right number rather than a generous one.","where":"ICN Terminal 2 · Korean Air departures","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Korean Air international check-in closes at 15:40. That's the real deadline."},{"kind":"warn","text":"Claim tax-free refunds before security. Afternoon desk queues can be bad."},{"kind":"verify","text":"Paradise City's Terminal 2 shuttle is less frequent. Book a private van for nine people with luggage."}]},{"id":"d13-ke041","start":"16:40","title":"KE041 · Incheon to Seattle","kind":"fixed","status":"booked","who":"Everyone","detail":"Arrives Seattle 10:40 the same day, 18 September. You land before you took off, which is the only good thing about flying east.","where":"ICN → SEA"},{"id":"d13-molealt","start":"Only if Rene cancels","title":"The Friday-morning fallback","kind":"medical","status":"idea","who":"Whoever is having it","whoSplit":true,"detail":"Thursday 10:00 at Rene Clinic is confirmed, so this is now a cancellation fallback rather than a live option — keep it only because a clinic can call on Wednesday night. The math still works: Yeongjong clinics open at 10:00, the procedure runs thirty to forty-five minutes for one to three moles, and the car to Terminal 2 leaves at 13:00. A 10:00 appointment in the Unseo cluster has you back at the hotel around 10:55 with two hours to spare.","where":"Unseo-dong, five minutes away. Yes Dermatology (032-752-9730) and Yeongjong Central (032-746-3200) both open 10:00 Friday, and TheYul in Cheongna opens 10:00 Friday too if you need a third. Rene itself is open 10:00–20:00 Friday if the cancellation is yours rather than theirs.","fallback":"If the only Friday slot offered is after 11:00, decline it and have the removal done in Seattle instead. No mole is worth a missed flight with nine people.","labels":[{"kind":"warn","text":"For the 10:00 fallback appointment, eat at 08:15 and walk out by 09:30."},{"kind":"warn","text":"Friday means no wound check before the ten-hour flight. That's why Thursday was booked."},{"kind":"rest","text":"Keep the wound covered with the hydrocolloid patch, and reapply ointment right before boarding."},{"kind":"warn","text":"Korean Air check-in closes at 15:40. Leaving the hotel at 13:00 gives a buffer, not endless time."}]}]}],"overlayUpdatedAt":null};</script>
<script type="module">
/* Seoul trip — dispensing strip renderer.
   Small hand-rolled DOM builder; no framework, no build step. */

const $ = (sel, root = document) => root.querySelector(sel);

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* Pictograms drawn in the label's own grammar: 1.5px strokes, blunt caps,
   the shapes a dispensing warning sticker actually uses. */
const ICON = {
  warn: 'M8 1.6 15 14H1L8 1.6Z M8 6v3.6 M8 11.6h.01',
  rest: 'M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6 5.8 5.8 0 1 0 13.4 9.6Z',
  verify: 'M8 14.5A6.5 6.5 0 1 0 8 1.5a6.5 6.5 0 0 0 0 13Z M6.2 6.1a1.9 1.9 0 0 1 3.7.6c0 1.3-1.9 1.7-1.9 1.7 M8 11.4h.01',
  fall: 'M2.5 4.5h11 M2.5 8h7 M2.5 11.5h9 M12 10.5l2 1.5-2 1.5',
  pin: 'M8 14.5s5-4.4 5-8a5 5 0 1 0-10 0c0 3.6 5 8 5 8Z M8 7.6a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z',
  sun: 'M8 11.5A3.5 3.5 0 1 0 8 4.5a3.5 3.5 0 0 0 0 7Z M8 1.5v1.4 M8 13.1v1.4 M14.5 8h-1.4 M2.9 8H1.5 M12.6 3.4l-1 1 M4.4 11.6l-1 1 M12.6 12.6l-1-1 M4.4 4.4l-1-1',
  cloud: 'M4.7 12.4h6.6a2.9 2.9 0 0 0 .3-5.8 4 4 0 0 0-7.7.9 2.5 2.5 0 0 0 .8 4.9Z',
  rain: 'M4.9 10.2h6.3a2.7 2.7 0 0 0 .3-5.4 3.8 3.8 0 0 0-7.3.9 2.4 2.4 0 0 0 .7 4.5Z M5.9 12.1v2.2 M8 12.5v2.2 M10.1 12.1v2.2',
  showers: 'M4.9 10.2h6.3a2.7 2.7 0 0 0 .3-5.4 3.8 3.8 0 0 0-7.3.9 2.4 2.4 0 0 0 .7 4.5Z M6.4 12.1l-1 2.3 M8.5 12.1l-1 2.3 M10.6 12.1l-1 2.3',
  drizzle: 'M4.9 10.2h6.3a2.7 2.7 0 0 0 .3-5.4 3.8 3.8 0 0 0-7.3.9 2.4 2.4 0 0 0 .7 4.5Z M5.9 12.4v.9 M8 13.1v.9 M10.1 12.4v.9',
  travel: 'M1.6 9 14.4 4.6l-1.5 3.6-3.2 1.1-1.5 4-1.4-2.9-3.1 1.1L1.6 9Z',
};

const SKY = {
  sun:     { icon: "sun",     label: "Sunny" },
  cloud:   { icon: "cloud",   label: "Cloudy" },
  rain:    { icon: "rain",    label: "Rain" },
  showers: { icon: "showers", label: "Showers" },
  drizzle: { icon: "drizzle", label: "Mist and drizzle" },
  travel:  { icon: "travel",  label: "In the air" },
};

function icon(name, size = 14) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.5");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", ICON[name] || ICON.warn);
  svg.append(p);
  return svg;
}

/* ---------------- time helpers ---------------- */

const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const parseISO = (d) => {
  const [y, m, dd] = d.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, dd));
};

const dowOf = (d) => DOW[parseISO(d).getUTCDay()];
const dayNum = (d) => parseISO(d).getUTCDate();
const monOf = (d) => MON[parseISO(d).getUTCMonth()];

const toMin = (hhmm) => {
  if (!hhmm) return null;
  const [h1, m1] = hhmm.split(":").map(Number);
  return h1 * 60 + m1;
};

const fmtDur = (mins) => {
  if (!mins) return null;
  const hrs = Math.floor(mins / 60);
  const rem = mins % 60;
  if (hrs && rem) return `${hrs}h ${rem}m`;
  if (hrs) return `${hrs}h`;
  return `${rem}m`;
};

/** Current wall-clock date and time in Seoul, regardless of the host's zone. */
function seoulNow() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t)?.value ?? "00";
  return {
    date: `${get("year")}-${get("month")}-${get("day")}`,
    minutes: Number(get("hour")) * 60 + Number(get("minute")),
    clock: `${get("hour")}:${get("minute")}`,
  };
}

/* ---------------- state ---------------- */

const state = { trip: null, day: null, view: "day", sheet: null };
let lastOrigin = null;

const LS_KEY = "seoul-2026-09/local";
function readLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function writeLocal(v) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch { /* private mode */ }
}
function withLocal(seed) {
  const ov = readLocal();
  if (!Object.keys(ov).length) return seed;
  return {
    ...seed,
    days: seed.days.map((d) => ({
      ...d,
      doses: d.doses.map((x) => (ov[x.id] ? { ...x, ...ov[x.id] } : x)),
    })),
  };
}

async function load() {
  state.trip = withLocal(window.__TRIP__);
  const now = seoulNow();
  const dates = state.trip.days.map((d) => d.date);
  const inTrip = dates.includes(now.date);
  state.day = inTrip ? now.date : dates[0];
  state.view = inTrip ? "day" : "overview";
  render();
}

async function patchDose(id, patch) {
  const ov = readLocal();
  ov[id] = { ...(ov[id] || {}), ...patch };
  writeLocal(ov);
  state.trip = withLocal(window.__TRIP__);
  render();
}

const currentDay = () => state.trip.days.find((d) => d.date === state.day);
const legOf = (day) => state.trip.legs.find((l) => l.id === day.legId);

/** Every dose in the trip that carries a caution or an unverified fact. */
function allFlags() {
  const out = [];
  for (const day of state.trip.days) {
    for (const dose of day.doses) {
      for (const label of dose.labels || []) {
        if (label.kind === "warn" || label.kind === "verify") out.push({ day, dose, label });
      }
    }
  }
  return out;
}

/* ---------------- render ---------------- */

function render() {
  const root = $("#app");
  const body =
    state.view === "index" ? renderIndex() :
    state.view === "overview" ? renderOverview() :
    renderDay();
  root.replaceChildren(
    renderEnvelope(),
    renderRail(),
    body,
  );
  const flags = allFlags();
  const existing = $(".fab");
  if (existing) existing.remove();
  if (flags.length) document.body.append(renderFab(flags.length));
  if (state.sheet) openSheet(state.sheet);
}

function renderEnvelope() {
  const trip = state.trip;
  const now = seoulNow();
  const inTrip = trip.days.some((d) => d.date === now.date);

  return h("header", { class: "envelope" },
    h("div", { class: "envelope__top" },
      h("button", {
        class: "envelope__mark",
        "aria-label": "Trip summary",
        onclick: () => { state.view = "overview"; render(); },
      },
        trip.dispensedBy,
        h("b", {}, trip.title),
      ),
      h("div", { class: "envelope__count" },
        inTrip ? "Seoul now" : "Seoul time",
        h("b", { class: "u-mono" }, now.clock),
      ),
    ),
    h("div", { class: "legs", role: "tablist", "aria-label": "Trip legs" },
      trip.legs.map((leg) => {
        const selected = currentDay() && currentDay().legId === leg.id && state.view === "day";
        return h("button", {
          class: "leg", role: "tab", "aria-selected": String(!!selected),
          onclick: () => { state.view = "day"; state.day = leg.firstDay; render(); },
        },
          h("span", { class: "leg__n" }, `RX ${leg.n}`),
          h("span", { class: "leg__name" }, leg.short),
          h("span", { class: "leg__dates" }, leg.range),
        );
      }),
    ),
  );
}

function renderRail() {
  const rail = h("div", { class: "rail", role: "tablist", "aria-label": "Days" });
  const now = seoulNow();
  rail.append(h("button", {
    class: "day-tab day-tab--all",
    role: "tab", "aria-selected": String(state.view === "overview"),
    "aria-label": "Whole trip on one page",
    onclick: () => { state.view = "overview"; render(); },
  },
    h("span", { class: "day-tab__dow" }, "All"),
    h("span", { class: "day-tab__d day-tab__d--all" }, "days"),
  ));
  for (const day of state.trip.days) {
    const selected = day.date === state.day && state.view === "day";
    const hasFixed = day.doses.some((d) => d.status === "booked" && d.kind === "fixed");
    const hasWarn = day.doses.some((d) => (d.labels || []).some((l) => l.kind === "warn"));
    rail.append(h("button", {
      class: `day-tab${day.date === now.date ? " day-tab--today" : ""}`,
      role: "tab", "aria-selected": String(selected),
      "aria-label": `${dowOf(day.date)} ${dayNum(day.date)} ${monOf(day.date)} — ${day.title}`,
      onclick: () => { state.view = "day"; state.day = day.date; render(); },
    },
      h("span", { class: "day-tab__dow" }, dowOf(day.date)),
      h("span", { class: "day-tab__d" }, String(dayNum(day.date))),
      hasFixed ? h("span", { class: "day-tab__pin" })
        : hasWarn ? h("span", { class: "day-tab__pin day-tab__pin--warn" }) : null,
    ));
  }
  queueMicrotask(() => {
    const active = rail.querySelector('[aria-selected="true"]');
    if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
  });
  return rail;
}

function renderDay() {
  const day = currentDay();
  const leg = legOf(day);
  const now = seoulNow();
  const isToday = day.date === now.date;

  const scroll = h("div", { class: "strip-scroll", id: "scroll" });

  scroll.append(
    h("div", { class: "day-head" },
      h("div", { class: "day-head__meta" },
        h("span", {}, `Day ${state.trip.days.indexOf(day) + 1} of ${state.trip.days.length}`),
        h("span", { class: "sep" }, "·"),
        h("span", {}, `${dowOf(day.date)} ${dayNum(day.date)} ${monOf(day.date)}`),
        isToday ? [h("span", { class: "sep" }, "·"), h("span", { style: { color: "var(--red)" } }, "Today")] : null,
      ),
      h("h1", {}, day.title),
      h("p", { class: "day-head__base" }, icon("pin", 13), leg.hotel),
    ),
    h("section", { class: "directions", "aria-label": "Directions for the day" },
      h("div", { class: "directions__label" },
        h("span", {}, "Directions"),
        h("span", {}, day.pace),
      ),
      h("p", {}, day.note),
      day.naps?.length
        ? h("div", { class: "directions__naps" },
            day.naps.map((n) => h("span", { class: "nap-chip" },
              icon("rest", 12), n.who, h("time", {}, n.end && n.end !== "—" ? `${n.start}–${n.end}` : n.start))))
        : null,
    ),
    renderConditions(day),
  );

  const strip = h("div", { class: "strip" });
  let nowPlaced = !isToday;

  day.doses.forEach((dose, i) => {
    if (!nowPlaced && toMin(dose.start) > now.minutes) {
      strip.append(h("div", { class: "now-rule" }, h("span", { class: "now-rule__tag" }, `NOW ${now.clock}`)));
      nowPlaced = true;
    }
    if (i > 0) strip.append(h("div", { class: "perf", "aria-hidden": "true" }));
    strip.append(renderSachet(dose, i, day));
  });

  scroll.append(strip);
  return scroll;
}

function renderConditions(day) {
  const w = day.weather;
  if (!w) return null;
  const sky = SKY[w.sky] || SKY.cloud;
  const severe = w.sky === "rain" || w.sky === "showers";

  return h("section", {
      class: `conditions${severe ? " conditions--wet" : ""}`,
      "aria-label": "Weather outlook for the day",
    },
    h("div", { class: "conditions__head" },
      h("span", { class: "conditions__term" }, "Storage conditions"),
      h("span", { class: "conditions__read" },
        h("span", { class: "conditions__ico" }, icon(sky.icon, 15)),
        h("span", { class: "conditions__sky" }, sky.label),
        w.hi != null
          ? h("span", { class: "conditions__temp" },
              h("b", {}, `${w.hi}°`), h("span", { class: "conditions__slash" }, "/"), h("i", {}, `${w.lo}°`))
          : null,
      ),
    ),
    h("p", { class: "conditions__note" }, w.note),
    h("p", { class: "conditions__caveat" },
      icon("verify", 12),
      h("span", {}, state.trip.weatherCaveat ||
        "Long-range statistical model — not a forecast. Re-check three days out."),
    ),
  );
}

function renderSachet(dose, i, day) {
  const done = !!dose.done;
  const cls = ["sachet", `sachet--${dose.kind}`, dose.status === "idea" && "sachet--idea",
    dose.status === "booked" && "sachet--stamped", done && "sachet--done"]
    .filter(Boolean).join(" ");

  const span = dose.end ? `${dose.start}–${dose.end}` : fmtDur(dose.mins);

  return h("button", {
    class: cls, "data-adv": true, style: { "--i": i },
    "aria-label": `${dose.start} ${dose.title}. Open details.`,
    onclick: (e) => { state.sheet = dose.id; openSheet(dose.id, e.currentTarget); },
  },
    h("div", { class: "sachet__body" },
      h("div", { class: "sachet__head" },
        h("span", { class: "sachet__time" }, dose.start),
        span ? h("span", { class: "sachet__span" }, span) : null,
        h("span", { class: "sachet__seq" }, `${String(i + 1).padStart(2, "0")}/${String(day.doses.length).padStart(2, "0")}`),
      ),
      h("div", { class: "sachet__title" }, dose.title),
      dose.detail ? h("p", { class: "sachet__detail" }, dose.detail) : null,
      (dose.leaveBy || dose.who) ? h("div", { class: "sachet__foot" },
        dose.leaveBy ? h("span", { class: "leaveby" }, `Leave by ${dose.leaveBy}`) : null,
        dose.who ? h("span", { class: `who${dose.whoSplit ? " who--split" : ""}` }, dose.who) : null,
      ) : null,
      dose.labels?.length ? h("div", { class: "labels" },
        dose.labels.map((l) => h("span", { class: `label label--${l.kind}` }, icon(l.kind === "rest" ? "rest" : l.kind === "verify" ? "verify" : l.kind === "fall" ? "fall" : "warn", 13), l.text)),
      ) : null,
    ),
    dose.status === "booked" ? h("span", { class: "stamp", "aria-hidden": "true" }, h("b", {}, "조제"), "BOOKED") : null,
  );
}

/* ---------------- expanded sachet ---------------- */

const SEAL_VAR = {
  fixed: "var(--red)", rest: "var(--blue)", meal: "var(--kraft)", medical: "var(--green)",
  transit: "color-mix(in srgb, var(--blue) 52%, var(--kraft))",
  outing: "color-mix(in srgb, var(--kraft) 70%, var(--red))",
  shop: "color-mix(in srgb, var(--kraft) 55%, var(--ink))",
  admin: "color-mix(in srgb, var(--ink) 38%, var(--film))",
  idea: "color-mix(in srgb, var(--ink) 22%, transparent)",
};

function openSheet(id, origin) {
  closeSheet(false);
  let dose = null, day = null;
  for (const d of state.trip.days) {
    const found = d.doses.find((x) => x.id === id);
    if (found) { dose = found; day = d; break; }
  }
  if (!dose) return;
  state.sheet = id;
  lastOrigin = origin || null;

  const backdrop = h("div", { class: "sheet-backdrop", onclick: () => closeSheet() });
  const sheet = h("div", {
    class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": dose.title, tabindex: "-1",
    style: { "--seal": SEAL_VAR[dose.kind] || "var(--film-edge)" },
  },
    h("div", { class: "sheet__grip" }),
    h("div", { class: "sheet__seal", "aria-hidden": "true" }),
    h("div", { class: "sheet__body" },
      h("div", { class: "sheet__head" },
        h("span", { class: "sheet__time" }, dose.start),
        dose.end ? h("span", { class: "sachet__span" }, `→ ${dose.end}`) : null,
        dose.mins ? h("span", { class: "sachet__span" }, fmtDur(dose.mins)) : null,
      ),
      h("h2", {}, dose.title),
      dose.detail ? h("p", { class: "sheet__detail" }, dose.detail) : null,
      dose.labels?.length ? h("div", { class: "labels" },
        dose.labels.map((l) => h("span", { class: `label label--${l.kind}` }, icon(l.kind === "rest" ? "rest" : l.kind === "verify" ? "verify" : l.kind === "fall" ? "fall" : "warn", 13), l.text)),
      ) : null,
      h("dl", { class: "fields" },
        field("Date", `${dowOf(day.date)} ${dayNum(day.date)} ${monOf(day.date)}`),
        field("Who", dose.who || "Everyone"),
        dose.leaveBy ? field("Leave by", dose.leaveBy) : null,
        dose.where ? field("Where", (() => {
          const q = naverQuery(dose.where);
          return h("span", {},
            dose.where,
            q ? h("a", {
              class: "field__map",
              href: `https://map.naver.com/p/search/${encodeURIComponent(q)}`,
              target: "_blank", rel: "noreferrer",
            }, icon("pin", 12), `Naver Map`) : null,
          );
        })()) : null,
        dose.getting ? field("Getting there", dose.getting) : null,
        dose.cost ? field("Cost", dose.cost) : null,
        dose.fallback ? field("If it fails", dose.fallback) : null,
        dose.book ? field("To book", dose.book) : null,
        field("Status", { booked: "Booked and confirmed", planned: "Planned, not booked", idea: "Idea — swap freely" }[dose.status] || dose.status),
        dose.source ? field("Source", h("a", { href: dose.source, target: "_blank", rel: "noreferrer" }, new URL(dose.source).hostname.replace(/^www\./, ""))) : null,
      ),
      h("div", { class: "sheet__actions" },
        h("button", {
          class: "btn btn--primary",
          onclick: () => { patchDose(dose.id, { done: !dose.done }); closeSheet(); },
        }, dose.done ? "Mark not done" : "Mark done"),
        h("button", { class: "btn", onclick: () => closeSheet() }, "Close"),
      ),
    ),
  );

  document.body.append(backdrop, sheet);

  /* Peephole: the sheet grows out of the sachet you tapped and shrinks back
     into it, so the strip stays the map and the sheet is the window opening. */
  if (lastOrigin && !reduceMotion()) {
    const from = lastOrigin.getBoundingClientRect();
    const to = sheet.getBoundingClientRect();
    if (to.width > 0 && to.height > 0) {
      const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
      const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
      sheet.animate(
        [
          { transform: `translate(${dx}px, ${dy}px) scale(${Math.max(0.28, from.width / to.width)}, ${Math.max(0.12, from.height / to.height)})`, opacity: 0, borderRadius: "8px" },
          { transform: "translate(0, 0) scale(1, 1)", opacity: 1 },
        ],
        { duration: 320, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "backwards" },
      );
      backdrop.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: "ease-out" });
    }
  }

  const app = document.getElementById("app");
  if (app) app.inert = true;
  sheet.focus();
}

function reduceMotion() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* Focus trap. aria-modal alone does not stop Tab escaping into the strip. */
function trapFocus(e) {
  const sheet = document.querySelector(".sheet");
  if (!sheet || e.key !== "Tab") return;
  const items = [...sheet.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter((el) => el.offsetParent !== null);
  if (!items.length) { e.preventDefault(); sheet.focus(); return; }
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === sheet)) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}
document.addEventListener("keydown", trapFocus, true);

/* Google Maps will not route inside Korea, so every location links to Naver.
   The `where` strings carry prose after the place name; strip it down to
   something Naver can actually resolve, and link nothing when it cannot. */
const GENERIC = /^(hanbok rental|makeup salon)\b|^(a|an|the)?\s*(shop|salon|clinic|restaurant|market)s?\b/i;

function naverQuery(where) {
  if (!where) return null;
  let q = where.split(/\s+[·—→]\s+/)[0];
  q = q.split(/\.\s|\bor\b/i)[0];
  q = q.replace(/,\s+[a-z][^,]*$/, "");
  q = q.trim().replace(/[,;.]+$/, "");
  if (q.length > 75) q = q.split(",")[0].trim();
  if (!q) return null;
  if (/\bSEA\b|Seattle|^Departs\b/i.test(q)) return null;
  if (GENERIC.test(q)) return null;
  if (!/[A-Z\uAC00-\uD7A3]/.test(q)) return null;
  return q;
}

function field(label, value) {
  return h("div", { class: "field" }, h("dt", {}, label), h("dd", {}, value));
}

function closeSheet(clearState = true) {
  const sheet = document.querySelector(".sheet");
  const backdrop = document.querySelector(".sheet-backdrop");
  const app = document.getElementById("app");
  if (app) app.inert = false;

  const origin = lastOrigin;
  const drop = () => { sheet?.remove(); backdrop?.remove(); };

  if (sheet && clearState && origin && document.contains(origin) && !reduceMotion()) {
    const from = origin.getBoundingClientRect();
    const to = sheet.getBoundingClientRect();
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    backdrop?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 190, easing: "ease-in", fill: "forwards" });
    const a = sheet.animate(
      [
        { transform: "translate(0, 0) scale(1, 1)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(${Math.max(0.28, from.width / to.width)}, ${Math.max(0.12, from.height / to.height)})`, opacity: 0, borderRadius: "8px" },
      ],
      { duration: 210, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" },
    );
    a.onfinish = drop;
    a.oncancel = drop;
  } else {
    drop();
  }

  if (clearState) { state.sheet = null; origin?.focus?.(); lastOrigin = null; }
}

/* ---------------- caution index ---------------- */

function renderFab(n) {
  const isIndex = state.view === "index";
  return h("button", {
    class: "fab",
    "aria-label": isIndex
      ? "Back to the day view"
      : `Cautions — ${n} warnings and open questions across the whole trip`,
    title: isIndex ? "Back to the day view" : "Every warning and open question, in one list",
    onclick: () => { state.view = isIndex ? "day" : "index"; render(); },
  }, icon("warn", 14), isIndex ? "Back to day" : "Cautions",
     isIndex ? null : h("span", { class: "fab__n", "aria-hidden": "true" }, String(n)));
}

/* The whole course on one page: what a dispensing label carries on the
   outside of the packet, before you tear off the first sachet. */
function renderOverview() {
  const trip = state.trip;
  const now = seoulNow();
  const scroll = h("div", { class: "strip-scroll" });

  const booked = [];
  for (const day of trip.days) {
    for (const dose of day.doses) {
      if (dose.status === "booked") booked.push({ day, dose });
    }
  }

  scroll.append(
    h("div", { class: "day-head" },
      h("h1", {}, "Fourteen days, one page"),
      h("p", { class: "ov-lede" },
        "Every day in a line. Tap any of them for the times, the walking routes, and the things that could bite."),
    ),
  );

  const wrap = h("div", { class: "strip" });

  /* Printed label block: the facts that govern the whole course. */
  const facts = [
    ["Period", `${monOf(trip.days[0].date)} ${dayNum(trip.days[0].date)} – ${dayNum(trip.days.at(-1).date)}, 2026`, `${trip.days.length} days`],
    ["Party", "Nine", "Two infants, one toddler, two grandparents"],
    ["Bases", `${trip.legs.filter((l) => l.nights).length} hotels`, trip.legs.filter((l) => l.nights).map((l) => l.short).join(" · ")],
    ["Booked", `${booked.length} fixed`, "Everything else can move"],
  ];
  const label = h("dl", { class: "ov-facts" });
  for (const [term, value, note] of facts) {
    label.append(
      h("dt", { class: "ov-facts__t" }, term),
      h("dd", { class: "ov-facts__v" },
        h("b", {}, value),
        h("span", {}, note),
      ),
    );
  }
  wrap.append(label);

  /* One band per stay, then the days that sit inside it. */
  for (const leg of trip.legs) {
    const days = trip.days.filter((d) => d.legId === leg.id);
    if (!days.length) continue;

    const band = h("section", { class: "ov-course" },
      h("h2", { class: "ov-course__h" },
        h("span", { class: "ov-course__n" }, `RX ${leg.n}`),
        h("span", { class: "ov-course__name" }, leg.hotel),
        h("span", { class: "ov-course__meta" },
          leg.nights ? `${leg.range} · ${leg.nights} nights` : leg.range),
      ),
    );

    for (const day of days) {
      const sky = SKY[day.weather?.sky] || null;
      const fixed = day.doses.filter((d) => d.status === "booked").at(-1);
      const pace = (day.pace || "").split(/\s+[·—]\s+|\s+·\s+|\s+—\s+/)[0];

      band.append(h("button", {
        class: `ov-day${day.date === now.date ? " ov-day--today" : ""}`,
        "aria-label": [
          `${dowOf(day.date)} ${monOf(day.date)} ${dayNum(day.date)}`,
          day.title,
          fixed ? `${fixed.start} fixed` : null,
          day.gist || null,
        ].filter(Boolean).join(" — "),
        onclick: () => { state.view = "day"; state.day = day.date; render(); },
      },
        h("span", { class: "ov-day__date", "aria-hidden": "true" },
          h("span", { class: "ov-day__dow" }, dowOf(day.date)),
          h("span", { class: "ov-day__num" }, String(dayNum(day.date))),
        ),
        h("span", { class: "ov-day__body" },
          h("span", { class: "ov-day__title" }, day.title),
          fixed ? h("span", { class: "ov-day__fixed" }, `${fixed.start} fixed`) : null,
          h("span", { class: "ov-day__gist" }, day.gist || ""),
        ),
        h("span", { class: "ov-day__side" },
          sky ? h("span", { class: "ov-day__sky", title: sky.label },
            icon(sky.icon, 15),
            h("span", { class: "u-sr" }, sky.label),
          ) : null,
          h("span", { class: "ov-day__pace" }, pace),
        ),
      ));
    }
    wrap.append(band);
  }

  wrap.append(h("p", { class: "ov-foot" }, trip.weatherCaveat || ""));
  scroll.append(wrap);
  return scroll;
}

function renderIndex() {
  const flags = allFlags();
  const scroll = h("div", { class: "strip-scroll" });
  scroll.append(
    h("div", { class: "day-head" },
      h("div", { class: "day-head__meta" }, h("span", {}, `${flags.length} cautions across ${state.trip.days.length} days`)),
      h("h1", {}, "Everything that could bite"),
    ),
  );

  const wrap = h("div", { class: "strip" });
  for (const kind of ["warn", "verify"]) {
    const group = flags.filter((f) => f.label.kind === kind);
    if (!group.length) continue;
    const g = h("section", { class: "index-group" },
      h("h2", { class: "index-group__h" }, kind === "warn" ? "Collisions and cautions" : "Confirm before you rely on it"),
    );
    for (const { day, dose, label } of group) {
      g.append(h("button", {
        class: `index-row index-row--${dose.kind}`,
        onclick: () => { state.view = "day"; state.day = day.date; render(); openSheet(dose.id); },
      },
        h("span", { class: "index-row__seal", "aria-hidden": "true" }),
        h("div", { class: "index-row__m" }, `${dowOf(day.date)} ${dayNum(day.date)} ${monOf(day.date)} · ${dose.start}`),
        h("div", { class: "index-row__t" }, dose.title),
        h("div", { class: "index-row__d" }, label.text),
      ));
    }
    wrap.append(g);
  }
  scroll.append(wrap);
  return scroll;
}

/* ---------------- keyboard ---------------- */

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.sheet) { closeSheet(); return; }
  if (state.view !== "day" || state.sheet) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.target.closest("input, textarea")) return;
  const dates = state.trip.days.map((d) => d.date);
  const i = dates.indexOf(state.day);
  const next = e.key === "ArrowLeft" ? i - 1 : i + 1;
  if (next < 0 || next >= dates.length) return;
  e.preventDefault();
  state.day = dates[next];
  render();
});

/* Live "now" rule: re-render on the minute so it stays honest. */
setInterval(() => { if (state.trip && !state.sheet) render(); }, 60_000);

load();

</script>
