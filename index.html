:"Lotte World Mall next door has far better food than the park itself and proper seating."},{"id":"d5-back","start":"13:50","end":"14:20","title":"Whole group back to the hotel","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:50","detail":"Everyone returns together — this is not the optional half. Fifteen minutes back to Samseong puts the toddler down in a real bed at 14:20, on the biggest day of the leg.","labels":[{"kind":"warn","text":"Take your parents back to the hotel here. Four hours out at ages 69 and 70 is a full day."}]},{"id":"d5-nap","start":"14:20","end":"16:20","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids · grandparents","labels":[{"kind":"rest","text":"Protect this nap. The grandparents rest here too, and the rest of the day is optional for them."}]},{"id":"d5-lake","start":"16:35","end":"17:30","title":"Seokchon Lake loop","kind":"outing","status":"idea","who":"Whoever wants it","whoSplit":true,"detail":"A flat paved loop around the lake beside the park, with benches the whole way. Good in late-afternoon light and easy to cut short. Genuinely optional — a second trip back out to Jamsil is a lot for one day.","labels":[{"kind":"warn","text":"Skip Seokchon Lake if the day has already been long. It’s a nice-to-have."}]},{"id":"d5-dinner","start":"18:15","mins":75,"title":"Dinner at Lotte World Mall or back in Samseong","kind":"meal","status":"planned","who":"Everyone","detail":"Decide based on where the group actually is at 17:45, not now."}]},{"date":"2026-09-11","legId":"insa","title":"Move north","gist":"Check out, cross the city to Insadong, then walk the alleys to Ikseon-dong.","pace":"Light · moving day","weather":{"sky":"cloud","hi":30,"lo":21,"note":"The hottest day in the model, at 30°C, and cloudy with it — which means humid rather than bright. Moving day, so most of it is indoors or in a vehicle. Walk the Insadong loop on the shaded side and use Ssamziegil when it bites."},"note":"A deliberately thin morning and a real afternoon. Moving nine people and twelve days of luggage across the city is the whole job before lunch — the botox that used to sit here has moved to the 8th. But once the bags are down, this is the day the new neighbourhood is right outside the door, so the afternoon is a proper Insadong walking loop ending in Ikseon-dong, all of it flat and all of it within ten minutes of the room.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"Toddler","start":"13:30","end":"15:00"}],"doses":[{"id":"d6-bfast","start":"09:00","mins":60,"title":"Last Park Hyatt breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"The last included one — the Insadong leg has no breakfast benefit, so this is the final easy morning meal of the trip. Nine o'clock; checkout is not until 11:30 and there is nothing to be early for."},{"id":"d6-slow","start":"10:15","end":"11:15","title":"A slow last morning in Gangnam","kind":"rest","status":"planned","who":"Everyone","detail":"Nothing booked. Pack properly and let the children run around the room. Moving days go better when the morning before them is empty.","fallback":"Starfield COEX is five minutes away and indoors if anyone needs to burn energy before a car ride.","labels":[]},{"id":"d6-checkout","start":"11:30","mins":30,"title":"Check out of Park Hyatt","kind":"admin","status":"planned","who":"Everyone","detail":"Bags down, late checkout requested the night before if you can get it."},{"id":"d6-move","start":"12:15","end":"13:00","title":"Transfer to Insadong","kind":"transit","status":"planned","who":"Everyone","leaveBy":"12:15","detail":"Across the river to Jongno. Two vehicles again — nine people and twelve days of luggage does not fit in one.","where":"Nine Tree Premier Insadong · 49 Insadong-gil, Jongno-gu","source":"https://english.visitseoul.net/hotel/view/18185180","labels":[{"kind":"verify","text":"Confirm the exact hotel name and address. There is more than one Nine Tree in central Seoul."}]},{"id":"d6-checkin","start":"13:00","mins":45,"title":"Check in, cribs, breathe","kind":"rest","status":"planned","who":"Everyone","detail":"Rooms may not be ready. Store bags, take the kids up when they are.","labels":[{"kind":"warn","text":"Standard check-in is 15:00. Book one room from the night of the 10th if you need a guaranteed nap room."}]},{"id":"d6-nap","start":"13:30","end":"15:00","title":"Nap block, wherever it can happen","kind":"rest","status":"planned","who":"Three kids","labels":[]},{"id":"d6-insa","start":"15:30","end":"16:45","title":"Insadong on foot — the actual loop","kind":"outing","status":"planned","who":"Whoever wants it","whoSplit":true,"detail":"A real route rather than a vague direction. Out of the hotel onto Insadong-gil, north along the main street through the paper, ceramic, tea and brush shops, into Ssamziegil at the top — a four-storey spiral ramp rather than stairs, so the stroller goes all the way up and back down without a lift. Cut east through Nagwon-dong and you are at the mouth of Ikseon-dong. The whole loop is about 1.2 km, entirely flat, and never more than eight minutes from your own room.","where":"Insadong-gil → Ssamziegil → Nagwon-dong · from the hotel door","getting":"On foot. The hotel is on Insadong-gil itself.","fallback":"Every point on this loop is a short walk back to the room, so it can be twenty minutes or two hours and anyone can peel off at any time.","labels":[{"kind":"warn","text":"Forecast is around 30°C. Walk the shaded east side, use Ssamziegil for breaks, and carry water for your parents."},{"kind":"verify","text":"Confirm whether Insadong-gil is car-free that day. Pedestrian hours vary by weekday."}]},{"id":"d6-ikseon","start":"16:45","end":"18:15","title":"Ikseon-dong alleys","kind":"outing","status":"planned","who":"Whoever wants it","whoSplit":true,"detail":"A dense grid of restored hanok converted into cafés and small shops, about ten minutes' walk from the hotel and directly at the end of the Insadong loop. Flat, shaded by the low rooflines, and photogenic without the hill climb Bukchon demands. Late afternoon is the right time — the shops are all open by now, and the lanes light up as the sun drops.","where":"Ikseon-dong, Jongno · about 700 m from the hotel","getting":"On foot, straight on from Nagwon-dong.","fallback":"Cheonggyecheon stream is five minutes south and is flat, shaded and noticeably cooler if the alleys are crowded.","source":"https://english.visitseoul.net/attractions/Ikseon-dong-Hanok-Village_/2686","labels":[{"kind":"warn","text":"Ikseon-dong alleys are often under 2 m wide. Use a carrier, or leave the big stroller at the hotel."},{"kind":"rest","text":"Ikseon-dong is a 10-minute walk from this hotel, so it fits a thin moving-day afternoon."}]},{"id":"d6-dinner","start":"18:30","mins":75,"title":"Dinner in Ikseon-dong","kind":"meal","status":"planned","who":"Everyone","detail":"Eat where the walk ends rather than trekking back. Ikseon-dong is thick with restaurants in converted hanok, and the walk home afterwards is ten flat minutes. Table seating for nine, booked.","labels":[{"kind":"warn","text":"Ask for chairs when you book. Converted hanok often means floor seating."},{"kind":"warn","text":"Book ahead for nine. Ikseon-dong restaurants are small and may not seat you together without notice."}]}]},{"date":"2026-09-12","legId":"insa","title":"Museum day","gist":"National Museum of Korea, free and flat, then the rest of Yongsan.","pace":"Medium","weather":{"sky":"cloud","hi":28,"lo":20,"note":"Cloudy and 28°C. The museum is air-conditioned throughout, so this day is weather-proof by construction — which is exactly why the Yongsan add-on afterwards has an indoor option built into it."},"note":"A Saturday, so the palaces and markets will be at their worst. The national museum is the opposite: enormous, flat, air-conditioned, lift-served throughout, and free to enter. It is the single most infant-and-grandparent-friendly major sight in Seoul.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d7-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Breakfast is not included on this leg. Either the hotel's own, or a bakery — Korean bakery chains handle a group of nine without ceremony. The museum does not open until 10:00, so there is nothing to gain from being up before nine.","labels":[{"kind":"verify","text":"Confirm whether the Insadong booking includes breakfast and for how many."}]},{"id":"d7-museum","start":"10:30","end":"12:30","title":"National Museum of Korea","kind":"outing","status":"planned","who":"Everyone","detail":"Yongsan. Free general admission, vast flat galleries, lifts everywhere, stroller-free rental on site, and benches in most rooms. Do one wing, not the building.","where":"National Museum of Korea, 137 Seobinggo-ro, Yongsan-gu","source":"https://www.museum.go.kr/site/eng/home","fallback":"The reflecting pool and the path to the pagoda outside are worth the trip on their own if the galleries are too much.","labels":[{"kind":"rest","text":"Lactation room is on the first floor. Strollers and wheelchairs are free at the information desk."},{"kind":"warn","text":"Closed Mondays. Open until 18:00 today, so you can leave with hours to spare."},{"kind":"verify","text":"Reserve the free Children’s Museum online now. It books out weeks ahead, and one slot may not hold nine."}]},{"id":"d7-back","start":"12:40","end":"13:10","title":"Nap group back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · two adults","whoSplit":true,"leaveBy":"12:40","detail":"The half of the group that needs the nap goes straight back. Skipping the museum lunch is deliberate: eating at the museum pushes the toddler's nap past 14:00, and tomorrow is the one day of the trip that cannot absorb a badly rested two-year-old."},{"id":"d7-yongsan","start":"12:40","end":"15:00","title":"Yongsan afterwards, for whoever is free","kind":"outing","status":"planned","who":"Adults not on nap duty","whoSplit":true,"detail":"The museum is not the only reason to come out here, and it is a long way to travel for one building. Three things are within reach on foot or one stop: the museum's own grounds and reflecting pool, which are free and quietly one of the best pieces of landscape in Seoul; Ichon Hangang Park, straight down to the river; and Yongsan I'Park Mall at Yongsan Station, which is a genuinely enormous indoor complex with electronics, toys and a food court if the heat wins.","where":"Yongsan-gu · museum grounds, Ichon Hangang Park, Yongsan I'Park Mall","getting":"Museum grounds on foot. Ichon Hangang Park is about fifteen minutes' walk. Yongsan I'Park Mall is one stop on Line 4 or a five-minute taxi.","fallback":"Go straight back with everyone else. This is an add-on for the people who are not carrying a sleeping child, and skipping it costs nothing.","labels":[{"kind":"rest","text":"Split after Yongsan if needed. The nap stays protected; this is only for adults free at 13:00."},{"kind":"warn","text":"Be back by 15:30. Tomorrow starts at 06:50, and hanbok prep needs everyone dressing to be present."},{"kind":"verify","text":"Confirm Yongsan Park redevelopment walk-in access. Parts open and close by reservation."}]},{"id":"d7-lunch","start":"13:15","mins":45,"title":"Lunch at the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Room service, a bakery run, or the nearest thing to the lobby. Speed matters more than quality today.","fallback":"Insadong-gil is full of takeaway. Somebody grabs food while everyone else goes up."},{"id":"d7-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","detail":"A full, on-time toddler nap, which is the entire reason today ends early. The grandparents should take this one too — tomorrow starts at 06:50 and runs long.","labels":[{"kind":"rest","text":"Protect this nap block. It’s the most load-bearing rest of the trip."}]},{"id":"d7-prep","start":"16:30","end":"17:30","title":"Tomorrow's hanbok logistics, settled tonight","kind":"admin","status":"planned","who":"Jun","detail":"Confirm the rental booking, the number of people, the hair and makeup slots, and the walking route to the palace ticket office. Lay out what everyone wears underneath. Charge the camera.","labels":[{"kind":"warn","text":"Tomorrow has a hard 10:50 call time and nine people to dress. Settle everything you can tonight."},{"kind":"warn","text":"Set out one passport and ₩70,000 cash tonight for the rental deposit."},{"kind":"warn","text":"Message the photographer tonight: rain plan, covered palace option, and a morning phone number."}]},{"id":"d7-dinner","start":"18:00","mins":75,"title":"Early dinner, early night","kind":"meal","status":"planned","who":"Everyone","detail":"Genuinely early. Tomorrow is the day the whole trip is photographed."}]},{"date":"2026-09-13","legId":"insa","title":"Hanbok, and the photographs","gist":"Hair, hanbok, and the 10:50 photo session at Gyeongbokgung. The one fixed morning.","pace":"Full · hard call time","weather":{"sky":"showers","hi":26,"lo":19,"note":"Showers in the model, on the one day of the trip with a paid, unmovable, outdoor booking. This is the single most weather-exposed thing on the itinerary and it is worth over-preparing for — see the photographer note on the 12th."},"note":"The one immovable morning of the trip. Nine people in hanbok, with hair and makeup, standing inside Heungnyemun Gate at 10:50. Everything before it is reverse-timed from it. The order matters and it is not the obvious one: makeup salons open at 08:00, hanbok shops do not open until 09:00, so makeup has to come first and the fitting has to start the minute the rental shop unlocks the door.","naps":[{"who":"7mo","start":"in the carrier, en route","end":""},{"who":"5mo","start":"in the carrier, en route","end":""},{"who":"Toddler","start":"14:45","end":"16:30"}],"doses":[{"id":"d8-bfast","start":"06:50","mins":40,"title":"Breakfast, in the room if it is faster","kind":"meal","status":"planned","who":"Everyone","detail":"The one early start left on the trip, and it is unavoidable: the salon opens at 08:00, the hanbok shop at 09:00, and the photographer's call time at 10:50 is paid and booked. Feed the children properly now — there is no good window again until after the shoot, and nothing staining goes near anyone once hanbok is on.","labels":[{"kind":"warn","text":"Feed first, dress second."},{"kind":"rest","text":"Warn everyone the night before: this breakfast starts before the usual 09:00."}]},{"id":"d8-toSalon","start":"07:35","end":"07:55","title":"Two taxis to the salon","kind":"transit","status":"planned","who":"Everyone","leaveBy":"07:35","detail":"Naver puts the hotel 1.1 km from the Gyeongbokgung cluster — 18 minutes and 1,719 steps on foot, four crosswalks, and the route is step-free, which matters with two strollers. That proximity is the whole reason the photo day sits in this leg. Take taxis anyway. You are moving nine people to a hard 08:00 booking and the walk is the first thing that slips.","where":"Beauty Palace Gyeongbokgung, or your chosen makeup salon","getting":"Two taxis from Nine Tree by Parnas Insadong. 1.1 km due west via Ujeongguk-ro, Yulgok-ro and Sajik-ro — Naver says 3 minutes driving at ₩4,800 a car, which is Seoul's base fare with no tolls. Two cars is roughly ₩9,600 total. [Naver Map, verified 27 August] Ask the front desk to book both cars the night before rather than hailing at 07:35 on a Sunday — it is more reliable than an app, and it takes the sign-up question off the table entirely on the one morning you cannot repeat.","source":"https://english.visitseoul.net/hotel/view/18185180","labels":[{"kind":"fall","text":"If taxis fail, walk 1.1 km in 18 minutes by 07:30, or take line 3 one stop from Anguk exit 6. Fare is ₩1,550."}]},{"id":"d8-hairmakeup","start":"08:00","end":"09:00","title":"Hair and makeup · first slot of the day","kind":"fixed","status":"planned","who":"Adults having it","whoSplit":true,"detail":"This has to happen before the hanbok, not alongside it, because the salon opens an hour earlier than the rental shop. Beauty Palace Gyeongbokgung opens 08:00 on Sundays and runs a 40-minute hanbok makeup and a 70-minute hanbok makeup with hair-up. Book the 40-minute service for everyone who wants it and run the chairs in parallel.","where":"Makeup salon in the Gyeongbokgung cluster","cost":"Per person, by service tier","source":"https://creatrip.com/en/spot/14538","labels":[{"kind":"warn","text":"Beauty Palace fits six at once. Book explicit staggered slots from 08:00 for nine people."},{"kind":"warn","text":"Closed Tuesdays. Sunday 13 September is fine, but don't move this to Tuesday."},{"kind":"verify","text":"Confirm how many artists work at 08:00. One artist can't finish four faces before 09:00."}]},{"id":"d8-toShop","start":"09:00","end":"09:10","title":"Walk to the hanbok shop","kind":"transit","status":"planned","who":"Everyone","leaveBy":"09:00","detail":"The salons and the rental shops are the same few streets around Gyeongbokgung Station Exit 4 and Jahamun-ro 2-gil. This is a short flat walk, not a journey.","where":"Hanbok rental, Gyeongbokgung Station Exit 4 cluster","source":"https://seohwahanbok.net/hanbok-rental/"},{"id":"d8-fitting","start":"09:10","end":"10:20","title":"Hanbok fitting · nine people","kind":"fixed","status":"planned","who":"Everyone","detail":"Seventy minutes against a 09:00 opening, walking in rather than reserving. Hanboknam is the pick — 4.7 across 4,426 reviews, the largest selection in the cluster, and 1.1 km from the hotel. It sits about 350 metres west of Gwanghwamun, so you pass the palace on the way over and only backtrack a short distance afterward. Order of dressing: grandparents, toddler, infants, then the adults who can dress themselves fastest.","where":"Hanbok rental shop","cost":"Around ₩24,000 for four hours or ₩32,000 all day, per person, at Seohwa's published rates","source":"https://seohwahanbok.net/hanbok-rental/","book":"Walking in, not reserving. A booking here does not buy queue priority, and the crowding complaints in this cluster are all about midday rather than the opening hour. Send Hanboknam one email before you fly — hanboknams@naver.com — asking two things: how many stylists work the 09:00 slot on Sunday 13 September, and that infant sizes are held for a 5-month-old and a 7-month-old. Hair runs about 20 minutes a head, one head at a time. Two stylists and the morning is comfortable; one stylist against three or four heads does not finish. All nine of you are renting, both babies included. Fallbacks if Hanboknam is shut or slammed: Seohwa at 137 Sajik-ro, Oneday in the same building's basement, or Haewadal on 0507-1315-7188.","labels":[{"kind":"warn","text":"Take the all-day tier. A four-hour rental from 09:10 expires at 13:10, during lunch."},{"kind":"warn","text":"Budget 20 minutes for each infant's hanbok change. There are two of them."},{"kind":"warn","text":"Email Hanboknam: confirm two stylists at opening. One stylist doing 15 to 20 minutes per head risks the 10:50 call time."},{"kind":"rest","text":"Arrive at opening. The early slot is calm, and crowds build later."},{"kind":"rest","text":"Send one non-makeup adult to Hanboknam at 08:55 to start paperwork and pull sizes."},{"kind":"warn","text":"Staff here may let you browse alone. Ask at the counter to be walked through the sizes."},{"kind":"verify","text":"Confirm Hanboknam can take nine renters in one slot, both babies included."}]},{"id":"d8-toPalace","start":"10:25","end":"10:45","title":"Walk to Heungnyemun Gate","kind":"transit","status":"planned","who":"Everyone","leaveBy":"10:25","detail":"Twenty minutes for a walk that takes five, because nine people in hanbok with two strollers do not move at walking pace. Aim to be standing at the meeting point at 10:45 with five minutes in hand.","where":"Gyeongbokgung · ticket and information area inside Heungnyemun Gate","getting":"Enter through Gwanghwamun Gate. The ticket and information area is inside Heungnyemun, the second gate — this is where official tours assemble and is what 'main ticket entrance' almost certainly means.","source":"https://royal.khs.go.kr/ENG/contents/E702000000.do?schGroupCode=gbg","fallback":"The escalation branch, decided now and not at 10:30: if the shop is running late, at 10:30 send the grandparents, the men and the toddler ahead on foot to hold the meeting point. Skip the last lip touch-up. Message the photographer at 10:20 with a realistic number rather than at 10:50 with an apology. Real drop-dead for the group is 11:00 — the photographer will wait ten minutes and will not wait thirty.","labels":[{"kind":"warn","text":"Guard performances run 10:00 for 20 minutes and 11:00 for 10 near Gwanghwamun and Heungnyemun. Budget the full walk."},{"kind":"warn","text":"Confirm the exact photographer meeting point and swap numbers. Gwanghwamun Gate and the ticket area are 150 metres apart."},{"kind":"fall","text":"Agree on the photographer's rain plan in advance: indoor palace halls, a covered colonnade, or a reschedule."}]},{"id":"d8-shoot","start":"10:50","end":"12:20","title":"Photography session at Gyeongbokgung","kind":"fixed","status":"booked","who":"Everyone","detail":"Meeting inside Heungnyemun Gate. Everyone in full hanbok enters the palace free — the rule covers traditional and modernised hanbok, and your parents are already free at 65 and over, as are all three children.","where":"Gyeongbokgung Palace","cost":"Admission ₩3,000 for adults 19–64, and free for anyone in qualifying hanbok","source":"https://royal.khs.go.kr/ENG/contents/E701000000.do","labels":[{"kind":"warn","text":"Free admission needs full hanbok: jeogori plus chima or baji. Partial outfits pay full price."},{"kind":"warn","text":"Shoot whole-group and grandparent frames first. The infants may only last 40 good minutes."},{"kind":"rest","text":"Find the nursing room by the information centre on arrival. It has a changing station, microwave, and sink."},{"kind":"warn","text":"Palace paths include gravel and rough stone. Use carriers once you're inside."}]},{"id":"d8-return","start":"12:30","end":"13:00","title":"Return the hanbok","kind":"admin","status":"planned","who":"Everyone","detail":"Back to the shop, change, collect your own clothes. Or keep them on through lunch if you took the full-day rental and everyone still has the energy."},{"id":"d8-lunch","start":"13:00","mins":75,"title":"Lunch near the palace","kind":"meal","status":"planned","who":"Everyone","detail":"Everyone will be hungry, hot, and finished. Somewhere close with chairs — do not go looking.","labels":[{"kind":"warn","text":"Book lunch. Sunday near Gyeongbokgung for nine without a reservation is risky."},{"kind":"warn","text":"Pick lunch somewhere that can absorb a toddler meltdown, and be ready to send half the group ahead."}]},{"id":"d8-rest","start":"14:30","end":"17:00","title":"Back to the hotel · everyone off duty","kind":"rest","status":"planned","who":"Everyone","detail":"The biggest morning of the trip earns the emptiest afternoon of the trip.","labels":[{"kind":"rest","text":"Protected rest block. Don't schedule into this."}]},{"id":"d8-dinner","start":"18:30","mins":90,"title":"A proper dinner","kind":"meal","status":"planned","who":"Everyone","detail":"The one meal of the trip worth booking properly. Table seating, private room if you can get one for nine.","labels":[{"kind":"verify","text":"Book a private room well in advance for nine people and three small children."}]}]},{"date":"2026-09-14","legId":"insa","title":"Mapo, and a market locals still use","gist":"A stream walk in the morning, Mangwon Market and Yeonnam-dong after the nap.","pace":"Medium","weather":{"sky":"sun","hi":29,"lo":20,"note":"Sunny and 29°C. Warm for a market at midday, which is part of why Mangwon sits at 16:30 — the arcade is covered, the heat has dropped, and the food stalls are at their best in the late afternoon."},"note":"An easy morning in Jongno, then west after the nap. Gwangjang has been dropped on purpose — it has become a queue for a tourist photograph rather than a market, and it is a genuinely hard room for infants. Mangwon is the version that still works: a real neighbourhood market where people do their shopping, two stops from Hongdae, with a flat riverside park and the Gyeongui Line park next door. Today is a Monday, which is the quietest possible night to be on this side of the city.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d9-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Late morning by design — the day's real event is dinner at Mangwon Market, and you do not want the group already tired by mid-afternoon."},{"id":"d9-cheonggyecheon","start":"10:15","end":"11:30","title":"Cheonggyecheon in the morning","kind":"outing","status":"planned","who":"Everyone","detail":"The sunken stream through the middle of the city, and a five-minute walk from the hotel door. Cool at water level, flat along the whole length, and genuinely pleasant before the heat arrives. Walk as far as you feel like and climb out at any bridge. This has moved from filler to the actual morning, because the afternoon is out in Mapo and today needs an easy start.","where":"Cheonggyecheon, five minutes from the hotel","source":"https://english.visitseoul.net/area/CheonggyecheonStream/ENP000034","fallback":"Turn around at any point. The whole stream runs parallel to the street above it, so there is no committed distance.","labels":[{"kind":"warn","text":"Most stream access is stairs. Find a ramped entrance before you commit with a stroller."}]},{"id":"d9-lunch","start":"12:00","mins":75,"title":"Lunch near the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Back in Jongno with time in hand. Eat properly here, because tonight's meal is standing up at a market."},{"id":"d9-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","labels":[]},{"id":"d9-tomapo","start":"15:45","end":"16:20","title":"Across to Mapo","kind":"transit","status":"planned","who":"Everyone","leaveBy":"15:45","detail":"West across the city to the Mangwon and Yeonnam side of Mapo-gu. Two vehicles for nine, or Line 6 if the group is feeling robust — Mangwon is two stops from Hongik University station.","where":"Mangwon-dong, Mapo-gu"},{"id":"d9-mangwon","start":"16:30","end":"18:00","title":"Mangwon Market — dinner, standing up","kind":"meal","status":"planned","who":"Everyone","detail":"This replaces Gwangjang, and it is a better fit in every way that matters to this group. Mangwon is a working neighbourhood market rather than a tourist destination — locals doing their actual shopping, prices that have not been rewritten for visitors, and a covered arcade that is wider and calmer than Gwangjang's aisles. The things to eat here are the fried chicken in sweet-and-sour glaze, tteokbokki, freshly fried mandu and the croquettes. Late afternoon is when it fills up and everything is hot.","where":"Mangwon Market, Mapo-gu · Mangwon station Line 6, exit 2","fallback":"If it is heaving, buy food and walk two minutes to Mangwon Hangang Park to eat it by the river.","labels":[{"kind":"warn","text":"Mangwon is covered but crowded. Take one stroller at most, use carriers, and expect to eat standing or in the park."},{"kind":"warn","text":"Bring cash. Some stalls take cards, but plenty don't."},{"kind":"verify","text":"Confirm the closing day before you go. Traditional markets often close Sunday or Monday, and today is Monday."}]},{"id":"d9-yeonnam","start":"18:15","end":"19:15","title":"Yeonnam-dong and the Gyeongui Line park","kind":"outing","status":"planned","who":"Everyone","detail":"A disused railway line turned into a long, thin park running through Yeonnam-dong, and the single most stroller-friendly thing in this half of the city — flat, straight, grassy, wide, and lined with low-key cafés and shops. It is the calm version of this neighbourhood, and it connects Mangwon to Hongdae on foot without ever putting you in Hongdae's crowds.","where":"Gyeongui Line Forest Park, Yeonnam-dong","getting":"About ten minutes by taxi from Mangwon Market, or three stops.","fallback":"Go straight back to the hotel after the market. This is a bonus, not a requirement, and nobody will mind.","labels":[]},{"id":"d9-hongdae","start":"19:15","end":"20:30","title":"Hongdae, for whoever still wants it","kind":"outing","status":"idea","who":"Adults who fancy it","whoSplit":true,"detail":"The main Hongdae streets are ten minutes' walk from the far end of the Yeonnam park — buskers, street food, record shops, and the densest concentration of late-opening anything in Seoul. Marked as an idea rather than a plan because it is loud, extremely crowded and the wrong environment for two infants at bedtime. One useful piece of luck: today is a Monday, which is by some distance the quietest night of the week here.","where":"Hongdae main street and Eoulmadang-ro","fallback":"Skip it entirely. Everyone with a child goes back to the hotel from Yeonnam and this simply does not happen.","labels":[{"kind":"warn","text":"Split up for Hongdae at 19:30. Send interested adults, and put everyone else in a car home."}]},{"id":"d9-back","start":"19:30","title":"Kids and grandparents back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · parents on duty","whoSplit":true,"leaveBy":"19:30","detail":"Thirty minutes back across town. Bedtime is late tonight by design, which is why tomorrow's morning starts indoors and slowly."}]},{"date":"2026-09-15","legId":"insa","title":"Children's clothes, Costco, and the skincare haul","gist":"Children's clothes at The Hyundai Seoul, Costco, then Myeongdong for skincare.","pace":"Medium · shopping","weather":{"sky":"cloud","hi":28,"lo":20,"note":"Mostly cloudy. Almost the whole day is indoors — department store, warehouse, Myeongdong — so this one is weather-independent by design. If the model turns wet, nothing here needs to move."},"note":"The dedicated shopping day, placed late so you are buying with a known suitcase situation rather than guessing. Namdaemun has been dropped for The Hyundai Seoul in Yeouido — better children's brands, air conditioning, nursing rooms, lifts and a food hall, which is worth more than market pricing when you are doing this with a toddler. Costco Yangpyeong is ten minutes from it, so the two pair on one trip. Myeongdong skincare in the afternoon. Gyeongbokgung is closed today, which costs you nothing since you have already been.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d10-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, and nothing lost by it — The Hyundai Seoul does not open its doors until 10:30, so an earlier start only buys you time standing outside a shut mall."},{"id":"d10-toyeouido","start":"10:10","end":"10:50","title":"Over to Yeouido","kind":"transit","status":"planned","who":"Shopping group","whoSplit":true,"leaveBy":"10:10","detail":"Line 5 runs directly from Jongno-3ga to Yeouido with no change, which is unusually civilised for this city. A taxi is about twenty-five minutes. Either way you arrive just after opening rather than at 11:30 with everyone else.","where":"The Hyundai Seoul, 108 Yeoui-daero, Yeongdeungpo-gu"},{"id":"d10-easy","start":"10:15","end":"12:00","title":"Slow morning for everyone else","kind":"rest","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Hotel, Insadong street, a café. The point of splitting today is that nobody has to endure a shopping trip they did not want, and Yeouido is a long way to drag a two-year-old for other people's errands."},{"id":"d10-hyundai","start":"10:55","end":"13:00","title":"The Hyundai Seoul · children's clothes","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"This replaces Namdaemun, and for this group it is not a close call. The Hyundai Seoul is the newest and most consistently well-reviewed department store in the city: a full children's floor with the Korean and international brands people actually fly home with, an indoor garden you can park a stroller in, proper nursing rooms, wide flat aisles, lifts everywhere, and a basement food hall good enough to be lunch. You will pay department-store prices rather than market prices — that is the trade, and with a toddler in tow it is the right one.","where":"The Hyundai Seoul, Yeouido · children's floor and the food hall","getting":"Line 5 to Yeouido, direct from Jongno-3ga.","cost":"Department-store pricing. Budget more per item than a market and fewer items.","fallback":"Lotte World Mall in Jamsil covers similar ground and you were already near it on the 10th. Starfield Hanam is bigger again but is outside Seoul and not worth the drive on a day this full.","labels":[{"kind":"warn","text":"Bring passports. Tax-free refund needs one, and the desks are in-store."},{"kind":"verify","text":"Confirm opening time before you leave. Department stores often open at 10:30, not 10:00."},{"kind":"rest","text":"Eat lunch in the building. The lower-level food hall can handle a group without a booking."}]},{"id":"d10-lunch","start":"12:00","mins":75,"title":"Lunch in Insadong for the hotel group","kind":"meal","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Close to the room and ahead of the nap. The shopping group is eating in The Hyundai's food hall at the same time, so there is no regroup to coordinate."},{"id":"d10-costco","start":"13:15","end":"14:45","title":"Costco Yangpyeong","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"Ten minutes from The Hyundai Seoul, which is the entire reason it sits on this day rather than any other. Yangpyeong is the closest warehouse to Yeouido and it is open 10:00 to 22:00. The Korean-specific things worth the trip are the own-brand seaweed, gim snacks, dried persimmon, honey butter almonds and the bulk skincare — none of which you can carry out of Olive Young at this price.","where":"Costco Yangpyeong, 156 Seonyu-ro, Yeongdeungpo-gu","getting":"About ten minutes by taxi from The Hyundai Seoul.","labels":[{"kind":"warn","text":"Bring your physical US Costco card. Membership is global, but the app can fail at Korean door scanners."},{"kind":"warn","text":"Korean Costco closes on the second and fourth Sunday. Tuesday is clear, but check before moving this to a weekend."},{"kind":"verify","text":"Confirm the card policy at the door. Carry enough cash for the basket in case your US card doesn't work."},{"kind":"warn","text":"Costco buys are bulky and heavy. Do the luggage reckoning tonight, not at the airport on the 18th."}]},{"id":"d10-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[]},{"id":"d10-myeongdong","start":"16:15","end":"18:00","title":"Myeongdong · skincare","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"The flagship Olive Young plus the surrounding brand stores, and a fresh shift is fine here — whoever did Yeouido and Costco has earned a sit down. This is the serious skincare stop of the trip: buy the volume here, not at the airport.","where":"Myeongdong","getting":"Ten minutes by taxi from the hotel, or two stops on Line 3 and a short walk.","labels":[{"kind":"verify","text":"Confirm the tax-free refund threshold and process. Bring your passport."},{"kind":"warn","text":"Pack all liquids, gels, and creams in checked bags tonight."}]},{"id":"d10-pack","start":"18:15","mins":45,"title":"First pack and a luggage reckoning","kind":"admin","status":"planned","who":"Adults","detail":"Tomorrow you move hotels, and today you bought department-store clothes, a Costco run and a skincare haul. Better to find out tonight that you need another suitcase than at the Incheon check-in desk on the 18th.","labels":[{"kind":"warn","text":"Buy the extra suitcase today if you need one. Don't leave this for Yeongjong or the airport."}]},{"id":"d10-dinner","start":"19:00","mins":75,"title":"Last Jongno dinner","kind":"meal","status":"planned","who":"Everyone","detail":"The last dinner in the city proper — from here it is the airport hotel. Pick the one thing someone said they wanted to eat again and go there.","labels":[{"kind":"warn","text":"Book dinner. This is the last easy meal nobody will want to improvise."}]}]},{"date":"2026-09-16","legId":"icn","title":"Out to the island","gist":"Check out, jjajangmyeon in Incheon Chinatown, then over the bridge to the resort.","pace":"Light · moving day","weather":{"sky":"showers","hi":27,"lo":20,"note":"Showers return for the Incheon leg. A wet moving day is a nuisance rather than a problem, but Chinatown involves walking between the vehicle and the restaurant, so keep the umbrellas at the top of a bag."},"note":"A clean moving day with no medical appointment stacked on top of it — which is the whole point. The mole removal sits on the 17th, so today is nothing but checking out, crossing the city, and arriving somewhere with a pool. The one addition is lunch: Incheon invented jjajangmyeon, and the original Chinatown is close enough to the bridge that you can eat there on the way rather than making a separate trip. Check-in is 15:00 at both Yeongjong properties, so the afternoon nap needs a room that is already yours.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"Toddler","start":"14:00","end":"16:00"}],"doses":[{"id":"d11-bfast","start":"09:00","mins":60,"title":"Breakfast and final pack","kind":"meal","status":"planned","who":"Everyone","detail":"Checkout is 11:00 and the transfer is not until 11:30, so a nine o'clock breakfast still leaves an unhurried hour. Pack the night before and this morning is genuinely easy."},{"id":"d11-lastinsa","start":"10:05","end":"10:50","title":"Last walk through Insadong","kind":"outing","status":"planned","who":"Anyone who wants it","whoSplit":true,"detail":"Bags are packed, checkout is not until 11:00, and Ssamziegil is four minutes from the door. This is the last unhurried stretch on the mainland — use it for the small souvenirs nobody has bought yet, or skip it entirely and sit in the lobby.","where":"Insadong-gil, four minutes from the hotel","fallback":"Skipping this costs nothing. The airport has a duty-free the size of a town.","labels":[{"kind":"rest","text":"This walk is optional. Nobody has to leave the hotel this morning."}]},{"id":"d11-checkout","start":"11:00","mins":30,"title":"Check out of Insadong","kind":"admin","status":"planned","who":"Everyone","detail":"Sweep the rooms for the small things that get left: bottle parts, chargers, one shoe, the toddler's specific cup. Ask the desk to hold the bags if you want a last hour in Insadong."},{"id":"d11-transfer","start":"11:30","end":"12:30","title":"Out west to Incheon Chinatown","kind":"transit","status":"planned","who":"Everyone","leaveBy":"11:30","detail":"Roughly an hour from Jongno to Incheon Station on the mainland. This is not a detour so much as a pause on the way — Chinatown sits by the Yeongjong Bridge approach, so you stop, eat, and carry on over the water to the resort. Good news on the name confusion at the far end: Hyatt Regency Incheon Paradise City is a single, real hotel — the former west tower of Grand Hyatt Incheon, rebranded in 2025 and sitting inside the Paradise City resort complex. So you get Hyatt loyalty and the resort's facilities in one booking.","where":"Incheon Chinatown, Jung-gu · then Yeongjong Island","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Book the transfer with three car seats, a Chinatown stop, and waiting time."},{"kind":"verify","text":"Confirm the driver will hold your luggage during lunch. If not, move jjajangmyeon to the 17th."},{"kind":"verify","text":"Check your confirmation says Hyatt Regency, not Hotel Paradise or Art Paradiso."}]},{"id":"d11-jjajang","start":"12:35","end":"13:45","title":"Jjajangmyeon in the place that invented it","kind":"meal","status":"planned","who":"Everyone","detail":"Incheon's Chinatown is where jjajangmyeon was created, by Shandong migrants working the port in the late 1800s, and eating it here is a genuinely different thing from eating it anywhere else. Junghwaru is the pick for this group: well reviewed, large enough to seat nine, and with waits that run ten to twenty minutes rather than the hour that the two famous places routinely hit. Today is a Wednesday, which is the single biggest thing working in your favour here — weekend waits in Chinatown are punishing.","where":"Junghwaru, Incheon Chinatown · near Incheon Station","cost":"Roughly ₩8,000–₩12,000 for jjajangmyeon, more for tangsuyuk to share.","fallback":"Gonghwachun is the original house and has the museum-piece interior, but the food is widely described as ordinary and the wait as long. Sinseungban is the locals' choice on taste. Both are worth knowing about if Junghwaru is closed.","labels":[{"kind":"warn","text":"Call ahead for nine. Chinatown lunch spots may not hold a walk-in table this size."},{"kind":"warn","text":"Jjajangmyeon stains permanently. Bib everyone under three, and skip nice clothes."},{"kind":"verify","text":"Confirm the closing day. Some Chinatown restaurants close one weekday a month."}]},{"id":"d11-toresort","start":"13:50","end":"14:20","title":"Over the bridge to Yeongjong","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:50","detail":"Twenty-five minutes over the water to Paradise City. All three children will very likely sleep in the car, which is exactly what you want given check-in is not until 15:00 anyway.","where":"Hyatt Regency Incheon Paradise City, Yeongjong Island","labels":[{"kind":"rest","text":"Treat this drive as the first half of nap. Don't wake anyone at the door."}]},{"id":"d11-checkin","start":"14:20","mins":40,"title":"Check in","kind":"rest","status":"planned","who":"Everyone","detail":"The hotel sits inside the Paradise City complex, so once you are in you do not need to leave it again before the flight.","labels":[{"kind":"warn","text":"Standard check-in is 15:00. Book one room from the night of the 15th so kids can nap on arrival."}]},{"id":"d11-nap","start":"14:45","end":"16:00","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","detail":"Shorter than usual and partly already served by the drive over the bridge. Do not stretch it — tonight is the last chance to swim.","labels":[]},{"id":"d11-resort","start":"16:15","end":"18:00","title":"Wonderbox, or just the room","kind":"outing","status":"planned","who":"Everyone","detail":"Indoors and shaded by design today. Wonderbox is Paradise City's indoor family theme park and is the right size and temperature for a two-year-old — carousel scale, not roller-coaster scale. The complex also has extensive public art you can walk through for free. This is now your one clear water day: the mole removal sits on the 17th, so nobody is under a no-swimming restriction yet.","where":"Paradise City complex, on site","source":"https://www.p-city.com/front/wonderbox/overview","fallback":"The hotel room and a long bath is a perfectly good version of this.","labels":[{"kind":"rest","text":"Swim today if anyone wants to. Tomorrow's procedure closes the water for seven to ten days."},{"kind":"verify","text":"Confirm Wonderbox hours and whether the hotel bundles admission."},{"kind":"warn","text":"Cimer refuses children under seven. It only works as an adults-only split shift."},{"kind":"rest","text":"Ask for the 50% guest coupon. The ₩60,000 aqua pass drops to about ₩30,000, and the aqua zone shuts at 19:00."}]},{"id":"d11-dinner","start":"18:30","mins":75,"title":"Dinner at the resort","kind":"meal","status":"planned","who":"Everyone","detail":"There is very little walkable off-site dining out here. Plan to eat in.","labels":[{"kind":"verify","text":"Confirm on-site restaurant options and whether any take a booking for nine."}]}]},{"date":"2026-09-17","legId":"icn","title":"The empty day","gist":"Mole removal at 10:00 for three, back around midday, then deliberately nothing.","pace":"Light — deliberately","weather":{"sky":"showers","hi":28,"lo":21,"note":"Showers again. This matters less than any other rain day of the trip: the mole removal is indoors, the resort is indoors, and staying out of strong sun afterwards is a medical instruction anyway. Cloud is genuinely helpful today."},"note":"The last full day, and outside one confirmed morning appointment it is intentionally almost blank. Twelve days in with two infants, a toddler and two people in their seventies, the most valuable thing you can schedule is nothing. Rene Clinic opens at 10:00 and you have the first slot of the day, but it is three patients on one doctor, so plan on being there until roughly 11:30 and hold the room until 12:00. Nothing else is booked, so it can run long without costing anything. Pack in the afternoon so tomorrow morning is calm.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d12-bfast","start":"08:15","mins":60,"title":"Early breakfast, clinic party only","kind":"meal","status":"planned","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"The 10:00 slot is the first appointment of the day and Rene Clinic is eight to twelve minutes away rather than five, so this one breakfast starts at 08:15. It is still unhurried — an hour at the table and you are walking out at 09:30 with time to spare for first-visit paperwork.","labels":[{"kind":"rest","text":"Only the clinic party eats early. Everyone else keeps the 09:00 breakfast."}]},{"id":"d12-bfast-rest","start":"09:00","mins":75,"title":"Breakfast, no rush","kind":"meal","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Nobody else has to be up early today. Last full morning of the trip, the pool is right there, and there is nothing on the schedule until lunch."},{"id":"d12-toclinic","start":"09:30","end":"09:45","title":"Out to the clinic","kind":"transit","status":"planned","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"leaveBy":"09:30","detail":"Rene Clinic sits in the Haneul-dosi (Sky City) district rather than the Unseo cluster, which makes it eight to twelve minutes by taxi instead of five — still on-island, so no toll. Leaving at 09:30 gives you the drive plus fifteen minutes to get three first-visit foreign patients through the paperwork before the 10:00 slot starts.","where":"SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu — Haneul-dosi, about 8–12 minutes from Paradise City","cost":"About ₩7,000–₩10,000 by taxi, on-island, no toll","fallback":"If no taxi materialises at the door, the resort front desk will call one. Do not plan on the Incheon Airport Maglev — it was reclassified as a tourist train, runs 10:00 to 17:00 Tuesday to Sunday only, and does not go near Haneul-dosi.","source":"https://www.incheon.go.kr/IC010205/view?repSeq=DOM_0000000013303245","labels":[{"kind":"verify","text":"Confirm the taxi the night before. Show the driver: 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층."}]},{"id":"d12-mole","start":"10:00","end":"12:00","title":"Mole removal · Rene Clinic","kind":"medical","status":"booked","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"Confirmed for 10:00, the first slot of the day, for three adults. Budget two hours and expect to use less. A Korean derm clinic runs this as a pipeline: a ten-to-fifteen-minute consult each, numbing cream applied as each consult ends and left on fifteen to twenty minutes, then three to ten minutes of actual laser or shave per mole. Because the numbing on patient one is working while patient two is being consulted, three people take far less than three times one person — realistically out around 11:30, not 13:00. What pushes it long is first-visit paperwork in a second language, anyone turning out to have more moles than expected, and three separate payments at the end. Placed on the last full day deliberately: doing it here means you carry no healing wound through twelve days of Seoul heat, sun, and markets, and it leaves Wednesday's water park genuinely usable instead of theoretically off-limits. The cost of the placement is that you leave the country roughly thirty hours later — fine for a routine shave or laser removal, and the thing to reconsider if the doctor wants to cut deeper.","where":"Rene Clinic (르네의원), 3F Rooms 304–308, SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu, Incheon · 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층 304–308호 · +82 32-716-5716 · Thursday hours 10:00–20:00 with a 13:00–14:00 lunch break","cost":"Not published. Incheon rates generally run ₩10,000–₩20,000 for a small or medium flat mole, typically 10–30% below Gangnam, with multiple moles often priced as a package. Add roughly ₩30,000–₩60,000 if anything goes to biopsy. Confirm the price at the desk before the procedure starts.","source":"https://rene-clinic.com/","fallback":"If Rene cancels, Yes Dermatology (032-752-9730) in the Unseo cluster is five minutes from the resort and also opens 10:00 Thursday, with two board-certified dermatologists. Yeongjong Central Dermatology (032-746-3200) and Doctors Dermatology Yeongjong (032-710-2346) are in the same cluster on the same hours.","labels":[{"kind":"warn","text":"13:00 is the real deadline, not 14:00 — the clinic shuts 13:00–14:00 for lunch."},{"kind":"rest","text":"Three patients on one doctor. Realistically out by 11:30; the room is held to 12:00."},{"kind":"warn","text":"Ask whether anything goes to pathology. If the doctor wants a biopsy, defer to Seattle."},{"kind":"warn","text":"If the doctor recommends sutures instead of a shave, don't do it 30 hours before a ten-hour flight."},{"kind":"verify","text":"Ask if Dr. Moon Seong-ho (문성호) is a 피부과 전문의. Check akd.or.kr/dermatologist/verify."},{"kind":"verify","text":"Ask for aftercare instructions in English, in writing. Use the hotel concierge by phone if needed."},{"kind":"warn","text":"Buy dressings, ointment, and silicone gel before you leave the clinic."},{"kind":"warn","text":"No swimming, sauna, or hot tub for seven to ten days from today."},{"kind":"rest","text":"Photograph the wound with a ruler today and tomorrow for a Seattle dermatologist."},{"kind":"verify","text":"Confirm the clinic takes foreign cards. Three separate payments will be slower."}]},{"id":"d12-morning","start":"10:15","end":"12:15","title":"Resort morning, whatever anyone feels like","kind":"rest","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Pool for whoever can, grounds for whoever wants, room for whoever needs it. No group activity, and no waiting around for the clinic party — start lunch without them if they run late.","labels":[]},{"id":"d12-back","start":"12:00","end":"12:15","title":"Back to the resort","kind":"transit","status":"planned","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"Ask the clinic to call the return taxi before you walk out. Ten minutes later you are back. If you finish closer to 11:30, you get the spare half hour back at the pool."},{"id":"d12-lunch","start":"12:15","mins":60,"title":"Lunch on site","kind":"meal","status":"planned","who":"Everyone","detail":"Eat inside the complex. This is the last full day and nobody needs a taxi for lunch. The clinic party may walk in a few minutes late — start without them."},{"id":"d12-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[]},{"id":"d12-pack","start":"15:30","end":"17:00","title":"Pack properly","kind":"admin","status":"planned","who":"Adults","detail":"All the skincare into checked bags. Formula, milk, snacks, and a full change of clothes per child into the cabin bag. Passports and boarding passes somewhere one person is responsible for.","labels":[{"kind":"warn","text":"Pack every Myeongdong liquid and gel in checked luggage before you reach the airport."}]},{"id":"d12-outing","start":"16:00","end":"17:30","title":"Sunset somewhere near the water","kind":"outing","status":"idea","who":"Whoever wants it","whoSplit":true,"detail":"Yeongjong has west-facing coast and the sunsets are the reason people stay out here. Late afternoon rather than midday keeps it off anyone's healing skin.","fallback":"Drop it without a second thought if the day has been enough.","labels":[{"kind":"verify","text":"Confirm sunset time and a viewpoint a short taxi ride from the hotel."}]},{"id":"d12-dinner","start":"18:30","mins":90,"title":"Last dinner","kind":"meal","status":"planned","who":"Everyone","detail":"Twelve days, nine people, everybody still speaking to each other. Book something good."}]},{"date":"2026-09-18","legId":"icn","title":"Home","gist":"Last breakfast, an early lunch, and KE041 home at 16:40. The airport is 15 minutes away.","pace":"Travel","weather":{"sky":"showers","hi":29,"lo":21,"note":"Showers on departure day. Build in extra time for the drive to the terminal — it is short, but a wet Friday morning at ICN with nine people and a luggage trolley convoy is not the moment to be optimistic about traffic."},"note":"The one genuine advantage of staying on Yeongjong Island: the airport is fifteen minutes away instead of ninety. A calm morning, an early lunch, and a departure that does not start at dawn.","naps":[{"who":"All three","start":"on board","end":"eventually"}],"doses":[{"id":"d13-bfast","start":"09:00","mins":60,"title":"Last breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, like the rest of the trip. The car to Terminal 2 does not leave until 13:00, so there is room for a proper last meal without anyone watching a clock."},{"id":"d13-woundcheck","start":"10:15","mins":15,"title":"Wound check before the flight","kind":"medical","status":"planned","who":"Whoever had it removed","whoSplit":true,"detail":"About twenty-four hours on. Look at it in good daylight, change the dressing, and photograph it with a ruler in frame — that photo is what a Seattle dermatologist will compare against. Then dress it clean for the flight, because cabin air is dry and ten hours is a long time.","fallback":"If it looks wrong — spreading redness, heat, or weeping that will not stop — call Rene Clinic on +82 32-716-5716 the moment they open at 10:00, not from the airport. You are ten minutes from them this morning and you will be nine thousand kilometres away tonight. Even a 10:00 call leaves three hours before the car leaves.","labels":[{"kind":"warn","text":"Pack ointment and spare dressings in your cabin bag. Redress it once mid-flight."},{"kind":"rest","text":"Take the second wound photo. Use the same ruler and light if you can."}]},{"id":"d13-morning","start":"10:30","end":"11:45","title":"Slow morning, bags down","kind":"rest","status":"planned","who":"Everyone","detail":"Checkout is usually 11:00. Store the bags and use the lobby until you leave."},{"id":"d13-lunch","start":"11:45","mins":60,"title":"Early lunch before the airport","kind":"meal","status":"planned","who":"Everyone","detail":"Eat properly now. Airside with nine people is not where you want to be solving lunch."},{"id":"d13-toAirport","start":"13:00","end":"13:30","title":"To Incheon Terminal 2","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:00","detail":"About twenty minutes from the hotel to Terminal 2, so you are checking in around 13:30 for a 16:40 departure. With three car seats to check, a stroller to tag, and tax-free refunds to claim, three hours is the right number rather than a generous one.","where":"ICN Terminal 2 · Korean Air departures","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Korean Air international check-in closes at 15:40. That's the real deadline."},{"kind":"warn","text":"Claim tax-free refunds before security. Afternoon desk queues can be bad."},{"kind":"verify","text":"Paradise City's Terminal 2 shuttle is less frequent. Book a private van for nine people with luggage."}]},{"id":"d13-ke041","start":"16:40","title":"KE041 · Incheon to Seattle","kind":"fixed","status":"booked","who":"Everyone","detail":"Arrives Seattle 10:40 the same day, 18 September. You land before you took off, which is the only good thing about flying east.","where":"ICN → SEA"},{"id":"d13-molealt","start":"Only if Rene cancels","title":"The Friday-morning fallback","kind":"medical","status":"idea","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"Thursday 10:00 at Rene Clinic is confirmed, so this is now a cancellation fallback rather than a live option — keep it only because a clinic can call on Wednesday night. The math is much tighter than it used to be, because it is three patients rather than one: Yeongjong clinics open at 10:00, three people take roughly ninety minutes end to end, and the car to Terminal 2 leaves at 13:00. A 10:00 start in the Unseo cluster has you back at the hotel around 11:45 — enough, but it is a single buffer with nothing behind it.","where":"Unseo-dong, five minutes away. Yes Dermatology (032-752-9730) and Yeongjong Central (032-746-3200) both open 10:00 Friday, and TheYul in Cheongna opens 10:00 Friday too if you need a third. Rene itself is open 10:00–20:00 Friday if the cancellation is yours rather than theirs.","fallback":"If the only Friday slot offered is after 10:30, decline it and have the removal done in Seattle instead. Three patients starting at 11:00 finish too close to a 13:00 departure, and no mole is worth a missed flight with nine people.","labels":[{"kind":"warn","text":"For the 10:00 fallback appointment, eat at 08:15 and walk out by 09:30."},{"kind":"warn","text":"Friday means no wound check before the ten-hour flight. That's why Thursday was booked."},{"kind":"rest","text":"Keep the wound covered with the hydrocolloid patch, and reapply ointment right before boarding."},{"kind":"warn","text":"Korean Air check-in closes at 15:40. Leaving the hotel at 13:00 gives a buffer, not endless time."}]}]}],"overlayUpdatedAt":null};</script>
<script>window.__KO__ = {"day.2026-09-05.gist":"시애틀에서 서울로. KE042는 12:50 출발, 내일 오후 도착이에요.","day.2026-09-05.nap.0.end":"착륙 무렵","day.2026-09-05.nap.0.start":"기내에서","day.2026-09-05.nap.0.who":"아기들","day.2026-09-05.nap.1.end":"15:00","day.2026-09-05.nap.1.start":"13:30","day.2026-09-05.nap.1.who":"두 살 아이","day.2026-09-05.note":"오늘은 선택할 수 있는 것도, 조정할 수 있는 것도 없어요. 아홉 명, 카시트 세 개, 그리고 모두가 함께 있어야 하는 국제선 카운터. 실제로 정할 문제는 집에서 얼마나 일찍 나서느냐, 그것 하나예요.","day.2026-09-05.pace":"이동일","day.2026-09-05.title":"시애틀, 그리고 열한 시간","day.2026-09-05.weatherNote":"출발은 시애틀, 도착은 서울. 오늘 중요한 날씨는 인천국제공항에 내릴 때의 날씨 하나뿐이에요.","day.2026-09-06.gist":"16:40 도착, 기사님부터 찾고 eSIM과 현금. 오늘은 그게 전부예요.","day.2026-09-06.nap.0.end":"아무 때나","day.2026-09-06.nap.0.start":"아무 때나","day.2026-09-06.nap.0.who":"세 아이 모두","day.2026-09-06.note":"아홉 명이 16:40에 도착한다는 건 현실적으로 20:15 이전에는 호텔 방에 못 들어가고, 그보다 늦어질 수도 있다는 뜻이에요. 다른 일정은 아무것도 잡지 마세요. 오늘의 단 하나의 원칙: 다른 무엇보다 먼저 기사님을 찾을 것. 업체는 착륙 시각부터 딱 두 시간만 기다려요. 간단히 요기하고 아기들을 재우고, 다 함께 03:00에 눈이 떠질 걸 받아들이세요.","day.2026-09-06.pace":"가벼움","day.2026-09-06.title":"착륙, 연결, 눕기","day.2026-09-06.weatherNote":"모델에는 비, 22°C로 서늘함. 결과는 두 가지: 인천에서의 이동은 맑은 일요일 저녁보다 느릴 거고, 두 시간 기사 대기 시간은 더 빡빡해져요. 어른마다 접이식 우비 한 벌씩, 위탁 수하물에 파묻지 말고 기내 가방에 꺼내기 쉽게 두세요.","day.2026-09-07.gist":"08:00부터 셋은 병원, 나머지는 아침 식사 후 코엑스.","day.2026-09-07.nap.0.end":"11:00","day.2026-09-07.nap.0.start":"09:30","day.2026-09-07.nap.0.who":"7개월","day.2026-09-07.nap.1.end":"09:30","day.2026-09-07.nap.1.start":"08:30","day.2026-09-07.nap.1.who":"5개월","day.2026-09-07.nap.2.end":"15:00","day.2026-09-07.nap.2.start":"13:00","day.2026-09-07.nap.2.who":"두 살 아이","day.2026-09-07.note":"새벽 전에 팀이 나뉩니다. 어른 세 명은 금식 상태로 병원에 가고, 나머지 여섯 명은 시차 적응 중에 남아 아침 식사를 하며 무리하지 않아요. 이날의 유일한 행운은 위치예요 — 광동병원은 봉은사로 612, 코엑스 바로 옆, 파크 하얏트에서 약 5분 거리입니다. 병원의 세 명과 몰의 여섯 명은 오전 내내 서로 도보 거리 안에 있어요.","day.2026-09-07.pace":"분리 일정","day.2026-09-07.title":"검진, 나머지는 아주 느긋한 하루","day.2026-09-07.weatherNote":"옅은 안개와 이슬비, 온화함. 병원에 가는 세 명에게는 상관없고, 나머지 여섯 명에게는 오히려 반가운 소식이에요 — 흐리고 선선한 날은 시차 적응 중인 실내 오전에 가장 편한 날씨예요.","day.2026-09-08.gist":"오전에는 서울숲, 낮잠 후 강남에서 보톡스와 스킨케어.","day.2026-09-08.nap.0.end":"11:00","day.2026-09-08.nap.0.start":"09:30","day.2026-09-08.nap.0.who":"7개월","day.2026-09-08.nap.1.end":"13:00","day.2026-09-08.nap.1.start":"11:30","day.2026-09-08.nap.1.who":"5개월","day.2026-09-08.nap.2.end":"15:00","day.2026-09-08.nap.2.start":"13:00","day.2026-09-08.nap.2.who":"두 살 아이","day.2026-09-08.note":"여전히 시차 적응 중. 오전에 야외 일정 하나, 오후에 실내 일정 하나, 호텔에서 15분 이내 거리로만 움직입니다. 경복궁은 화요일에 문을 닫아 오늘은 일부러 궁궐을 건너뛰고 성수대교만 잠깐 건너요 — 서울숲은 이 호텔에서 갈 수 있는 가장 평평하고 그늘 많은 녹지 공간입니다.","day.2026-09-08.pace":"가벼움","day.2026-09-08.title":"여유로운 강남","day.2026-09-08.weatherNote":"예보상 첫 여정 중 가장 좋은 날. 맑고 27°C, 새벽에는 선선함. 서울숲과 성수를 나중이 아니라 오늘로 배치한 이유예요 — 야외 오전이 가능할 때 잡으세요.","day.2026-09-09.gist":"Jun, Ann, 아기는 10:00 열차로 대전. 나머지는 강남.","day.2026-09-09.nap.0.end":"대략 11:00","day.2026-09-09.nap.0.start":"열차 안에서","day.2026-09-09.nap.0.who":"7개월","day.2026-09-09.nap.1.end":"13:00","day.2026-09-09.nap.1.start":"11:30","day.2026-09-09.nap.1.who":"5개월","day.2026-09-09.nap.2.end":"15:00","day.2026-09-09.nap.2.start":"13:00","day.2026-09-09.nap.2.who":"두 살 아이","day.2026-09-09.note":"여행 중 유일한 장거리 일정이고, 파크 하얏트 구간에 일부러 붙였어요. 수서역이 삼성동에서 가깝고, 여기서 남쪽으로 가는 고속열차가 대전으로 가는 가장 빠른 방법이거든요. 10:00 열차면 아침이 진짜 여유로워요 — 호텔에서 아침 먹고, 7개월 아기를 새벽에 깨울 필요도 없고, 그러고도 정오 전에 대전에 도착해요. 남은 사람들은 강남에서 일부러 느슨한 하루를 보내요.","day.2026-09-09.pace":"분리 · 3인 장거리","day.2026-09-09.title":"대전 다녀오기","day.2026-09-09.weatherNote":"서울도 대전도 맑고 따뜻해요. 열차 일정이라 날씨에 크게 좌우되지 않고, 이런 날에 배치해도 아깝지 않은 이유 중 하나예요.","day.2026-09-10.gist":"한산한 평일 롯데월드, 실내 위주. 오후 낮잠은 호텔에서.","day.2026-09-10.nap.0.end":"11:00","day.2026-09-10.nap.0.start":"09:30","day.2026-09-10.nap.0.who":"7개월","day.2026-09-10.nap.1.end":"13:00","day.2026-09-10.nap.1.start":"11:30","day.2026-09-10.nap.1.who":"5개월","day.2026-09-10.nap.2.end":"15:00","day.2026-09-10.nap.2.start":"13:00","day.2026-09-10.nap.2.who":"두 살 아이","day.2026-09-10.note":"놀이공원 가는 날이에요. 일부러 평일에, 그리고 일부러 대부분 실내인 이 공원으로 잡았어요. 잠실은 호텔에서 15분 거리라, 낮잠은 유모차 안이 아니라 호텔에서 잘 수 있어요.","day.2026-09-10.pace":"빡빡함 — 최대 하루","day.2026-09-10.title":"목요일 롯데월드","day.2026-09-10.weatherNote":"흐리고 따뜻해요. 이번 구간 가장 큰 하루로는 좋은 조건이에요 — 아이 셋과 몇 시간을 밖에서 보내야 할 때, 27°C에 구름 낀 날씨는 27°C 뙤약볕보다 훨씬 나아요.","day.2026-09-11.gist":"체크아웃하고 도시를 가로질러 인사동으로, 그다음 골목을 걸어 익선동까지.","day.2026-09-11.nap.0.end":"11:00","day.2026-09-11.nap.0.start":"09:30","day.2026-09-11.nap.0.who":"7개월","day.2026-09-11.nap.1.end":"15:00","day.2026-09-11.nap.1.start":"13:30","day.2026-09-11.nap.1.who":"두 살 아이","day.2026-09-11.note":"오전은 일부러 얕게, 오후는 제대로. 9명과 12일치 짐을 도시를 가로질러 옮기는 게 점심 전까지의 전부예요 — 원래 여기 있던 보톡스 일정은 8일로 옮겼어요. 짐만 내려놓으면 새 동네가 바로 문 밖이에요. 그래서 오후는 인사동을 제대로 도는 산책 코스로 익선동에서 끝나요. 전부 평지고, 방에서 10분 안 거리예요.","day.2026-09-11.pace":"가벼움 · 이동일","day.2026-09-11.title":"북쪽으로 이동","day.2026-09-11.weatherNote":"예보상 가장 더운 날이에요. 30°C에 흐림 — 쨍한 게 아니라 습해요. 이동일이라 대부분은 실내나 차 안이에요. 인사동 산책은 그늘진 쪽으로 걷고, 더위가 심해지면 쌈지길로 피하세요.","day.2026-09-12.gist":"국립중앙박물관은 무료에 평지, 그다음은 용산 곳곳.","day.2026-09-12.nap.0.end":"11:00","day.2026-09-12.nap.0.start":"09:30","day.2026-09-12.nap.0.who":"7개월","day.2026-09-12.nap.1.end":"13:00","day.2026-09-12.nap.1.start":"11:30","day.2026-09-12.nap.1.who":"5개월","day.2026-09-12.nap.2.end":"15:00","day.2026-09-12.nap.2.start":"13:00","day.2026-09-12.nap.2.who":"두 살 아이","day.2026-09-12.note":"토요일이라 궁궐과 시장은 가장 붐빌 겁니다. 국립중앙박물관은 정반대예요. 규모가 크고, 평지에, 냉방이 되고, 어디든 엘리베이터가 있고, 입장료도 무료입니다. 서울의 큰 명소 중에서 아기와 할머니·할아버지에게 가장 편한 곳입니다.","day.2026-09-12.pace":"보통","day.2026-09-12.title":"박물관 가는 날","day.2026-09-12.weatherNote":"흐리고 28°C. 박물관 내부는 전체가 냉방이라 이 하루는 애초에 날씨 영향을 안 받도록 설계돼 있어요. 그래서 이어지는 용산 일정에도 실내 대안을 함께 넣어 뒀습니다.","day.2026-09-13.gist":"헤어, 한복, 그리고 10:50 경복궁 사진 촬영. 유일하게 확정된 오전입니다.","day.2026-09-13.nap.0.start":"이동 중 아기띠에서","day.2026-09-13.nap.0.who":"7개월","day.2026-09-13.nap.1.start":"이동 중 아기띠에서","day.2026-09-13.nap.1.who":"5개월","day.2026-09-13.nap.2.end":"16:30","day.2026-09-13.nap.2.start":"14:45","day.2026-09-13.nap.2.who":"두 살 아이","day.2026-09-13.note":"이번 여행에서 유일하게 미룰 수 없는 오전입니다. 아홉 명이 한복 차림에 헤어·메이크업을 마치고 10:50까지 흥례문 안에 서 있어야 해요. 그 앞의 모든 일정은 이 시간에서 역산해 짰습니다. 순서가 중요한데, 뻔한 순서가 아닙니다. 메이크업 살롱은 08:00에 열지만 한복집은 09:00에야 문을 열어요. 그래서 메이크업이 먼저이고, 한복 대여는 대여점 문 여는 순간 바로 시작해야 합니다.","day.2026-09-13.pace":"빡빡함 · 콜타임 엄수","day.2026-09-13.title":"한복, 그리고 사진","day.2026-09-13.weatherNote":"일기예보에 소나기. 하필이면 여행 중 유일하게 유료로 예약해 놓은 야외 일정이 있는 날입니다. 일정 중 날씨에 가장 취약한 일정이니 과할 정도로 대비해 두는 게 낫습니다 — 12일의 사진작가 관련 메모를 확인하세요.","day.2026-09-14.gist":"아침엔 청계천 산책, 낮잠 뒤엔 망원시장과 연남동.","day.2026-09-14.nap.0.end":"11:00","day.2026-09-14.nap.0.start":"09:30","day.2026-09-14.nap.0.who":"7개월","day.2026-09-14.nap.1.end":"13:00","day.2026-09-14.nap.1.start":"11:30","day.2026-09-14.nap.1.who":"5개월","day.2026-09-14.nap.2.end":"15:00","day.2026-09-14.nap.2.start":"13:00","day.2026-09-14.nap.2.who":"두 살 아이","day.2026-09-14.note":"오전엔 종로에서 여유롭게, 낮잠 뒤엔 서쪽으로. 광장시장은 일부러 뺐어요 — 이제는 시장이라기보다 관광 사진 줄서기가 됐고, 아기들이 있기엔 정말 힘든 공간이에요. 망원은 아직 제대로 굴러가는 쪽이에요: 사람들이 실제로 장을 보러 오는 동네 시장이고, 홍대에서 두 정거장, 옆에는 평지의 한강공원과 경의선숲길이 있어요. 오늘은 월요일이라, 이쪽 동네에서 하루를 보내기엔 가장 조용한 저녁이에요.","day.2026-09-14.pace":"보통","day.2026-09-14.title":"마포, 현지인의 시장","day.2026-09-14.weatherNote":"맑고 29°C. 한낮에 시장 다니기엔 더운 날씨라, 망원을 16:30에 넣은 이유이기도 해요 — 아케이드가 지붕이 있고, 더위도 한풀 꺾이고, 먹거리 노점은 늦은 오후가 제일이에요.","day.2026-09-15.gist":"더현대 서울에서 아이 옷, 코스트코, 이어서 명동에서 스킨케어.","day.2026-09-15.nap.0.end":"11:00","day.2026-09-15.nap.0.start":"09:30","day.2026-09-15.nap.0.who":"7개월","day.2026-09-15.nap.1.end":"13:00","day.2026-09-15.nap.1.start":"11:30","day.2026-09-15.nap.1.who":"5개월","day.2026-09-15.nap.2.end":"15:00","day.2026-09-15.nap.2.start":"13:00","day.2026-09-15.nap.2.who":"두 살 아이","day.2026-09-15.note":"본격적인 쇼핑 데이인데, 여행 후반에 배치해서 남은 캐리어 상황을 알고 물건을 살 수 있어요. 남대문은 여의도의 더현대 서울로 바꿨어요 — 아이 옷 브랜드가 더 좋고, 냉방, 수유실, 엘리베이터, 지하 식품관까지 갖춰져 있어, 두 살 아이를 데리고 다니는 상황에선 시장 가격보다 이쪽이 훨씬 나아요. 코스트코 양평점은 여기서 10분 거리라, 두 곳을 한 번에 묶을 수 있어요. 오후엔 명동에서 스킨케어. 오늘은 경복궁이 휴관인데, 이미 다녀왔으니 아쉬울 게 없어요.","day.2026-09-15.pace":"보통 · 쇼핑","day.2026-09-15.title":"아이 옷·코스트코·스킨케어","day.2026-09-15.weatherNote":"대체로 흐림. 하루의 대부분이 실내예요 — 백화점, 창고형 매장, 명동 — 그래서 처음부터 날씨를 안 타게 짰어요. 예보가 비로 바뀌어도 여기 있는 일정은 하나도 옮길 필요가 없어요.","day.2026-09-16.gist":"체크아웃하고 인천 차이나타운에서 짜장면, 다리를 건너 리조트로.","day.2026-09-16.nap.0.end":"11:00","day.2026-09-16.nap.0.start":"09:30","day.2026-09-16.nap.0.who":"7개월","day.2026-09-16.nap.1.end":"16:00","day.2026-09-16.nap.1.start":"14:00","day.2026-09-16.nap.1.who":"두 살 아이","day.2026-09-16.note":"진료 일정이 얹혀 있지 않은, 순수하게 이동만 하는 날 — 그게 이번 이동일의 핵심이에요. 점 빼기는 17일에 잡혀 있어서 오늘은 체크아웃하고 도시를 가로질러 수영장이 있는 곳으로 이동하는 것뿐이에요. 하나 더 있는 건 점심: 인천이 짜장면의 발상지이고, 원조 차이나타운이 다리 진입로에서 가까워서 따로 다녀오는 대신 가는 길에 들러 먹을 수 있어요. 영종도 두 호텔 모두 체크인이 15:00이라, 오후 낮잠은 이미 우리 방이 된 곳에서 재워야 해요.","day.2026-09-16.pace":"가벼움 · 이동일","day.2026-09-16.title":"섬으로","day.2026-09-16.weatherNote":"인천 구간에는 다시 소나기가 와요. 비 오는 이동일은 문제까지는 아니고 성가신 정도지만, 차이나타운에서는 차와 식당 사이를 걸어야 해서 우산은 가방 맨 위에 두세요.","day.2026-09-17.gist":"10:00에 어른 셋 점 빼기, 정오쯤 복귀, 오후는 일부러 비워둡니다.","day.2026-09-17.nap.0.end":"11:00","day.2026-09-17.nap.0.start":"09:30","day.2026-09-17.nap.0.who":"7개월","day.2026-09-17.nap.1.end":"13:00","day.2026-09-17.nap.1.start":"11:30","day.2026-09-17.nap.1.who":"5개월","day.2026-09-17.nap.2.end":"15:00","day.2026-09-17.nap.2.start":"13:00","day.2026-09-17.nap.2.who":"두 살 아이","day.2026-09-17.note":"여행 마지막 온전한 하루예요. 확정된 오전 예약 하나 말고는 일부러 거의 비워두었어요. 아기 둘, 두 살 아이, 70대 두 분과 함께한 12일차, 가장 값진 일정은 '아무것도 없음'입니다. 르네의원은 10:00에 열고 그날 첫 슬롯이 여러분이지만, 환자 셋에 의사 한 명이라 11:30쯤까지 걸린다고 잡고 진료실은 12:00까지 확보해 두세요. 그 외에는 예약이 없으니 시간이 밀려도 아무 손해가 없어요. 짐은 오후에 싸서 내일 아침을 편하게 두세요.","day.2026-09-17.pace":"가벼움 · 일부러","day.2026-09-17.title":"비워둔 하루","day.2026-09-17.weatherNote":"또 소나기. 이번 여행의 어느 비 오는 날보다도 영향이 적어요. 점 빼기는 실내, 리조트도 실내, 시술 뒤에는 어차피 강한 햇볕을 피해야 하니까요. 오늘은 오히려 구름이 정말 도움이 됩니다.","day.2026-09-18.gist":"마지막 아침, 이른 점심, 16:40 KE041로 귀국. 공항까지 15분.","day.2026-09-18.nap.0.end":"언젠가는","day.2026-09-18.nap.0.start":"기내에서","day.2026-09-18.nap.0.who":"셋 다","day.2026-09-18.note":"영종도에 묵는 진짜 장점 하나: 공항까지 90분이 아니라 15분이에요. 여유로운 아침, 이른 점심, 새벽부터 시작하지 않아도 되는 출국일.","day.2026-09-18.pace":"이동일","day.2026-09-18.title":"집으로","day.2026-09-18.weatherNote":"출국일에 소나기예요. 터미널까지 가는 시간은 여유 있게 잡으세요 — 거리는 짧지만, 비 오는 금요일 아침 인천공항에서 9명과 짐 카트 행렬을 끌고 교통을 낙관할 때는 아니에요.","dose.d0-carriers.detail":"아이 셋이니 답도 셋이에요. 아기 둘은 대부분의 날 소프트 아기띠, 두 살 아이는 가볍고 완전히 접히는 유모차 한 대. 망원시장, 익선동 골목, 궁 자갈길은 사실상 아기띠만 가능해요. 더현대 서울과 국립중앙박물관은 반대로, 넓고 평평하고 엘리베이터가 있어서 유모차가 제 역할을 해요.","dose.d0-carriers.fallback":"짐을 다 가져오기가 부담스럽다면, KPLANZ가 서울에서 유모차, 카시트, 여행용 아기 침대를 대여해요.","dose.d0-carriers.label.0":"롯데월드, 경복궁, 코엑스, 국립중앙박물관은 현장에서 유모차를 대여해요.","dose.d0-carriers.title":"아기띠·유모차 실전편","dose.d0-carriers.who":"두 가족","dose.d0-formula.detail":"기저귀는 어렵지 않아요 — 이마트, 홈플러스, 편의점 어디든 모든 사이즈가 있고, 쿠팡은 호텔로도 배송해요. 분유는 달라요. 두 아기 중 하나라도 미국의 특정 브랜드를 먹는다면, 12일치를 짊어지고 오거나 낯선 나라에서 여행 중간에 바꾸거나 둘 중 하나예요. 어느 쪽도 4일차 새벽 3시에 결정할 일이 아니에요.","dose.d0-formula.fallback":"7개월 아기용 이유식 파우치는 CU나 GS25 어디서든 팔아요. 이유식 문제는 따로 준비 안 해도 해결돼요.","dose.d0-formula.label.0":"아기 둘의 12일치 분유는 캐리어 하나 분량이에요. 지금 부피를 계산하고 누가 들지 정하세요.","dose.d0-formula.label.1":"세탁은 두 번, 9일경 파크 하얏트와 14일경 인사동에서 계획하세요. 두 호텔 모두 셀프 세탁실은 없어요.","dose.d0-formula.title":"분유·이유식·기저귀 결정","dose.d0-formula.who":"두 가족","dose.d0-ke042.detail":"한국 시간 9월 6일(일) 16:40 도착. 벽쪽 아기 바구니 좌석은 아직 배정되지 않았다면 꼭 요청해 볼 만해요.","dose.d0-ke042.label.0":"지금 대한항공에 아기 바구니 좌석을 요청하세요. 아기 체중 제한이 있어요.","dose.d0-ke042.label.1":"KE042가 ICN 제2여객터미널 도착인지 확인하세요. 기사님이 제자리에서 기다리도록.","dose.d0-ke042.label.2":"시애틀 공항은 세 콩코스 모두에 수유실이 있어요. 탑승 전에 수유와 유축을 마치세요.","dose.d0-ke042.title":"KE042 · 시애틀→인천","dose.d0-ke042.where":"SEA 출발 · ICN 도착","dose.d0-ke042.who":"다 함께","dose.d0-leave.detail":"국제선 출발 네 시간 전. 아홉 명, 그중 둘은 걷지도 못하는 아기예요. 지나쳐 보이지만 지나치지 않아요.","dose.d0-leave.label.0":"카시트 세 개는 위탁 수하물이나 게이트 체크. 어느 쪽으로 할지 카운터가 아니라 집에서 나서기 전에 정하세요.","dose.d0-leave.title":"시애틀–타코마 공항 출발","dose.d0-leave.where":"SEA · 대한항공 국제선 체크인","dose.d0-leave.who":"다 함께","dose.d0-medical.detail":"체류지마다 소아 응급실 정보를 한국어로 카드에 적어, 어른들 지갑에 한 장씩 넣어 두세요. 22:00에 아픈 아기를 태운 택시 기사님은 폰으로 읽어주는 영어 주소를 원하지 않아요.","dose.d0-medical.fallback":"파크 하얏트 구간: 삼성서울병원, 약 10분. 인사동 구간: 서울대학교병원, 5–10분. 영종도 구간: 인천 인하대학교병원, 약 25분.","dose.d0-medical.label.0":"각 병원에 24시간 소아 응급실이 있는지 확인하고, 주소는 한국어로 적어 두세요.","dose.d0-medical.label.1":"여행자 의료보험이 한국에서 세 아이 모두의 소아 응급실 진료를 보장하는지 확인하세요.","dose.d0-medical.title":"쓸 일 없길 바라는 카드","dose.d0-medical.who":"다 함께","dose.d0-pack.detail":"여권, 카시트, 유모차 태그, 분유와 유축 모유는 기내 가방에, 어른마다 여벌 옷 한 벌씩도 기내 가방에. 마지막 한 가지는 아기 둘과 함께라면 선택이 아니에요.","dose.d0-pack.fallback":"잊고 온 건 처방약과 여권만 빼면 서울에서 다 살 수 있어요.","dose.d0-pack.label.0":"출발 한 달 전 미국 여권 K-ETA 면제 확인. 출발 일주일 이내에 Q-Code 재확인.","dose.d0-pack.title":"최종 짐·장비 점검","dose.d0-pack.who":"다 함께","dose.d1-cash.detail":"공항 은행 ATM은 미국 카드를 받고, 명동 어느 환전소보다 나은 환율을 줘요. 일행 전체의 잡비를 한 번에 넉넉히 뽑으세요 — 망원시장, 인사동 노점, 그리고 실제로 먹고 싶어질 대부분의 소소한 먹거리는 현금 결제고, 이걸 여행 중간에 해결하고 싶지는 않을 거예요. 티머니 카드는 같은 편의점에서 함께 사세요.","dose.d1-cash.fallback":"기사님이 기다리고 있다면 이 일은 통째로 넘기세요. 호텔에서 환전되고, 편의점 어디서든 티머니를 팔고, 파크 하얏트 로비에 ATM이 있어요. 이 일 하나 때문에 픽업을 잃을 만한 가치는 없어요.","dose.d1-cash.label.0":"차에 짐 싣는 동안 현금과 티머니를 해결하세요. 두 시간이 임박했다면 건너뛰고 호텔에서 처리하세요.","dose.d1-cash.label.1":"출발 전에 Uber를 설치하세요. 기존 계정, 번호, 카드가 한국에서도 그대로 작동해서 새 가입이 필요 없어요.","dose.d1-cash.label.2":"원하면 집에서 Kakao T도 설치해 두되, 해외번호 인증에 의지해서 도착하지는 마세요.","dose.d1-cash.label.3":"k.ride는 3순위로 두세요. 최근 후기에서 미국, 캐나다, 호주 카드가 거절됐다는 언급이 있어요.","dose.d1-cash.title":"현금·티머니 · 한 명만","dose.d1-cash.who":"어른 한 명, 짐 싣는 동안","dose.d1-checkin.detail":"방마다 아기 침대가 이미 들어와 있는지 확인하세요. 프런트에 있을 때 일행 전원의 Globalist 조식 안내도 함께 물어보세요.","dose.d1-checkin.label.0":"아기 침대와 젖병 워머는 체크인이 아니라 예약할 때 요청하세요.","dose.d1-checkin.title":"체크인·아기 침대·짐 풀기","dose.d1-checkin.who":"다 함께","dose.d1-dinner.detail":"룸서비스나 편의점. 오늘 저녁은 시작 시간이 있는 식당은 예약하지 마세요 — 공항이 지연되는 만큼 이 식사도 계속 밀리게 돼요.","dose.d1-dinner.fallback":"도착일 저녁으로 편의점 식사는 전혀 부끄러울 것 없는 선택이에요.","dose.d1-dinner.label.0":"장 정결제 첫 회분은 비행이 지연됐더라도 18:00에서 21:00 사이에 복용하세요.","dose.d1-dinner.title":"간단한 저녁, 호텔 근처","dose.d1-dinner.who":"다 함께","dose.d1-driver.detail":"마지막 짐이 카트에 실리는 순간, 어른 한 명이 곧장 만남의 장소로 걸어가 기사님과 연락을 취하세요. eSIM 카운터도, ATM도 아니에요. 이 페이지의 다른 모든 일은 늦어도 되지만, 이것만은 안 돼요.","dose.d1-driver.fallback":"안내판 앞에 기사님이 없다면, 찾아 나서기 전에 먼저 업체에 전화하세요. 홀을 헤매지 마세요 — 제2여객터미널 입국장에는 만남의 장소가 여러 군데 있고 서로 멀리 떨어져 있어요.","dose.d1-driver.label.0":"기사님은 착륙 시각부터 두 시간만 기다려요. KE042가 16:40 도착이니까, 18:40이면 예약이 무효가 돼요.","dose.d1-driver.label.1":"짐이 다 나오면 어른 한 명을 먼저 보내세요. 연락만 닿으면 일행이 도착할 때까지 대기 시간이 멈춰요.","dose.d1-driver.label.2":"업체 전화번호는 종이에도 적어 지니세요. 신호가 안 잡힐 수 있는 폰만 믿어서는 안 돼요.","dose.d1-driver.title":"무엇보다 기사님 먼저","dose.d1-driver.where":"ICN 제2여객터미널 입국장 — 업체 만남의 장소","dose.d1-driver.who":"어른 한 명이 먼저","dose.d1-esim.detail":"이건 10분짜리 점검이지 별도의 일이 아니에요. 이제는 기사님 연락 전이 아니라 후에 해요. 시애틀을 떠나기 전에 eSIM을 사고, 시애틀 공항 게이트 Wi-Fi에서 탑승 전에 전부 활성화해 두세요 — 한국 eSIM 프로필은 네트워크를 잡으면 자동으로 켜져서, 입국심사까지 걸어가는 사이에 폰 다섯 대가 알아서 연결돼요.","dose.d1-esim.fallback":"폰 하나가 말썽이면 공항 포켓 Wi-Fi 한 대만 빌려도 일행 전체가 쓸 수 있어요. 나머지는 입국장이 아니라 호텔에서 정리하세요.","dose.d1-esim.label.0":"eSIM은 탑승 전에 활성화하세요. 입국장에서 폰 다섯 대를 처리하면 45분이 날아가고 기사 대기 시간까지 놓칠 수 있어요.","dose.d1-esim.label.1":"시애틀을 떠나기 전에 모든 폰이 통신사 잠금 해제 상태이고 eSIM을 지원하는지 확인하세요.","dose.d1-esim.label.2":"문자 인증코드가 필요한 앱 가입은 한국 eSIM으로 바꾸기 전에 마치세요. 데이터 전용 eSIM은 미국 SMS를 막을 수 있어요.","dose.d1-esim.title":"기사님 연락 후 eSIM","dose.d1-esim.where":"ICN 입국장","dose.d1-esim.who":"어른들 모두","dose.d1-immig.detail":"60분이 아니라 90분이에요. 일요일 16:40 도착은 장거리 항공편이 몰리는 시간대라, 카시트 세 개에 게이트 위탁 유모차 두 대는 보통 캐로셀이 끝난 뒤에도 대형 수하물 코너에 나오는 데 15–25분이 더 걸려요. 아기 둘은 차에 타기 전에 수유를 해야 해요.","dose.d1-immig.fallback":"줄이 지독하면 어른 한 명을 먼저 수하물 쪽으로 보내고, 나머지는 함께 입국심사를 통과하세요.","dose.d1-immig.label.0":"한국 입국심사에서 우선 심사대를 요청하세요. 아기 동반 가족은 대개 이용할 수 있어요.","dose.d1-immig.label.1":"출발 전 Q-Code와 세관 신고에 필요한 최신 서류를 확인하세요.","dose.d1-immig.label.2":"내리기 전에 승무원에게 게이트 위탁 유모차를 어디서 받는지 물어보세요.","dose.d1-immig.title":"입국·짐·유모차 찾기","dose.d1-immig.who":"다 함께","dose.d1-land.detail":"착륙. 여기서부터 호텔 문 앞까지 걸리는 시간이야말로 사람들이 늘 과소평가하는 부분이에요.","dose.d1-land.label.0":"제2여객터미널 수유실: 3층, 1번 게이트 근처.","dose.d1-land.title":"KE042 인천 도착","dose.d1-land.where":"인천국제공항","dose.d1-land.who":"다 함께","dose.d1-sleep.detail":"시차 16시간. 다 함께 03:00에 눈이 떠질 걸 예상하고, 맞서지 마세요 — 내일 일정이 이렇게 짜인 이유예요.","dose.d1-sleep.title":"다 함께 잠자리로","dose.d1-sleep.who":"다 함께","dose.d1-transfer.detail":"인천에서 삼성동까지는 도시를 가로지르는 먼 거리예요. 아홉 명에 짐까지 하면 차량 두 대 아니면 큰 승합차 한 대인데, 카시트를 지정해서 출발 전에 예약해 두세요. 18:10에 연락이 닿았으니, 이 출발 시각은 위약금 없이 10~15분 정도는 늦출 수 있어요.","dose.d1-transfer.label.0":"픽업 업체가 영유아 카시트 세 개를 제공하는지 확인하세요. 한국 법상 만 6세 미만은 카시트 착용이 필수예요.","dose.d1-transfer.label.1":"두 시간 대기가 예정 착륙 시각부터인지, 입국장 통과 시점부터인지 확인하세요.","dose.d1-transfer.label.2":"일요일 저녁 도착일 때의 견적 이동 시간을 확인하세요.","dose.d1-transfer.title":"파크 하얏트 개별 이동","dose.d1-transfer.where":"파크 하얏트 서울, 강남구 테헤란로 606","dose.d1-transfer.who":"다 함께","dose.d10-bfast.detail":"아홉 시 시작이지만 손해 볼 것 없어요 — 더현대 서울은 10:30이 되어야 문을 여니, 더 일찍 나가봤자 닫힌 몰 앞에 서 있는 시간만 늘어요.","dose.d10-bfast.title":"아침","dose.d10-bfast.who":"다 함께","dose.d10-costco.detail":"더현대 서울에서 10분 거리라, 다른 날이 아니라 오늘 넣은 이유가 전적으로 이거예요. 양평점이 여의도에서 가장 가까운 지점이고 10:00–22:00 영업이에요. 이 매장에서 사둘 만한 한국 전용 품목은 자체 브랜드 김, 김스낵, 곶감, 허니버터 아몬드, 그리고 대용량 스킨케어예요 — 이 가격에는 올리브영에서 그대로 들고 나올 수 없는 것들이에요.","dose.d10-costco.getting":"더현대 서울에서 택시로 약 10분.","dose.d10-costco.label.0":"미국 코스트코 실물 카드 지참. 회원권은 세계 공용, 앱은 한국 입구 스캐너에서 안 될 수 있어요.","dose.d10-costco.label.1":"한국 코스트코는 둘째·넷째 일요일 휴무. 화요일은 정상 영업이지만, 주말로 옮기면 꼭 확인하세요.","dose.d10-costco.label.2":"입구에서 카드 결제 정책 확인. 미국 카드가 안 될 때를 대비해 현금도 넉넉히 챙기세요.","dose.d10-costco.label.3":"코스트코에서 산 물건은 크고 무거워요. 짐 정리는 오늘 밤에 하세요. 18일 공항에서 하면 늦어요.","dose.d10-costco.title":"코스트코 양평점","dose.d10-costco.where":"코스트코 양평점, 영등포구 선유로 156","dose.d10-costco.who":"쇼핑 팀","dose.d10-dinner.detail":"도심에서 먹는 마지막 저녁이에요 — 여기서부터는 공항 호텔이에요. 누군가 한 번 더 먹고 싶다고 했던 것 하나를 골라서 거기로 가세요.","dose.d10-dinner.label.0":"저녁 예약. 즉흥으로 정하고 싶지 않은 마지막 편한 식사예요.","dose.d10-dinner.title":"종로에서 마지막 저녁","dose.d10-dinner.who":"다 함께","dose.d10-easy.detail":"호텔, 인사동 거리, 카페. 오늘 팀을 나누는 이유는 원치 않는 쇼핑을 억지로 견디지 않아도 되게 하려는 거예요. 다른 사람 볼일로 두 살 아이를 여의도까지 끌고 가기엔 너무 멀어요.","dose.d10-easy.title":"그 외 여유로운 오전","dose.d10-easy.who":"할머니·할아버지 · 아이들","dose.d10-hyundai.cost":"백화점 가격대. 시장보다 품목당 예산을 늘리고, 사는 개수는 줄여서 잡으세요.","dose.d10-hyundai.detail":"남대문 대신 넣은 곳이고, 이 팀한테는 고민할 것도 없이 더현대예요. 더현대 서울은 서울에서 가장 최근에 문을 연, 후기가 꾸준히 좋은 백화점이에요: 한국·해외 브랜드가 다 모인 아동복 전 층, 유모차를 세워둘 수 있는 실내 정원, 제대로 된 수유실, 넓고 평평한 통로, 어디에나 있는 엘리베이터, 그리고 점심으로도 충분한 지하 식품관이 있어요. 시장 가격 대신 백화점 가격을 내야 해요 — 이게 감수할 부분이고, 두 살 아이를 데리고 다닐 땐 이쪽이 맞는 선택이에요.","dose.d10-hyundai.fallback":"잠실의 롯데월드몰이 비슷한 쇼핑을 커버하고, 10일에 이미 근처까지 갔었어요. 스타필드 하남은 더 크지만 서울 밖이라, 이렇게 빡빡한 날에 굳이 갈 거리는 아니에요.","dose.d10-hyundai.getting":"종로3가역에서 5호선 여의도역까지 직행.","dose.d10-hyundai.label.0":"여권 챙기세요. 택스프리 환급에 필요하고, 창구는 매장 안에 있어요.","dose.d10-hyundai.label.1":"출발 전에 오픈 시간 확인. 백화점은 10:00이 아니라 10:30에 여는 곳이 많아요.","dose.d10-hyundai.label.2":"점심은 건물 안에서. 지하 식품관은 예약 없이도 인원수를 받아줘요.","dose.d10-hyundai.title":"더현대 서울 · 아이 옷","dose.d10-hyundai.where":"더현대 서울, 여의도 · 아동복 층과 식품관","dose.d10-hyundai.who":"쇼핑 팀","dose.d10-lunch.detail":"숙소 근처에서, 낮잠 전에. 쇼핑 팀도 같은 시간에 더현대 식품관에서 먹으니, 점심 때 다시 합류하지 않아도 돼요.","dose.d10-lunch.title":"호텔 팀은 인사동 점심","dose.d10-lunch.who":"할머니·할아버지 · 아이들","dose.d10-myeongdong.detail":"명동 플래그십 올리브영과 주변 브랜드 매장, 여기서 사람이 교대해도 괜찮아요 — 여의도와 코스트코를 돈 사람은 좀 앉아 쉴 자격이 있어요. 이번 여행에서 스킨케어를 제대로 사는 곳이에요: 공항 말고 여기서 물량을 챙겨 오세요.","dose.d10-myeongdong.getting":"호텔에서 택시로 10분, 혹은 3호선 두 정거장에 짧은 도보.","dose.d10-myeongdong.label.0":"택스프리 환급 기준 금액과 절차 확인. 여권 챙기세요.","dose.d10-myeongdong.label.1":"액체·젤·크림류는 오늘 밤 위탁 수하물에 다 넣으세요.","dose.d10-myeongdong.title":"명동 · 스킨케어","dose.d10-myeongdong.where":"명동","dose.d10-myeongdong.who":"쇼핑 팀","dose.d10-nap.title":"낮잠 시간","dose.d10-nap.who":"아이 셋","dose.d10-pack.detail":"내일은 호텔을 옮기고, 오늘은 백화점 옷, 코스트코 장보기, 스킨케어까지 샀어요. 캐리어가 하나 더 필요한지는, 18일 인천 체크인 카운터가 아니라 오늘 밤에 알아두는 게 나아요.","dose.d10-pack.label.0":"추가 캐리어가 필요하면 오늘 사세요. 영종도나 공항까지 미루지 마세요.","dose.d10-pack.title":"1차 짐 정리·캐리어 점검","dose.d10-pack.who":"어른들","dose.d10-toyeouido.detail":"종로3가역에서 여의도역까지 5호선이 환승 없이 바로 이어져요, 서울치고는 드물게 편한 편이에요. 택시로는 약 25분. 어느 쪽이든 11:30에 다른 사람들과 함께가 아니라 오픈 직후에 도착해요.","dose.d10-toyeouido.title":"여의도로 건너가기","dose.d10-toyeouido.where":"더현대 서울, 영등포구 여의대로 108","dose.d10-toyeouido.who":"쇼핑 팀","dose.d11-bfast.detail":"체크아웃은 11:00, 이동 차량은 11:30이라 9
