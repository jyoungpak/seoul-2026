시 아침이면 서두르지 않아도 한 시간이 남아요. 전날 밤에 짐을 싸두면 오늘 아침은 정말 여유로워요.","dose.d11-bfast.title":"아침과 마지막 짐 정리","dose.d11-bfast.who":"다 함께","dose.d11-checkin.detail":"호텔이 파라다이스시티 단지 안에 있어서, 한 번 들어가면 비행기 타기 전까지 다시 나올 일이 없어요.","dose.d11-checkin.label.0":"체크인 15:00. 도착 직후 낮잠 위해 15일 밤부터 방 하나 예약.","dose.d11-checkin.title":"체크인","dose.d11-checkin.who":"다 함께","dose.d11-checkout.detail":"잊고 가기 쉬운 것들을 방마다 확인하세요: 젖병 부품, 충전기, 신발 한 짝, 두 살 아이가 쓰는 그 컵. 인사동에서 한 시간 더 보내고 싶으면 프런트에 짐을 맡겨 두세요.","dose.d11-checkout.title":"인사동 체크아웃","dose.d11-checkout.who":"다 함께","dose.d11-dinner.detail":"이 근처에는 걸어갈 만한 외부 식당이 거의 없어요. 안에서 먹는 걸로 계획하세요.","dose.d11-dinner.label.0":"단지 내 식당 옵션과 9명 예약 가능 여부 확인.","dose.d11-dinner.title":"리조트에서 저녁","dose.d11-dinner.who":"다 함께","dose.d11-jjajang.cost":"짜장면은 대략 ₩8,000–₩12,000, 다 같이 먹는 탕수육은 그보다 더 나와요.","dose.d11-jjajang.detail":"인천 차이나타운은 짜장면이 처음 만들어진 곳이에요. 1800년대 말 항구에서 일하던 산둥 출신 화교들이 만들었고, 여기서 먹는 짜장면은 다른 곳에서 먹는 것과 정말 달라요. 이 인원에는 중화루가 답이에요: 평이 좋고, 아홉 명이 앉을 만큼 넓고, 유명한 두 집이 보통 한 시간씩 걸리는 것과 달리 10~20분 대기로 끝나요. 오늘이 수요일이라는 게 가장 큰 강점이에요 — 주말 차이나타운은 대기가 정말 지독해요.","dose.d11-jjajang.fallback":"공화춘이 원조 집이고 박물관 같은 내부가 있지만, 음식은 평범하다는 평이 많고 대기도 길어요. 신승반점은 맛으로는 현지인들의 선택이에요. 중화루가 문을 닫았을 때를 대비해 둘 다 알아두면 좋아요.","dose.d11-jjajang.label.0":"9명은 미리 전화 예약. 차이나타운은 이 인원의 워크인은 어려워요.","dose.d11-jjajang.label.1":"짜장면은 안 지워져요. 세 살 이하 턱받이 필수, 좋은 옷은 피하기.","dose.d11-jjajang.label.2":"휴무일 확인. 차이나타운 식당 중엔 월 1회 평일 휴무인 곳이 있어요.","dose.d11-jjajang.title":"짜장면 원조에서","dose.d11-jjajang.where":"중화루, 인천 차이나타운 · 인천역 근처","dose.d11-jjajang.who":"다 함께","dose.d11-lastinsa.detail":"짐은 다 쌌고, 체크아웃은 11:00까지, 쌈지길은 문 앞에서 4분 거리예요. 육지에서 여유롭게 보낼 수 있는 마지막 시간 — 아직 못 산 작은 기념품을 사러 가거나, 아예 건너뛰고 로비에 앉아 있어도 돼요.","dose.d11-lastinsa.fallback":"건너뛰어도 아쉬울 것 없어요. 공항 면세점이 동네 하나 크기예요.","dose.d11-lastinsa.label.0":"이 산책은 선택이에요. 오늘 아침 아무도 호텔을 나갈 필요 없어요.","dose.d11-lastinsa.title":"인사동 마지막 산책","dose.d11-lastinsa.where":"인사동길, 호텔에서 4분","dose.d11-lastinsa.who":"원하는 사람만","dose.d11-nap.detail":"평소보다 짧고, 다리 건너오는 이동으로 일부는 이미 채워졌어요. 늘리지 말기 — 오늘 밤이 수영할 수 있는 마지막 기회예요.","dose.d11-nap.title":"낮잠 시간","dose.d11-nap.who":"아이 셋","dose.d11-resort.detail":"오늘은 일부러 실내와 그늘 위주로 짰어요. 원더박스는 파라다이스시티의 실내 가족 테마파크로, 두 살 아이에게 딱 맞는 규모와 온도예요 — 롤러코스터 규모가 아니라 회전목마 규모. 단지 안에 무료로 걸어볼 수 있는 공공 예술 작품도 많아요. 오늘이 확실하게 물놀이할 수 있는 유일한 날이에요: 점 빼기는 17일에 잡혀 있어서 아직 아무도 수영 금지가 아니에요.","dose.d11-resort.fallback":"호텔 방에서 느긋하게 목욕만 해도 충분해요.","dose.d11-resort.label.0":"오늘 원하면 수영하세요. 내일 시술 이후로는 7~10일간 물놀이 금지.","dose.d11-resort.label.1":"원더박스 운영 시간과 호텔 입장권 포함 여부 확인.","dose.d11-resort.label.2":"시메르는 7세 미만 입장 불가. 어른만 교대로 다녀오는 방식으로만 가능.","dose.d11-resort.label.3":"투숙객 50%쿠폰: 60,000→30,000원, 아쿠아존 19:00 마감","dose.d11-resort.title":"원더박스 또는 객실","dose.d11-resort.where":"파라다이스시티 단지 내","dose.d11-resort.who":"다 함께","dose.d11-toresort.detail":"바다 위로 25분이면 파라다이스시티예요. 아이 셋 다 차에서 잠들 가능성이 높은데, 어차피 체크인이 15:00이라 딱 좋아요.","dose.d11-toresort.label.0":"이 이동을 낮잠 전반으로 보세요. 도착해도 아무도 깨우지 마세요.","dose.d11-toresort.title":"다리 건너 영종도로","dose.d11-toresort.where":"하얏트 리젠시 인천 파라다이스시티, 영종도","dose.d11-toresort.who":"다 함께","dose.d11-transfer.detail":"종로에서 육지 쪽 인천역까지 약 한 시간. 돌아가는 길이라기보다 가는 길에 잠깐 들르는 정도예요 — 차이나타운이 영종대교 진입로 옆이라 잠깐 내려 먹고 다리를 건너 리조트까지 이어가면 돼요. 도착지 이름이 헷갈리는 문제는 걱정 마세요: 하얏트 리젠시 인천 파라다이스시티는 실제로 존재하는 단일 호텔이에요 — 원래 그랜드 하얏트 인천의 서쪽 타워였던 곳이 2025년에 리브랜딩되어 파라다이스시티 리조트 단지 안에 자리 잡고 있어요. 그래서 하얏트 멤버십과 리조트 시설을 한 번의 예약으로 다 누릴 수 있어요.","dose.d11-transfer.label.0":"이동 차량은 카시트 3개, 차이나타운 경유, 대기 시간 포함으로 예약.","dose.d11-transfer.label.1":"점심 시 기사가 짐 지켜주는지 확인. 안 되면 짜장면 17일로 이동.","dose.d11-transfer.label.2":"예약이 하얏트 리젠시인지 확인 — Paradise·Paradiso 아님","dose.d11-transfer.title":"인천 차이나타운으로","dose.d11-transfer.where":"인천 차이나타운, 중구 · 이어서 영종도","dose.d11-transfer.who":"다 함께","dose.d12-back.detail":"나오기 전에 의원에 돌아갈 택시를 불러 달라고 요청하세요. 10분 뒤면 도착합니다. 11:30쯤 마치면 남는 30분은 수영장에서 챙길 수 있어요.","dose.d12-back.title":"리조트로 복귀","dose.d12-back.who":"어른 셋 — NaRhee, Jun, Ann","dose.d12-bfast-rest.detail":"나머지는 오늘 일찍 일어날 필요 없어요. 여행 마지막 온전한 아침이고, 수영장은 바로 옆이고, 점심 전까지 아무 일정도 없어요.","dose.d12-bfast-rest.title":"느긋한 아침","dose.d12-bfast-rest.who":"나머지 모두","dose.d12-bfast.detail":"10:00 예약이 그날 첫 슬롯이고 르네의원까지 5분이 아니라 8~12분 거리라, 이 아침은 08:15에 시작해요. 그래도 서두를 정도는 아니에요 — 식탁에서 한 시간, 09:30에 나가면 초진 서류를 여유 있게 마칠 시간이 남아요.","dose.d12-bfast.label.0":"진료 팀만 일찍 먹고, 나머지는 09:00 아침 그대로.","dose.d12-bfast.title":"이른 아침 · 진료 팀만","dose.d12-bfast.who":"어른 셋 — NaRhee, Jun, Ann","dose.d12-dinner.detail":"열이틀, 아홉 명, 아직 서로 말을 나누는 사이. 괜찮은 곳으로 예약하세요.","dose.d12-dinner.title":"마지막 저녁","dose.d12-dinner.who":"다 함께","dose.d12-lunch.detail":"리조트 안에서 먹어요. 마지막 온전한 하루, 점심 때문에 택시 탈 필요 없어요. 진료 팀이 몇 분 늦게 올 수 있어요 — 기다리지 말고 먼저 시작하세요.","dose.d12-lunch.title":"리조트에서 점심","dose.d12-lunch.who":"다 함께","dose.d12-mole.cost":"공개된 가격 없음. 인천 시세는 보통 작은/중간 편평 점 하나에 10,000~20,000원 정도로, 강남보다 10~30% 저렴하고, 점이 여러 개면 패키지로 묶는 경우가 많아요. 조직검사로 넘어가면 약 30,000~60,000원을 더 잡으세요. 시술 시작 전에 데스크에서 가격을 확정하세요.","dose.d12-mole.detail":"10:00에 확정, 그날의 첫 슬롯, 어른 셋입니다. 2시간을 잡되 그보다 짧게 끝날 거예요. 한국 피부과는 이 시술을 파이프라인처럼 돌립니다: 사람마다 상담 10~15분, 상담이 끝나면 마취 크림을 발라 15~20분 두고, 그다음 점 하나당 실제 레이저나 셰이브가 3~10분입니다. 1번 환자에 마취가 도는 동안 2번 환자를 상담하기 때문에, 세 명이 걸리는 시간은 한 명의 세 배보다 훨씬 짧아요 — 현실적으로 13:00이 아니라 11:30쯤 나옵니다. 시간이 길어지는 요인은 제2외국어로 진행하는 초진 서류, 예상보다 점이 더 많이 나오는 경우, 마지막에 세 번 따로 결제하는 것입니다. 마지막 온전한 하루에 일부러 배치했어요: 오늘 하면 서울의 더위·햇볕·시장을 아물지 않은 상처를 안고 열이틀 동안 다닐 일이 없고, 수요일 워터파크도 이론상 금지가 아니라 실제로 마음껏 즐길 수 있는 상태로 남습니다. 이 배치의 대가는 시술 뒤 약 30시간 만에 출국한다는 점이에요 — 일반 셰이브나 레이저 제거라면 문제없지만, 의사가 더 깊이 절개하겠다고 하면 다시 생각해 봐야 할 부분입니다.","dose.d12-mole.fallback":"르네의원이 취소되면, 운서동 상권의 예스피부과(032-752-9730)가 리조트에서 5분 거리이고 목요일 10:00에 열며 피부과 전문의가 두 명입니다. 같은 상권에 같은 시간대인 영종중앙피부과(032-746-3200)와 닥터스피부과 영종점(032-710-2346)도 있어요.","dose.d12-mole.label.0":"진짜 마감은 14:00이 아니라 13:00 — 의원이 13:00–14:00 점심시간에 문을 닫습니다.","dose.d12-mole.label.1":"환자 셋에 의사 한 명. 현실적으로 11:30 종료, 진료실은 12:00까지 확보.","dose.d12-mole.label.2":"조직검사로 넘길 것이 있는지 확인. 조직검사가 필요하면 시애틀에서 하세요.","dose.d12-mole.label.3":"셰이브 대신 봉합을 권하면, 열 시간 비행 30시간 전에는 하지 마세요.","dose.d12-mole.label.4":"문성호 원장이 피부과 전문의인지 확인. akd.or.kr/dermatologist/verify에서 조회.","dose.d12-mole.label.5":"시술 후 관리 안내를 영어로, 서면으로 받으세요. 필요하면 호텔 컨시어지에 전화로 도움 요청.","dose.d12-mole.label.6":"의원을 나서기 전에 드레싱, 연고, 실리콘 겔을 구입하세요.","dose.d12-mole.label.7":"오늘부터 7~10일간 수영, 사우나, 온탕 금지.","dose.d12-mole.label.8":"시애틀 피부과에 보낼 사진: 오늘과 내일, 자를 대고 상처를 촬영하세요.","dose.d12-mole.label.9":"해외 카드 결제 가능한지 확인. 세 번 따로 결제하면 더 오래 걸려요.","dose.d12-mole.title":"점 빼기 · 르네의원","dose.d12-mole.where":"르네의원 · 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층 304–308호 · +82 32-716-5716 · 목요일 10:00–20:00, 점심시간 13:00–14:00","dose.d12-mole.who":"어른 셋 — NaRhee, Jun, Ann","dose.d12-morning.detail":"가능한 사람은 수영장, 원하는 사람은 야외 산책, 필요한 사람은 객실에서. 단체 활동 없음, 진료 팀 기다리지 말 것 — 늦어지면 그들 없이 점심을 시작하세요.","dose.d12-morning.title":"리조트 오전 · 자유롭게","dose.d12-morning.who":"나머지 모두","dose.d12-nap.title":"낮잠 시간","dose.d12-nap.who":"아이 셋","dose.d12-outing.detail":"영종도는 서쪽 해안이라 노을을 보러 사람들이 이 동네에 머물러요. 한낮이 아니라 늦은 오후에 나가면 시술 부위에 강한 햇볕이 닿을 일이 없어요.","dose.d12-outing.fallback":"하루가 이미 충분했다 싶으면 미련 없이 접으세요.","dose.d12-outing.label.0":"노을 시각과 호텔에서 택시로 잠깐 거리인 전망 지점을 확정.","dose.d12-outing.title":"바닷가 어디쯤 노을","dose.d12-outing.who":"원하는 사람만","dose.d12-pack.detail":"스킨케어는 전부 위탁 수하물로. 분유, 우유, 간식, 아이별로 전신 갈아입을 옷 한 벌은 기내 가방으로. 여권과 탑승권은 한 사람이 책임지고 관리.","dose.d12-pack.label.0":"공항 도착 전에 명동에서 산 액체·젤은 전부 위탁 수하물로 옮기세요.","dose.d12-pack.title":"짐 제대로 싸기","dose.d12-pack.who":"어른들","dose.d12-toclinic.cost":"택시로 약 7,000~10,000원, 섬 안이라 통행료 없음","dose.d12-toclinic.detail":"르네의원은 운서동 쪽이 아니라 하늘도시 쪽에 있어요. 그래서 택시로 5분이 아니라 8~12분 걸립니다 — 그래도 섬 안이라 통행료는 없어요. 09:30에 출발하면 이동 시간에 더해, 초진 외국인 환자 셋의 서류를 10:00 슬롯 시작 전까지 마칠 15분이 남아요.","dose.d12-toclinic.fallback":"출입구에 택시가 안 잡히면 리조트 프런트에 부탁하면 불러 줍니다. 인천공항 자기부상열차는 계산에 넣지 마세요 — 관광 열차로 재분류되어 화요일부터 일요일까지 10:00–17:00에만 운행하고, 하늘도시 근처에는 가지 않아요.","dose.d12-toclinic.label.0":"전날 밤에 택시 확정. 기사에게 주소 보여주기: 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층.","dose.d12-toclinic.title":"의원 가는 길","dose.d12-toclinic.where":"에스디메디컬 · 영종구 하늘중앙로195번길 21 — 하늘도시, 파라다이스시티에서 약 8~12분","dose.d12-toclinic.who":"어른 셋 — NaRhee, Jun, Ann","dose.d13-bfast.detail":"여행 내내 그랬듯 9시. 제2여객터미널로 가는 차는 13:00에나 출발하니, 시계 볼 필요 없이 제대로 마지막 식사를 할 여유가 있어요.","dose.d13-bfast.title":"마지막 아침","dose.d13-bfast.who":"다 함께","dose.d13-ke041.detail":"같은 날 9월 18일 10:40에 시애틀 도착. 이륙 전에 착륙하는 셈이에요, 동쪽으로 가는 비행의 유일한 장점이죠.","dose.d13-ke041.title":"KE041 · 인천 → 시애틀","dose.d13-ke041.where":"ICN → SEA","dose.d13-ke041.who":"다 함께","dose.d13-lunch.detail":"지금 제대로 드세요. 9명이서 출국장 안쪽에서 점심을 해결해야 하는 상황은 만들지 마세요.","dose.d13-lunch.title":"공항 전 이른 점심","dose.d13-lunch.who":"다 함께","dose.d13-molealt.detail":"목요일 10:00 르네의원 예약이 확정되어 있어서, 이건 실제 옵션이 아니라 취소 대비 대안이에요 — 수요일 밤에 병원에서 취소 연락이 올 수 있으니 남겨두는 것뿐이에요. 시간 계산이 예전보다 훨씬 빡빡해요, 환자가 한 명이 아니라 세 명이라서: 영종도 병원은 10:00 개원, 세 사람이면 처음부터 끝까지 90분 정도 걸리고, 제2여객터미널로 가는 차는 13:00에 출발해요. 운서 쪽에서 10:00 시작이면 호텔에 11:45쯤 돌아와요 — 여유는 있지만, 그 뒤로 대안이 없는 단 하나의 여유예요.","dose.d13-molealt.fallback":"금요일에 10:30 이후 시간대만 가능하다면, 거절하고 시애틀에서 점 빼기로 하세요. 11:00에 세 명 시작하면 13:00 출발 시간과 너무 가까워지고, 9명이 비행기를 놓칠 만큼 가치 있는 점은 없어요.","dose.d13-molealt.label.0":"10:00 대안 예약이면 08:15에 식사, 09:30에는 출발.","dose.d13-molealt.label.1":"금요일이면 10시간 비행 전 상처 확인 못 해요. 그래서 목요일 예약.","dose.d13-molealt.label.2":"상처는 하이드로콜로이드 패치로 덮고, 탑승 직전에 연고를 다시 바르세요.","dose.d13-molealt.label.3":"대한항공 체크인 15:40 마감. 13:00 출발은 버퍼일 뿐이에요.","dose.d13-molealt.title":"금요일 아침 대안","dose.d13-molealt.where":"운서동, 5분 거리. 예스피부과(032-752-9730)와 영종중앙의원(032-746-3200) 모두 금요일 10:00 개원, 세 번째 후보가 필요하면 청라의 더율피부과도 금요일 10:00 개원이에요. 취소가 우리 쪽에서 나오는 경우라면 르네의원도 금요일 10:00–20:00 진료해요.","dose.d13-molealt.who":"어른 셋 — NaRhee, Jun, Ann","dose.d13-morning.detail":"체크아웃은 보통 11:00이에요. 짐은 맡겨두고 출발할 때까지 로비를 이용하세요.","dose.d13-morning.title":"느긋한 아침, 짐 맡기기","dose.d13-morning.who":"다 함께","dose.d13-toAirport.detail":"호텔에서 제2여객터미널까지 약 20분이라, 16:40 출발편에 13:30쯤 체크인하게 돼요. 카시트 3개 위탁, 유모차 태그, 세금 환급까지 있으니 세 시간은 넉넉한 게 아니라 딱 맞는 시간이에요.","dose.d13-toAirport.label.0":"대한항공 국제선 체크인 마감은 15:40. 이게 진짜 마감이에요.","dose.d13-toAirport.label.1":"세금 환급은 보안 검색 전에 처리. 오후 창구 줄이 길 수 있어요.","dose.d13-toAirport.label.2":"파라다이스시티 제2여객터미널 셔틀은 뜸함. 9명 짐용 프라이빗 밴 예약.","dose.d13-toAirport.title":"인천 제2여객터미널로","dose.d13-toAirport.where":"인천공항 제2여객터미널 · 대한항공 출국","dose.d13-toAirport.who":"다 함께","dose.d13-woundcheck.detail":"시술 후 약 24시간이 지난 시점이에요. 밝은 자연광에서 살펴보고, 드레싱을 갈고, 자를 함께 넣어 사진을 찍으세요 — 이 사진이 시애틀 피부과에서 비교할 기준이에요. 그리고 비행을 위해 깨끗하게 다시 붙이세요, 기내 공기는 건조하고 열 시간은 긴 시간이에요.","dose.d13-woundcheck.fallback":"이상이 있으면 — 붉은 기가 번지거나, 열이 나거나, 진물이 계속 나면 — 공항에서가 아니라 10:00에 문 여는 즉시 르네의원(+82 32-716-5716)으로 전화하세요. 오늘 아침 여기서 병원까지 10분 거리지만, 오늘 밤이면 9,000km 떨어져 있게 돼요. 10:00에 전화해도 차량 출발까지 세 시간이 있어요.","dose.d13-woundcheck.label.0":"연고와 여분 드레싱은 기내 가방에. 비행 중 한 번 갈아주세요.","dose.d13-woundcheck.label.1":"두 번째 상처 사진 촬영. 가능하면 같은 자와 같은 조명으로.","dose.d13-woundcheck.title":"출국 전 상처 확인","dose.d13-woundcheck.who":"점 뺀 사람","dose.d2-bfast.detail":"글로벌리스트 혜택에 포함. 여유 있게 드세요 — 오늘 하루 이 그룹이 머물 가장 조용하고 따뜻한 공간이고, 이 아침이 오늘 계획의 대부분을 대신해 줍니다. 8시가 아니라 9시: 병원 세 명은 새벽에 출발했고, 시차 적응 이틀째에 다른 사람들이 일찍 일어날 이유는 없어요.","dose.d2-bfast.label.0":"글로벌리스트 아침이 몇 명까지 포함되는지 확인하세요. 추가 인원은 보통 유료예요.","dose.d2-bfast.label.1":"이유식 먹는 7개월 아기 음식이 되는지 주방에 문의하세요. CU와 GS25에서도 이유식 파우치를 팔아요.","dose.d2-bfast.title":"파크 하얏트 아침","dose.d2-bfast.who":"아내 · 부모님 · 아이 셋","dose.d2-clinic-go.detail":"광동병원은 파크 하얏트에서 택시로 5분, 또는 코엑스를 지나 도보 15분 거리예요. 지하철 9호선 봉은사역 5번 출구에서 1분. 차로 내려주는 경우 발렛 파킹 가능.","dose.d2-clinic-go.getting":"택시로 5분. 너무 배고파서 못 걷는 사람만 없다면 도보 15분도 가능.","dose.d2-clinic-go.label.0":"수면 검사받는 사람은 여권 지참 필수. 여권 없으면 수면내시경 불가.","dose.d2-clinic-go.title":"병원 이동","dose.d2-clinic-go.where":"광동병원 · 서울 강남구 봉은사로 612 (삼성동)","dose.d2-clinic-go.who":"Jun · NaRhee · Jordan","dose.d2-coex.detail":"지하에 있고, 평평하고, 냉난방이 되며, 엘리베이터가 곳곳에 있고, 호텔에서 도보로 가까워요. 시차 적응 이틀째에 어린아이 셋과 함께라면 흥미로움보다 실내와 가까움이 이깁니다. 마침 병원 바로 옆이라 두 그룹이 멀리 떨어지지도 않아요.","dose.d2-coex.fallback":"너무 부담되면 호텔 로비와 블록 한 바퀴 유모차 산책만으로도 충분히 좋은 오전이 됩니다.","dose.d2-coex.getting":"몰 영업시간 10:30~22:00. 수유실과 유모차 대여 시설 있음.","dose.d2-coex.title":"코엑스 몰과 별마당 도서관","dose.d2-coex.where":"코엑스, 삼성동 — 파크 하얏트에서 도보 거리","dose.d2-coex.who":"아내 · 부모님 · 아이 셋","dose.d2-collect.detail":"누군가 차를 가지고 출구에서 만나세요. 어제 저녁부터 금식했고 수면 마취까지 받았을 수 있는 세 명이 스스로 택시를 잡을 상황이 아닙니다.","dose.d2-collect.fallback":"검진 진행에 따라 시간이 밀립니다. 오후는 여유 있게 두고, 이 시간과 겹치는 일정은 잡지 마세요.","dose.d2-collect.label.0":"죽을 미리 준비하세요. 내시경 후에는 자극 없는 음식부터, 아홉 명 식당 식사는 아직 안 됩니다.","dose.d2-collect.title":"병원 셋 데리러 가기","dose.d2-collect.who":"어른 한 명","dose.d2-dinner.detail":"좌식이 아니라 의자로 아홉 명이 앉을 수 있는 곳. 이 조건은 여행 내내 반복해서 부딪히니 매번 확인할 가치가 있어요.","dose.d2-dinner.label.0":"예약할 때 의자석을 요청하세요. 좌식은 70대 두 분에게 힘듭니다.","dose.d2-dinner.title":"호텔 근처 이른 저녁","dose.d2-dinner.who":"다 함께","dose.d2-evening.detail":"아기 둘과 70대 두 분과 함께 하는 열여섯 시간 교대 근무의 이틀째. 지금 저녁을 비워두면 남은 한 주가 편해집니다.","dose.d2-evening.label.0":"회복을 위해 저녁은 비워두세요.","dose.d2-evening.title":"일정 없음. 일부러.","dose.d2-evening.who":"다 함께","dose.d2-fast.detail":"광동병원 자체 준비 안내에 따르면 전날 저녁은 가볍고 저지방식으로 먹고, 지시가 있으면 21:00 이후에는 아무것도 먹지 말라고 되어 있어요 — 즉, 금식은 도착일 저녁부터 시작됩니다. 아침은 없고, 예약한 검사에 따라 물, 커피, 우유, 껌, 사탕까지 모두 제한될 수 있어요.","dose.d2-fast.label.0":"검진 7~10일 전 파크 하얏트에 의료 소포 도착을 알리고, 병원에 등록된 호텔명이 맞는지 확인하세요.","dose.d2-fast.label.1":"접수는 08:00부터 선착순 시작. 오후 슬롯은 11:00까지 도착하면 접수돼요.","dose.d2-fast.label.2":"약을 임의로 중단하지 마세요. 내시경·조직검사 전 항응고제·항혈소판제 복용을 반드시 알리세요.","dose.d2-fast.title":"금식 — 셋은 아침 없음","dose.d2-fast.who":"Jun · NaRhee · Jordan","dose.d2-kd.cost":"광동병원 자체 등급은 스탠다드 $400~$850, 프리미엄 $1,000~$3,900, 1인 기준","dose.d2-kd.detail":"광동병원 공시 소요 시간은 스탠다드 프로그램 약 3시간, 프리미엄은 3~4시간입니다. KD Program은 뇌 MRI, 뇌 MRA, 경추·요추 MRI, 췌장·간 MRI, NK세포 활성도, 심장초음파, 암 유전자 패널이 추가되어 이 범위의 상단 또는 그 이상에 해당돼요. 최소 12:30까지 잡아두고, 14:00 정도는 여유 있게 보세요.","dose.d2-kd.label.0":"08:00 도착을 서면으로 확인받으세요. 평일 공시 진료시간은 09:00~17:30입니다.","dose.d2-kd.label.1":"수면내시경 후 1~2시간은 식사 불가, 혼자 귀가 불가. 누군가 데리러 가야 해요.","dose.d2-kd.label.2":"세 명이 동시에 진행 가능한지 확인하세요. MRI 대기가 한 줄이면 하루 전체가 달라져요.","dose.d2-kd.label.3":"전체 결과는 나중에 나옵니다. 광동병원은 약 10일이라고 안내하지만 후기는 2~3주라고 해요.","dose.d2-kd.title":"정밀 특화 검진 · KD Program","dose.d2-kd.where":"광동병원 국제검진센터","dose.d2-kd.who":"Jun · NaRhee · Jordan","dose.d2-naps.detail":"아이 셋 모두 취침, 어른 두 명 휴식. 여행 어느 날에도 이 시간대에는 다른 일정을 잡지 마세요.","dose.d2-naps.title":"호텔 복귀 · 낮잠 시간","dose.d2-naps.who":"아내 · 부모님 · 아이 셋","dose.d2-prep2.detail":"병원 안내는 명확하고 예외가 없습니다: 04:00에 알약 2차 복용. 착륙 후 약 11시간이 지난 시점이고, 이번 여행에서 시차 적응이 가장 힘든 밤이에요. 전체 계획에서 놓치기 가장 쉬운 항목이자, 되돌릴 수 없는 유일한 항목입니다 — 놓치면 대장내시경은 그 자리에서 취소돼요.","dose.d2-prep2.fallback":"대안은 없습니다. 복용을 놓쳤다면 병원으로 출발하기 전에 02-2222-4888로 전화하세요. 가서 알게 되는 것보다 낫습니다.","dose.d2-prep2.label.0":"잠들기 전에 휴대폰 두 대에 알람을 두 개 설정하세요.","dose.d2-prep2.label.1":"04:00부터 출발 전까지 화장실 근처에 있으세요. 07:30 택시 전 잠은 기대하지 마세요.","dose.d2-prep2.title":"관장약 2차 복용","dose.d2-prep2.who":"Jun · NaRhee · Jordan","dose.d2-rejoin.detail":"세 명에게는 약 스무 시간 만의 첫 제대로 된 식사입니다. 가깝고, 조용하고, 계단 없는 곳으로.","dose.d2-rejoin.fallback":"16:00까지 밀릴 수 있어요. 이 식사는 시간이 옮겨질 뿐, 취소되지는 않습니다.","dose.d2-rejoin.label.0":"점심 시간은 여유 있게 잡으세요. 수면 마취 후 퇴원은 검사 일정보다 늦어질 수 있어요.","dose.d2-rejoin.title":"병원 셋 도착 후 늦은 점심","dose.d2-rejoin.who":"다 함께","dose.d3-bfast.detail":"포함되어 있어요. 이 여정 전체를 여기에 맞춰 짜세요 — 호텔에서 제대로 된 아침을 먹으면 하루 중 가장 어려운 식사를 다섯 번 넘게 계획에서 지울 수 있습니다. 9시에 시작하니 어두울 때 아기 옷 입힐 일도 없어요.","dose.d3-bfast.title":"파크 하얏트 아침","dose.d3-bfast.who":"다 함께","dose.d3-botox.cost":"국산 보톡스는 부위당 약 ₩40,000~₩80,000, 수입 알러간은 약 ₩140,000~₩220,000","dose.d3-botox.detail":"이동일에서 이날로 옮겼습니다. 강남은 병원이 밀집해 있고 영어 지원도 좋으며, 셋째 날에 하면 결과가 자리 잡을 시간이 열흘 있고, 출국 전에 같은 병원이 예상 밖의 변화를 확인할 여유도 생깁니다. 시술 자체는 5~15분이고, 예약 시간의 대부분은 상담이에요.","dose.d3-botox.label.0":"보톡스 후: 4시간 눕지 말고 시술 부위 만지지 마세요. 24시간 음주·뜨거운 목욕·사우나·격한 운동 금지.","dose.d3-botox.label.1":"17일 인천 르네의원 점 빼기와는 일정을 겹치지 마세요. 사후 관리 안내는 서면으로 받아두세요.","dose.d3-botox.label.2":"가격, 사용 제품, 재진 포함 여부를 확인하세요.","dose.d3-botox.title":"보톡스 예약 · 강남","dose.d3-botox.where":"강남역 또는 압구정 · 병원 미정","dose.d3-botox.who":"받는 사람","dose.d3-dinner.detail":"한국 식당은 19:00쯤부터 붐빕니다. 아기들과 함께한 아홉 명은 18:30이 훨씬 좋은 자리를 얻어요.","dose.d3-dinner.label.0":"아홉 명은 미리 예약하세요. 서울에서는 그 인원의 워크인이 거의 어디서나 어렵습니다.","dose.d3-dinner.title":"이른 저녁","dose.d3-dinner.who":"다 함께","dose.d3-lunch.detail":"낮잠 시간 범위 안으로 돌아옵니다. 좌식 아닌 의자석으로.","dose.d3-lunch.title":"호텔 근처 점심","dose.d3-lunch.who":"다 함께","dose.d3-nap.title":"호텔 낮잠 시간","dose.d3-nap.who":"아이 셋 + 필요한 사람","dose.d3-seongsu.detail":"강남에서 강 건너 바로 맞은편이고, 성수를 가장 편하게 즐길 수 있는 방법이에요 — 동네가 완전히 깨어나기 전에 도착하세요. 먼저 서울숲에서 시작해요. 평평하고 넓고 그늘이 많아 유모차와 할머니·할아버지에게 정말 편합니다. 그런 다음 연무장길의 창고를 개조한 카페와 플래그십 스토어로 걸어 들어가세요. 성수는 옛 신발 공장 지구에서 디자인 지구로 바뀐 곳이라 도로가 넓고 인도가 제대로 되어 있어요. 익선동이나 북촌과는 다릅니다.","dose.d3-seongsu.fallback":"서울숲만으로도 완전한 오전 일정이 됩니다. 그룹이 지치면 카페 거리는 완전히 건너뛰고 나무 그늘 아래 앉아 계세요.","dose.d3-seongsu.getting":"파크 하얏트에서 성수대교를 곧장 건너 택시로 10~15분. 아홉 명이니 차 두 대.","dose.d3-seongsu.label.0":"10:30에 도착해 서울숲부터. 성수 카페는 대부분 11:00에 열고 정오면 줄이 생겨요.","dose.d3-seongsu.label.1":"부모님께는 서울숲을 활용하세요. 평평한 포장 산책로, 그늘, 벤치가 넉넉해요.","dose.d3-seongsu.label.2":"카페 한 곳이 유모차 포함 아홉 명을 받을 수 있는지 확인하거나, 두 테이블로 나눌 계획을 세우세요.","dose.d3-seongsu.title":"성수와 서울숲","dose.d3-seongsu.where":"서울숲, 성동구 성수동","dose.d3-seongsu.who":"다 함께","dose.d3-skincare.detail":"그룹을 나누세요: 일부는 쇼핑, 일부는 아이들과 함께. 올리브영은 한국 데일리 스킨케어를 커버하고, 백화점 식품관과 아동 매장이 나머지를 커버해요. 두 곳 모두 실내, 냉방, 엘리베이터 이용 가능.","dose.d3-skincare.fallback":"여기 있는 것들은 여행 후반 명동에서도 살 수 있으니 오늘 다 끝내지 않아도 괜찮아요.","dose.d3-skincare.label.0":"여권을 지참하세요. 매장 내 즉시 환급 창구에서 필요합니다.","dose.d3-skincare.title":"스킨케어 — 올리브영·백화점","dose.d3-skincare.where":"강남 · 올리브영 강남타운, 그리고 현대백화점 무역센터점 또는 스타필드 코엑스","dose.d3-skincare.who":"어른들 교대로","dose.d4-bfast.detail":"이번 여행에서 유일하게 9시에 시작할 수 없는 아침이에요 — 10:00 열차가 시간을 정하니, 09:15에는 나서야 해요. 그래도 여유 있는 편이에요. 10:00 출발을 고른 이유가 바로 이거예요. 서두르지 않고 제대로 아침을 먹기 위해서요. 여기서 든든히 드세요. 열차 안 음식은 제한적이고, 아기와 함께라면 역은 정신없어요.","dose.d4-bfast.label.0":"이 셋만 일찍 움직여요. 호텔에 남는 나머지는 09:00에 아침 먹어요.","dose.d4-bfast.title":"호텔에서 여유로운 아침","dose.d4-bfast.who":"Jun · 아내 · 7개월","dose.d4-bongeunsa.detail":"코엑스 바로 건너편에 있는 현역 사찰이에요. 도보 10분. 조용하고 푸르고, 언제든 그만두고 나올 만큼 짧아요. 확정이 아니라 후보로 둔 것도 의도적이에요 — 오늘은 열차 안 타는 여섯 명의 회복일이니까, 아무것도 안 하는 것도 완전히 유효한 선택이에요.","dose.d4-bongeunsa.fallback":"두 살 아이가 지치면 언제든 돌아오세요. 아예 건너뛰고 할머니·할아버지는 방에서 오전을 보내셔도 좋아요. 스타필드 코엑스는 실내에 평평하고 30초 더 가까워요.","dose.d4-bongeunsa.label.0":"부모님이 피곤하시면 이건 그냥 넘어가세요. 다른 외출로 설득하지 마세요.","dose.d4-bongeunsa.label.1":"사찰 경내에는 계단과 경사가 있어요. 계단 없는 경로를 미리 확인하거나 아래층에만 머무세요.","dose.d4-bongeunsa.title":"봉은사","dose.d4-bongeunsa.where":"봉은사, 삼성동","dose.d4-bongeunsa.who":"부모님 · NaRhee 가족","dose.d4-dept.detail":"실내에 냉방, 엘리베이터, 수유실, 지하 식품관까지 갖췄어요. 한국 백화점은 어린아이와 함께일 때 실제로 필요한 것들을 유난히 잘 갖춰놓았어요.","dose.d4-dept.label.0":"수유실 층수와 영업시간을 확인하세요.","dose.d4-dept.title":"백화점, 교대로","dose.d4-dept.where":"현대백화점 무역센터점 또는 스타필드 코엑스","dose.d4-dept.who":"부모님 · NaRhee 가족","dose.d4-dinner.detail":"호텔 근처에서. 이번 저녁을 위해 멀리 이동할 힘은 아무도 없어요.","dose.d4-dinner.title":"열차 도착 후 저녁","dose.d4-dinner.who":"다 함께","dose.d4-return.detail":"18:00쯤 호텔 도착이면 다 같이 저녁 먹기 전에 여유 있게 들어와요. 피곤할 만큼 늦지만, 아기가 내일 망가질 정도로 늦지는 않아요.","dose.d4-return.fallback":"방문이 잘 흘러가면 늦은 열차를 타도 괜찮아요 — 다만 대전에서 17:30 이후 출발이면 18:45 저녁을 놓치니, 그냥 넘기지 말고 가족에게 알려주세요.","dose.d4-return.title":"수서로 돌아오는 열차","dose.d4-return.who":"Jun · 아내 · 7개월","dose.d4-srt.cost":"일반실 편도 약 20,100원. 만 6세 미만은 무릎에 앉히면 무료예요. 좌석을 확실히 잡고 싶으면 아이 표를 사세요.","dose.d4-srt.detail":"남쪽으로 약 55분. 유모차보다 아기띠가 역에서 이동하기 훨씬 편해요 — 열차 안 짐 공간은 제한적이고 선착순이에요.","dose.d4-srt.label.0":"삼촌께 어느 대전역인지 확인하세요 — 대전역인지 서대전역인지.","dose.d4-srt.title":"SRT 대전행","dose.d4-srt.where":"수서역 → 대전","dose.d4-srt.who":"Jun · 아내 · 7개월","dose.d4-stay-bfast.detail":"정해진 일정도 알람도 없어요. 오늘은 열차 안 타는 여섯 명의 회복일이에요 — 9시 이후에 시작하고, 뒤에는 언제든 뺄 수 있는 일정만 두세요.","dose.d4-stay-bfast.title":"여유로운 호텔 아침","dose.d4-stay-bfast.who":"부모님 · NaRhee 가족","dose.d4-stay-nap.title":"낮잠 시간","dose.d4-stay-nap.who":"호텔에 있는 아이 둘","dose.d4-suseo.detail":"수서역은 남쪽 방향 고속철도 종점이고, 파크 하얏트에서 택시로 5분 정도예요 — 이 일정을 인사동 구간이 아니라 여기에 넣은 이유가 바로 이거예요. 인사동에서 가려면 서울역까지 나가서 더 느린 KTX를 타야 해요. 승강장에서 15분이면 충분해요.","dose.d4-suseo.label.0":"SRT는 etk.srail.kr에서 예매하세요. 해외 카드도 돼요. 10:00 열차를 원하면 미리 예매해두세요.","dose.d4-suseo.title":"수서역으로","dose.d4-suseo.where":"수서역 (SRT)","dose.d4-suseo.who":"Jun · 아내 · 7개월","dose.d4-uncle.detail":"오늘의 이유예요. 함께 여유롭게 점심 드세요. 뒤에 다른 일정 얹지 말고 오후는 비워두세요 — 4시간이면 형식적인 인사가 아니라 진짜 방문이에요.","dose.d4-uncle.label.0":"돌아가는 열차 시간을 미리 정해두세요. 그래야 인사가 급하지 않고 놓치지도 않아요.","dose.d4-uncle.title":"아내 삼촌과","dose.d4-uncle.who":"Jun · 아내 · 7개월","dose.d5-back.detail":"다 같이 돌아와요 — 이 부분은 선택이 아니에요. 삼성동까지 15분이면 두 살 아이를 14:20에 진짜 침대에 눕힐 수 있어요. 이번 구간 가장 큰 하루니까요.","dose.d5-back.label.0":"여기서 부모님을 호텔로 모시고 들어가세요. 69세·70세 어른들에게 4시간 외출은 하루 종일에 해당해요.","dose.d5-back.title":"다 함께 호텔 복귀","dose.d5-back.who":"다 함께","dose.d5-bfast.detail":"9시. 롯데월드는 종일 걸어야 하니, 일찍 시작하는 것보다 쉬고 시작하는 게 더 중요해요 — 목요일이라 개장부터 11시 사이에는 사람이 크게 늘지 않아요.","dose.d5-bfast.title":"파크 하얏트 아침","dose.d5-bfast.who":"다 함께","dose.d5-dinner.detail":"지금 정하지 말고 17:45에 다들 어디에 있는지 보고 정하세요.","dose.d5-dinner.title":"롯데월드몰 또는 삼성동","dose.d5-dinner.who":"다 함께","dose.d5-go.detail":"택시 두 대나 지하철. 어느 쪽이든 금방이에요.","dose.d5-go.title":"잠실로","dose.d5-go.where":"롯데월드, 잠실","dose.d5-go.who":"다 함께","dose.d5-lake.detail":"공원 옆 호수를 도는 평평한 포장 산책로예요. 전 구간에 벤치가 있어요. 늦은 오후 빛에 좋고, 언제든 짧게 끊을 수 있어요. 정말 선택이에요 — 잠실까지 다시 나가는 건 하루에는 부담스러울 수 있어요.","dose.d5-lake.label.0":"이미 하루가 길었다면 석촌호수는 그냥 넘어가세요. 있으면 좋고 없어도 되는 일정이에요.","dose.d5-lake.title":"석촌호수 산책","dose.d5-lake.who":"원하는 사람만","dose.d5-lunch.detail":"바로 옆 롯데월드몰이 공원 안보다 음식이 훨씬 낫고 자리도 제대로 있어요.","dose.d5-lunch.title":"단지 안에서 점심","dose.d5-lunch.who":"다 함께","dose.d5-nap.label.0":"이 낮잠은 꼭 지키세요. 할머니·할아버지도 여기서 쉬시고, 오늘 나머지 일정은 두 분에게는 선택이에요.","dose.d5-nap.title":"호텔에서 낮잠 시간","dose.d5-nap.who":"아이 셋 · 할머니·할아버지","dose.d5-park.detail":"오전 내내가 아니라 두 시간 이내로만. 실내 어드벤처 구역은 냉방이 되고, 대부분 평지에 엘리베이터가 있어요 — 여기서는 놀이기구보다 이 점이 더 중요해요. 어린이 전용 구역이 따로 있어서, 두 살 아이가 도는 동안 할머니·할아버지는 편안히 앉아 계실 수 있어요. 아기 둘은 그동안 아기띠 안에서 낮잠 자요.","dose.d5-park.fallback":"공원이 부담스러우면 같은 단지 안의 롯데월드 아쿠아리움이 어둡고 시원하고 조용하고, 90분 정도면 돌아요.","dose.d5-park.label.0":"두 살 아이 기준으로 롯데월드는 90–100분까지만. 아이가 무너지기 전에 나오세요.","dose.d5-park.label.1":"개장 시간, 티켓 종류, 유모차 대여, 놀이기구 나이·키 제한을 확인하세요.","dose.d5-park.label.2":"아기들은 탈 수 있는 게 거의 없어요. 놀이기구 체크리스트가 아니라 둘러보는 곳으로 여기세요.","dose.d5-park.label.3":"가기 전에 공원 안 수유실과 기저귀 교환대 위치를 확인하세요.","dose.d5-park.title":"롯데월드 어드벤처 실내","dose.d5-park.where":"롯데월드 어드벤처, 잠실","dose.d5-park.who":"다 함께","dose.d6-bfast.detail":"포함된 마지막 아침이에요 — 인사동 구간에는 조식 혜택이 없으니, 여행 중 편안한 아침 식사는 이게 마지막이에요. 9시에 시작해요. 체크아웃은 11:30까지고, 서두를 이유가 없어요.","dose.d6-bfast.title":"파크 하얏트 마지막 아침","dose.d6-bfast.who":"다 함께","dose.d6-checkin.detail":"방이 아직 준비 안 됐을 수 있어요. 짐은 맡겨두고, 방 준비되면 아이들을 데리고 올라가세요.","dose.d6-checkin.label.0":"정식 체크인은 15:00이에요. 낮잠 방을 확실히 잡고 싶으면 10일 밤부터 방 하나를 예약해두세요.","dose.d6-checkin.title":"체크인·아기 침대·숨 돌림","dose.d6-checkin.who":"다 함께","dose.d6-checkout.detail":"짐 내려놓고, 가능하면 전날 저녁에 늦은 체크아웃을 요청해두세요.","dose.d6-checkout.title":"파크 하얏트 체크아웃","dose.d6-checkout.who":"다 함께","dose.d6-dinner.detail":"돌아와서 다시 나가지 말고 산책이 끝나는 곳에서 드세요. 익선동은 한옥을 개조한 식당이 빼곡해요. 식사 후 호텔까지는 평지 도보 10분이에요. 9명 테이블석으로 예약 완료.","dose.d6-dinner.label.0":"예약할 때 의자석으로 요청하세요. 한옥 개조 식당은 좌식이 많아요.","dose.d6-dinner.label.1":"9명이니 미리 예약하세요. 익선동 식당들은 작아서, 미리 말하지 않으면 함께 앉기 어려울 수 있어요.","dose.d6-dinner.title":"익선동 저녁","dose.d6-dinner.who":"다 함께","dose.d6-ikseon.detail":"복원한 한옥을 카페와 작은 가게로 개조한 촘촘한 골목이에요. 호텔에서 도보 10분 정도고, 인사동 코스 끝자락에 바로 있어요. 평지에, 낮은 처마가 그늘을 만들고, 북촌처럼 언덕을 오르지 않아도 사진이 잘 나와요. 늦은 오후가 딱 좋아요 — 이때쯤이면 가게들이 다 열려 있고, 해가 지면서 골목에 불이 들어와요.","dose.d6-ikseon.fallback":"골목이 붐비면 남쪽으로 5분 거리에 청계천이 있어요. 평지에 그늘도 있고 확연히 더 시원해요.","dose.d6-ikseon.getting":"도보. 낙원동에서 그대로 이어져요.","dose.d6-ikseon.label.0":"익선동 골목은 폭이 2m가 안 되는 곳이 많아요. 아기띠를 쓰거나, 큰 유모차는 호텔에 두고 오세요.","dose.d6-ikseon.label.1":"익선동은 이 호텔에서 도보 10분이라, 얕은 이동일 오후에 딱 맞는 일정이에요.","dose.d6-ikseon.title":"익선동 골목","dose.d6-ikseon.where":"익선동, 종로 · 호텔에서 약 700m","dose.d6-ikseon.who":"원하는 사람만","dose.d6-insa.detail":"막연한 방향이 아니라 실제 경로예요. 호텔에서 나와 인사동길로, 큰길을 따라 북쪽으로 종이·도자기·차·붓 가게들을 지나 맨 위에서 쌈지길로 들어가요 — 계단이 아니라 4층까지 이어지는 나선형 경사로라, 유모차 그대로 엘리베이터 없이 끝까지 올라갔다 내려올 수 있어요. 낙원동을 지나 동쪽으로 빠지면 익선동 입구예요. 전체 코스는 약 1.2km, 전 구간 평지고, 방에서 8분 넘게 떨어지는 지점이 없어요.","dose.d6-insa.fallback":"이 코스 어느 지점에서든 방까지 걸어서 금방이라, 20분이든 2시간이든 상관없고 누구든 언제든 빠져나갈 수 있어요.","dose.d6-insa.getting":"도보. 호텔이 인사동길에 바로 있어요.","dose.d6-insa.label.0":"예보는 30°C 안팎이에요. 그늘진 동쪽으로 걷고, 쌈지길에서 쉬고, 부모님 마실 물을 챙기세요.","dose.d6-insa.label.1":"그날 인사동길이 차량 통제되는지 확인하세요. 요일마다 보행자 시간이 달라요.","dose.d6-insa.title":"인사동 도보 실제 코스","dose.d6-insa.where":"인사동길 → 쌈지길 → 낙원동 · 호텔 문 앞부터","dose.d6-insa.who":"원하는 사람만","dose.d6-move.detail":"강 건너 종로로. 이번에도 차 두 대 — 9명과 12일치 짐은 차 한 대에 다 안 들어가요.","dose.d6-move.label.0":"호텔 이름과 주소를 정확히 확인하세요. 서울 도심에 나인트리가 여러 곳 있어요.","dose.d6-move.title":"인사동으로 이동","dose.d6-move.where":"나인트리 프리미어 인사동 · 종로구 인사동길 49","dose.d6-move.who":"다 함께","dose.d6-nap.title":"낮잠, 가능한 곳에서","dose.d6-nap.who":"아이 셋","dose.d6-slow.detail":"예약된 건 없어요. 짐을 제대로 싸고 아이들은 방에서 뛰어놀게 두세요. 이동일은 앞 오전이 비어 있을 때 더 잘 흘러가요.","dose.d6-slow.fallback":"차 타기 전에 에너지를 좀 빼야 한다면, 스타필드 코엑스가 5분 거리에 있고 실내예요.","dose.d6-slow.title":"강남에서 여유 오전","dose.d6-slow.who":"다 함께","dose.d7-back.detail":"낮잠이 필요한 절반은 곧장 숙소로 돌아갑니다. 박물관에서 점심을 안 먹는 건 의도적이에요. 여기서 점심을 먹으면 두 살 아이 낮잠이 14:00을 넘기게 되는데, 내일은 잘 못 잔 두 살을 감당할 여유가 전혀 없는 하루입니다.","dose.d7-back.title":"낮잠팀 인사동 복귀","dose.d7-back.who":"할머니·할아버지·아이 셋·어른 둘","dose.d7-bfast.detail":"이번 일정은 아침이 포함돼 있지 않습니다. 호텔 조식을 이용하거나 베이커리로 해결하세요. 한국 프랜차이즈 베이커리는 아홉 명 정도는 무리 없이 소화합니다. 박물관은 10:00에 문을 여니 9시 전에 일어날 이유는 없어요.","dose.d7-bfast.label.0":"인사동 예약에 조식이 포함되는지, 몇 명분인지 확인.","dose.d7-bfast.title":"아침","dose.d7-bfast.who":"다 함께","dose.d7-dinner.detail":"정말로 일찍. 내일은 여행 전체를 사진으로 남기는 날입니다.","dose.d7-dinner.title":"이른 저녁, 이른 취침","dose.d7-dinner.who":"다 함께","dose.d7-lunch.detail":"룸서비스, 베이커리 사 오기, 아니면 로비에서 가장 가까운 곳. 오늘은 맛보다 속도가 중요합니다.","dose.d7-lunch.fallback":"인사동길에 포장 음식이 많아요. 한 명이 사 오고 나머지는 방으로 올라가세요.","dose.d7-lunch.title":"호텔에서 점심","dose.d7-lunch.who":"다 함께","dose.d7-museum.detail":"용산. 상설전시는 무료 입장이고, 전시실은 넓고 평평합니다. 곳곳에 엘리베이터가 있고, 현장에서 유모차를 무료로 빌릴 수 있으며, 대부분의 전시실에 벤치가 있어요. 한 관만 도세요. 건물 전체는 무리입니다.","dose.d7-museum.fallback":"전시실이 부담스러우면 야외 거울못과 석탑까지 이어지는 산책로만 봐도 이곳까지 온 보람이 있어요.","dose.d7-museum.label.0":"수유실은 1층. 유모차·휠체어는 안내데스크에서 무료 대여.","dose.d7-museum.label.1":"월요일 휴관. 오늘은 18:00까지, 여유 있게 나올 수 있어요.","dose.d7-museum.label.2":"무료 어린이박물관 지금 예약. 매진 빠름, 9명 한 회차 어려울 수 있음.","dose.d7-museum.title":"국립중앙박물관","dose.d7-museum.where":"국립중앙박물관, 용산구 서빙고로 137","dose.d7-museum.who":"다 함께","dose.d7-nap.detail":"제시간에 두 살 아이가 낮잠을 충분히 자는 것, 오늘 일찍 마무리하는 이유가 바로 이거예요. 할머니·할아버지도 함께 쉬세요. 내일은 06:50 시작에 하루가 깁니다.","dose.d7-nap.label.0":"이 낮잠 시간은 반드시 지키세요. 여행 중 가장 중요한 휴식입니다.","dose.d7-nap.title":"호텔 낮잠 시간","dose.d7-nap.who":"아이 셋 + 할머니·할아버지","dose.d7-prep.detail":"대여 예약, 인원 수, 헤어·메이크업 시간, 그리고 궁 매표소까지의 도보 경로를 확정하세요. 각자 안에 입을 옷을 미리 꺼내 두고, 카메라를 충전하세요.","dose.d7-prep.label.0":"내일 10:50 콜타임 확정, 9명 착장. 오늘 밤 가능한 건 다 정리.","dose.d7-prep.label.1":"대여 보증금용 여권 1부, 현금 70,000원을 오늘 밤 준비.","dose.d7-prep.label.2":"오늘 밤 사진작가에게 문자: 우천 대안, 궁 내 지붕 있는 곳, 아침 연락처.","dose.d7-prep.title":"내일 한복, 오늘 밤 정리","dose.d7-prep.who":"Jun","dose.d7-yongsan.detail":"박물관 하나 보러 이 먼 곳까지 왔다면, 하나만 보고 돌아가긴 아쉽습니다. 도보나 지하철 한 정거장 거리에 세 곳이 있어요. 박물관 부지와 거울못은 무료이고, 서울에서 조용히 손꼽히는 조경입니다. 이촌한강공원은 바로 강변으로 이어지고, 용산역의 용산 아이파크몰은 전자제품·장난감·푸드코트를 갖춘 정말 거대한 실내 복합몰이라 더위에 지치면 이곳으로 피할 수 있습니다.","dose.d7-yongsan.fallback":"그냥 다른 사람들과 함께 숙소로 돌아가세요. 이건 자는 아이를 안고 있지 않은 사람들을 위한 추가 일정일 뿐, 건너뛰어도 잃는 게 없어요.","dose.d7-yongsan.getting":"박물관 부지는 도보로. 이촌한강공원은 도보 약 15분. 용산 아이파크몰은 지하철 4호선으로 한 정거장, 또는 택시로 5분.","dose.d7-yongsan.label.0":"필요 시 용산 후 분리. 낮잠은 유지, 이건 13:00에 자유인 어른만.","dose.d7-yongsan.label.1":"15:30까지 복귀. 내일 06:50 시작, 한복 준비에 모두 참석 필수.","dose.d7-yongsan.label.2":"용산공원 조성 부지 예약 없이 입장 가능한지 확인. 구역별 예약제 있음.","dose.d7-yongsan.title":"여유 있는 사람은 용산","dose.d7-yongsan.where":"용산구 · 박물관 부지, 이촌한강공원, 용산 아이파크몰","dose.d7-yongsan.who":"낮잠 담당이 아닌 어른들","dose.d8-bfast.detail":"여행에서 하나 남은 이른 출발이고, 피할 방법이 없어요. 살롱은 08:00 오픈, 한복집은 09:00 오픈, 사진작가 콜타임 10:50은 유료 예약이 걸려 있습니다. 지금 아이들을 제대로 먹이세요. 촬영이 끝날 때까지 다시 여유 있게 먹일 시간이 없고, 한복을 입고 나면 얼룩질 만한 음식은 근처에도 두지 마세요.","dose.d8-bfast.label.0":"먼저 먹이고, 옷은 그다음.","dose.d8-bfast.label.1":"전날 밤 모두에게 알리기: 이 아침은 평소 09:00보다 일찍 시작.","dose.d8-bfast.title":"아침, 빠르면 방에서","dose.d8-bfast.who":"다 함께","dose.d8-dinner.detail":"여행 중에 제대로 예약해서 갈 만한 유일한 한 끼입니다. 테이블 좌석, 아홉 명 가능한 룸이 있으면 룸으로.","dose.d8-dinner.label.0":"아홉 명과 어린 아이 셋을 위한 룸을 여유 있게 미리 예약하세요.","dose.d8-dinner.title":"제대로 된 저녁","dose.d8-dinner.who":"다 함께","dose.d8-fitting.cost":"서화 공시 가격 기준, 1인당 4시간 약 24,000원 또는 종일 32,000원","dose.d8-fitting.detail":"09:00 오픈에 맞춰 예약 없이 워크인, 70분 안에 마쳐야 합니다. 한복남을 추천 — 리뷰 4,426건에 평점 4.7, 이 근처에서 옷 종류가 가장 다양하고, 호텔에서 1.1 km 거리입니다. 광화문에서 서쪽으로 약 350미터에 있어서 가는 길에 궁을 지나가고, 끝난 뒤에는 잠깐만 되돌아오면 돼요. 옷 입는 순서: 할머니·할아버지, 두 살 아이, 아기들, 그다음 가장 빠르게 스스로 입을 수 있는 어른 순.","dose.d8-fitting.label.0":"종일권으로. 09:10에 4시간 대여하면 13:10 만료(점심 시간).","dose.d8-fitting.label.1":"아기 한 명당 한복 갈아입히기 20분씩 잡으세요. 아기가 둘입니다.","dose.d8-fitting.label.2":"한복남에 이메일: 오픈에 스타일리스트 2명? 1명이면 10:50 위태.","dose.d8-fitting.label.3":"오픈에 맞춰 도착. 이른 시간은 조용하고, 뒤로 갈수록 붐빕니다.","dose.d8-fitting.label.4":"메이크업 없는 어른 1명이 08:55에 한복남 가서 서류·사이즈 먼저.","dose.d8-fitting.label.5":"여기 직원은 혼자 고르라 둘 수 있어요. 카운터에서 사이즈 안내 요청.","dose.d8-fitting.label.6":"한복남이 한 번에 아홉 명(아기 둘 포함) 대여 가능한지 확인.","dose.d8-fitting.title":"한복 대여·9명","dose.d8-fitting.where":"한복 대여점","dose.d8-fitting.who":"다 함께","dose.d8-hairmakeup.cost":"1인당, 서비스 등급별","dose.d8-hairmakeup.detail":"이건 한복보다 먼저 해야 합니다. 나란히 진행이 아니라 반드시 먼저예요. 살롱이 한복 대여점보다 한 시간 일찍 열기 때문입니다. 뷰티팰리스 경복궁점은 일요일 08:00에 열고, 40분짜리 한복 메이크업과 70분짜리 한복 메이크업+업스타일 서비스를 운영합니다. 하려는 사람은 모두 40분짜리로 예약해서 자리를 병행으로 돌리세요.","dose.d8-hairmakeup.label.0":"뷰티팰리스는 동시 6명. 9명은 08:00부터 시간을 나눠 예약.","dose.d8-hairmakeup.label.1":"화요일 휴무. 9월 13일 일요일은 괜찮지만 화요일로 옮기지 마세요.","dose.d8-hairmakeup.label.2":"08:00 근무 인원 확인. 한 명이 09:00까지 네 명 마감 불가.","dose.d8-hairmakeup.title":"헤어·메이크업, 첫 타임","dose.d8-hairmakeup.where":"경복궁 일대의 메이크업 살롱","dose.d8-hairmakeup.who":"받기로 한 어른들","dose.d8-lunch.detail":"다들 배고프고 덥고 지쳐 있을 거예요. 가깝고 의자 있는 곳으로. 찾아 다니지 마세요.","dose.d8-lunch.label.0":"점심 예약. 일요일에 경복궁 근처에서 아홉 명이 예약 없이는 위험합니다.","dose.d8-lunch.label.1":"두 살 아이 소동에도 무리 없는 점심 선택, 절반 먼저 보낼 준비.","dose.d8-lunch.title":"경복궁 근처 점심","dose.d8-lunch.who":"다 함께","dose.d8-rest.detail":"여행에서 가장 큰 오전이었으니, 여행에서 가장 비어 있는 오후를 누리세요.","dose.d8-rest.label.0":"보호된 휴식 시간. 여기엔 아무 일정도 넣지 마세요.","dose.d8-rest.title":"호텔 복귀·전원 오프","dose.d8-rest.who":"다 함께","dose.d8-return.detail":"가게로 돌아가 옷을 갈아입고 자기 옷을 챙기세요. 종일 대여를 하고 다들 힘이 남아 있다면 점심때까지 한복을 입고 있어도 됩니다.","dose.d8-return.title":"한복 반납","dose.d8-return.who":"다 함께","dose.d8-shoot.cost":"입장료 19~64세 어른 3,000원, 규정에 맞는 한복 착용 시 무료","dose.d8-shoot.detail":"흥례문 안에서 만나요. 한복을 완전히 갖춰 입은 사람은 궁 입장이 무료입니다. 규정은 전통 한복과 개량 한복 모두 인정하고요. 부모님은 65세 이상이라 원래 무료이고, 아이 셋도 모두 무료입니다.","dose.d8-shoot.label.0":"무료 입장은 완전한 한복: 저고리+치마 또는 바지. 일부만이면 정가.","dose.d8-shoot.label.1":"단체·할머니·할아버지 컷 먼저. 아기들 컨디션은 40분이 한계.","dose.d8-shoot.label.2":"도착하면 안내센터 옆 수유실 위치 확인. 교체대·전자레인지·개수대 있음.","dose.d8-shoot.label.3":"궁 안 길에 자갈과 거친 돌 있음. 들어가면 아기띠 사용.","dose.d8-shoot.title":"경복궁 사진 촬영","dose.d8-shoot.where":"경복궁","dose.d8-shoot.who":"다 함께","dose.d8-toPalace.detail":"보통 5분이면 되는 거리에 20분을 잡으세요. 유모차 두 대에 한복 차림 아홉 명은 정상 도보 속도가 안 나옵니다. 10:45에는 만남 지점에 서서 5분 여유가 있도록 목표하세요.","dose.d8-toPalace.fallback":"지금 정해 두고 10:30에는 다시 논의하지 않는 결정: 대여점 진행이 늦어지면 10:30에 할머니·할아버지, 남자들, 두 살 아이를 먼저 도보로 보내 만남 지점을 잡아 두세요. 마지막 립 수정은 건너뛰세요. 10:50에 사과 문자를 보내지 말고 10:20에 사진작가에게 현실적인 인원을 알리세요. 팀 전체의 실질 마감은 11:00 — 사진작가는 10분은 기다려도 30분은 기다리지 않습니다.","dose.d8-toPalace.getting":"광화문으로 입장하세요. 매표·안내소는 두 번째 문인 흥례문 안에 있습니다. 공식 투어가 여기서 모이고, '메인 매표 입구'라고 하는 곳이 여기일 가능성이 높아요.","dose.d8-toPalace.label.0":"광화문·흥례문 부근 수문장 교대식 10:00 20분, 11:00 10분. 도보 넉넉히.","dose.d8-toPalace.label.1":"사진작가와 만남 지점 확정, 연락처 교환. 광화문·매표소 150m 거리.","dose.d8-toPalace.label.2":"사진작가와 우천 대안 사전 확정: 실내 전각, 지붕 회랑, 일정 변경.","dose.d8-toPalace.title":"흥례문까지 도보","dose.d8-toPalace.where":"경복궁 · 흥례문 안 매표·안내소","dose.d8-toPalace.who":"다 함께","dose.d8-toSalon.detail":"네이버 지도에서 호텔부터 경복궁 일대까지 1.1 km — 도보 18분, 1,719걸음, 횡단보도 4개, 계단이 없어 유모차 두 대에도 문제없는 길입니다. 이 가까움이 사진 촬영일을 이번 일정에 넣은 이유예요. 그래도 택시를 타세요. 아홉 명을 08:00 확정 예약에 맞춰 이동시켜야 하는데, 걸어가면 가장 먼저 흐트러지는 게 이 도보 이동입니다.","dose.d8-toSalon.getting":"나인트리 프리미어 인사동에서 택시 두 대. 우정국로·율곡로·사직로를 따라 서쪽으로 1.1 km — 네이버 지도 기준 차량으로 3분, 한 대에 4,800원(서울 기본요금, 통행료 없음). 두 대 합계 약 9,600원. [네이버 지도, 8월 27일 확인] 일요일 07:35에 길에서 잡지 말고, 전날 밤에 프런트에 두 대 예약을 부탁하세요. 앱보다 안정적이고, 다시는 못 하는 아침에 앱 가입 문제 자체를 아예 없애 줍니다.","dose.d8-toSalon.label.0":"택시 실패 시 07:30까지 도보 18분(1.1km), 또는 3호선 안국역 6번 출구 한 정거장. 1,550원.","dose.d8-toSalon.title":"살롱까지 택시 두 대","dose.d8-toSalon.where":"뷰티팰리스 경복궁점, 또는 예약한 메이크업 살롱","dose.d8-toSalon.who":"다 함께","dose.d8-toShop.detail":"살롱과 대여점은 경복궁역 4번 출구와 자하문로2길 주변 같은 몇 골목에 몰려 있어요. 짧고 평평한 도보 이동, 이동이라 부를 정도도 아닙니다.","dose.d8-toShop.title":"한복집으로 도보 이동","dose.d8-toShop.where":"한복 대여점, 경복궁역 4번 출구 일대","dose.d8-toShop.who":"다 함께","dose.d9-back.detail":"도시를 가로질러 30분. 오늘은 취침이 늦어지도록 일부러 짠 거라, 내일 아침은 실내에서 천천히 시작해요.","dose.d9-back.title":"인사동으로 먼저 복귀","dose.d9-back.who":"할머니·할아버지 · 아이 셋 · 당번 부모","dose.d9-bfast.detail":"일부러 늦게 시작 — 오늘의 진짜 일정은 망원시장에서의 저녁이니, 오후 중반부터 지쳐 있으면 안 돼요.","dose.d9-bfast.title":"아침","dose.d9-bfast.who":"다 함께","dose.d9-cheonggyecheon.detail":"도심 한복판, 도로 아래로 흐르는 하천이고, 호텔에서 걸어서 5분이에요. 물가라 시원하고, 전 구간이 평지고, 더위가 오기 전에 걷기엔 정말 좋아요. 걷고 싶은 만큼만 걷다가 아무 다리에서든 올라오면 돼요. 원래는 시간 때우기용이었는데 오늘의 진짜 오전 일정으로 옮겼어요 — 오후엔 마포까지 나가야 하니 아침은 가볍게 시작해야 해서요.","dose.d9-cheonggyecheon.fallback":"언제든 되돌아와도 돼요. 하천 전체가 위쪽 도로와 나란히 흐르니까, 꼭 얼마를 걸어야 한다는 게 없어요.","dose.d9-cheonggyecheon.label.0":"하천 진입로는 대부분 계단이에요. 유모차라면 경사로 입구를 먼저 찾으세요.","dose.d9-cheonggyecheon.title":"청계천의 아침","dose.d9-cheonggyecheon.where":"청계천, 호텔에서 도보 5분","dose.d9-cheonggyecheon.who":"다 함께","dose.d9-hongdae.detail":"홍대 메인 거리는 연남 공원 끝에서 도보 10분이에요 — 버스킹, 길거리 음식, 레코드 가게, 그리고 서울에서 늦게까지 여는 가게가 가장 빽빽하게 모인 곳이에요. 확정이 아니라 후보로 넣어둔 이유는, 시끄럽고 심하게 붐비고 잠자리에 들 아기 둘한테는 아주 안 맞는 환경이라서예요. 한 가지 다행: 오늘이 월요일이라, 이 동네에서 한 주 중 가장 조용한 저녁이에요.","dose.d9-hongdae.fallback":"그냥 건너뛰기. 아이가 있는 사람은 다 연남에서 바로 호텔로 돌아가고, 이 일정은 아예 없는 걸로.","dose.d9-hongdae.label.0":"19:30에 홍대 팀 분리. 갈 어른만 보내고, 나머지는 차로 호텔로.","dose.d9-hongdae.title":"홍대, 원하는 사람만","dose.d9-hongdae.where":"홍대 메인 거리와 어울마당로","dose.d9-hongdae.who":"가고 싶은 어른들","dose.d9-lunch.detail":"종로로 돌아와 시간에 여유가 있어요. 오늘 저녁은 시장에서 서서 먹는 자리라, 여기서 제대로 챙겨 드세요.","dose.d9-lunch.title":"호텔 근처에서 점심","dose.d9-lunch.who":"다 함께","dose.d9-mangwon.detail":"광장시장 대신 넣은 곳이고, 이 팀한테 중요한 모든 면에서 더 잘 맞아요. 망원은 관광지가 아니라 실제로 굴러가는 동네 시장이에요 — 현지 사람들이 진짜 장을 보고, 관광객용으로 가격이 새로 매겨져 있지도 않고, 지붕 있는 아케이드가 광장시장 통로보다 넓고 여유로워요. 여기서 먹을 것은 새콤달콤한 소스의 닭강정, 떡볶이, 갓 튀긴 만두, 그리고 고로케예요. 늦은 오후가 사람이 차고 모든 게 뜨끈뜨끈한 시간이에요.","dose.d9-mangwon.fallback":"너무 붐비면 먹을 것만 사서 도보 2분 const SKY = {
  sun:     { icon: "sun",     label: "Sunny" },
  cloud:   { icon: "cloud",   label: "Cloudy" },
  rain:    { icon: "rain",    label: "Rain" },
  showers: { icon: "showers", label: "Showers" },
  drizzle: { icon: "drizzle", label: "Mist and drizzle" },
  travel:  { icon: "travel",  label: "In the air" },
};

function icon(name, size = 14) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.5");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", ICON[name] || ICON.warn);
  svg.append(p);
  return svg;
}

/* ---------------- time helpers ---------------- */

const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW_KO = ["일", "월", "화", "수", "목", "금", "토"];

const parseISO = (d) => {
  const [y, m, dd] = d.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, dd));
};

const dowOf = (d) => DOW[parseISO(d).getUTCDay()];
const dayNum = (d) => parseISO(d).getUTCDate();
const monOf = (d) => MON[parseISO(d).getUTCMonth()];

/* Korean writes the weekday last and in one character, which is why the day rail
   fits it in the same slot as "Sat". */
const dowShort = (d) => (lang === "ko" ? DOW_KO[parseISO(d).getUTCDay()] : dowOf(d));
const fmtDate = (d) =>
  lang === "ko"
    ? `${parseISO(d).getUTCMonth() + 1}월 ${dayNum(d)}일 (${DOW_KO[parseISO(d).getUTCDay()]})`
    : `${dowOf(d)} ${dayNum(d)} ${monOf(d)}`;

const toMin = (hhmm) => {
  if (!hhmm) return null;
  const [h1, m1] = hhmm.split(":").map(Number);
  return h1 * 60 + m1;
};

const fmtDur = (mins) => {
  if (!mins) return null;
  const hrs = Math.floor(mins / 60);
  const rem = mins % 60;
  if (lang === "ko") {
    if (hrs && rem) return `${hrs}시간 ${rem}분`;
    if (hrs) return `${hrs}시간`;
    return `${rem}분`;
  }
  if (hrs && rem) return `${hrs}h ${rem}m`;
  if (hrs) return `${hrs}h`;
  return `${rem}m`;
};

/** Current wall-clock date and time in Seoul, regardless of the host's zone. */
function seoulNow() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t)?.value ?? "00";
  return {
    date: `${get("year")}-${get("month")}-${get("day")}`,
    minutes: Number(get("hour")) * 60 + Number(get("minute")),
    clock: `${get("hour")}:${get("minute")}`,
  };
}

/* ---------------- language ---------------- */

/* English is the source of truth; Korean is an overlay keyed off the same ids
   (lib/ko.mjs). A missing key falls back to English rather than showing a blank,
   so a half-translated build degrades to a readable one. */

const LANG_KEY = "seoul-2026-09/lang";
const LANGS = ["en", "ko"];

let lang = (() => {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch { /* private mode */ }
  return "en";
})();

const dict = () => (lang === "ko" ? window.__KO__ || {} : null);

/** Korean for `key` when Korean is on and we have it; the English otherwise. */
function t(key, en) {
  const d = dict();
  const v = d && d[key];
  return typeof v === "string" && v.trim() ? v : en;
}

/** Interface chrome, with {placeholder} interpolation. */
function ui(key, en, vars) {
  let s = t(`ui.${key}`, en);
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}

/* Content accessors — one per shape in the plan, so the key strings live in
   exactly one place and stay in step with scripts/i18n.mjs. */
const tTrip = (f) => t(`trip.${f}`, state.trip[f]);
const tLeg = (leg, f) => t(`leg.${leg.id}.${f}`, leg[f]);
const tDay = (day, f) => t(`day.${day.date}.${f}`, day[f]);
const tDose = (dose, f) => t(`dose.${dose.id}.${f}`, dose[f]);
const tLabel = (dose, i, text) => t(`dose.${dose.id}.label.${i}`, text);
const tNap = (day, i, f, v) => t(`day.${day.date}.nap.${i}.${f}`, v);
const tWeatherNote = (day) => t(`day.${day.date}.weatherNote`, day.weather?.note);
const skyLabel = (k) => ui(`sky.${k}`, SKY[k]?.label || "");

function setLang(next) {
  if (next === lang || !LANGS.includes(next)) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch { /* private mode */ }
  applyLang();
  render();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dataset.lang = lang;
}

/* ---------------- state ---------------- */

const state = { trip: null, day: null, view: "day", sheet: null };
let lastOrigin = null;

const LS_KEY = "seoul-2026-09/local";
function readLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function writeLocal(v) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch { /* private mode */ }
}
function withLocal(seed) {
  const ov = readLocal();
  if (!Object.keys(ov).length) return seed;
  return {
    ...seed,
    days: seed.days.map((d) => ({
      ...d,
      doses: d.doses.map((x) => (ov[x.id] ? { ...x, ...ov[x.id] } : x)),
    })),
  };
}

async function load() {
  state.trip = withLocal(window.__TRIP__);
  const now = seoulNow();
  const dates = state.trip.days.map((d) => d.date);
  const inTrip = dates.includes(now.date);
  state.day = inTrip ? now.date : dates[0];
  state.view = inTrip ? "day" : "overview";
  applyLang();
  render();
}

async function patchDose(id, patch) {
  const ov = readLocal();
  ov[id] = { ...(ov[id] || {}), ...patch };
  writeLocal(ov);
  state.trip = withLocal(window.__TRIP__);
  render();
}

const currentDay = () => state.trip.days.find((d) => d.date === state.day);
const legOf = (day) => state.trip.legs.find((l) => l.id === day.legId);

/** Every dose in the trip that carries a caution or an unverified fact. */
function allFlags() {
  const out = [];
  for (const day of state.trip.days) {
    for (const dose of day.doses) {
      for (const label of dose.labels || []) {
        if (label.kind === "warn" || label.kind === "verify") out.push({ day, dose, label });
      }
    }
  }
  return out;
}

/* ---------------- render ---------------- */

function render() {
  const root = $("#app");
  const body =
    state.view === "index" ? renderIndex() :
    state.view === "overview" ? renderOverview() :
    renderDay();
  root.replaceChildren(
    renderEnvelope(),
    renderRail(),
    body,
  );
  const flags = allFlags();
  const existing = $(".fab");
  if (existing) existing.remove();
  if (flags.length) document.body.append(renderFab(flags.length));
  if (state.sheet) openSheet(state.sheet);
}

function renderEnvelope() {
  const trip = state.trip;
  const now = seoulNow();
  const inTrip = trip.days.some((d) => d.date === now.date);

  return h("header", { class: "envelope" },
    h("div", { class: "envelope__top" },
      h("button", {
        class: "envelope__mark",
        "aria-label": ui("summary", "Trip summary"),
        onclick: () => { state.view = "overview"; render(); },
      },
        tTrip("dispensedBy"),
        h("b", {}, tTrip("title")),
      ),
      h("div", { class: "envelope__right" },
        h("div", { class: "envelope__count" },
          inTrip ? ui("seoulNow", "Seoul now") : ui("seoulTime", "Seoul time"),
          h("b", { class: "u-mono" }, now.clock),
        ),
        renderLangToggle(),
      ),
    ),
    h("div", { class: "legs", role: "tablist", "aria-label": ui("legs", "Trip legs") },
      trip.legs.map((leg) => {
        const selected = currentDay() && currentDay().legId === leg.id && state.view === "day";
        return h("button", {
          class: "leg", role: "tab", "aria-selected": String(!!selected),
          onclick: () => { state.view = "day"; state.day = leg.firstDay; render(); },
        },
          h("span", { class: "leg__n" }, `RX ${leg.n}`),
          h("span", { class: "leg__name" }, tLeg(leg, "short")),
          h("span", { class: "leg__dates" }, tLeg(leg, "range")),
        );
      }),
    ),
  );
}

/* Two states, printed on the envelope rather than floated over it. Each button
   is labelled in its own language, so a reader who cannot read the current one
   can still find their way out. */
function renderLangToggle() {
  return h("div", { class: "langsel", role: "group", "aria-label": ui("lang", "Language") },
    LANGS.map((code) => h("button", {
      class: `langsel__b${code === lang ? " is-on" : ""}`,
      type: "button",
      lang: code,
      "aria-pressed": String(code === lang),
      onclick: () => setLang(code),
    }, code === "ko" ? "한국어" : "EN")),
  );
}

function renderRail() {
  const rail = h("div", { class: "rail", role: "tablist", "aria-label": ui("days", "Days") });
  const now = seoulNow();
  rail.append(h("button", {
    class: "day-tab day-tab--all",
    role: "tab", "aria-selected": String(state.view === "overview"),
    "aria-label": ui("wholeTrip", "Whole trip on one page"),
    onclick: () => { state.view = "overview"; render(); },
  },
    h("span", { class: "day-tab__dow" }, ui("all", "All")),
    h("span", { class: "day-tab__d day-tab__d--all" }, ui("allDays", "days")),
  ));
  for (const day of state.trip.days) {
    const selected = day.date === state.day && state.view === "day";
    const hasFixed = day.doses.some((d) => d.status === "booked" && d.kind === "fixed");
    const hasWarn = day.doses.some((d) => (d.labels || []).some((l) => l.kind === "warn"));
    rail.append(h("button", {
      class: `day-tab${day.date === now.date ? " day-tab--today" : ""}`,
      role: "tab", "aria-selected": String(selected),
      "aria-label": `${fmtDate(day.date)} — ${tDay(day, "title")}`,
      onclick: () => { state.view = "day"; state.day = day.date; render(); },
    },
      h("span", { class: "day-tab__dow" }, dowShort(day.date)),
      h("span", { class: "day-tab__d" }, String(dayNum(day.date))),
      hasFixed ? h("span", { class: "day-tab__pin" })
        : hasWarn ? h("span", { class: "day-tab__pin day-tab__pin--warn" }) : null,
    ));
  }
  queueMicrotask(() => {
    const active = rail.querySelector('[aria-selected="true"]');
    if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
  });
  return rail;
}

function renderDay() {
  const day = currentDay();
  const leg = legOf(day);
  const now = seoulNow();
  const isToday = day.date === now.date;

  const scroll = h("div", { class: "strip-scroll", id: "scroll" });

  scroll.append(
    h("div", { class: "day-head" },
      h("div", { class: "day-head__meta" },
        h("span", {}, ui("dayOf", `Day ${state.trip.days.indexOf(day) + 1} of ${state.trip.days.length}`,
          { i: state.trip.days.indexOf(day) + 1, n: state.trip.days.length })),
        h("span", { class: "sep" }, "·"),
        h("span", {}, fmtDate(day.date)),
        isToday ? [h("span", { class: "sep" }, "·"), h("span", { style: { color: "var(--red)" } }, ui("today", "Today"))] : null,
      ),
      h("h1", {}, tDay(day, "title")),
      h("p", { class: "day-head__base" }, icon("pin", 13), tLeg(leg, "hotel")),
    ),
    h("section", { class: "directions", "aria-label": ui("directionsAria", "Directions for the day") },
      h("div", { class: "directions__label" },
        h("span", {}, ui("directions", "Directions")),
        h("span", {}, tDay(day, "pace")),
      ),
      h("p", {}, tDay(day, "note")),
      day.naps?.length
        ? h("div", { class: "directions__naps" },
            day.naps.map((n, i) => h("span", { class: "nap-chip" },
              icon("rest", 12), tNap(day, i, "who", n.who),
              (() => {
                const s = tNap(day, i, "start", n.start);
                const e = n.end && n.end !== "—" ? tNap(day, i, "end", n.end) : null;
                return h("time", {}, e ? `${s}–${e}` : s);
              })())))
        : null,
    ),
    renderConditions(day),
  );

  const strip = h("div", { class: "strip" });
  let nowPlaced = !isToday;

  day.doses.forEach((dose, i) => {
    if (!nowPlaced && toMin(dose.start) > now.minutes) {
      strip.append(h("div", { class: "now-rule" }, h("span", { class: "now-rule__tag" }, `${ui("now", "NOW")} ${now.clock}`)));
      nowPlaced = true;
    }
    if (i > 0) strip.append(h("div", { class: "perf", "aria-hidden": "true" }));
    strip.append(renderSachet(dose, i, day));
  });

  scroll.append(strip);
  return scroll;
}

function renderConditions(day) {
  const w = day.weather;
  if (!w) return null;
  const sky = SKY[w.sky] || SKY.cloud;
  const severe = w.sky === "rain" || w.sky === "showers";

  return h("section", {
      class: `conditions${severe ? " conditions--wet" : ""}`,
      "aria-label": ui("storageAria", "Weather outlook for the day"),
    },
    h("div", { class: "conditions__head" },
      h("span", { class: "conditions__term" }, ui("storage", "Storage conditions")),
      h("span", { class: "conditions__read" },
        h("span", { class: "conditions__ico" }, icon(sky.icon, 15)),
        h("span", { class: "conditions__sky" }, skyLabel(w.sky) || sky.label),
        w.hi != null
          ? h("span", { class: "conditions__temp" },
              h("b", {}, `${w.hi}°`), h("span", { class: "conditions__slash" }, "/"), h("i", {}, `${w.lo}°`))
          : null,
      ),
    ),
    h("p", { class: "conditions__note" }, tWeatherNote(day)),
    h("p", { class: "conditions__caveat" },
      icon("verify", 12),
      h("span", {}, tTrip("weatherCaveat") ||
        "Long-range statistical model — not a forecast. Re-check three days out."),
    ),
  );
}

function renderSachet(dose, i, day) {
  const done = !!dose.done;
  const cls = ["sachet", `sachet--${dose.kind}`, dose.status === "idea" && "sachet--idea",
    dose.status === "booked" && "sachet--stamped", done && "sachet--done"]
    .filter(Boolean).join(" ");

  const span = dose.end ? `${dose.start}–${dose.end}` : fmtDur(dose.mins);

  return h("button", {
    class: cls, "data-adv": true, style: { "--i": i },
    "aria-label": ui("openDetails", `${dose.start} ${tDose(dose, "title")}. Open details.`,
      { time: dose.start, title: tDose(dose, "title") }),
    onclick: (e) => { state.sheet = dose.id; openSheet(dose.id, e.currentTarget); },
  },
    h("div", { class: "sachet__body" },
      h("div", { class: "sachet__head" },
        h("span", { class: "sachet__time" }, dose.start),
        span ? h("span", { class: "sachet__span" }, span) : null,
        h("span", { class: "sachet__seq" }, `${String(i + 1).padStart(2, "0")}/${String(day.doses.length).padStart(2, "0")}`),
      ),
      h("div", { class: "sachet__title" }, tDose(dose, "title")),
      dose.detail ? h("p", { class: "sachet__detail" }, tDose(dose, "detail")) : null,
      (dose.leaveBy || dose.who) ? h("div", { class: "sachet__foot" },
        dose.leaveBy ? h("span", { class: "leaveby" }, `${ui("leaveBy", "Leave by")} ${dose.leaveBy}`) : null,
        dose.who ? h("span", { class: `who${dose.whoSplit ? " who--split" : ""}` }, tDose(dose, "who")) : null,
      ) : null,
      dose.labels?.length ? h("div", { class: "labels" },
        dose.labels.map((l, li) => h("span", { class: `label label--${l.kind}` }, icon(l.kind === "rest" ? "rest" : l.kind === "verify" ? "verify" : l.kind === "fall" ? "fall" : "warn", 13), tLabel(dose, li, l.text))),
      ) : null,
    ),
    dose.status === "booked" ? h("span", { class: "stamp", "aria-hidden": "true" }, h("b", {}, "조제"), ui("booked", "BOOKED")) : null,
  );
}

/* ---------------- expanded sachet ---------------- */

const SEAL_VAR = {
  fixed: "var(--red)", rest: "var(--blue)", meal: "var(--hanji)", medical: "var(--green)",
  transit: "color-mix(in srgb, var(--blue) 52%, var(--hanji))",
  outing: "color-mix(in srgb, var(--hanji) 70%, var(--red))",
  shop: "color-mix(in srgb, var(--hanji) 55%, var(--ink))",
  admin: "color-mix(in srgb, var(--ink) 38%, var(--film))",
  idea: "color-mix(in srgb, var(--ink) 22%, transparent)",
};

function openSheet(id, origin) {
  closeSheet(false);
  let dose = null, day = null;
  for (const d of state.trip.days) {
    const found = d.doses.find((x) => x.id === id);
    if (found) { dose = found; day = d; break; }
  }
  if (!dose) return;
  state.sheet = id;
  lastOrigin = origin || null;

  const backdrop = h("div", { class: "sheet-backdrop", onclick: () => closeSheet() });
  const sheet = h("div", {
    class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": tDose(dose, "title"), tabindex: "-1",
    style: { "--seal": SEAL_VAR[dose.kind] || "var(--film-edge)" },
  },
    h("div", { class: "sheet__grip" }),
    h("div", { class: "sheet__seal", "aria-hidden": "true" }),
    h("div", { class: "sheet__body" },
      h("div", { class: "sheet__head" },
        h("span", { class: "sheet__time" }, dose.start),
        dose.end ? h("span", { class: "sachet__span" }, `→ ${dose.end}`) : null,
        dose.mins ? h("span", { class: "sachet__span" }, fmtDur(dose.mins)) : null,
      ),
      h("h2", {}, tDose(dose, "title")),
      dose.detail ? h("p", { class: "sheet__detail" }, tDose(dose, "detail")) : null,
      dose.labels?.length ? h("div", { class: "labels" },
        dose.labels.map((l, li) => h("span", { class: `label label--${l.kind}` }, icon(l.kind === "rest" ? "rest" : l.kind === "verify" ? "verify" : l.kind === "fall" ? "fall" : "warn", 13), tLabel(dose, li, l.text))),
      ) : null,
      h("dl", { class: "fields" },
        field(ui("f.date", "Date"), fmtDate(day.date)),
        field(ui("f.who", "Who"), dose.who ? tDose(dose, "who") : ui("everyone", "Everyone")),
        dose.leaveBy ? field(ui("f.leaveBy", "Leave by"), dose.leaveBy) : null,
        dose.where ? field(ui("f.where", "Where"), (() => {
          /* Gate on the English string so the filters keep working, then
             search in Korean when Korean is on — Naver resolves it better. */
          const gate = naverQuery(dose.where);
          const koWhere = lang === "ko" ? tDose(dose, "where") : null;
          const q = gate && koWhere && koWhere !== dose.where
            ? koWhere.split(/\s+[·—→]\s+/)[0].trim().replace(/[,;.]+$/, "")
            : gate;
          return h("span", {},
            tDose(dose, "where"),
            q ? h("a", {
              class: "field__map",
              href: `https://map.naver.com/p/search/${encodeURIComponent(q)}`,
              target: "_blank", rel: "noreferrer",
            }, icon("pin", 12), ui("naverMap", "Naver Map")) : null,
          );
        })()) : null,
        dose.getting ? field(ui("f.getting", "Getting there"), tDose(dose, "getting")) : null,
        dose.cost ? field(ui("f.cost", "Cost"), tDose(dose, "cost")) : null,
        dose.fallback ? field(ui("f.fallback", "If it fails"), tDose(dose, "fallback")) : null,
        dose.book ? field(ui("f.book", "To book"), dose.book) : null,
        field(ui("f.status", "Status"), {
          booked: ui("status.booked", "Booked and confirmed"),
          planned: ui("status.planned", "Planned, not booked"),
          idea: ui("status.idea", "Idea — swap freely"),
        }[dose.status] || dose.status),
        dose.source ? field(ui("f.source", "Source"), h("a", { href: dose.source, target: "_blank", rel: "noreferrer" }, new URL(dose.source).hostname.replace(/^www\./, ""))) : null,
      ),
      h("div", { class: "sheet__actions" },
        h("button", {
          class: "btn btn--primary",
          onclick: () => { patchDose(dose.id, { done: !dose.done }); closeSheet(); },
        }, dose.done ? ui("markNotDone", "Mark not done") : ui("markDone", "Mark done")),
        h("button", { class: "btn", onclick: () => closeSheet() }, ui("close", "Close")),
      ),
    ),
  );

  document.body.append(backdrop, sheet);

  /* Peephole: the sheet grows out of the sachet you tapped and shrinks back
     into it, so the strip stays the map and the sheet is the window opening. */
  if (lastOrigin && !reduceMotion()) {
    const from = lastOrigin.getBoundingClientRect();
    const to = sheet.getBoundingClientRect();
    if (to.width > 0 && to.height > 0) {
      const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
      const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
      sheet.animate(
        [
          { transform: `translate(${dx}px, ${dy}px) scale(${Math.max(0.28, from.width / to.width)}, ${Math.max(0.12, from.height / to.height)})`, opacity: 0, borderRadius: "8px" },
          { transform: "translate(0, 0) scale(1, 1)", opacity: 1 },
        ],
        { duration: 320, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "backwards" },
      );
      backdrop.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: "ease-out" });
    }
  }

  const app = document.getElementById("app");
  if (app) app.inert = true;
  sheet.focus();
}

function reduceMotion() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* Focus trap. aria-modal alone does not stop Tab escaping into the strip. */
function trapFocus(e) {
  const sheet = document.querySelector(".sheet");
  if (!sheet || e.key !== "Tab") return;
  const items = [...sheet.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter((el) => el.offsetParent !== null);
  if (!items.length) { e.preventDefault(); sheet.focus(); return; }
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === sheet)) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}
document.addEventListener("keydown", trapFocus, true);

/* Google Maps will not route inside Korea, so every location links to Naver.
   The `where` strings carry prose after the place name; strip it down to
   something Naver can actually resolve, and link nothing when it cannot. */
const GENERIC = /^(hanbok rental|makeup salon)\b|^(a|an|the)?\s*(shop|salon|clinic|restaurant|market)s?\b/i;

function naverQuery(where) {
  if (!where) return null;
  let q = where.split(/\s+[·—→]\s+/)[0];
  q = q.split(/\.\s|\bor\b/i)[0];
  q = q.replace(/,\s+[a-z][^,]*$/, "");
  q = q.trim().replace(/[,;.]+$/, "");
  if (q.length > 75) q = q.split(",")[0].trim();
  if (!q) return null;
  if (/\bSEA\b|Seattle|^Departs\b/i.test(q)) return null;
  if (GENERIC.test(q)) return null;
  if (!/[A-Z\uAC00-\uD7A3]/.test(q)) return null;
  return q;
}

function field(label, value) {
  return h("div", { class: "field" }, h("dt", {}, label), h("dd", {}, value));
}

function closeSheet(clearState = true) {
  const sheet = document.querySelector(".sheet");
  const backdrop = document.querySelector(".sheet-backdrop");
  const app = document.getElementById("app");
  if (app) app.inert = false;

  const origin = lastOrigin;
  const drop = () => { sheet?.remove(); backdrop?.remove(); };

  if (sheet && clearState && origin && document.contains(origin) && !reduceMotion()) {
    const from = origin.getBoundingClientRect();
    const to = sheet.getBoundingClientRect();
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    backdrop?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 190, easing: "ease-in", fill: "forwards" });
    const a = sheet.animate(
      [
        { transform: "translate(0, 0) scale(1, 1)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(${Math.max(0.28, from.width / to.width)}, ${Math.max(0.12, from.height / to.height)})`, opacity: 0, borderRadius: "8px" },
      ],
      { duration: 210, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" },
    );
    a.onfinish = drop;
    a.oncancel = drop;
  } else {
    drop();
  }

  if (clearState) { state.sheet = null; origin?.focus?.(); lastOrigin = null; }
}

/* ---------------- caution index ---------------- */

function renderFab(n) {
  const isIndex = state.view === "index";
  return h("button", {
    class: "fab",
    "aria-label": isIndex
      ? ui("backToDayAria", "Back to the day view")
      : ui("cautionsAria", `Cautions — ${n} warnings and open questions across the whole trip`, { n }),
    title: isIndex ? ui("backToDayAria", "Back to the day view") : ui("cautionsTitle", "Every warning and open question, in one list"),
    onclick: () => { state.view = isIndex ? "day" : "index"; render(); },
  }, icon("warn", 14), isIndex ? ui("backToDay", "Back to day") : ui("cautions", "Cautions"),
     isIndex ? null : h("span", { class: "fab__n", "aria-hidden": "true" }, String(n)));
}

/* The whole course on one page: what a dispensing label carries on the
   outside of the packet, before you tear off the first sachet. */
function renderOverview() {
  const trip = state.trip;
  const now = seoulNow();
  const scroll = h("div", { class: "strip-scroll" });

  const booked = [];
  for (const day of trip.days) {
    for (const dose of day.doses) {
      if (dose.status === "booked") booked.push({ day, dose });
    }
  }

  scroll.append(
    h("div", { class: "day-head" },
      h("h1", {}, ui("ovTitle", "Fourteen days, one page")),
      h("p", { class: "ov-lede" },
        ui("ovLede", "Every day in a line. Tap any of them for the times, the walking routes, and the things that could bite.")),
    ),
  );

  const wrap = h("div", { class: "strip" });

  /* Printed label block: the facts that govern the whole course. */
  const stayLegs = trip.legs.filter((l) => l.nights);
  const facts = [
    [ui("f.period", "Period"),
     ui("periodValue", `${monOf(trip.days[0].date)} ${dayNum(trip.days[0].date)} – ${dayNum(trip.days.at(-1).date)}, 2026`,
        { a: dayNum(trip.days[0].date), b: dayNum(trip.days.at(-1).date) }),
     ui("dayCount", `${trip.days.length} days`, { n: trip.days.length })],
    [ui("f.party", "Party"), ui("partyValue", "Nine"), ui("partyNote", "Two infants, one toddler, two grandparents")],
    [ui("f.bases", "Bases"),
     ui("hotelCount", `${stayLegs.length} hotels`, { n: stayLegs.length }),
     stayLegs.map((l) => tLeg(l, "short")).join(" · ")],
    [ui("f.bookedCount", "Booked"),
     ui("fixedCount", `${booked.length} fixed`, { n: booked.length }),
     ui("elseMoves", "Everything else can move")],
  ];
  const label = h("dl", { class: "ov-facts" });
  for (const [term, value, note] of facts) {
    label.append(
      h("dt", { class: "ov-facts__t" }, term),
      h("dd", { class: "ov-facts__v" },
        h("b", {}, value),
        h("span", {}, note),
      ),
    );
  }
  wrap.append(label);

  /* One band per stay, then the days that sit inside it. */
  for (const leg of trip.legs) {
    const days = trip.days.filter((d) => d.legId === leg.id);
    if (!days.length) continue;

    const band = h("section", { class: "ov-course" },
      h("h2", { class: "ov-course__h" },
        h("span", { class: "ov-course__n" }, `RX ${leg.n}`),
        h("span", { class: "ov-course__name" }, tLeg(leg, "hotel")),
        h("span", { class: "ov-course__meta" },
          leg.nights
            ? `${tLeg(leg, "range")} · ${ui("nights", `${leg.nights} nights`, { n: leg.nights })}`
            : tLeg(leg, "range")),
      ),
    );

    for (const day of days) {
      const sky = SKY[day.weather?.sky] || null;
      const fixed = day.doses.filter((d) => d.status === "booked").at(-1);
      const pace = (tDay(day, "pace") || "").split(/\s+[·—]\s+|\s+·\s+|\s+—\s+/)[0];
      const fixedTag = fixed ? ui("fixedAt", `${fixed.start} fixed`, { time: fixed.start }) : null;

      band.append(h("button", {
        class: `ov-day${day.date === now.date ? " ov-day--today" : ""}`,
        "aria-label": [
          fmtDate(day.date),
          tDay(day, "title"),
          fixedTag,
          tDay(day, "gist") || null,
        ].filter(Boolean).join(" — "),
        onclick: () => { state.view = "day"; state.day = day.date; render(); },
      },
        h("span", { class: "ov-day__date", "aria-hidden": "true" },
          h("span", { class: "ov-day__dow" }, dowShort(day.date)),
          h("span", { class: "ov-day__num" }, String(dayNum(day.date))),
        ),
        h("span", { class: "ov-day__body" },
          h("span", { class: "ov-day__title" }, tDay(day, "title")),
          fixedTag ? h("span", { class: "ov-day__fixed" }, fixedTag) : null,
          h("span", { class: "ov-day__gist" }, tDay(day, "gist") || ""),
        ),
        h("span", { class: "ov-day__side" },
          sky ? h("span", { class: "ov-day__sky", title: skyLabel(day.weather.sky) },
            icon(sky.icon, 15),
            h("span", { class: "u-sr" }, skyLabel(day.weather.sky)),
          ) : null,
          h("span", { class: "ov-day__pace" }, pace),
        ),
      ));
    }
    wrap.append(band);
  }

  wrap.append(h("p", { class: "ov-foot" }, tTrip("weatherCaveat") || ""));
  scroll.append(wrap);
  return scroll;
}

function renderIndex() {
  const flags = allFlags();
  const scroll = h("div", { class: "strip-scroll" });
  scroll.append(
    h("div", { class: "day-head" },
      h("div", { class: "day-head__meta" }, h("span", {},
        ui("idxMeta", `${flags.length} cautions across ${state.trip.days.length} days`,
          { n: flags.length, d: state.trip.days.length }))),
      h("h1", {}, ui("idxTitle", "Everything that could bite")),
    ),
  );

  const wrap = h("div", { class: "strip" });
  for (const kind of ["warn", "verify"]) {
    const group = flags.filter((f) => f.label.kind === kind);
    if (!group.length) continue;
    const g = h("section", { class: "index-group" },
      h("h2", { class: "index-group__h" }, kind === "warn"
        ? ui("grp.warn", "Collisions and cautions")
        : ui("grp.verify", "Confirm before you rely on it")),
    );
    for (const { day, dose, label } of group) {
      const li = (dose.labels || []).indexOf(label);
      g.append(h("button", {
        class: `index-row index-row--${dose.kind}`,
        onclick: () => { state.view = "day"; state.day = day.date; render(); openSheet(dose.id); },
      },
        h("span", { class: "index-row__seal", "aria-hidden": "true" }),
        h("div", { class: "index-row__m" }, `${fmtDate(day.date)} · ${dose.start}`),
        h("div", { class: "index-row__t" }, tDose(dose, "title")),
        h("div", { class: "index-row__d" }, tLabel(dose, li, label.text)),
      ));
    }
    wrap.append(g);
  }
  scroll.append(wrap);
  return scroll;
}

/* ---------------- keyboard ---------------- */

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.sheet) { closeSheet(); return; }
  if (state.view !== "day" || state.sheet) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.target.closest("input, textarea")) return;
  const dates = state.trip.days.map((d) => d.date);
  const i = dates.indexOf(state.day);
  const next = e.key === "ArrowLeft" ? i - 1 : i + 1;
  if (next < 0 || next >= dates.length) return;
  e.preventDefault();
  state.day = dates[next];
  render();
});

/* Live "now" rule: re-render on the minute so it stays honest. */
setInterval(() => { if (state.trip && !state.sheet) render(); }, 60_000);

load();

</script>
