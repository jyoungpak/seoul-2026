ing","status":"planned","who":"Whoever wants it","whoSplit":true,"detail":"A real route rather than a vague direction. Out of the hotel onto Insadong-gil, north along the main street through the paper, ceramic, tea and brush shops, into Ssamziegil at the top — a four-storey spiral ramp rather than stairs, so the stroller goes all the way up and back down without a lift. Cut east through Nagwon-dong and you are at the mouth of Ikseon-dong. The whole loop is about 1.2 km, entirely flat, and never more than eight minutes from your own room.","where":"Insadong-gil → Ssamziegil → Nagwon-dong · from the hotel door","getting":"On foot. The hotel is on Insadong-gil itself.","fallback":"Every point on this loop is a short walk back to the room, so it can be twenty minutes or two hours and anyone can peel off at any time.","labels":[{"kind":"warn","text":"The long-range model has this as the hottest day of the trip, around 30°C. Walk the shaded east side of the street, go into Ssamziegil when it bites, and carry water for your parents — this is their fourth consecutive day out."},{"kind":"rest","text":"Explicitly optional for your parents. The hotel is right there and nothing on this loop is worth a forced march."},{"kind":"verify","text":"Confirm whether Insadong-gil is car-free on the day you go — the pedestrian hours vary by day of the week."}]},{"id":"d6-ikseon","start":"16:45","end":"18:15","title":"Ikseon-dong alleys","kind":"outing","status":"planned","who":"Whoever wants it","whoSplit":true,"detail":"A dense grid of restored hanok converted into cafés and small shops, about ten minutes' walk from the hotel and directly at the end of the Insadong loop. Flat, shaded by the low rooflines, and photogenic without the hill climb Bukchon demands. Late afternoon is the right time — the shops are all open by now, and the lanes light up as the sun drops.","where":"Ikseon-dong, Jongno · about 700 m from the hotel","getting":"On foot, straight on from Nagwon-dong.","fallback":"Cheonggyecheon stream is five minutes south and is flat, shaded and noticeably cooler if the alleys are crowded.","source":"https://english.visitseoul.net/attractions/Ikseon-dong-Hanok-Village_/2686","labels":[{"kind":"warn","text":"The alleys are genuinely narrow — often under two metres, with café tables spilling out. A large stroller is awkward here; a carrier is much better. Consider leaving the big stroller at the hotel before this leg of the walk."},{"kind":"rest","text":"Moved here from the 14th on purpose. It is a ten-minute walk from this hotel, which makes it the right thing for a thin moving-day afternoon rather than a separate expedition."}]},{"id":"d6-dinner","start":"18:30","mins":75,"title":"Dinner in Ikseon-dong","kind":"meal","status":"planned","who":"Everyone","detail":"Eat where the walk ends rather than trekking back. Ikseon-dong is thick with restaurants in converted hanok, and the walk home afterwards is ten flat minutes. Table seating for nine, booked.","labels":[{"kind":"warn","text":"Ask explicitly for chairs when you book. Converted hanok often means floor seating, and this neighbourhood has far more of it than Gangnam did."},{"kind":"warn","text":"Book ahead for nine. Ikseon-dong restaurants are mostly small — several rooms of six — and a party this size frequently cannot be seated together without notice."}]}]},{"date":"2026-09-12","legId":"insa","title":"Museum day","pace":"Medium","weather":{"sky":"cloud","hi":28,"lo":20,"note":"Cloudy and 28°C. The museum is air-conditioned throughout, so this day is weather-proof by construction — which is exactly why the Yongsan add-on afterwards has an indoor option built into it."},"note":"A Saturday, so the palaces and markets will be at their worst. The national museum is the opposite: enormous, flat, air-conditioned, lift-served throughout, and free to enter. It is the single most infant-and-grandparent-friendly major sight in Seoul.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d7-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Breakfast is not included on this leg. Either the hotel's own, or a bakery — Korean bakery chains handle a group of nine without ceremony. The museum does not open until 10:00, so there is nothing to gain from being up before nine.","labels":[{"kind":"verify","text":"Confirm whether the Insadong booking includes breakfast and for how many."}]},{"id":"d7-museum","start":"10:30","end":"12:30","title":"National Museum of Korea","kind":"outing","status":"planned","who":"Everyone","detail":"Yongsan. Free general admission, vast flat galleries, lifts everywhere, stroller-free rental on site, and benches in most rooms. Do one wing, not the building.","where":"National Museum of Korea, 137 Seobinggo-ro, Yongsan-gu","source":"https://www.museum.go.kr/site/eng/home","fallback":"The reflecting pool and the path to the pagoda outside are worth the trip on their own if the galleries are too much.","labels":[{"kind":"rest","text":"Lactation room on the first floor; strollers and wheelchairs lend free at the information desk."},{"kind":"warn","text":"Closed Mondays — which is why this is a Saturday. Open until 18:00 today, so you are leaving with hours to spare on purpose."},{"kind":"verify","text":"The Children's Museum inside is free but needs an online reservation and books out weeks ahead. Reserve now, and check whether a single slot even holds nine people."}]},{"id":"d7-back","start":"12:40","end":"13:10","title":"Nap group back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · two adults","whoSplit":true,"leaveBy":"12:40","detail":"The half of the group that needs the nap goes straight back. Skipping the museum lunch is deliberate: eating at the museum pushes the toddler's nap past 14:00, and tomorrow is the one day of the trip that cannot absorb a badly rested two-year-old."},{"id":"d7-yongsan","start":"12:40","end":"15:00","title":"Yongsan afterwards, for whoever is free","kind":"outing","status":"planned","who":"Adults not on nap duty","whoSplit":true,"detail":"The museum is not the only reason to come out here, and it is a long way to travel for one building. Three things are within reach on foot or one stop: the museum's own grounds and reflecting pool, which are free and quietly one of the best pieces of landscape in Seoul; Ichon Hangang Park, straight down to the river; and Yongsan I'Park Mall at Yongsan Station, which is a genuinely enormous indoor complex with electronics, toys and a food court if the heat wins.","where":"Yongsan-gu · museum grounds, Ichon Hangang Park, Yongsan I'Park Mall","getting":"Museum grounds on foot. Ichon Hangang Park is about fifteen minutes' walk. Yongsan I'Park Mall is one stop on Line 4 or a five-minute taxi.","fallback":"Go straight back with everyone else. This is an add-on for the people who are not carrying a sleeping child, and skipping it costs nothing.","labels":[{"kind":"rest","text":"Structured as a split on purpose. The nap is protected either way — this only exists for the adults who would otherwise be sitting in a hotel room at 13:00."},{"kind":"warn","text":"Be back by 15:30. Tomorrow starts at 06:50 with a hard 10:50 call time, and tonight's hanbok prep needs everyone who is dressing to be present."},{"kind":"verify","text":"Confirm the Yongsan Park redevelopment area is open to walk-in visitors on the day — parts of the former base site open and close by reservation."}]},{"id":"d7-lunch","start":"13:15","mins":45,"title":"Lunch at the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Room service, a bakery run, or the nearest thing to the lobby. Speed matters more than quality today.","fallback":"Insadong-gil is full of takeaway. Somebody grabs food while everyone else goes up."},{"id":"d7-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","detail":"A full, on-time toddler nap, which is the entire reason today ends early. The grandparents should take this one too — tomorrow starts at 06:50 and runs long.","labels":[{"kind":"rest","text":"Protected nap window. The most load-bearing rest block of the trip."}]},{"id":"d7-prep","start":"16:30","end":"17:30","title":"Tomorrow's hanbok logistics, settled tonight","kind":"admin","status":"planned","who":"Jun","detail":"Confirm the rental booking, the number of people, the hair and makeup slots, and the walking route to the palace ticket office. Lay out what everyone wears underneath. Charge the camera.","labels":[{"kind":"warn","text":"Tomorrow has a hard 10:50 call time and nine people to dress. Everything that can be settled tonight should be."},{"kind":"warn","text":"Lay out both babies' 0호 hanbok tonight with everything else. They are the one item nobody can improvise in the morning, because the rental shop does not stock that size."},{"kind":"warn","text":"Set out one passport and about ₩70,000 in cash tonight. Both Seohwa and Oneday publish the same deposit rule — one passport for the group plus ₩10,000 cash per person renting, refunded after they check the garments. Seven renters means ₩70,000. A cash machine run at 08:45 is not a thing this morning can absorb."},{"kind":"warn","text":"Message the photographer tonight with the rain policy and a mobile number that will actually be answered in the morning. The long-range model has showers on the 13th, and Seoul in September is peak typhoon season — you want that conversation had before 08:00 tomorrow, not during it. Ask two specific things: what happens if it is raining at 10:50, and whether a covered alternative inside the palace grounds is on the table."}]},{"id":"d7-dinner","start":"18:00","mins":75,"title":"Early dinner, early night","kind":"meal","status":"planned","who":"Everyone","detail":"Genuinely early. Tomorrow is the day the whole trip is photographed."}]},{"date":"2026-09-13","legId":"insa","title":"Hanbok, and the photographs","pace":"Full · hard call time","weather":{"sky":"showers","hi":26,"lo":19,"note":"Showers in the model, on the one day of the trip with a paid, unmovable, outdoor booking. This is the single most weather-exposed thing on the itinerary and it is worth over-preparing for — see the photographer note on the 12th."},"note":"The one immovable morning of the trip. Nine people in hanbok, with hair and makeup, standing inside Heungnyemun Gate at 10:50. Everything before it is reverse-timed from it. The order matters and it is not the obvious one: makeup salons open at 08:00, hanbok shops do not open until 09:00, so makeup has to come first and the fitting has to start the minute the rental shop unlocks the door.","naps":[{"who":"7mo","start":"in the carrier, en route","end":""},{"who":"5mo","start":"in the carrier, en route","end":""},{"who":"Toddler","start":"14:45","end":"16:30"}],"doses":[{"id":"d8-bfast","start":"06:50","mins":40,"title":"Breakfast, in the room if it is faster","kind":"meal","status":"planned","who":"Everyone","detail":"The one early start left on the trip, and it is unavoidable: the salon opens at 08:00, the hanbok shop at 09:00, and the photographer's call time at 10:50 is paid and booked. Feed the children properly now — there is no good window again until after the shoot, and nothing staining goes near anyone once hanbok is on.","labels":[{"kind":"warn","text":"Feed first, dress second. This is the only order that works."},{"kind":"rest","text":"Every other breakfast on the trip starts at 09:00. Warn the group about this one the night before, not on the morning."}]},{"id":"d8-toSalon","start":"07:35","end":"07:55","title":"Two taxis to the salon","kind":"transit","status":"planned","who":"Everyone","leaveBy":"07:35","detail":"Naver puts the hotel 1.1 km from the Gyeongbokgung cluster — 18 minutes and 1,719 steps on foot, four crosswalks, and the route is step-free, which matters with two strollers. That proximity is the whole reason the photo day sits in this leg. Take taxis anyway. You are moving nine people to a hard 08:00 booking and the walk is the first thing that slips.","where":"Beauty Palace Gyeongbokgung, or your chosen makeup salon","getting":"Two taxis from Nine Tree by Parnas Insadong. 1.1 km due west via Ujeongguk-ro, Yulgok-ro and Sajik-ro — Naver says 3 minutes driving at ₩4,800 a car, which is Seoul's base fare with no tolls. Two cars is roughly ₩9,600 total. [Naver Map, verified 27 August] Ask the front desk to book both cars the night before rather than hailing at 07:35 on a Sunday — it is more reliable than an app, and it takes the sign-up question off the table entirely on the one morning you cannot repeat.","source":"https://english.visitseoul.net/hotel/view/18185180","labels":[{"kind":"fall","text":"If a taxi does not come you have two real options, both checked on Naver. Walk: 1.1 km, 18 minutes, four crosswalks, and Naver's avoid-stairs route is the same route — so it is step-free for the strollers. Leave by 07:30 and you still make 08:00. Or take the subway: Anguk on line 3 to Gyeongbokgung is one stop, no transfer, 8 minutes door to door at ₩1,550. Anguk has an elevator by exit 6 — route to that exit rather than the nearest one, or you will be carrying strollers down stairs."}]},{"id":"d8-hairmakeup","start":"08:00","end":"09:00","title":"Hair and makeup · first slot of the day","kind":"fixed","status":"planned","who":"Adults having it","whoSplit":true,"detail":"This has to happen before the hanbok, not alongside it, because the salon opens an hour earlier than the rental shop. Beauty Palace Gyeongbokgung opens 08:00 on Sundays and runs a 40-minute hanbok makeup and a 70-minute hanbok makeup with hair-up. Book the 40-minute service for everyone who wants it and run the chairs in parallel.","where":"Makeup salon in the Gyeongbokgung cluster","cost":"Per person, by service tier","source":"https://creatrip.com/en/spot/14538","labels":[{"kind":"warn","text":"Beauty Palace takes a maximum of six people at once and can accommodate up to twenty across a booking. Nine will not fit in one sitting — book explicit staggered slots from 08:00."},{"kind":"warn","text":"It is closed Tuesdays. Sunday 13 September is fine, but do not move this to a Tuesday if the shoot slips."},{"kind":"verify","text":"Confirm how many artists work the 08:00 slot. One artist doing 40 minutes each cannot finish four faces before 09:00."}]},{"id":"d8-toShop","start":"09:00","end":"09:10","title":"Walk to the hanbok shop","kind":"transit","status":"planned","who":"Everyone","leaveBy":"09:00","detail":"The salons and the rental shops are the same few streets around Gyeongbokgung Station Exit 4 and Jahamun-ro 2-gil. This is a short flat walk, not a journey.","where":"Hanbok rental, Gyeongbokgung Station Exit 4 cluster","source":"https://seohwahanbok.net/hanbok-rental/"},{"id":"d8-fitting","start":"09:10","end":"10:20","title":"Hanbok fitting · nine people","kind":"fixed","status":"planned","who":"Everyone","detail":"Seventy minutes against a 09:00 opening, walking in rather than reserving. Hanboknam is the pick — 4.7 across 4,426 reviews, the largest selection in the cluster, and 1.1 km from the hotel. It sits about 350 metres west of Gwanghwamun, so you pass the palace on the way over and only backtrack a short distance afterward. Order of dressing: grandparents, toddler, infants, then the adults who can dress themselves fastest.","where":"Hanbok rental shop","cost":"Around ₩24,000 for four hours or ₩32,000 all day, per person, at Seohwa's published rates","source":"https://seohwahanbok.net/hanbok-rental/","book":"Walking in, not reserving — and the review data backs that. A booking here does not buy queue priority: Korean reviewers repeatedly report reserving and still waiting, and every crowding complaint in this cluster is about midday, not the opening hour. But a booking was never going to fix the thing that can actually cost you the 10:50, so handle that separately. Send Hanboknam one email before you fly — hanboknams@naver.com — asking a single question: how many stylists work the 09:00 slot on Sunday 13 September. Hair runs about 20 minutes a head, one head at a time. Two stylists and the morning is comfortable; one stylist against three or four heads does not finish. The email commits you to nothing. Seven people are renting, not nine — the babies wear their own. Fallbacks if Hanboknam is shut or slammed: Seohwa at 137 Sajik-ro, Oneday in the same building's basement, or Haewadal on 0507-1315-7188.","labels":[{"kind":"warn","text":"Take the all-day tier, not four hours. A four-hour rental started at 09:10 expires at 13:10, in the middle of lunch."},{"kind":"warn","text":"Hanbok on an infant is a twenty-minute negotiation, not a five-minute change. This is the step that runs late, and there are two of them."},{"kind":"warn","text":"Ask one question by email even though you are walking in: how many stylists work the opening slot. Hair is 15 to 20 minutes a head — a YES Hanbok customer timed hers at 20 — and it is done one at a time, so three or four heads against one stylist is the single thing most likely to cost you the call time. Get two confirmed in writing."},{"kind":"rest","text":"The crowding complaints about this cluster are all about midday, not morning. Two separate Google reviewers confirm the early slot is calm: at Seohwa, “the store wasn't so crowded in the morning, everything was done super quick in like 10mins,” and “book early slots like 9am or 9.30am, customers start coming in after that and queue will be long.” Arriving at opening is doing most of the work here."},{"kind":"rest","text":"Walk-in tactic that costs nothing: send one adult who is not having makeup done ahead to Hanboknam at 08:55, so someone is first through the door. They start the paperwork and begin pulling sizes while the salon group finishes, and the rest of you arrive at 09:10 to a shop already working on you."},{"kind":"warn","text":"Hanboknam's one recurring complaint is passivity, not rudeness — “staff was helpful, but they weren't forthcoming... they left me on my own to pick out my pieces.” Fine for you, less fine for your parents. Say at the counter that you want to be walked through it. Reviewers who asked got help."},{"kind":"warn","text":"Neither baby can be fitted from rental stock. Rental sizing starts at 12 months across this whole cluster — Hanboknam's floor is explicitly age one. A 5-month-old and a 7-month-old need a different product: 백일 or 돌복 hanbok in size 0호, which is made for 0 to 12 months. Buy it ahead — Namdaemun Market, Gmarket or Coupang, roughly ₩15,000 to ₩50,000 — or rent from a US seller before you fly. The toddler is fine at every shop here."},{"kind":"verify","text":"Haewadal Hanbok is the one shop reported to stock under-12-month sizes with notice, and that report is unverified. One call to 0507-1315-7188 settles it either way, but buy the 0호 sets regardless — they cost less than the risk."},{"kind":"verify","text":"Confirm Hanboknam can take seven renters in one slot — same email as the stylist question, second line. If sizing worries you, Seohwa stocks men to 2XL and women to 4XL and does carry children's sizes."},{"kind":"warn","text":"Why Hanboknam and not the alternatives. Its 4.7 across 4,426 reviews carries a 2.3% one-star rate on a natural curve, the most trustworthy quality signal in the cluster. Haewadal opens 08:30 and is the only early door, which is worth thirty minutes — but its ratings are polarised: 653 five-stars against 38 one-stars on just 712 reviews, a 5.3% one-star rate, and the bad ones describe staff being rough and rude. Wrong risk profile for two babies and grandparents. Treat YES Hanbok's 5.0 as unmeasured rather than best — 97.8% five-star across 1,753 reviews is not organic, and a reviewer names the mechanism: a free extra hour for booking through Instagram."}]},{"id":"d8-toPalace","start":"10:25","end":"10:45","title":"Walk to Heungnyemun Gate","kind":"transit","status":"planned","who":"Everyone","leaveBy":"10:25","detail":"Twenty minutes for a walk that takes five, because nine people in hanbok with two strollers do not move at walking pace. Aim to be standing at the meeting point at 10:45 with five minutes in hand.","where":"Gyeongbokgung · ticket and information area inside Heungnyemun Gate","getting":"Enter through Gwanghwamun Gate. The ticket and information area is inside Heungnyemun, the second gate — this is where official tours assemble and is what 'main ticket entrance' almost certainly means.","source":"https://royal.khs.go.kr/ENG/contents/E702000000.do?schGroupCode=gbg","fallback":"The escalation branch, decided now and not at 10:30: if the shop is running late, at 10:30 send the grandparents, the men and the toddler ahead on foot to hold the meeting point. Skip the last lip touch-up. Message the photographer at 10:20 with a realistic number rather than at 10:50 with an apology. Real drop-dead for the group is 11:00 — the photographer will wait ten minutes and will not wait thirty.","labels":[{"kind":"warn","text":"The Changing of the Royal Guard runs 10:00 for twenty minutes and the Guard Duty Performance runs 11:00 for ten, both at the Gwanghwamun and Heungnyemun end. You are walking into the crowd both times. Budget the full twenty minutes."},{"kind":"warn","text":"Confirm the exact meeting point with the photographer and swap phone numbers. Gwanghwamun Gate and the ticket area are two different places about 150 metres apart."},{"kind":"fall","text":"If it is raining hard, this becomes a different day. Agree the photographer's wet-weather policy in advance — most Seoul hanbok photographers offer indoor palace halls, a covered colonnade, or a reschedule. September is peak typhoon season and this is a booked, unrepeatable session."}]},{"id":"d8-shoot","start":"10:50","end":"12:20","title":"Photography session at Gyeongbokgung","kind":"fixed","status":"booked","who":"Everyone","detail":"Meeting inside Heungnyemun Gate. Everyone in full hanbok enters the palace free — the rule covers traditional and modernised hanbok, and your parents are already free at 65 and over, as are all three children.","where":"Gyeongbokgung Palace","cost":"Admission ₩3,000 for adults 19–64, and free for anyone in qualifying hanbok","source":"https://royal.khs.go.kr/ENG/contents/E701000000.do","labels":[{"kind":"warn","text":"Free admission needs a full set — jeogori plus chima or baji. A jeogori over jeans, a T-shirt under a skirt, or a partial outfit does not qualify and pays full price."},{"kind":"warn","text":"Two infants have roughly forty good minutes in them. Ask the photographer to shoot the whole-group and grandparent frames first and the couple frames last."},{"kind":"rest","text":"There is a nursing room by the information centre with a changing station, a microwave, and a sink. Learn where it is on arrival, not when you need it."},{"kind":"warn","text":"Palace paths are unpaved gravel and rough stone in places. Strollers work but they fight you — carriers are better once you are inside."}]},{"id":"d8-return","start":"12:30","end":"13:00","title":"Return the hanbok","kind":"admin","status":"planned","who":"Everyone","detail":"Back to the shop, change, collect your own clothes. Or keep them on through lunch if you took the full-day rental and everyone still has the energy."},{"id":"d8-lunch","start":"13:00","mins":75,"title":"Lunch near the palace","kind":"meal","status":"planned","who":"Everyone","detail":"Everyone will be hungry, hot, and finished. Somewhere close with chairs — do not go looking.","labels":[{"kind":"warn","text":"Book this. Sunday lunch near Gyeongbokgung for nine without a reservation is a bad way to end a good morning."},{"kind":"warn","text":"The toddler's nap is running about ninety minutes late by now and will not happen until you are back at the hotel. Pick somewhere that can absorb a meltdown, and be willing to send half the group ahead."}]},{"id":"d8-rest","start":"14:30","end":"17:00","title":"Back to the hotel · everyone off duty","kind":"rest","status":"planned","who":"Everyone","detail":"The biggest morning of the trip earns the emptiest afternoon of the trip.","labels":[{"kind":"rest","text":"Protected. Do not schedule into this."}]},{"id":"d8-dinner","start":"18:30","mins":90,"title":"A proper dinner","kind":"meal","status":"planned","who":"Everyone","detail":"The one meal of the trip worth booking properly. Table seating, private room if you can get one for nine.","labels":[{"kind":"verify","text":"Book a private room well in advance — they are the single best solution to nine people and three small children."}]}]},{"date":"2026-09-14","legId":"insa","title":"Mapo, and a market locals still use","pace":"Medium","weather":{"sky":"sun","hi":29,"lo":20,"note":"Sunny and 29°C. Warm for a market at midday, which is part of why Mangwon sits at 16:30 — the arcade is covered, the heat has dropped, and the food stalls are at their best in the late afternoon."},"note":"An easy morning in Jongno, then west after the nap. Gwangjang has been dropped on purpose — it has become a queue for a tourist photograph rather than a market, and it is a genuinely hard room for infants. Mangwon is the version that still works: a real neighbourhood market where people do their shopping, two stops from Hongdae, with a flat riverside park and the Gyeongui Line park next door. Today is a Monday, which is the quietest possible night to be on this side of the city.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d9-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Late morning by design — the day's real event is dinner at Mangwon Market, and you do not want the group already tired by mid-afternoon."},{"id":"d9-cheonggyecheon","start":"10:15","end":"11:30","title":"Cheonggyecheon in the morning","kind":"outing","status":"planned","who":"Everyone","detail":"The sunken stream through the middle of the city, and a five-minute walk from the hotel door. Cool at water level, flat along the whole length, and genuinely pleasant before the heat arrives. Walk as far as you feel like and climb out at any bridge. This has moved from filler to the actual morning, because the afternoon is out in Mapo and today needs an easy start.","where":"Cheonggyecheon, five minutes from the hotel","source":"https://english.visitseoul.net/area/CheonggyecheonStream/ENP000034","fallback":"Turn around at any point. The whole stream runs parallel to the street above it, so there is no committed distance.","labels":[{"kind":"warn","text":"Access down to the stream level is by stairs at most points. Find one of the ramped entrances before you commit with a stroller — they exist but are not at every block."},{"kind":"rest","text":"Short, flat, shaded and close. A deliberately undemanding morning before an afternoon that travels."}]},{"id":"d9-lunch","start":"12:00","mins":75,"title":"Lunch near the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Back in Jongno with time in hand. Eat properly here, because tonight's meal is standing up at a market."},{"id":"d9-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","labels":[{"kind":"rest","text":"Protected nap window."}]},{"id":"d9-tomapo","start":"15:45","end":"16:20","title":"Across to Mapo","kind":"transit","status":"planned","who":"Everyone","leaveBy":"15:45","detail":"West across the city to the Mangwon and Yeonnam side of Mapo-gu. Two vehicles for nine, or Line 6 if the group is feeling robust — Mangwon is two stops from Hongik University station.","where":"Mangwon-dong, Mapo-gu"},{"id":"d9-mangwon","start":"16:30","end":"18:00","title":"Mangwon Market — dinner, standing up","kind":"meal","status":"planned","who":"Everyone","detail":"This replaces Gwangjang, and it is a better fit in every way that matters to this group. Mangwon is a working neighbourhood market rather than a tourist destination — locals doing their actual shopping, prices that have not been rewritten for visitors, and a covered arcade that is wider and calmer than Gwangjang's aisles. The things to eat here are the fried chicken in sweet-and-sour glaze, tteokbokki, freshly fried mandu and the croquettes. Late afternoon is when it fills up and everything is hot.","where":"Mangwon Market, Mapo-gu · Mangwon station Line 6, exit 2","fallback":"If it is heaving, buy food and walk two minutes to Mangwon Hangang Park to eat it by the river.","labels":[{"kind":"warn","text":"Still a market: covered, busy and shoulder-to-shoulder in places. Take one stroller at most and put the smaller two in carriers. Buy from the stalls and eat standing or walk it to the park."},{"kind":"warn","text":"Cash. Some stalls now take cards but plenty do not, and this is exactly what the airport ATM run was for."},{"kind":"verify","text":"Confirm the closing day before you go — most Seoul traditional markets close one or two days a month and it is usually a Sunday or Monday. Today is a Monday, so this one genuinely needs checking."}]},{"id":"d9-yeonnam","start":"18:15","end":"19:15","title":"Yeonnam-dong and the Gyeongui Line park","kind":"outing","status":"planned","who":"Everyone","detail":"A disused railway line turned into a long, thin park running through Yeonnam-dong, and the single most stroller-friendly thing in this half of the city — flat, straight, grassy, wide, and lined with low-key cafés and shops. It is the calm version of this neighbourhood, and it connects Mangwon to Hongdae on foot without ever putting you in Hongdae's crowds.","where":"Gyeongui Line Forest Park, Yeonnam-dong","getting":"About ten minutes by taxi from Mangwon Market, or three stops.","fallback":"Go straight back to the hotel after the market. This is a bonus, not a requirement, and nobody will mind.","labels":[{"kind":"rest","text":"Flat, open, and the easiest walking of the day. This is the part built for your parents and the strollers."}]},{"id":"d9-hongdae","start":"19:15","end":"20:30","title":"Hongdae, for whoever still wants it","kind":"outing","status":"idea","who":"Adults who fancy it","whoSplit":true,"detail":"The main Hongdae streets are ten minutes' walk from the far end of the Yeonnam park — buskers, street food, record shops, and the densest concentration of late-opening anything in Seoul. Marked as an idea rather than a plan because it is loud, extremely crowded and the wrong environment for two infants at bedtime. One useful piece of luck: today is a Monday, which is by some distance the quietest night of the week here.","where":"Hongdae main street and Eoulmadang-ro","fallback":"Skip it entirely. Everyone with a child goes back to the hotel from Yeonnam and this simply does not happen.","labels":[{"kind":"warn","text":"This is a split or it is nothing. Two infants and a two-year-old in Hongdae at 19:30 is a bad idea even on a Monday — send the adults who want it and put everyone else in a car home."},{"kind":"rest","text":"Genuinely optional. The day is already complete after Yeonnam."}]},{"id":"d9-back","start":"19:30","title":"Kids and grandparents back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · parents on duty","whoSplit":true,"leaveBy":"19:30","detail":"Thirty minutes back across town. Bedtime is late tonight by design, which is why tomorrow's morning starts indoors and slowly."}]},{"date":"2026-09-15","legId":"insa","title":"Children's clothes, Costco, and the skincare haul","pace":"Medium · shopping","weather":{"sky":"cloud","hi":28,"lo":20,"note":"Mostly cloudy. Almost the whole day is indoors — department store, warehouse, Myeongdong — so this one is weather-independent by design. If the model turns wet, nothing here needs to move."},"note":"The dedicated shopping day, placed late so you are buying with a known suitcase situation rather than guessing. Namdaemun has been dropped for The Hyundai Seoul in Yeouido — better children's brands, air conditioning, nursing rooms, lifts and a food hall, which is worth more than market pricing when you are doing this with a toddler. Costco Yangpyeong is ten minutes from it, so the two pair on one trip. Myeongdong skincare in the afternoon. Gyeongbokgung is closed today, which costs you nothing since you have already been.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d10-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, and nothing lost by it — The Hyundai Seoul does not open its doors until 10:30, so an earlier start only buys you time standing outside a shut mall."},{"id":"d10-toyeouido","start":"10:10","end":"10:50","title":"Over to Yeouido","kind":"transit","status":"planned","who":"Shopping group","whoSplit":true,"leaveBy":"10:10","detail":"Line 5 runs directly from Jongno-3ga to Yeouido with no change, which is unusually civilised for this city. A taxi is about twenty-five minutes. Either way you arrive just after opening rather than at 11:30 with everyone else.","where":"The Hyundai Seoul, 108 Yeoui-daero, Yeongdeungpo-gu"},{"id":"d10-easy","start":"10:15","end":"12:00","title":"Slow morning for everyone else","kind":"rest","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Hotel, Insadong street, a café. The point of splitting today is that nobody has to endure a shopping trip they did not want, and Yeouido is a long way to drag a two-year-old for other people's errands."},{"id":"d10-hyundai","start":"10:55","end":"13:00","title":"The Hyundai Seoul · children's clothes","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"This replaces Namdaemun, and for this group it is not a close call. The Hyundai Seoul is the newest and most consistently well-reviewed department store in the city: a full children's floor with the Korean and international brands people actually fly home with, an indoor garden you can park a stroller in, proper nursing rooms, wide flat aisles, lifts everywhere, and a basement food hall good enough to be lunch. You will pay department-store prices rather than market prices — that is the trade, and with a toddler in tow it is the right one.","where":"The Hyundai Seoul, Yeouido · children's floor and the food hall","getting":"Line 5 to Yeouido, direct from Jongno-3ga.","cost":"Department-store pricing. Budget more per item than a market and fewer items.","fallback":"Lotte World Mall in Jamsil covers similar ground and you were already near it on the 10th. Starfield Hanam is bigger again but is outside Seoul and not worth the drive on a day this full.","labels":[{"kind":"warn","text":"Bring passports. Tax-free refund needs one, the desks are in-store, and this is the single biggest purchase day of the trip."},{"kind":"verify","text":"Confirm the opening time before you leave — Korean department stores commonly open at 10:30 rather than 10:00, and some run different weekday and weekend hours."},{"kind":"rest","text":"Lunch is in the building. The food hall is on the lower level and handles a group without a booking, which is why this day does not have a separate lunch stop."}]},{"id":"d10-lunch","start":"12:00","mins":75,"title":"Lunch in Insadong for the hotel group","kind":"meal","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Close to the room and ahead of the nap. The shopping group is eating in The Hyundai's food hall at the same time, so there is no regroup to coordinate."},{"id":"d10-costco","start":"13:15","end":"14:45","title":"Costco Yangpyeong","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"Ten minutes from The Hyundai Seoul, which is the entire reason it sits on this day rather than any other. Yangpyeong is the closest warehouse to Yeouido and it is open 10:00 to 22:00. The Korean-specific things worth the trip are the own-brand seaweed, gim snacks, dried persimmon, honey butter almonds and the bulk skincare — none of which you can carry out of Olive Young at this price.","where":"Costco Yangpyeong, 156 Seonyu-ro, Yeongdeungpo-gu","getting":"About ten minutes by taxi from The Hyundai Seoul.","labels":[{"kind":"warn","text":"Your US membership card works in Korea — the membership is global and you do not need to buy a Korean one. Bring the physical card; the app has been unreliable for foreign accounts at Korean door scanners."},{"kind":"warn","text":"Korean Costco warehouses close on the second and fourth Sunday of every month. Today is a Tuesday so you are clear, but do not casually move this to a weekend without checking the date."},{"kind":"verify","text":"Confirm the current card policy at the door. Korean Costco has historically accepted only one specific domestic card network for payment plus cash — carry enough cash to cover the basket rather than assuming your US card works."},{"kind":"warn","text":"Whatever you buy here is bulk and it is heavy. Do the luggage reckoning below tonight, not at the airport on the 18th."}]},{"id":"d10-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[{"kind":"rest","text":"Protected nap window."}]},{"id":"d10-myeongdong","start":"16:15","end":"18:00","title":"Myeongdong · skincare","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"The flagship Olive Young plus the surrounding brand stores, and a fresh shift is fine here — whoever did Yeouido and Costco has earned a sit down. This is the serious skincare stop of the trip: buy the volume here, not at the airport.","where":"Myeongdong","getting":"Ten minutes by taxi from the hotel, or two stops on Line 3 and a short walk.","labels":[{"kind":"verify","text":"Confirm the tax-free refund threshold and process, and bring your passport — you cannot claim without it."},{"kind":"warn","text":"Liquids, gels, and creams all have to go in checked bags. Between Costco this afternoon and this, tonight's luggage reckoning is not optional."}]},{"id":"d10-pack","start":"18:15","mins":45,"title":"First pack and a luggage reckoning","kind":"admin","status":"planned","who":"Adults","detail":"Tomorrow you move hotels, and today you bought department-store clothes, a Costco run and a skincare haul. Better to find out tonight that you need another suitcase than at the Incheon check-in desk on the 18th.","labels":[{"kind":"warn","text":"Buy the extra suitcase today if you need one. Both Myeongdong and the Costco you were in this afternoon sell them, and neither Yeongjong Island nor the airport is a good place to solve this."}]},{"id":"d10-dinner","start":"19:00","mins":75,"title":"Last Jongno dinner","kind":"meal","status":"planned","who":"Everyone","detail":"The last dinner in the city proper — from here it is the airport hotel. Pick the one thing someone said they wanted to eat again and go there.","labels":[{"kind":"warn","text":"Book it. This is the last easy dinner of the trip and the only one nobody will want to improvise."}]}]},{"date":"2026-09-16","legId":"icn","title":"Out to the island","pace":"Light · moving day","weather":{"sky":"showers","hi":27,"lo":20,"note":"Showers return for the Incheon leg. A wet moving day is a nuisance rather than a problem, but Chinatown involves walking between the vehicle and the restaurant, so keep the umbrellas at the top of a bag."},"note":"A clean moving day with no medical appointment stacked on top of it — which is the whole point. The mole removal sits on the 17th, so today is nothing but checking out, crossing the city, and arriving somewhere with a pool. The one addition is lunch: Incheon invented jjajangmyeon, and the original Chinatown is close enough to the bridge that you can eat there on the way rather than making a separate trip. Check-in is 15:00 at both Yeongjong properties, so the afternoon nap needs a room that is already yours.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"Toddler","start":"14:00","end":"16:00"}],"doses":[{"id":"d11-bfast","start":"09:00","mins":60,"title":"Breakfast and final pack","kind":"meal","status":"planned","who":"Everyone","detail":"Checkout is 11:00 and the transfer is not until 11:30, so a nine o'clock breakfast still leaves an unhurried hour. Pack the night before and this morning is genuinely easy."},{"id":"d11-lastinsa","start":"10:05","end":"10:50","title":"Last walk through Insadong","kind":"outing","status":"planned","who":"Anyone who wants it","whoSplit":true,"detail":"Bags are packed, checkout is not until 11:00, and Ssamziegil is four minutes from the door. This is the last unhurried stretch on the mainland — use it for the small souvenirs nobody has bought yet, or skip it entirely and sit in the lobby.","where":"Insadong-gil, four minutes from the hotel","fallback":"Skipping this costs nothing. The airport has a duty-free the size of a town.","labels":[{"kind":"rest","text":"Deliberately optional. Nobody has to leave the hotel this morning."}]},{"id":"d11-checkout","start":"11:00","mins":30,"title":"Check out of Insadong","kind":"admin","status":"planned","who":"Everyone","detail":"Sweep the rooms for the small things that get left: bottle parts, chargers, one shoe, the toddler's specific cup. Ask the desk to hold the bags if you want a last hour in Insadong."},{"id":"d11-transfer","start":"11:30","end":"12:30","title":"Out west to Incheon Chinatown","kind":"transit","status":"planned","who":"Everyone","leaveBy":"11:30","detail":"Roughly an hour from Jongno to Incheon Station on the mainland. This is not a detour so much as a pause on the way — Chinatown sits by the Yeongjong Bridge approach, so you stop, eat, and carry on over the water to the resort. Good news on the name confusion at the far end: Hyatt Regency Incheon Paradise City is a single, real hotel — the former west tower of Grand Hyatt Incheon, rebranded in 2025 and sitting inside the Paradise City resort complex. So you get Hyatt loyalty and the resort's facilities in one booking.","where":"Incheon Chinatown, Jung-gu · then Yeongjong Island","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Book this transfer in advance with three car seats, and book it explicitly as a transfer with a mid-route stop and a waiting period. A standard point-to-point airport transfer will not include an hour parked in Chinatown, and discovering that at the kerb with nine people and all your luggage is the failure mode here."},{"kind":"verify","text":"Confirm the operator will hold your luggage in the vehicle during lunch. If they will not, this stop does not work and the jjajangmyeon moves to a separate outing on the 17th."},{"kind":"verify","text":"Hotel Paradise and Art Paradiso are separate lodging products in the same complex. Check your confirmation says Hyatt Regency."}]},{"id":"d11-jjajang","start":"12:35","end":"13:45","title":"Jjajangmyeon in the place that invented it","kind":"meal","status":"planned","who":"Everyone","detail":"Incheon's Chinatown is where jjajangmyeon was created, by Shandong migrants working the port in the late 1800s, and eating it here is a genuinely different thing from eating it anywhere else. Junghwaru is the pick for this group: well reviewed, large enough to seat nine, and with waits that run ten to twenty minutes rather than the hour that the two famous places routinely hit. Today is a Wednesday, which is the single biggest thing working in your favour here — weekend waits in Chinatown are punishing.","where":"Junghwaru, Incheon Chinatown · near Incheon Station","cost":"Roughly ₩8,000–₩12,000 for jjajangmyeon, more for tangsuyuk to share.","fallback":"Gonghwachun is the original house and has the museum-piece interior, but the food is widely described as ordinary and the wait as long. Sinseungban is the locals' choice on taste. Both are worth knowing about if Junghwaru is closed.","labels":[{"kind":"warn","text":"Call ahead for nine. Even on a weekday, Chinatown restaurants fill at lunch and none of the three will hold a table for a walk-in group this size."},{"kind":"warn","text":"Jjajangmyeon is black bean sauce and it stains permanently. Everyone under three needs a bib, and do not put anyone in anything they care about — you are checking into a hotel straight after this."},{"kind":"verify","text":"Confirm the closing day. Several Chinatown restaurants close one weekday a month and the schedules are not published in English."}]},{"id":"d11-toresort","start":"13:50","end":"14:20","title":"Over the bridge to Yeongjong","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:50","detail":"Twenty-five minutes over the water to Paradise City. All three children will very likely sleep in the car, which is exactly what you want given check-in is not until 15:00 anyway.","where":"Hyatt Regency Incheon Paradise City, Yeongjong Island","labels":[{"kind":"rest","text":"Treat this drive as the front half of the nap. Do not wake anyone at the door."}]},{"id":"d11-checkin","start":"14:20","mins":40,"title":"Check in","kind":"rest","status":"planned","who":"Everyone","detail":"The hotel sits inside the Paradise City complex, so once you are in you do not need to leave it again before the flight.","labels":[{"kind":"warn","text":"Standard check-in on Yeongjong is 15:00. Arriving at 14:20 gets your luggage stored, not your rooms — and the nap then happens in a lobby, which means it does not happen. Book one room from the night of the 15th so at least one room is already yours when you walk in. The Chinatown stop makes this more important, not less: the children will arrive already asleep."}]},{"id":"d11-nap","start":"14:45","end":"16:00","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","detail":"Shorter than usual and partly already served by the drive over the bridge. Do not stretch it — tonight is the last chance to swim.","labels":[{"kind":"rest","text":"Protected nap window."}]},{"id":"d11-resort","start":"16:15","end":"18:00","title":"Wonderbox, or just the room","kind":"outing","status":"planned","who":"Everyone","detail":"Indoors and shaded by design today. Wonderbox is Paradise City's indoor family theme park and is the right size and temperature for a two-year-old — carousel scale, not roller-coaster scale. The complex also has extensive public art you can walk through for free. This is now your one clear water day: the mole removal sits on the 17th, so nobody is under a no-swimming restriction yet.","where":"Paradise City complex, on site","source":"https://www.p-city.com/front/wonderbox/overview","fallback":"The hotel room and a long bath is a perfectly good version of this.","labels":[{"kind":"rest","text":"Swim today if anyone wants to. Tomorrow's procedure closes the water for seven to ten days — today is the last chance and it is deliberately placed here."},{"kind":"verify","text":"Confirm Wonderbox opening hours and whether the hotel bundles admission."},{"kind":"warn","text":"Cimer refuses every child under seven. That is all three of yours — no family zone, no infant area, no exception. Confirmed on p-city.com, the Klook listing and Korean reviewer accounts. Cimer can only ever be a split shift with someone on childcare, never a group outing."},{"kind":"rest","text":"If adults do split off for Cimer, today is the only day it works — tomorrow's procedure closes the water. Ask for the 50 percent guest coupon at check-in, which takes the aqua pass from ₩60,000 to about ₩30,000. Wednesday is a weekday, so the aqua zone shuts at 19:00 and a 16:00 arrival only buys you three hours. Going straight after check-in is the version that is worth the money."}]},{"id":"d11-dinner","start":"18:30","mins":75,"title":"Dinner at the resort","kind":"meal","status":"planned","who":"Everyone","detail":"There is very little walkable off-site dining out here. Plan to eat in.","labels":[{"kind":"verify","text":"Confirm on-site restaurant options and whether any take a booking for nine."}]}]},{"date":"2026-09-17","legId":"icn","title":"The empty day","pace":"Light — deliberately","weather":{"sky":"showers","hi":28,"lo":21,"note":"Showers again. This matters less than any other rain day of the trip: the mole removal is indoors, the resort is indoors, and staying out of strong sun afterwards is a medical instruction anyway. Cloud is genuinely helpful today."},"note":"The last full day, and outside one confirmed morning appointment it is intentionally almost blank. Twelve days in with two infants, a toddler and two people in their seventies, the most valuable thing you can schedule is nothing. Rene Clinic opens at 10:00 and you have the first slot of the day, so the whole errand is done and back at the resort by 11:00. Pack in the afternoon so tomorrow morning is calm.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d12-bfast","start":"08:15","mins":60,"title":"Early breakfast, clinic party only","kind":"meal","status":"planned","who":"Whoever is having it","whoSplit":true,"detail":"The 10:00 slot is the first appointment of the day and Rene Clinic is eight to twelve minutes away rather than five, so this one breakfast starts at 08:15. It is still unhurried — an hour at the table and you are walking out at 09:30 with time to spare for first-visit paperwork.","labels":[{"kind":"rest","text":"Everyone else eats at 09:00 as usual. Only the clinic party is on the early clock."}]},{"id":"d12-bfast-rest","start":"09:00","mins":75,"title":"Breakfast, no rush","kind":"meal","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Nobody else has to be up early today. Last full morning of the trip, the pool is right there, and there is nothing on the schedule until lunch."},{"id":"d12-toclinic","start":"09:30","end":"09:45","title":"Out to the clinic","kind":"transit","status":"planned","who":"Whoever is having it","whoSplit":true,"leaveBy":"09:30","detail":"Rene Clinic sits in the Haneul-dosi (Sky City) district rather than the Unseo cluster, which makes it eight to twelve minutes by taxi instead of five — still on-island, so no toll. Leaving at 09:30 for a 10:00 appointment gives you the drive plus fifteen minutes for first-visit paperwork, which a foreign patient will need.","where":"SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu — Haneul-dosi, about 8–12 minutes from Paradise City","cost":"About ₩7,000–₩10,000 by taxi, on-island, no toll","fallback":"If no taxi materialises at the door, the resort front desk will call one. Do not plan on the Incheon Airport Maglev — it was reclassified as a tourist train, runs 10:00 to 17:00 Tuesday to Sunday only, and does not go near Haneul-dosi.","source":"https://www.incheon.go.kr/IC010205/view?repSeq=DOM_0000000013303245","labels":[{"kind":"verify","text":"Confirm the taxi the night before, and have the Korean address on your phone to show the driver: 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층."}]},{"id":"d12-mole","start":"10:00","end":"10:45","title":"Mole removal · Rene Clinic","kind":"medical","status":"booked","who":"Whoever is having it","whoSplit":true,"detail":"Confirmed for 10:00, the first slot of the day. Placed on the last full day deliberately: doing it here means you carry no healing wound through twelve days of Seoul heat, sun, and markets, and it leaves Wednesday's water park genuinely usable instead of theoretically off-limits. The cost of the placement is that you leave the country roughly thirty hours later — fine for a routine shave or laser removal, and the thing to reconsider if the doctor wants to cut deeper.","where":"Rene Clinic (르네의원), 3F Rooms 304–308, SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu, Incheon · 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층 304–308호 · +82 32-716-5716 · Thursday hours 10:00–20:00 with a 13:00–14:00 lunch break","cost":"Not published. Incheon rates generally run ₩10,000–₩20,000 for a small or medium flat mole, typically 10–30% below Gangnam, with multiple moles often priced as a package. Add roughly ₩30,000–₩60,000 if anything goes to biopsy. Confirm the price at the desk before the procedure starts.","source":"https://rene-clinic.com/","fallback":"If Rene cancels, Yes Dermatology (032-752-9730) in the Unseo cluster is five minutes from the resort and also opens 10:00 Thursday, with two board-certified dermatologists. Yeongjong Central Dermatology (032-746-3200) and Doctors Dermatology Yeongjong (032-710-2346) are in the same cluster on the same hours.","labels":[{"kind":"warn","text":"This is the one question that changes the plan: ask whether anything is going to pathology. A routine shave with no biopsy is purely cosmetic and this date is ideal. If the doctor wants a biopsy, the report lands after you have left the country, in Korean, at a clinic you can no longer walk into."},{"kind":"warn","text":"If the doctor recommends a wider excision with sutures rather than a shave, do not do it on this date. Stitches thirty hours before a ten-hour flight is a bad trade. Ask for the conservative option or defer to Seattle."},{"kind":"verify","text":"Ask whether Dr. Moon Seong-ho (문성호) is a board-certified dermatologist, 피부과 전문의. Research for this trip could not confirm it from any public source and the clinic's own materials emphasise aesthetic experience rather than a specialty board credential, which points to a general practitioner with substantial aesthetic training. That is perfectly normal for cosmetic mole removal in Korea and not a reason to cancel — but it is worth one question at the consult, and it is a reason to decline anything beyond a straightforward shave or laser. You can also check the registry at akd.or.kr/dermatologist/verify."},{"kind":"verify","text":"Ask for the aftercare instructions in English, in writing. English is not advertised at any Yeongjong clinic and many hand aftercare over in Korean only. Have the hotel concierge on the phone if it comes to that."},{"kind":"warn","text":"Buy the dressings, ointment, and silicone gel before you leave the building. You will not want to hunt for a pharmacy on the resort side of the island tomorrow morning."},{"kind":"warn","text":"No swimming, no sauna, no hot tub for seven to ten days from today. Wednesday was the water day for exactly this reason."},{"kind":"rest","text":"Photograph the wound with a ruler in frame today and again tomorrow. It is the only way a Seattle dermatologist can judge how it changed in transit."},{"kind":"verify","text":"Confirm the clinic takes foreign cards, and carry enough cash if they do not."},{"kind":"rest","text":"The clinic closes 13:00–14:00 for lunch. Irrelevant to a 10:00 appointment, but useful if you need to call them back the same day."}]},{"id":"d12-morning","start":"10:15","end":"12:00","title":"Resort morning, whatever anyone feels like","kind":"rest","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Pool for whoever can, grounds for whoever wants, room for whoever needs it. No group activity, and no waiting around for the clinic party — they are back by 11:00.","labels":[{"kind":"rest","text":"Unstructured on purpose."}]},{"id":"d12-back","start":"10:45","end":"11:00","title":"Back to the resort","kind":"transit","status":"planned","who":"Whoever is having it","whoSplit":true,"detail":"Ask the clinic to call the return taxi before you walk out. Ten minutes later you are back, and the resort morning is still going."},{"id":"d12-lunch","start":"12:15","mins":60,"title":"Lunch on site","kind":"meal","status":"planned","who":"Everyone","detail":"Eat inside the complex. This is the last full day and nobody needs a taxi for lunch."},{"id":"d12-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[{"kind":"rest","text":"Protected nap window."}]},{"id":"d12-pack","start":"15:30","end":"17:00","title":"Pack properly","kind":"admin","status":"planned","who":"Adults","detail":"All the skincare into checked bags. Formula, milk, snacks, and a full change of clothes per child into the cabin bag. Passports and boarding passes somewhere one person is responsible for.","labels":[{"kind":"warn","text":"Every liquid and gel bought in Myeongdong goes in checked luggage. Sorting this at the airport with nine people is how flights get missed."}]},{"id":"d12-outing","start":"16:00","end":"17:30","title":"Sunset somewhere near the water","kind":"outing","status":"idea","who":"Whoever wants it","whoSplit":true,"detail":"Yeongjong has west-facing coast and the sunsets are the reason people stay out here. Late afternoon rather than midday keeps it off anyone's healing skin.","fallback":"Drop it without a second thought if the day has been enough.","labels":[{"kind":"verify","text":"Confirm sunset time and a viewpoint reachable in a short taxi ride from your hotel."}]},{"id":"d12-dinner","start":"18:30","mins":90,"title":"Last dinner","kind":"meal","status":"planned","who":"Everyone","detail":"Twelve days, nine people, everybody still speaking to each other. Book something good."}]},{"date":"2026-09-18","legId":"icn","title":"Home","pace":"Travel","weather":{"sky":"showers","hi":29,"lo":21,"note":"Showers on departure day. Build in extra time for the drive to the terminal — it is short, but a wet Friday morning at ICN with nine people and a luggage trolley convoy is not the moment to be optimistic about traffic."},"note":"The one genuine advantage of staying on Yeongjong Island: the airport is fifteen minutes away instead of ninety. A calm morning, an early lunch, and a departure that does not start at dawn.","naps":[{"who":"All three","start":"on board","end":"eventually"}],"doses":[{"id":"d13-bfast","start":"09:00","mins":60,"title":"Last breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, like the rest of the trip. The car to Terminal 2 does not leave until 13:00, so there is room for a proper last meal without anyone watching a clock."},{"id":"d13-woundcheck","start":"10:15","mins":15,"title":"Wound check before the flight","kind":"medical","status":"planned","who":"Whoever had it removed","whoSplit":true,"detail":"About twenty-four hours on. Look at it in good daylight, change the dressing, and photograph it with a ruler in frame — that photo is what a Seattle dermatologist will compare against. Then dress it clean for the flight, because cabin air is dry and ten hours is a long time.","fallback":"If it looks wrong — spreading redness, heat, or weeping that will not stop — call Rene Clinic on +82 32-716-5716 the moment they open at 10:00, not from the airport. You are ten minutes from them this morning and you will be nine thousand kilometres away tonight. Even a 10:00 call leaves three hours before the car leaves.","labels":[{"kind":"warn","text":"Pack the ointment and spare dressings in your cabin bag, not the checked one. You will want to redress it once mid-flight."},{"kind":"rest","text":"Second of the two photos. Same ruler, same light if you can."}]},{"id":"d13-morning","start":"10:30","end":"11:45","title":"Slow morning, bags down","kind":"rest","status":"planned","who":"Everyone","detail":"Checkout is usually 11:00. Store the bags and use the lobby until you leave."},{"id":"d13-lunch","start":"11:45","mins":60,"title":"Early lunch before the airport","kind":"meal","status":"planned","who":"Everyone","detail":"Eat properly now. Airside with nine people is not where you want to be solving lunch."},{"id":"d13-toAirport","start":"13:00","end":"13:30","title":"To Incheon Terminal 2","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:00","detail":"About twenty minutes from the hotel to Terminal 2, so you are checking in around 13:30 for a 16:40 departure. With three car seats to check, a stroller to tag, and tax-free refunds to claim, three hours is the right number rather than a generous one.","where":"ICN Terminal 2 · Korean Air departures","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Korean Air closes international check-in one hour before departure — 15:40. That is your real deadline, not 16:40."},{"kind":"warn","text":"Claim the tax-free refunds before security, and leave time for it. The desks queue badly in the afternoon."},{"kind":"verify","text":"The Paradise City shuttle runs to Terminal 1 frequently and Terminal 2 less often. For nine people with luggage, book a private van rather than gambling on it."}]},{"id":"d13-ke041","start":"16:40","title":"KE041 · Incheon to Seattle","kind":"fixed","status":"booked","who":"Everyone","detail":"Arrives Seattle 10:40 the same day, 18 September. You land before you took off, which is the only good thing about flying east.","where":"ICN → SEA"},{"id":"d13-molealt","start":"Only if Rene cancels","title":"The Friday-morning fallback","kind":"medical","status":"idea","who":"Whoever is having it","whoSplit":true,"detail":"Thursday 10:00 at Rene Clinic is confirmed, so this is now a cancellation fallback rather than a live option — keep it only because a clinic can call on Wednesday night. The math still works: Yeongjong clinics open at 10:00, the procedure runs thirty to forty-five minutes for one to three moles, and the car to Terminal 2 leaves at 13:00. A 10:00 appointment in the Unseo cluster has you back at the hotel around 10:55 with two hours to spare.","where":"Unseo-dong, five minutes away. Yes Dermatology (032-752-9730) and Yeongjong Central (032-746-3200) both open 10:00 Friday, and TheYul in Cheongna opens 10:00 Friday too if you need a third. Rene itself is open 10:00–20:00 Friday if the cancellation is yours rather than theirs.","fallback":"If the only Friday slot offered is after 11:00, decline it and have the removal done in Seattle instead. No mole is worth a missed flight with nine people.","labels":[{"kind":"warn","text":"On this fallback the two of you still eat at 08:15 — a 10:00 appointment needs you walking out by 09:30. Everyone else keeps the nine o'clock breakfast."},{"kind":"warn","text":"A same-day procedure means no wound check before a ten-hour flight. That is the real cost of Friday over Thursday, and it is why Thursday was booked."},{"kind":"rest","text":"Flying roughly six hours after a minor laser removal is medically fine — cabin pressure does nothing to a superficial skin wound, and Korean clinics treat tourists who fly home the same week as routine. Keep it covered with the hydrocolloid patch the clinic gives you and re-apply ointment right before boarding."},{"kind":"warn","text":"Korean Air closes check-in at 15:40 and you are leaving the hotel at 13:00. The buffer is real but it is not infinite."}]}]}],"overlayUpdatedAt":null};</script>

/* Seoul trip — dispensing strip renderer.
   Small hand-rolled DOM builder; no framework, no build step. */

const $ = (sel, root = document) => root.querySelector(sel);

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
