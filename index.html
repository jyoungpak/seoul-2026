 jet lag.","labels":[{"kind":"verify","text":"Confirm how many people Globalist breakfast covers. Additional guests are usually charged."},{"kind":"verify","text":"Ask the kitchen about food for a seven-month-old on solids. CU and GS25 also sell Korean baby food pouches."}]},{"id":"d2-coex","start":"10:30","end":"12:00","title":"COEX Mall and Starfield Library","kind":"outing","status":"planned","who":"Wife · parents · three kids","whoSplit":true,"detail":"Underground, flat, climate-controlled, lifts everywhere, and a short walk from the hotel. On day two of jet lag with three small children, indoor and close beats interesting. It also happens to be next door to the hospital, so the two halves of the group are never far apart.","where":"COEX, Samseong — walking distance from Park Hyatt","getting":"Mall hours are 10:30–22:00. Nursing rooms and stroller rental on site.","source":"https://english.visitseoul.net/shopping/Starfield-COEX-Mall_/ENP027622","fallback":"If it is too much, the hotel lobby and a stroller lap of the block is a completely valid morning."},{"id":"d2-naps","start":"12:30","end":"15:00","title":"Back at the hotel · nap block","kind":"rest","status":"planned","who":"Wife · parents · three kids","whoSplit":true,"detail":"All three children down, two adults off duty. Do not schedule over this window on any day of this trip.","labels":[]},{"id":"d2-collect","start":"12:30","mins":60,"title":"Collect the three from the clinic","kind":"transit","status":"planned","who":"One adult goes","whoSplit":true,"detail":"Somebody meets them at the exit with a car. Three people who have been fasted since last night, possibly sedated, do not hail their own taxi.","fallback":"Slides with the checkup. Keep the afternoon soft and do not book anything against it.","labels":[{"kind":"warn","text":"Have congee or juk ready. After a scope, start with bland food, not a nine-person restaurant meal."}]},{"id":"d2-rejoin","start":"15:00","mins":90,"title":"Late lunch when the clinic three get back","kind":"meal","status":"planned","who":"Everyone","detail":"First real food in roughly twenty hours for three of you. Somewhere close, somewhere quiet, and no stairs.","fallback":"May slide to 16:00. This meal moves; it does not get cancelled.","labels":[{"kind":"warn","text":"Plan lunch loosely. Post-sedation discharge can run later than the test schedule."}]},{"id":"d2-evening","start":"17:00","mins":120,"title":"Nothing. Deliberately.","kind":"rest","status":"planned","who":"Everyone","detail":"Day two of a sixteen-hour shift with two infants and two people in their seventies. An empty evening now buys you the rest of the week.","labels":[{"kind":"rest","text":"Leave the evening empty for recovery."}]},{"id":"d2-dinner","start":"19:00","mins":60,"title":"Early dinner near the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Somewhere that seats nine with chairs rather than floor seating. This is a constraint you will hit repeatedly and it is worth checking every time.","labels":[{"kind":"warn","text":"Ask for chairs when you book. Floor seating is tough for two people in their seventies."}]}]},{"date":"2026-09-08","legId":"ph","title":"Gentle Gangnam","gist":"Seoul Forest in the morning, botox and skincare after the nap, then Crab 52 at 18:00.","pace":"Light","weather":{"sky":"cloud","hi":28,"lo":15,"note":"The clear evening has gone back in, and it takes the view with it. Overcast, 28°C, dry. Crab 52 is on the 52nd floor and your 18:00 booking now sits under cloud, so don't build the evening around the window — the food is why you booked it, and the room will be dim rather than spectacular. This isn't the warmest day of the trip any more either; four other days match it at 28°C. The cloud does help the Seoul Forest walk, which is easier at 28°C without open sun on it. The low is 15°C and hasn't moved: still the coldest morning of the trip, so both infants want a real layer at breakfast, not a token one."},"note":"Still climbing out of jet lag. One outdoor thing in the morning, one indoor thing in the afternoon, and nothing more than fifteen minutes from the hotel. Gyeongbokgung is closed on Tuesdays, so today deliberately skips the palaces and takes the short hop over Seongsu Bridge instead — Seoul Forest is the flattest, shadiest green space within reach of this hotel. The one hard edge on today is the evening: Crab 52 is booked for nine at 18:00 and it is the only reservation of the Gangnam leg, so the afternoon has to end on time.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d3-bfast","start":"09:00","mins":75,"title":"Park Hyatt breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Included. Build the whole leg around it — a real breakfast at the hotel removes the hardest meal of the day from the plan five times over. Nine o'clock start, so nobody is dressing a baby in the dark."},{"id":"d3-seongsu","start":"10:30","end":"12:30","title":"Seongsu and Seoul Forest","kind":"outing","status":"planned","who":"Everyone","detail":"Directly across the river from Gangnam and the easiest version of Seongsu you will get — arrive before the neighbourhood wakes up properly. Start in Seoul Forest, which is flat, wide, heavily shaded and genuinely stroller-and-grandparent-friendly, then walk into the converted-warehouse cafés and flagship stores on Yeonmujang-gil. Seongsu is a former shoe-factory district turned design quarter, so the streets are wide and the pavements are real, which is not true of Ikseon-dong or Bukchon.","where":"Seoul Forest and Seongsu-dong, Seongdong-gu","getting":"Ten to fifteen minutes by taxi from the Park Hyatt straight over Seongsu Bridge. Two vehicles for nine.","fallback":"Seoul Forest alone is a complete morning. If the group is flagging, skip the café streets entirely and sit under the trees.","labels":[{"kind":"warn","text":"Arrive at 10:30 for Seoul Forest first. Seongsu cafés mostly open at 11:00 and queue by noon."},{"kind":"rest","text":"Use Seoul Forest for your parents: flat paved loops, shade, and plenty of benches."},{"kind":"verify","text":"Confirm one café can take nine with strollers, or plan to split into two tables."}]},{"id":"d3-lunch","start":"12:45","mins":60,"title":"Lunch near the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Back within range of the nap block. Chairs, not floor seating."},{"id":"d3-nap","start":"13:45","end":"15:15","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + whoever needs it","labels":[]},{"id":"d3-botox","start":"15:30","end":"16:45","title":"Botox appointment · Gangnam","kind":"medical","status":"planned","who":"Whoever is having it","whoSplit":true,"detail":"Moved here off the moving day. Gangnam has the clinic density and the English support, and doing it on day three leaves a full ten days for the result to settle and for the same clinic to see anything unexpected before you fly. Injections themselves take five to fifteen minutes; the appointment is mostly consultation.","where":"Gangnam Station or Apgujeong · clinic to be chosen","cost":"Korean-brand botox runs about ₩40,000–₩80,000 per area, imported Allergan about ₩140,000–₩220,000","book":"Book in advance. Same-day slots exist but not for a specific doctor.","source":"https://www.hairrisk.com/clinic-guide/botox-korea","labels":[{"kind":"warn","text":"After Botox: no lying flat or touching the area for 4 hours. No alcohol, hot baths, sauna, or hard exercise for 24."},{"kind":"warn","text":"Keep Botox separate from mole removal on the 17th at Rene Clinic in Incheon. Get aftercare instructions in writing."},{"kind":"verify","text":"Confirm the price, product used, and whether follow-up review is included."}]},{"id":"d3-skincare","start":"15:30","end":"17:30","title":"Skincare run — Olive Young and a department store","kind":"shop","status":"planned","who":"Adults in shifts","whoSplit":true,"detail":"Split the group: some shop, some stay with the kids. Olive Young covers everyday Korean skincare; the department store food halls and children's floors cover the rest. Both are indoors, air-conditioned, and lift-served.","where":"Gangnam · Olive Young Gangnam Town, and Hyundai Department Store Trade Center or Starfield COEX","source":"https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=148766","fallback":"Everything here is also available in Myeongdong later in the trip, so no pressure to finish it today.","labels":[{"kind":"warn","text":"Bring passports. In-store tax-free refund desks need them."},{"kind":"warn","text":"Hard stop at 17:30. Crab 52 is booked for 18:00 and you want to be walking out of the hotel by 17:40, so leave the last shop before you have to rush."}]},{"id":"d3-dinner","start":"18:00","mins":120,"title":"Crab 52 · dinner on the 52nd floor","kind":"meal","status":"booked","who":"Everyone","detail":"Booked for nine at 18:00, which is the first seating of the night — dinner service runs 18:00 to 21:00 and the room is at its quietest and its freshest right at the open. That matters more than the view with three children at the table. You are 339 metres from the door, so this is the shortest trip to dinner of the whole trip, and the kids can be back in bed by half eight.","where":"Crab 52, 511 Yeongdong-daero, Gangnam-gu","getting":"Two ways in, and they are not equal tonight. Above ground it is a four-minute walk up Yeongdong-daero to the Trade Tower main entrance, then the lobby lifts. Underground you can go from the hotel through Samseong Station into COEX, past Starfield Library, and reach the Trade Tower lifts without ever stepping outside. The underground route is longer on foot but it is flat, air-conditioned, and it passes the baby lounges — which is why it wins with two infants and a toddler.","cost":"$200 an adult, under-36-months free — roughly $1,200 for the six adults","source":"https://www.catchtable.net/shop/crab52/info","fallback":"If the lift queue at street level looks bad, the B1 route through COEX gets you to the same lifts from inside the mall.","labels":[{"kind":"warn","text":"Bring the children's passports. Crab 52 requires documented proof of date of birth for every infant and child, and passports are explicitly on their accepted list. Turn up without them and you risk being charged the $100 child rate for children who should be free."},{"kind":"verify","text":"Check the 2-year-old's age against 36 months on 8 September. Free stops the day before the third birthday, so a few weeks either way is a $100 difference."},{"kind":"warn","text":"No nursing room and no changing table inside the restaurant — that is their own notice, and it covers their four walls only. Change and feed everyone at the COEX B1 baby lounge on the way up. Coming back down mid-meal is a ten to fifteen minute round trip once you count the lift from 52."},{"kind":"warn","text":"Strollers cannot come into the restaurant. They will store them, but plan on carriers for the evening."},{"kind":"verify","text":"Ask whether the nine of you can sit together. Their own notice says parties of five or more may be split across tables, and it is worth settling before you are standing at the door."},{"kind":"warn","text":"Payment is on the day, at the restaurant, only. Korean won by card or cash, or US dollars in notes — no coins, no prepayment, no bank transfer. The dollar rate is the previous day's IBK rate."},{"kind":"rest","text":"Scouting this on the 7th costs nothing. You are already at COEX that morning, so walk the B1 route to the Trade Tower lifts once while you have no reservation to make."}]}]},{"date":"2026-09-09","legId":"ph","title":"Daejeon and back","gist":"Jun, Ann, and the baby take the booked 10:00 train to Daejeon. Gangnam for everyone else.","pace":"Split · long day for three","weather":{"sky":"sun","hi":27,"lo":20,"note":"Daejeon has gone from overcast to mainly clear at 27°C, and it is still dry — a 15% chance and nothing measurable. That is the best draw you could get for a day built around a train, a car, and a meal with family: clear enough that the walking bits between them are pleasant, warm enough that the baby needs nothing extra, dry enough that you can stop planning around an umbrella. Suseo's platforms are underground, so the wait itself is cool — it's the walk to the taxi and the walk at the Daejeon end where you'll feel it. Fill the bottle before you go down."},"note":"The one long-distance day, taken from the Park Hyatt leg on purpose: Suseo station is close to Samseong and the high-speed line south from there is the fastest way to Daejeon. Two things changed since this was first sketched. The outbound is now booked — KTX 393, car 14, seats 6C and 7C — and the morning starts earlier than it did, because the taxi to Suseo is a rush-hour taxi and 'five minutes' was the map's answer, not Wednesday's. The other change isn't yours: KORAIL and SR merged on 1 September, so the train you'd have called an SRT is now sold as a KTX and the old SRT booking site no longer applies. Book the return in the KORAIL app. Everyone else has a deliberately unambitious day in Gangnam.","naps":[{"who":"7mo","start":"on the train","end":"roughly 11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d4-bfast","start":"08:00","mins":45,"title":"Unhurried breakfast at the hotel","kind":"meal","status":"planned","who":"Jun · wife · 7mo","whoSplit":true,"detail":"The one breakfast on the trip that can't start at nine — the 10:00 train sets the clock, and you want to be in a taxi by 08:55. It's still the calm version rather than a rushed one, but it starts earlier than the old plan did: the ride to Suseo is a rush-hour ride, not the five-minute hop it looks like on a map. Eat properly here. You have a 57-minute train and no guarantee of anything worth buying at either end.","labels":[{"kind":"rest","text":"Only the three of you are on the early clock. Everyone else staying at the hotel eats at 09:00."}]},{"id":"d4-suseo","start":"08:55","end":"09:25","title":"To Suseo station","kind":"transit","status":"planned","who":"Jun · wife · 7mo","whoSplit":true,"leaveBy":"08:55","detail":"Suseo is the southern high-speed terminus, about 6 km from the Park Hyatt — which is the whole reason this trip sits in this leg rather than the Insadong one. The old plan said five minutes by taxi. That's the free-flow number; at nine in the morning on a Wednesday, Gangnam traffic makes it 15 to 25. Leaving at 08:55 gets you into the concourse around 09:25, which is the buffer you want, because the platform number doesn't go up on the board until about 09:45 and your car is at the far end of a 400-metre train.","where":"Suseo station · 210 Suseo-dong, Gangnam-gu","getting":"Taxi from the hotel door. Show the driver 수서역 — the high-speed station, not Suseo subway station, though they share a concourse.","cost":"About ₩9,000–12,000 by taxi.","source":"https://www.rome2rio.com/s/Park-Hyatt-Seoul/Suseo-Station","labels":[{"kind":"warn","text":"There are no ticket barriers. You walk in, read the departure board, and go down the escalator for your platform — so being early buys you the walk, not a queue."},{"kind":"verify","text":"The board lists the train's final destination, not yours. Look for the 10:00 to Pohang, not for Daejeon."}]},{"id":"d4-stay-bfast","start":"09:00","mins":75,"title":"Unhurried hotel breakfast","kind":"meal","status":"planned","who":"Parents · sister's family","whoSplit":true,"detail":"No agenda, no alarm. This is the recovery day for the six who are not on a train — nine o'clock or later, and nothing after it that can't be dropped."},{"id":"d4-ktx","start":"10:00","end":"10:57","title":"KTX 393 to Daejeon","kind":"transit","status":"booked","who":"Jun · wife · 7mo","whoSplit":true,"detail":"Fifty-seven minutes southbound on KTX-Sancheon 393. Two adult tickets, car 14, seats 6C and 7C — the baby rides on a lap, which is why there are only two. You did better than you probably realise: 6C and 7C aren't side by side, they face each other across a fixed table in a four-seat family bay, which is the easiest possible arrangement for handing a seven-month-old back and forth. Both are aisle seats, so neither of you gets a window but both of you can get out without climbing over anyone.","where":"Suseo → Daejeon Station","getting":"Car 14 is in the rear half of a coupled 20-car formation, so board somewhere in cars 11–18 and follow the car-number markings on the platform floor. The two halves are sealed from each other — board into cars 1–8 by mistake and you cannot reach your seat at all while the train is moving. Wear the baby to board and fold the stroller; there's a real step up into the car.","book":"KTX-Sancheon 393 · car 14 · seats 6C and 7C · tickets 80038-0903-10007-42 and -10008-62.","cost":"₩20,100 each, economy. The seven-month-old is free on a lap — one free infant per accompanying adult, under sixes.","source":"https://korailtalk.co.kr/304/","labels":[{"kind":"rest","text":"Car 14 is the child-friendly coach, and the nursing room with a nappy-changing table is at the far end of your own car. You will not need to go looking for it."},{"kind":"warn","text":"A screenshot is not a valid ticket. KORAIL deliberately blanks the train, seat, and ticket numbers out of captures, so have the ticket live in the KORAIL app. Your eSIM needs to be working before you reach the platform."},{"kind":"warn","text":"The platform is only posted about 15 minutes before departure, around 09:45. Watch the board and move as soon as it appears."},{"kind":"verify","text":"You bought two of the bay's four seats. The two window seats facing you can be sold to strangers, so don't count on having the table to yourselves."},{"kind":"rest","text":"No trolley or café service on board. Bring the bottle and anything you want to drink with you."}]},{"id":"d4-bongeunsa","start":"10:30","end":"11:45","title":"Bongeunsa Temple","kind":"outing","status":"idea","who":"Parents · sister's family","whoSplit":true,"detail":"A working Buddhist temple directly across from COEX, ten minutes on foot. Quiet, green, and short enough to abandon at any point. Marked as an idea rather than a plan on purpose — today is the recovery day for the six not on a train, and doing nothing is a completely valid version of it.","where":"Bongeunsa, Samseong-dong","fallback":"Turn around whenever the toddler is done, or skip it entirely and let the grandparents have the morning in the room. Starfield COEX is indoors, flat, and thirty seconds closer.","labels":[{"kind":"warn","text":"Give your parents this one back if they’re tired. Don’t talk them into another outing."},{"kind":"warn","text":"Temple grounds have steps and slopes. Scout the accessible route or stay on the lower level."}]},{"id":"d4-uncle","start":"11:15","end":"15:30","title":"With wife's uncle","kind":"fixed","status":"planned","who":"Jun · wife · 7mo","whoSplit":true,"detail":"The reason for the day. Lunch together, unhurried. Leave the afternoon open rather than stacking anything after it — four hours is a real visit, not a courtesy call.","labels":[{"kind":"rest","text":"Four hours is a real visit, not a courtesy call. Let it run long if it wants to — the return train is the flexible part of the day."},{"kind":"verify","text":"Settle the pickup point with the uncle in advance. Your train arrives into Daejeon Station, the big central one — it can't serve Seodaejeon, which is on a different line."}]},{"id":"d4-stay-nap","start":"13:00","end":"15:00","title":"Nap block","kind":"rest","status":"planned","who":"Two kids at the hotel","whoSplit":true,"labels":[]},{"id":"d4-dept","start":"15:30","end":"17:30","title":"Department store, in shifts","kind":"shop","status":"planned","who":"Parents · sister's family","whoSplit":true,"detail":"Indoor, air-conditioned, lifts, nursing rooms, and a food hall in the basement. Korean department stores are unusually good at the thing you actually need with small children.","where":"Hyundai Department Store Trade Center or Starfield COEX","labels":[{"kind":"verify","text":"Confirm the nursing-room floor and store hours."}]},{"id":"d4-return","start":"16:26","end":"17:19","title":"Train back to Suseo","kind":"transit","status":"planned","who":"Jun · wife · 7mo","whoSplit":true,"leaveBy":"15:50","detail":"Not booked yet — this is the one real gap in the day. Only the outbound tickets exist. Daejeon back to Suseo runs two to four times an hour through the late afternoon, so the seat isn't the worry; having to buy it at a machine with a tired baby is. The 16:26 gets you to Suseo at 17:19 and to the hotel around 17:45, comfortably before dinner.","where":"Daejeon Station → Suseo","cost":"₩20,100 each.","fallback":"Later options run 16:59, 17:09, and 17:34. Past about 17:30 out of Daejeon you'll miss the 18:45 dinner, so tell the group rather than assuming.","source":"https://train.vicharas.net/timetable/%EB%8C%80%EC%A0%84-%EC%97%90%EC%84%9C-%EC%88%98%EC%84%9C-%EA%B0%80%EB%8A%94-%EA%B8%B0%EC%B0%A8-%EC%8B%9C%EA%B0%84%ED%91%9C/","labels":[{"kind":"warn","text":"Book this before you leave Seattle. It's the last unbooked leg of the day and the easiest one to fix from a sofa."},{"kind":"warn","text":"Agree the return time with the uncle in advance so the goodbye isn't rushed or missed."}]},{"id":"d4-dinner","start":"18:45","mins":75,"title":"Dinner together when the train gets in","kind":"meal","status":"planned","who":"Everyone","detail":"Near the hotel. Nobody has energy to travel for this one."}]},{"date":"2026-09-10","legId":"ph","title":"Lotte World, on a Thursday","gist":"Lotte World, indoors, on a quiet weekday. Home for the afternoon nap.","pace":"Full — the biggest day of the leg","weather":{"sky":"cloud","hi":22,"lo":16,"note":"Two degrees cooler again, and now it's the mildest day of the Gangnam leg by a clear margin: overcast, 22°C, dry on an 8% chance. Every other day of this leg sits at 26°C or above, so this is the one that's genuinely comfortable outdoors. That lands well. The Lotte World indoor half is climate-controlled regardless, but the 16:35 Seokchon Lake loop is the outdoor part, and 22°C under cloud means your parents can take the whole loop instead of half of it. The flip side is that 22°C by the water in late afternoon is cool with a breeze off it, so both infants want a proper layer for the lake, not just for the morning run to Jamsil."},"note":"The amusement park day, deliberately on a weekday and deliberately at the one park that is mostly indoors. Jamsil is fifteen minutes from the hotel, which means the nap block can happen at the hotel rather than in a pushchair queue.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d5-bfast","start":"09:00","mins":60,"title":"Park Hyatt breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock. Lotte World is a long day on its feet, and starting it rested matters more than starting it early — the park does not get meaningfully busier between opening and eleven on a Thursday."},{"id":"d5-go","start":"10:10","end":"10:40","title":"To Jamsil","kind":"transit","status":"planned","who":"Everyone","leaveBy":"10:10","detail":"Two taxis or the subway. Short either way.","where":"Lotte World, Jamsil"},{"id":"d5-park","start":"10:45","end":"12:30","title":"Lotte World Adventure — indoor half","kind":"outing","status":"planned","who":"Everyone","detail":"Under two hours, not a full morning. The indoor Adventure section is climate-controlled and mostly flat with lifts, which matters more than the rides here. There is a dedicated small-children's zone; the grandparents can sit in it comfortably while the toddler goes round. Both infants nap in carriers through this.","where":"Lotte World Adventure, Jamsil","fallback":"If the park is too much, Lotte World Aquarium in the same complex is dark, cool, quiet, and takes ninety minutes.","labels":[{"kind":"warn","text":"Cap Lotte World at 90–100 minutes for the two-year-old. Leave before the meltdown."},{"kind":"verify","text":"Confirm opening hours, ticket options, stroller rental, and ride age or height limits."},{"kind":"warn","text":"Infants can’t ride much. Treat this as a place to explore, not a ride checklist."},{"kind":"verify","text":"Confirm nursing-room and baby-change locations inside the park before you go."}]},{"id":"d5-lunch","start":"12:45","mins":60,"title":"Lunch in the complex","kind":"meal","status":"planned","who":"Everyone","detail":"Lotte World Mall next door has far better food than the park itself and proper seating."},{"id":"d5-back","start":"13:50","end":"14:20","title":"Whole group back to the hotel","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:50","detail":"Everyone returns together — this is not the optional half. Fifteen minutes back to Samseong puts the toddler down in a real bed at 14:20, on the biggest day of the leg.","labels":[{"kind":"warn","text":"Take your parents back to the hotel here. Four hours out at ages 69 and 70 is a full day."}]},{"id":"d5-nap","start":"14:20","end":"16:20","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids · grandparents","labels":[{"kind":"rest","text":"Protect this nap. The grandparents rest here too, and the rest of the day is optional for them."}]},{"id":"d5-lake","start":"16:35","end":"17:30","title":"Seokchon Lake loop","kind":"outing","status":"idea","who":"Whoever wants it","whoSplit":true,"detail":"A flat paved loop around the lake beside the park, with benches the whole way. Good in late-afternoon light and easy to cut short. Genuinely optional — a second trip back out to Jamsil is a lot for one day.","labels":[{"kind":"warn","text":"Skip Seokchon Lake if the day has already been long. It’s a nice-to-have."}]},{"id":"d5-dinner","start":"18:15","mins":75,"title":"Family dinner · details to come","kind":"meal","status":"planned","who":"Everyone","detail":"Tentatively set as a family dinner, with the venue and time still to be confirmed. Treat 18:15 as a placeholder that moves once the details land. The Seokchon Lake loop finishes at 17:30, so anywhere in the Jamsil complex works with no extra transfer, while heading back to Samseong needs about thirty minutes and pushes the infants closer to bedtime.","labels":[{"kind":"verify","text":"Confirm the venue and time, and check they can seat nine with two high chairs."}]}]},{"date":"2026-09-11","legId":"insa","title":"Move north","gist":"A long morning in Gangnam, the driver at 15:30, then a first walk through Insadong.","pace":"Light · moving day","weather":{"sky":"cloud","hi":26,"lo":17,"note":"Overcast and 26°C, with the low down to 17°C — three degrees cooler overnight than yesterday's forecast had it. That is the useful number on a moving day: you check out in the morning and the bags go in and out of vehicles twice. Dress the infants for 17°C at the start of the day rather than the afternoon high, and Ssamziegil stays a preference rather than a rescue."},"note":"A deliberately slow morning and a late crossing. The driver comes at 15:30 and wants ₩160,000 in cash on the spot, so today has two jobs before it has any others: have the cash ready, and keep the Park Hyatt room until the pickup. Both matter more than they look. Without the room you spend the entire nap window in a lobby with three tired children. Without the cash you are at an ATM at 15:20 with a driver waiting. Get those two right and the rest is easy — bags down, across the river, and the new neighbourhood is directly outside the door.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"Toddler","start":"13:30","end":"15:00"}],"doses":[{"id":"d6-bfast","start":"09:00","mins":60,"title":"Last Park Hyatt breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"The last included one — the Insadong leg has no breakfast benefit, so this is the final easy morning meal of the trip. Nine o'clock; checkout is not until 11:30 and there is nothing to be early for."},{"id":"d6-slow","start":"10:15","end":"11:15","title":"A slow last morning in Gangnam","kind":"rest","status":"planned","who":"Everyone","detail":"Nothing booked. Pack properly and let the children run around the room. Moving days go better when the morning before them is empty.","fallback":"Starfield COEX is five minutes away and indoors if anyone needs to burn energy before a car ride.","labels":[]},{"id":"d6-checkout","start":"11:30","end":"12:15","title":"Hold the room, pack, stage the bags","kind":"admin","status":"planned","who":"Everyone","detail":"The whole shape of today depends on one thing: keeping this room until the driver comes. Globalist status carries a guaranteed 4pm checkout at Hyatt hotels that are not resorts, and Park Hyatt Seoul is a city hotel in Samseong, so it qualifies. That turns a three-hour lobby wait with three tired children into an ordinary afternoon with a nap in it. Pack fully now, so leaving at 15:15 takes fifteen minutes rather than forty.","labels":[{"kind":"verify","text":"Ask at the desk the night before, not on the morning. Guaranteed is not the same as arranged, and it needs to be in the system before housekeeping starts."},{"kind":"fall","text":"If the room genuinely cannot be held, store the bags at the desk, stretch lunch, and use Starfield COEX for the nap window. It is five minutes away and indoors."}],"source":"https://milepro.com/guide-to-hyatt-globalist-status/"},{"id":"d6-lunch","start":"12:15","end":"13:15","title":"Last lunch in Gangnam","kind":"meal","status":"planned","who":"Everyone","detail":"Unhurried, because the room is yours until four and the driver is not coming until half past three. Stay close — the hotel or COEX — since the point of the next two hours is to be back upstairs before the children turn.","fallback":"If nobody wants a sit-down meal, the COEX food hall is five minutes away and lets everyone eat different things at different speeds."},{"id":"d6-nap","start":"13:30","end":"15:00","title":"Nap block, in your own room","kind":"rest","status":"planned","who":"Three kids","detail":"This is what the late checkout buys you. Everyone naps in a familiar dark room rather than a car seat or a lobby sofa, and the group starts a Friday-evening city crossing rested instead of wrecked.","labels":[{"kind":"rest","text":"Take this window yourselves too. You are about to move nine people and twelve days of luggage across Seoul in rush hour."}]},{"id":"d6-move","start":"15:30","end":"16:30","title":"Private transfer to Insadong","kind":"transit","status":"booked","who":"Everyone","leaveBy":"15:15","detail":"Booked. The driver collects you at the Park Hyatt at 15:30 and takes you across the river to Jongno. Allow the full hour rather than the forty minutes this takes on a quiet day — it's a Friday, and you're driving into the front edge of the evening peak. You're still ahead of the worst of it, which is exactly why a 15:30 pickup beats a 17:00 one.","where":"Nine Tree Premier Insadong · 49 Insadong-gil, Jongno-gu","getting":"Door to door from the Park Hyatt lobby. Be downstairs at 15:15 — nine people, twelve days of luggage and three car seats do not load in five minutes.","cost":"₩160,000, cash, handed to the driver at pickup","fallback":"If the driver does not turn up, Samseong to Anguk is line 2 onto line 3 with one change — but with this much luggage that is a genuinely bad afternoon. Take the operator's mobile number when you reconfirm.","source":"https://english.visitseoul.net/hotel/view/18185180","labels":[{"kind":"warn","text":"₩160,000 in cash, at pickup. Draw it earlier in the week and set it aside from your spending money — three ₩50,000 notes and one ₩10,000 is the exact amount, so the driver needs no change."},{"kind":"warn","text":"Reconfirm three car seats. Every other transfer on this trip was booked with them and this one has to match."},{"kind":"verify","text":"Check the vehicle really takes nine people plus twelve days of luggage. If it is one van rather than two, luggage is the constraint, not seats."},{"kind":"verify","text":"Confirm the destination name and address with the driver. There is more than one Nine Tree in central Seoul."}]},{"id":"d6-checkin","start":"16:30","mins":30,"title":"Check in at Nine Tree","kind":"rest","status":"planned","who":"Everyone","detail":"One real upside of the later transfer: you arrive well past the 15:00 check-in time, so the rooms are ready and nobody is parked in a lobby waiting on housekeeping. Bags up, cribs confirmed, then decide who is going back out.","labels":[{"kind":"rest","text":"Anyone who is finished for the day is finished. Everything after this is optional, and you have five nights here."}]},{"id":"d6-insa","start":"17:00","end":"18:00","title":"First walk up Insadong-gil","kind":"outing","status":"planned","who":"Whoever wants it","whoSplit":true,"detail":"A first pass rather than the full loop — the later transfer has taken the middle out of the afternoon, and you have five nights here to do it properly. Out of the hotel onto Insadong-gil, north through the paper, ceramic, tea and brush shops, into Ssamziegil at the top: a four-storey spiral ramp rather than stairs, so the stroller goes all the way up and back down without a lift. Turn round whenever anyone has had enough. You are never more than eight minutes from your own room.","where":"Insadong-gil → Ssamziegil · from the hotel door","getting":"On foot. The hotel is on Insadong-gil itself.","fallback":"Every point on this walk is a short flat walk back to the room, so it can be twenty minutes or an hour and anyone can peel off at any time.","labels":[{"kind":"rest","text":"Around 26°C and overcast, and you are out in the cool part of the day. This is the gentlest weather any outdoor block gets on this leg."},{"kind":"verify","text":"Insadong-gil is usually car-free at weekends and the 11th is a Friday, so assume traffic on the street and keep the toddler on the inside."}]},{"id":"d6-ikseon","start":"18:00","end":"18:30","title":"On to Ikseon-dong","kind":"outing","status":"planned","who":"Whoever wants it","whoSplit":true,"detail":"Cut east through Nagwon-dong and you reach the mouth of Ikseon-dong, a dense grid of restored hanok turned into cafés and small shops. Flat, shaded by the low rooflines, about ten minutes from the hotel. Half an hour is enough for a first look, and it leaves you at dinner rather than doubling back.","where":"Ikseon-dong, Jongno · about 700 m from the hotel","getting":"On foot, straight on from Ssamziegil through Nagwon-dong.","fallback":"Cheonggyecheon stream is five minutes south, flat and shaded, if the alleys are too crowded for a stroller.","source":"https://english.visitseoul.net/attractions/Ikseon-dong-Hanok-Village_/2686","labels":[{"kind":"warn","text":"Ikseon-dong alleys are often under 2 m wide. Use a carrier, or leave the big stroller at the hotel."},{"kind":"rest","text":"Dinner is at the end of this walk, so nobody has to backtrack."}]},{"id":"d6-dinner","start":"18:30","mins":75,"title":"Dinner in Ikseon-dong","kind":"meal","status":"planned","who":"Everyone","detail":"Eat where the walk ends rather than trekking back. Ikseon-dong is thick with restaurants in converted hanok, and the walk home afterwards is ten flat minutes. Table seating for nine, booked.","labels":[{"kind":"warn","text":"Ask for chairs when you book. Converted hanok often means floor seating."},{"kind":"warn","text":"Book ahead for nine. Ikseon-dong restaurants are small and may not seat you together without notice."}]}]},{"date":"2026-09-12","legId":"insa","title":"Museum day","gist":"National Museum of Korea, free and flat, then the rest of Yongsan.","pace":"Medium","weather":{"sky":"cloud","hi":28,"lo":19,"note":"This has swung back the other way: 28°C rather than 25, three degrees on, which ties it for the warmest day of the trip. Still dry though — 0mm on a 20% chance — so the umbrellas stay behind. What it changes is which half of the day you lean on. The National Museum was always the weather-proof core and now it's the cool one too, so put it in the heat of the afternoon and keep the Yongsan walk for either end rather than the other way round. The low is 19°C, so the morning is mild and nobody needs the layer an earlier read asked for."},"note":"A Saturday, so the palaces and markets will be at their worst. The national museum is the opposite: enormous, flat, air-conditioned, lift-served throughout, and free to enter. It is the single most infant-and-grandparent-friendly major sight in Seoul.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d7-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Breakfast is not included on this leg. Either the hotel's own, or a bakery — Korean bakery chains handle a group of nine without ceremony. The museum does not open until 10:00, so there is nothing to gain from being up before nine.","labels":[{"kind":"verify","text":"Confirm whether the Insadong booking includes breakfast and for how many."}]},{"id":"d7-museum","start":"10:30","end":"12:30","title":"National Museum of Korea","kind":"outing","status":"planned","who":"Everyone","detail":"Yongsan. Free general admission, vast flat galleries, lifts everywhere, stroller-free rental on site, and benches in most rooms. Do one wing, not the building.","where":"National Museum of Korea, 137 Seobinggo-ro, Yongsan-gu","source":"https://www.museum.go.kr/site/eng/home","fallback":"The reflecting pool and the path to the pagoda outside are worth the trip on their own if the galleries are too much.","labels":[{"kind":"rest","text":"Lactation room is on the first floor. Strollers and wheelchairs are free at the information desk."},{"kind":"warn","text":"Closed Mondays. Open until 18:00 today, so you can leave with hours to spare."},{"kind":"verify","text":"Reserve the free Children’s Museum online now. It books out weeks ahead, and one slot may not hold nine."}]},{"id":"d7-back","start":"12:40","end":"13:10","title":"Nap group back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · two adults","whoSplit":true,"leaveBy":"12:40","detail":"The half of the group that needs the nap goes straight back. Skipping the museum lunch is deliberate: eating at the museum pushes the toddler's nap past 14:00, and tomorrow is the one day of the trip that cannot absorb a badly rested two-year-old."},{"id":"d7-yongsan","start":"12:40","end":"15:00","title":"Yongsan afterwards, for whoever is free","kind":"outing","status":"planned","who":"Adults not on nap duty","whoSplit":true,"detail":"The museum is not the only reason to come out here, and it is a long way to travel for one building. Three things are within reach on foot or one stop: the museum's own grounds and reflecting pool, which are free and quietly one of the best pieces of landscape in Seoul; Ichon Hangang Park, straight down to the river; and Yongsan I'Park Mall at Yongsan Station, which is a genuinely enormous indoor complex with electronics, toys and a food court if the heat wins.","where":"Yongsan-gu · museum grounds, Ichon Hangang Park, Yongsan I'Park Mall","getting":"Museum grounds on foot. Ichon Hangang Park is about fifteen minutes' walk. Yongsan I'Park Mall is one stop on Line 4 or a five-minute taxi.","fallback":"Go straight back with everyone else. This is an add-on for the people who are not carrying a sleeping child, and skipping it costs nothing.","labels":[{"kind":"rest","text":"Split after Yongsan if needed. The nap stays protected; this is only for adults free at 13:00."},{"kind":"warn","text":"Be back by 15:30. Tomorrow starts at 06:50, and hanbok prep needs everyone dressing to be present."},{"kind":"verify","text":"Confirm Yongsan Park redevelopment walk-in access. Parts open and close by reservation."}]},{"id":"d7-lunch","start":"13:15","mins":45,"title":"Lunch at the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Room service, a bakery run, or the nearest thing to the lobby. Speed matters more than quality today.","fallback":"Insadong-gil is full of takeaway. Somebody grabs food while everyone else goes up."},{"id":"d7-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","detail":"A full, on-time toddler nap, which is the entire reason today ends early. The grandparents should take this one too — tomorrow starts at 06:50 and runs long.","labels":[{"kind":"rest","text":"Protect this nap block. It’s the most load-bearing rest of the trip."}]},{"id":"d7-prep","start":"16:30","end":"17:30","title":"Tomorrow's hanbok logistics, settled tonight","kind":"admin","status":"planned","who":"Jun","detail":"Confirm the rental booking, the number of people, the hair and makeup slots, and the walking route to the palace ticket office. Lay out what everyone wears underneath. Charge the camera.","labels":[{"kind":"warn","text":"Tomorrow has a hard 10:50 call time and nine people to dress. Settle everything you can tonight."},{"kind":"warn","text":"Set out one passport and ₩70,000 cash tonight for the rental deposit."},{"kind":"warn","text":"Message the photographer tonight: rain plan, covered palace option, and a morning phone number."}]},{"id":"d7-dinner","start":"18:00","mins":75,"title":"Early dinner, early night","kind":"meal","status":"planned","who":"Everyone","detail":"Genuinely early. Tomorrow is the day the whole trip is photographed."}]},{"date":"2026-09-13","legId":"insa","title":"Hanbok, and the photographs","gist":"Hair, hanbok, and the 10:50 photo session at Gyeongbokgung. The one fixed morning.","pace":"Full · hard call time","weather":{"sky":"drizzle","hi":22,"lo":20,"note":"Reverse the all-clear: light drizzle is back on the board for the paid, fixed, outdoor 10:50 shoot. Read the numbers before you worry — 0.6mm across the whole day, on a 20% chance. That's a damp possibility, not a washout, and the odds still favour a dry shoot by a wide margin. But it's enough that the fallback you were told to stop planning is worth keeping in your pocket, and enough to ask the hanbok shop one question at the 09:10 fitting: what happens if the hanbok gets damp, and do they charge for it. If you buy umbrellas, buy clear ones — dark ones throw shadow across faces. The consolation is real: 22°C rather than 26 makes wearing hanbok from the fitting through to the 12:30 return comfortable rather than something to endure, and overcast is still the soft, even light you'd have chosen over hard sun on nine faces at Heungnyemun Gate."},"note":"The one immovable morning of the trip. Nine people in hanbok, with hair and makeup, standing inside Heungnyemun Gate at 10:50. Everything before it is reverse-timed from it. The order matters and it is not the obvious one: makeup salons open at 08:00, hanbok shops do not open until 09:00, so makeup has to come first and the fitting has to start the minute the rental shop unlocks the door.","naps":[{"who":"7mo","start":"in the carrier, en route","end":""},{"who":"5mo","start":"in the carrier, en route","end":""},{"who":"Toddler","start":"14:45","end":"16:30"}],"doses":[{"id":"d8-bfast","start":"06:50","mins":40,"title":"Breakfast, in the room if it is faster","kind":"meal","status":"planned","who":"Everyone","detail":"The one early start left on the trip, and it is unavoidable: the salon opens at 08:00, the hanbok shop at 09:00, and the photographer's call time at 10:50 is paid and booked. Feed the children properly now — there is no good window again until after the shoot, and nothing staining goes near anyone once hanbok is on.","labels":[{"kind":"warn","text":"Feed first, dress second."},{"kind":"rest","text":"Warn everyone the night before: this breakfast starts before the usual 09:00."}]},{"id":"d8-toSalon","start":"07:35","end":"07:55","title":"Two taxis to the salon","kind":"transit","status":"planned","who":"Everyone","leaveBy":"07:35","detail":"Naver puts the hotel 1.1 km from the Gyeongbokgung cluster — 18 minutes and 1,719 steps on foot, four crosswalks, and the route is step-free, which matters with two strollers. That proximity is the whole reason the photo day sits in this leg. Take taxis anyway. You are moving nine people to a hard 08:00 booking and the walk is the first thing that slips.","where":"Beauty Palace Gyeongbokgung, or your chosen makeup salon","getting":"Two taxis from Nine Tree by Parnas Insadong. 1.1 km due west via Ujeongguk-ro, Yulgok-ro and Sajik-ro — Naver says 3 minutes driving at ₩4,800 a car, which is Seoul's base fare with no tolls. Two cars is roughly ₩9,600 total. [Naver Map, verified 27 August] Ask the front desk to book both cars the night before rather than hailing at 07:35 on a Sunday — it is more reliable than an app, and it takes the sign-up question off the table entirely on the one morning you cannot repeat.","source":"https://english.visitseoul.net/hotel/view/18185180","labels":[{"kind":"fall","text":"If taxis fail, walk 1.1 km in 18 minutes by 07:30, or take line 3 one stop from Anguk exit 6. Fare is ₩1,550."}]},{"id":"d8-hairmakeup","start":"08:00","end":"09:00","title":"Hair and makeup · first slot of the day","kind":"fixed","status":"planned","who":"Adults having it","whoSplit":true,"detail":"This has to happen before the hanbok, not alongside it, because the salon opens an hour earlier than the rental shop. Beauty Palace Gyeongbokgung opens 08:00 on Sundays and runs a 40-minute hanbok makeup and a 70-minute hanbok makeup with hair-up. Book the 40-minute service for everyone who wants it and run the chairs in parallel.","where":"Makeup salon in the Gyeongbokgung cluster","cost":"Per person, by service tier","source":"https://creatrip.com/en/spot/14538","labels":[{"kind":"warn","text":"Beauty Palace fits six at once. Book explicit staggered slots from 08:00 for nine people."},{"kind":"warn","text":"Closed Tuesdays. Sunday 13 September is fine, but don't move this to Tuesday."},{"kind":"verify","text":"Confirm how many artists work at 08:00. One artist can't finish four faces before 09:00."}]},{"id":"d8-toShop","start":"09:00","end":"09:10","title":"Walk to the hanbok shop","kind":"transit","status":"planned","who":"Everyone","leaveBy":"09:00","detail":"The salons and the rental shops are the same few streets around Gyeongbokgung Station Exit 4 and Jahamun-ro 2-gil. This is a short flat walk, not a journey.","where":"Hanbok rental, Gyeongbokgung Station Exit 4 cluster","source":"https://seohwahanbok.net/hanbok-rental/"},{"id":"d8-fitting","start":"09:10","end":"10:20","title":"Hanbok fitting · nine people","kind":"fixed","status":"planned","who":"Everyone","detail":"Seventy minutes against a 09:00 opening, walking in rather than reserving. Hanboknam is the pick — 4.7 across 4,426 reviews, the largest selection in the cluster, and 1.1 km from the hotel. It sits about 350 metres west of Gwanghwamun, so you pass the palace on the way over and only backtrack a short distance afterward. Order of dressing: grandparents, toddler, infants, then the adults who can dress themselves fastest.","where":"Hanbok rental shop","cost":"Around ₩24,000 for four hours or ₩32,000 all day, per person, at Seohwa's published rates","source":"https://seohwahanbok.net/hanbok-rental/","book":"Walking in, not reserving. A booking here does not buy queue priority, and the crowding complaints in this cluster are all about midday rather than the opening hour. Send Hanboknam one email before you fly — hanboknams@naver.com — asking two things: how many stylists work the 09:00 slot on Sunday 13 September, and that infant sizes are held for a 5-month-old and a 7-month-old. Hair runs about 20 minutes a head, one head at a time. Two stylists and the morning is comfortable; one stylist against three or four heads does not finish. All nine of you are renting, both babies included. Fallbacks if Hanboknam is shut or slammed: Seohwa at 137 Sajik-ro, Oneday in the same building's basement, or Haewadal on 0507-1315-7188.","labels":[{"kind":"warn","text":"Take the all-day tier. A four-hour rental from 09:10 expires at 13:10, during lunch."},{"kind":"warn","text":"Budget 20 minutes for each infant's hanbok change. There are two of them."},{"kind":"warn","text":"Email Hanboknam: confirm two stylists at opening. One stylist doing 15 to 20 minutes per head risks the 10:50 call time."},{"kind":"rest","text":"Arrive at opening. The early slot is calm, and crowds build later."},{"kind":"rest","text":"Send one non-makeup adult to Hanboknam at 08:55 to start paperwork and pull sizes."},{"kind":"warn","text":"Staff here may let you browse alone. Ask at the counter to be walked through the sizes."},{"kind":"verify","text":"Confirm Hanboknam can take nine renters in one slot, both babies included."}]},{"id":"d8-toPalace","start":"10:25","end":"10:45","title":"Walk to Heungnyemun Gate","kind":"transit","status":"planned","who":"Everyone","leaveBy":"10:25","detail":"Twenty minutes for a walk that takes five, because nine people in hanbok with two strollers do not move at walking pace. Aim to be standing at the meeting point at 10:45 with five minutes in hand.","where":"Gyeongbokgung · ticket and information area inside Heungnyemun Gate","getting":"Enter through Gwanghwamun Gate. The ticket and information area is inside Heungnyemun, the second gate — this is where official tours assemble and is what 'main ticket entrance' almost certainly means.","source":"https://royal.khs.go.kr/ENG/contents/E702000000.do?schGroupCode=gbg","fallback":"The escalation branch, decided now and not at 10:30: if the shop is running late, at 10:30 send the grandparents, the men and the toddler ahead on foot to hold the meeting point. Skip the last lip touch-up. Message the photographer at 10:20 with a realistic number rather than at 10:50 with an apology. Real drop-dead for the group is 11:00 — the photographer will wait ten minutes and will not wait thirty.","labels":[{"kind":"warn","text":"Guard performances run 10:00 for 20 minutes and 11:00 for 10 near Gwanghwamun and Heungnyemun. Budget the full walk."},{"kind":"warn","text":"Confirm the exact photographer meeting point and swap numbers. Gwanghwamun Gate and the ticket area are 150 metres apart."},{"kind":"fall","text":"Agree on the photographer's rain plan in advance: indoor palace halls, a covered colonnade, or a reschedule."}]},{"id":"d8-shoot","start":"10:50","end":"12:20","title":"Photography session at Gyeongbokgung","kind":"fixed","status":"booked","who":"Everyone","detail":"Meeting inside Heungnyemun Gate. Everyone in full hanbok enters the palace free — the rule covers traditional and modernised hanbok, and your parents are already free at 65 and over, as are all three children.","where":"Gyeongbokgung Palace","cost":"Admission ₩3,000 for adults 19–64, and free for anyone in qualifying hanbok","source":"https://royal.khs.go.kr/ENG/contents/E701000000.do","labels":[{"kind":"warn","text":"Free admission needs full hanbok: jeogori plus chima or baji. Partial outfits pay full price."},{"kind":"warn","text":"Shoot whole-group and grandparent frames first. The infants may only last 40 good minutes."},{"kind":"rest","text":"Find the nursing room by the information centre on arrival. It has a changing station, microwave, and sink."},{"kind":"warn","text":"Palace paths include gravel and rough stone. Use carriers once you're inside."}]},{"id":"d8-return","start":"12:30","end":"13:00","title":"Return the hanbok","kind":"admin","status":"planned","who":"Everyone","detail":"Back to the shop, change, collect your own clothes. Or keep them on through lunch if you took the full-day rental and everyone still has the energy."},{"id":"d8-lunch","start":"13:00","mins":75,"title":"Lunch near the palace","kind":"meal","status":"planned","who":"Everyone","detail":"Everyone will be hungry, hot, and finished. Somewhere close with chairs — do not go looking.","labels":[{"kind":"warn","text":"Book lunch. Sunday near Gyeongbokgung for nine without a reservation is risky."},{"kind":"warn","text":"Pick lunch somewhere that can absorb a toddler meltdown, and be ready to send half the group ahead."}]},{"id":"d8-rest","start":"14:30","end":"17:00","title":"Back to the hotel · everyone off duty","kind":"rest","status":"planned","who":"Everyone","detail":"The biggest morning of the trip earns the emptiest afternoon of the trip.","labels":[{"kind":"rest","text":"Protected rest block. Don't schedule into this."}]},{"id":"d8-dinner","start":"18:30","mins":90,"title":"Family dinner · details to come","kind":"meal","status":"planned","who":"Everyone","detail":"Tentatively set as a family dinner, with the venue and time still to be confirmed. Keep 18:30 as the placeholder: it sits just after the 14:30–17:00 rest block, so the children are on the right side of a nap whatever venue lands. This is the day everyone is already dressed up and photographed, which makes it the natural night for the proper table.","labels":[{"kind":"verify","text":"Confirm the venue and time, and ask for a private room for nine with three small children."}]}]},{"date":"2026-09-14","legId":"insa","title":"Mapo, and a market locals still use","gist":"A stream walk in the morning, Mangwon Market and Yeonnam-dong after the nap.","pace":"Medium","weather":{"sky":"cloud","hi":27,"lo":17,"note":"This was once the hottest day of the trip at 31°C with drizzle, and it's still nothing like that: dry, overcast, 27°C, with the low at 17°C. Four degrees handed back turns Mangwon from a heat-management problem into an ordinary evening. The 16:30 slot is still the right one — the day is off its peak by then, and the market's covered lanes do the rest of the work for you."},"note":"An easy morning in Jongno, then west after the nap. Gwangjang has been dropped on purpose — it has become a queue for a tourist photograph rather than a market, and it is a genuinely hard room for infants. Mangwon is the version that still works: a real neighbourhood market where people do their shopping, two stops from Hongdae, with a flat riverside park and the Gyeongui Line park next door. Today is a Monday, which is the quietest possible night to be on this side of the city.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d9-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Late morning by design — the day's real event is dinner at Mangwon Market, and you do not want the group already tired by mid-afternoon."},{"id":"d9-cheonggyecheon","start":"10:15","end":"11:30","title":"Cheonggyecheon in the morning","kind":"outing","status":"planned","who":"Everyone","detail":"The sunken stream through the middle of the city, and a five-minute walk from the hotel door. Cool at water level, flat along the whole length, and genuinely pleasant before the heat arrives. Walk as far as you feel like and climb out at any bridge. This has moved from filler to the actual morning, because the afternoon is out in Mapo and today needs an easy start.","where":"Cheonggyecheon, five minutes from the hotel","source":"https://english.visitseoul.net/area/CheonggyecheonStream/ENP000034","fallback":"Turn around at any point. The whole stream runs parallel to the street above it, so there is no committed distance.","labels":[{"kind":"warn","text":"Most stream access is stairs. Find a ramped entrance before you commit with a stroller."}]},{"id":"d9-lunch","start":"12:00","mins":75,"title":"Lunch near the hotel","kind":"meal","status":"planned","who":"Everyone","detail":"Back in Jongno with time in hand. Eat properly here, because tonight's meal is standing up at a market."},{"id":"d9-nap","start":"13:30","end":"15:30","title":"Nap block at the hotel","kind":"rest","status":"planned","who":"Three kids + grandparents","labels":[]},{"id":"d9-tomapo","start":"15:45","end":"16:20","title":"Across to Mapo","kind":"transit","status":"planned","who":"Everyone","leaveBy":"15:45","detail":"West across the city to the Mangwon and Yeonnam side of Mapo-gu. Two vehicles for nine, or Line 6 if the group is feeling robust — Mangwon is two stops from Hongik University station.","where":"Mangwon-dong, Mapo-gu"},{"id":"d9-mangwon","start":"16:30","end":"18:00","title":"Mangwon Market — dinner, standing up","kind":"meal","status":"planned","who":"Everyone","detail":"This replaces Gwangjang, and it is a better fit in every way that matters to this group. Mangwon is a working neighbourhood market rather than a tourist destination — locals doing their actual shopping, prices that have not been rewritten for visitors, and a covered arcade that is wider and calmer than Gwangjang's aisles. The things to eat here are the fried chicken in sweet-and-sour glaze, tteokbokki, freshly fried mandu and the croquettes. Late afternoon is when it fills up and everything is hot.","where":"Mangwon Market, Mapo-gu · Mangwon station Line 6, exit 2","fallback":"If it is heaving, buy food and walk two minutes to Mangwon Hangang Park to eat it by the river.","labels":[{"kind":"warn","text":"Mangwon is covered but crowded. Take one stroller at most, use carriers, and expect to eat standing or in the park."},{"kind":"warn","text":"Bring cash. Some stalls take cards, but plenty don't."},{"kind":"verify","text":"Confirm the closing day before you go. Traditional markets often close Sunday or Monday, and today is Monday."}]},{"id":"d9-yeonnam","start":"18:15","end":"19:15","title":"Yeonnam-dong and the Gyeongui Line park","kind":"outing","status":"planned","who":"Everyone","detail":"A disused railway line turned into a long, thin park running through Yeonnam-dong, and the single most stroller-friendly thing in this half of the city — flat, straight, grassy, wide, and lined with low-key cafés and shops. It is the calm version of this neighbourhood, and it connects Mangwon to Hongdae on foot without ever putting you in Hongdae's crowds.","where":"Gyeongui Line Forest Park, Yeonnam-dong","getting":"About ten minutes by taxi from Mangwon Market, or three stops.","fallback":"Go straight back to the hotel after the market. This is a bonus, not a requirement, and nobody will mind.","labels":[]},{"id":"d9-hongdae","start":"19:15","end":"20:30","title":"Hongdae, for whoever still wants it","kind":"outing","status":"idea","who":"Adults who fancy it","whoSplit":true,"detail":"The main Hongdae streets are ten minutes' walk from the far end of the Yeonnam park — buskers, street food, record shops, and the densest concentration of late-opening anything in Seoul. Marked as an idea rather than a plan because it is loud, extremely crowded and the wrong environment for two infants at bedtime. One useful piece of luck: today is a Monday, which is by some distance the quietest night of the week here.","where":"Hongdae main street and Eoulmadang-ro","fallback":"Skip it entirely. Everyone with a child goes back to the hotel from Yeonnam and this simply does not happen.","labels":[{"kind":"warn","text":"Split up for Hongdae at 19:30. Send interested adults, and put everyone else in a car home."}]},{"id":"d9-back","start":"19:30","title":"Kids and grandparents back to Insadong","kind":"transit","status":"planned","who":"Grandparents · three kids · parents on duty","whoSplit":true,"leaveBy":"19:30","detail":"Thirty minutes back across town. Bedtime is late tonight by design, which is why tomorrow's morning starts indoors and slowly."}]},{"date":"2026-09-15","legId":"insa","title":"Children's clothes, Costco, and the skincare haul","gist":"Children's clothes at The Hyundai Seoul, Costco, then Myeongdong for skincare.","pace":"Medium · shopping","weather":{"sky":"drizzle","hi":27,"lo":19,"note":"Light drizzle has appeared here too: 0.6mm on an 18% chance at 27°C. Same read as Sunday — more likely dry than not, but no longer something to ignore. It matters most at 16:15, because Myeongdong is open street with very little shade and no cover worth the name, and wet pavement with a toddler walking and a stroller to push is slower and more miserable than the numbers make it sound. The saving grace is that the rest of the day was always indoors: Hyundai Seoul and Costco don't care what the sky does. Carry one umbrella and be willing to cut Myeongdong short rather than push through it. The low is 19°C, two degrees up, so the early run to Yeouido is mild rather than cool."},"note":"The dedicated shopping day, placed late so you are buying with a known suitcase situation rather than guessing. Namdaemun has been dropped for The Hyundai Seoul in Yeouido — better children's brands, air conditioning, nursing rooms, lifts and a food hall, which is worth more than market pricing when you are doing this with a toddler. Costco Yangpyeong is ten minutes from it, so the two pair on one trip. Myeongdong skincare in the afternoon. Gyeongbokgung is closed today, which costs you nothing since you have already been.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d10-bfast","start":"09:00","mins":60,"title":"Breakfast","kind":"meal","status":"planned","who":"Everyone","detail":"Nine o'clock, and nothing lost by it — The Hyundai Seoul does not open its doors until 10:30, so an earlier start only buys you time standing outside a shut mall."},{"id":"d10-toyeouido","start":"10:10","end":"10:50","title":"Over to Yeouido","kind":"transit","status":"planned","who":"Shopping group","whoSplit":true,"leaveBy":"10:10","detail":"Line 5 runs directly from Jongno-3ga to Yeouido with no change, which is unusually civilised for this city. A taxi is about twenty-five minutes. Either way you arrive just after opening rather than at 11:30 with everyone else.","where":"The Hyundai Seoul, 108 Yeoui-daero, Yeongdeungpo-gu"},{"id":"d10-easy","start":"10:15","end":"12:00","title":"Slow morning for everyone else","kind":"rest","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Hotel, Insadong street, a café. The point of splitting today is that nobody has to endure a shopping trip they did not want, and Yeouido is a long way to drag a two-year-old for other people's errands."},{"id":"d10-hyundai","start":"10:55","end":"13:00","title":"The Hyundai Seoul · children's clothes","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"This replaces Namdaemun, and for this group it is not a close call. The Hyundai Seoul is the newest and most consistently well-reviewed department store in the city: a full children's floor with the Korean and international brands people actually fly home with, an indoor garden you can park a stroller in, proper nursing rooms, wide flat aisles, lifts everywhere, and a basement food hall good enough to be lunch. You will pay department-store prices rather than market prices — that is the trade, and with a toddler in tow it is the right one.","where":"The Hyundai Seoul, Yeouido · children's floor and the food hall","getting":"Line 5 to Yeouido, direct from Jongno-3ga.","cost":"Department-store pricing. Budget more per item than a market and fewer items.","fallback":"Lotte World Mall in Jamsil covers similar ground and you were already near it on the 10th. Starfield Hanam is bigger again but is outside Seoul and not worth the drive on a day this full.","labels":[{"kind":"warn","text":"Bring passports. Tax-free refund needs one, and the desks are in-store."},{"kind":"verify","text":"Confirm opening time before you leave. Department stores often open at 10:30, not 10:00."},{"kind":"rest","text":"Eat lunch in the building. The lower-level food hall can handle a group without a booking."}]},{"id":"d10-lunch","start":"12:00","mins":75,"title":"Lunch in Insadong for the hotel group","kind":"meal","status":"planned","who":"Grandparents · kids","whoSplit":true,"detail":"Close to the room and ahead of the nap. The shopping group is eating in The Hyundai's food hall at the same time, so there is no regroup to coordinate."},{"id":"d10-costco","start":"13:15","end":"14:45","title":"Costco Yangpyeong","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"Ten minutes from The Hyundai Seoul, which is the entire reason it sits on this day rather than any other. Yangpyeong is the closest warehouse to Yeouido and it is open 10:00 to 22:00. The Korean-specific things worth the trip are the own-brand seaweed, gim snacks, dried persimmon, honey butter almonds and the bulk skincare — none of which you can carry out of Olive Young at this price.","where":"Costco Yangpyeong, 156 Seonyu-ro, Yeongdeungpo-gu","getting":"About ten minutes by taxi from The Hyundai Seoul.","labels":[{"kind":"warn","text":"Bring your physical US Costco card. Membership is global, but the app can fail at Korean door scanners."},{"kind":"warn","text":"Korean Costco closes on the second and fourth Sunday. Tuesday is clear, but check before moving this to a weekend."},{"kind":"verify","text":"Confirm the card policy at the door. Carry enough cash for the basket in case your US card doesn't work."},{"kind":"warn","text":"Costco buys are bulky and heavy. Do the luggage reckoning tonight, not at the airport on the 18th."}]},{"id":"d10-nap","start":"13:15","end":"15:15","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","labels":[]},{"id":"d10-myeongdong","start":"16:15","end":"18:00","title":"Myeongdong · skincare","kind":"shop","status":"planned","who":"Shopping group","whoSplit":true,"detail":"The flagship Olive Young plus the surrounding brand stores, and a fresh shift is fine here — whoever did Yeouido and Costco has earned a sit down. This is the serious skincare stop of the trip: buy the volume here, not at the airport.","where":"Myeongdong","getting":"Ten minutes by taxi from the hotel, or two stops on Line 3 and a short walk.","labels":[{"kind":"verify","text":"Confirm the tax-free refund threshold and process. Bring your passport."},{"kind":"warn","text":"Pack all liquids, gels, and creams in checked bags tonight."}]},{"id":"d10-pack","start":"18:15","mins":45,"title":"First pack and a luggage reckoning","kind":"admin","status":"planned","who":"Adults","detail":"Tomorrow you move hotels, and today you bought department-store clothes, a Costco run and a skincare haul. Better to find out tonight that you need another suitcase than at the Incheon check-in desk on the 18th.","labels":[{"kind":"warn","text":"Buy the extra suitcase today if you need one. Don't leave this for Yeongjong or the airport."}]},{"id":"d10-dinner","start":"19:00","mins":75,"title":"Last Jongno dinner","kind":"meal","status":"planned","who":"Everyone","detail":"The last dinner in the city proper — from here it is the airport hotel. Pick the one thing someone said they wanted to eat again and go there.","labels":[{"kind":"warn","text":"Book dinner. This is the last easy meal nobody will want to improvise."}]}]},{"date":"2026-09-16","legId":"icn","title":"Out to the island","gist":"Check out, jjajangmyeon in Incheon Chinatown, then over the bridge to the resort.","pace":"Light · moving day","weather":{"sky":"cloud","hi":27,"lo":18,"note":"Back to overcast at Incheon and two degrees warmer at 27°C — still dry, which is the only thing a moving day really asks of the weather. Chinatown means walking between the vehicle and the restaurant, and cloud makes that easier than sun would: nobody's squinting and you don't have to find shade for a pram. The trade is that it'll feel humid rather than hot, so it's still worth getting the infants indoors before you start sorting luggage rather than after."},"note":"A clean moving day with no medical appointment stacked on top of it — which is the whole point. The mole removal sits on the 17th, so today is nothing but checking out, crossing the city, and arriving somewhere with a pool. The one addition is lunch: Incheon invented jjajangmyeon, and the original Chinatown is close enough to the bridge that you can eat there on the way rather than making a separate trip. Check-in is 15:00 at both Yeongjong properties, so the afternoon nap needs a room that is already yours.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"Toddler","start":"14:00","end":"16:00"}],"doses":[{"id":"d11-bfast","start":"09:00","mins":60,"title":"Breakfast and final pack","kind":"meal","status":"planned","who":"Everyone","detail":"Checkout is 11:00 and the transfer is not until 11:30, so a nine o'clock breakfast still leaves an unhurried hour. Pack the night before and this morning is genuinely easy."},{"id":"d11-lastinsa","start":"10:05","end":"10:50","title":"Last walk through Insadong","kind":"outing","status":"planned","who":"Anyone who wants it","whoSplit":true,"detail":"Bags are packed, checkout is not until 11:00, and Ssamziegil is four minutes from the door. This is the last unhurried stretch on the mainland — use it for the small souvenirs nobody has bought yet, or skip it entirely and sit in the lobby.","where":"Insadong-gil, four minutes from the hotel","fallback":"Skipping this costs nothing. The airport has a duty-free the size of a town.","labels":[{"kind":"rest","text":"This walk is optional. Nobody has to leave the hotel this morning."}]},{"id":"d11-checkout","start":"11:00","mins":30,"title":"Check out of Insadong","kind":"admin","status":"planned","who":"Everyone","detail":"Sweep the rooms for the small things that get left: bottle parts, chargers, one shoe, the toddler's specific cup. Ask the desk to hold the bags if you want a last hour in Insadong."},{"id":"d11-transfer","start":"11:30","end":"12:30","title":"Out west to Incheon Chinatown","kind":"transit","status":"planned","who":"Everyone","leaveBy":"11:30","detail":"Roughly an hour from Jongno to Incheon Station on the mainland. This is not a detour so much as a pause on the way — Chinatown sits by the Yeongjong Bridge approach, so you stop, eat, and carry on over the water to the resort. Good news on the name confusion at the far end: Hyatt Regency Incheon Paradise City is a single, real hotel — the former west tower of Grand Hyatt Incheon, rebranded in 2025 and sitting inside the Paradise City resort complex. So you get Hyatt loyalty and the resort's facilities in one booking.","where":"Incheon Chinatown, Jung-gu · then Yeongjong Island","source":"https://newsroom.hyatt.com/Hyatt_Regency_Incheon_Paradise_City_Opens_Today","labels":[{"kind":"warn","text":"Book the transfer with three car seats, a Chinatown stop, and waiting time."},{"kind":"verify","text":"Confirm the driver will hold your luggage during lunch. If not, move jjajangmyeon to the 17th."},{"kind":"verify","text":"Check your confirmation says Hyatt Regency, not Hotel Paradise or Art Paradiso."}]},{"id":"d11-jjajang","start":"12:35","end":"13:45","title":"Jjajangmyeon in the place that invented it","kind":"meal","status":"planned","who":"Everyone","detail":"Incheon's Chinatown is where jjajangmyeon was created, by Shandong migrants working the port in the late 1800s, and eating it here is a genuinely different thing from eating it anywhere else. Junghwaru is the pick for this group: well reviewed, large enough to seat nine, and with waits that run ten to twenty minutes rather than the hour that the two famous places routinely hit. Today is a Wednesday, which is the single biggest thing working in your favour here — weekend waits in Chinatown are punishing.","where":"Junghwaru, Incheon Chinatown · near Incheon Station","cost":"Roughly ₩8,000–₩12,000 for jjajangmyeon, more for tangsuyuk to share.","fallback":"Gonghwachun is the original house and has the museum-piece interior, but the food is widely described as ordinary and the wait as long. Sinseungban is the locals' choice on taste. Both are worth knowing about if Junghwaru is closed.","labels":[{"kind":"warn","text":"Call ahead for nine. Chinatown lunch spots may not hold a walk-in table this size."},{"kind":"warn","text":"Jjajangmyeon stains permanently. Bib everyone under three, and skip nice clothes."},{"kind":"verify","text":"Confirm the closing day. Some Chinatown restaurants close one weekday a month."}]},{"id":"d11-toresort","start":"13:50","end":"14:20","title":"Over the bridge to Yeongjong","kind":"transit","status":"planned","who":"Everyone","leaveBy":"13:50","detail":"Twenty-five minutes over the water to Paradise City. All three children will very likely sleep in the car, which is exactly what you want given check-in is not until 15:00 anyway.","where":"Hyatt Regency Incheon Paradise City, Yeongjong Island","labels":[{"kind":"rest","text":"Treat this drive as the first half of nap. Don't wake anyone at the door."}]},{"id":"d11-checkin","start":"14:20","mins":40,"title":"Check in","kind":"rest","status":"planned","who":"Everyone","detail":"The hotel sits inside the Paradise City complex, so once you are in you do not need to leave it again before the flight.","labels":[{"kind":"warn","text":"Standard check-in is 15:00. Book one room from the night of the 15th so kids can nap on arrival."}]},{"id":"d11-nap","start":"14:45","end":"16:00","title":"Nap block","kind":"rest","status":"planned","who":"Three kids","detail":"Shorter than usual and partly already served by the drive over the bridge. Do not stretch it — tonight is the last chance to swim.","labels":[]},{"id":"d11-resort","start":"16:15","end":"18:00","title":"Wonderbox, or just the room","kind":"outing","status":"planned","who":"Everyone","detail":"Indoors and shaded by design today. Wonderbox is Paradise City's indoor family theme park and is the right size and temperature for a two-year-old — carousel scale, not roller-coaster scale. The complex also has extensive public art you can walk through for free. This is now your one clear water day: the mole removal sits on the 17th, so nobody is under a no-swimming restriction yet.","where":"Paradise City complex, on site","source":"https://www.p-city.com/front/wonderbox/overview","fallback":"The hotel room and a long bath is a perfectly good version of this.","labels":[{"kind":"rest","text":"Swim today if anyone wants to. Tomorrow's procedure closes the water for seven to ten days."},{"kind":"verify","text":"Confirm Wonderbox hours and whether the hotel bundles admission."},{"kind":"warn","text":"Cimer refuses children under seven. It only works as an adults-only split shift."},{"kind":"rest","text":"Ask for the 50% guest coupon. The ₩60,000 aqua pass drops to about ₩30,000, and the aqua zone shuts at 19:00."}]},{"id":"d11-dinner","start":"18:30","mins":75,"title":"Dinner at the resort","kind":"meal","status":"planned","who":"Everyone","detail":"There is very little walkable off-site dining out here. Plan to eat in.","labels":[{"kind":"verify","text":"Confirm on-site restaurant options and whether any take a booking for nine."}]}]},{"date":"2026-09-17","legId":"icn","title":"The empty day","gist":"Mole removal at 10:00 for three, back around midday, then deliberately nothing.","pace":"Light — deliberately","weather":{"sky":"cloud","hi":24,"lo":19,"note":"Stand down on yesterday's warning. This has flipped back to overcast at 24°C, two degrees cooler and dry on a 12% chance — and that removes the collision that actually mattered. Three of you have mole removal at 10:00 and are told to stay out of strong sun afterwards; a grey sky does most of that work for you. Keep the treated skin covered anyway, because cloud isn't the same as no UV, but the resort afternoon is yours again instead of something to plan around. The 16:00 walk by the water still works — it just won't be a sunset."},"note":"The last full day, and outside one confirmed morning appointment it is intentionally almost blank. Twelve days in with two infants, a toddler and two people in their seventies, the most valuable thing you can schedule is nothing. Rene Clinic opens at 10:00 and you have the first slot of the day, but it is three patients on one doctor, so plan on being there until roughly 11:30 and hold the room until 12:00. Nothing else is booked, so it can run long without costing anything. Pack in the afternoon so tomorrow morning is calm.","naps":[{"who":"7mo","start":"09:30","end":"11:00"},{"who":"5mo","start":"11:30","end":"13:00"},{"who":"Toddler","start":"13:00","end":"15:00"}],"doses":[{"id":"d12-bfast","start":"08:15","mins":60,"title":"Early breakfast, clinic party only","kind":"meal","status":"planned","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"The 10:00 slot is the first appointment of the day and Rene Clinic is eight to twelve minutes away rather than five, so this one breakfast starts at 08:15. It is still unhurried — an hour at the table and you are walking out at 09:30 with time to spare for first-visit paperwork.","labels":[{"kind":"rest","text":"Only the clinic party eats early. Everyone else keeps the 09:00 breakfast."}]},{"id":"d12-bfast-rest","start":"09:00","mins":75,"title":"Breakfast, no rush","kind":"meal","status":"planned","who":"Everyone else","whoSplit":true,"detail":"Nobody else has to be up early today. Last full morning of the trip, the pool is right there, and there is nothing on the schedule until lunch."},{"id":"d12-toclinic","start":"09:30","end":"09:45","title":"Out to the clinic","kind":"transit","status":"planned","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"leaveBy":"09:30","detail":"Rene Clinic sits in the Haneul-dosi (Sky City) district rather than the Unseo cluster, which makes it eight to twelve minutes by taxi instead of five — still on-island, so no toll. Leaving at 09:30 gives you the drive plus fifteen minutes to get three first-visit foreign patients through the paperwork before the 10:00 slot starts.","where":"SD Medical Building, 21 Haneul-jungangno 195beon-gil, Yeongjong-gu — Haneul-dosi, about 8–12 minutes from Paradise City","cost":"About ₩7,000–₩10,000 by taxi, on-island, no toll","fallback":"If no taxi materialises at the door, the resort front desk will call one. Do not plan on the Incheon Airport Maglev — it was reclassified as a tourist train, runs 10:00 to 17:00 Tuesday to Sunday only, and does not go near Haneul-dosi.","source":"https://www.incheon.go.kr/IC010205/view?repSeq=DOM_0000000013303245","labels":[{"kind":"verify","text":"Confirm the taxi the night before. Show the driver: 인천광역시 영종구 하늘중앙로195번길 21, 에스디메디컬 3층."}]},{"id":"d12-mole","start":"10:00","end":"12:00","title":"Mole removal · Rene Clinic","kind":"medical","status":"booked","who":"Three adults — NaRhee, Jun, Ann","whoSplit":true,"detail":"Confirmed for 10:00, the first slot of the day, for three adults. Budget two hours and expect to use less. A Korean derm clinic runs this as a pipeline: a ten-to-fifteen-minute consult each, numbing cream applied as each consult ends and left on fifteen to twenty minutes, then three to ten minutes of actual laser or shave per mole. Because the numbing on patient one is working while patient two is being consulted, three people take far less than three times one person — realistically out around 11:30, not 13:00. What pushes it long is first-visit paperwork in a second language, anyone turning out to have more moles than expected, and three separate payments at the end. Placed on the last full day deliberately: doing it here means you carry no healing wound through twelve days of Seoul heat, sun, and markets, and it leaves Wednesday's water park genuin
